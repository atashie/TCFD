  flood-pluvial:
    name: "Pluvial (surface water) flood"
    esrs_class: acute
    cdp_label: "Flood (pluvial)"                     # UNVERIFIED
    covered_by: []
    customer_note: >-
      Not assessed. Surface-water flooding depends on local drainage capacity and on short-duration rainfall, neither of which is represented here. Heavy daily rainfall -- the driver of surface-water flooding, but not the flooding itself -- IS assessed under "Heavy precipitation, hail, snow and ice".
    materiality_note: >-
      DO NOT PROMOTE THE RAINFALL LAYERS TO PLUVIAL-FLOOD COVERAGE. The ten
      `pluvial-*` layers were built (2026-08-18) as a proxy for the rainfall DRIVER at the
      user's direction, and their layer_id prefix says "pluvial" -- which makes exactly this
      mistake easy. They rank rainfall hazard; they never state that a site floods. A
      well-drained urban cell and an undrained rural one with identical rainfall receive
      identical values, and drainage is the variable that decides the outcome. Declaring this
      family covered by them would be the failure this file exists to prevent: every number
      correct, the document misleading.
    isimip_candidate:
      - "PROXY ONLY, BUILT 2026-08-18: `pluvial-rx1day` (annual maximum 1-day rainfall) and `pluvial-r20mm/r50mm` are the closest available drivers. See families.heavy-precipitation, where they are correctly filed."
      - "NOT INGESTED: ISIMIP3b hourly `pr` (9 extended GCMs, ~24x daily volume) would give sub-daily intensity. It would still not give drainage."
    candidates_enumerated_on: >-
      2026-08-16 -- same enumeration as heavy-precipitation. NO pluvial-flood or
      surface-water impact model exists in any ISIMIP round; the CaMa-Flood products under
      DerivedOutputData are RIVER routing, not surface water. Scoped to what was listed.
    blocker: >-
      STILL BLOCKED, and the original objection stands. "Needs sub-daily precipitation and
      local drainage" remains true: the daily rainfall layers built in 2026-08-18 close
      neither. Drainage capacity is not an ISIMIP variable and is not derivable from climate
      forcing at all -- it is infrastructure. What CHANGED is that the rainfall driver is now
      measured and filed under heavy-precipitation, so a report can state the rainfall trend
      honestly while continuing to declare surface-water flooding unassessed.

  sea-level-rise:
    name: "Sea level rise"
    esrs_class: chronic
    cdp_label: "Sea level rise"                      # UNVERIFIED
    covered_by: [sealevel-2b]
    coverage_note: >-
      SCREENING RESOLUTION: published on a 0.5 deg (~55 km) grid, so a site's value is its
      whole region's value and the layer ranks coastlines rather than assessing sites.
      Permanent-inundation potential: the share of each site's coastal land lying at or
      below projected mean sea level, from ISIMIP2b regional sea-level projections applied
      to GEBCO terrain. Shipped 2026-08-14. It is an ELEVATION exposure measure, not a
      flood-frequency measure -- no tide, surge or wave setup -- and it does not cover
      coastal erosion, which remains unassessed under soil-coastal-erosion.
    materiality_note: >-
      Covered as of 2026-08-14, but read the boundary. This closes "coastal sites carry no
      permanent-inundation signal"; it does NOT close flood-coastal, which needs surge and
      tide. The layer's absolute exposure is systematically LOW because GEBCO is a surface
      model -- South Florida reads 0.00000 at every decade despite 99.9% of its land lying
      below 10 m -- so a zero must never be relayed as "no coastal risk". Coastal defences
      are invisible at 460 m, so the Netherlands reads as undefended.
    customer_note: >-
      Assessed at REGIONAL SCREENING RESOLUTION, and as permanent inundation rather than flooding. Results are produced on a grid of roughly 55 km, so the figure reported for a site describes the wider coastal region containing it, not the site itself. Coastal inundation depends on differences of a few metres in ground elevation over distances of a few hundred metres, so two locations in the same region can face very different exposure while sharing the same reported number. Use these results to identify which coastlines and which sites warrant closer study; a site-specific assessment using high-resolution elevation data is required before any decision about an individual building, berth or design level. This assessment reports how much of the coastal land at each site lies at or below projected mean sea level, and how that share changes by decade. It does NOT model storm surge, tides or wave action, which is where most coastal flood damage arises, and it does not represent sea walls, dikes or other defences -- a well-defended coast is scored exactly like an undefended one. The elevation data includes buildings and vegetation, which makes land appear higher than it is near the coast, so the exposed areas reported here should be read as a LOWER BOUND. A site can read zero exposure and still face serious coastal risk. Scenario coverage is limited to lower and intermediate emissions pathways, so the high end of possible sea-level rise is not represented.
    scenario_coverage: "rcp26, rcp60 only -- no high-forcing member exists for this product"
    candidates_enumerated_on: >-
      2026-08-14 -- listed files.isimip.org root and, for every round, OutputData/,
      DerivedOutputData/, InputData/ and SecondaryInputData/ plus each intermediate level
      below them; ISIMIP2b/InputData/sealevelrise/{historical,rcp26,rcp60} enumerated file
      by file; ISIMIP3b/InputData/climate/ocean/.../ssp585/ vocabulary projected for all 5
      GCMs (no sea-surface-height variable).
    isimip_candidate:
      - "SHIPPED: ISIMIP2b InputData/sealevelrise `total` -- 6 components x 4 CMIP5 GCMs x {rcp26,rcp60} + historical, gridded 0.5 deg annual 2006-2099 in metres with a 7-level percentile axis. Enumerated and value-checked 2026-08-14; see search_results.sea_level_rise."
    blocker: >-
      RESOLVED 2026-08-14 for the inundation route. Remaining gaps: no rcp85/SSP sea-level
      product exists in ISIMIP (2b InputData only, verified 2026-08-14 -- ISIMIP3b/InputData/
      has no sealevelrise/ and the 3b ocean forcing publishes no sea-surface-height variable
      across all 5 GCMs); no local subsidence, which exceeds the climate signal in several
      deltas; and no defence inventory anywhere in ISIMIP.

  storm-wind-extratropical:
    name: "Extratropical storm / severe wind"
    esrs_class: acute
    cdp_label: "Storm (including blizzards, dust and sandstorms)"   # UNVERIFIED
    covered_by: []
