  permafrost-thaw:
    name: "Permafrost thaw"
    esrs_class: chronic
    cdp_label: "Permafrost thawing"                  # UNVERIFIED
    covered_by: [permafrost-3b]
    coverage_note: >-
      Thaw depth only, shipped 2026-08-14. The layer reports the share of each model's soil
      column that is thawed at the end of the thaw season, and the change in that share
      against the 2020s -- i.e. how much of the frozen column is lost. It says NOTHING about
      ground ice, thaw settlement or slope, so it is not a ground-stability or subsidence
      signal, and ISIMIP publishes no variable that would make it one. Published on the 2020s
      permafrost footprint (18.17 M km2, >=2 of 3 models); a site outside that footprint is
      OFF_LAYER_MASK, not a low score.
    scenario_coverage: "ssp126, ssp370, ssp585"
    materiality_note: >-
      Covered as of 2026-08-14, but read the boundary. This closes "no permafrost variable is
      carried"; it does NOT close the question a high-latitude asset owner actually asks,
      which is whether the ground under a foundation, runway or pipeline will move. That
      needs ground-ice content and terrain, neither of which exists in ISIMIP. The models
      also agree on HOW MUCH permafrost is lost far better than on WHERE: over their own
      domains the 2090s ssp585 loss share is 31/58/32%, but on the cells CLASSIC and LPJmL
      both call permafrost the Jaccard overlap of their loss maps is 2.8%. Site-level use
      must carry the CI.
    customer_note: >-
      Assessed as thaw depth, not as ground stability. This assessment reports how much of the modelled soil column is thawed at each site and how much of it transitions from frozen to thawed over the century. It does not model ground ice, subsidence or settlement, so it indicates where permafrost is being lost, not how much a structure would move as a result -- for that, site-specific geotechnical investigation is required. Results are reported only for sites that lie within the modelled permafrost region; elsewhere the hazard does not apply and no score is given rather than a low one. The climate models disagree substantially about which specific locations lose permafrost first, so the reported uncertainty range is wide and should be read alongside the central value.
    isimip_candidate:
      # ENUMERATED 2026-08-14. Full matrices in config/isimip_search_catalog.yaml
      # search_results.permafrost_thaw. Supersedes the previous entry here, which said a
      # thaw-specific variable "was not enumerated" and was read as though none existed.
      - "ISIMIP3b `thawdepth` (annual, 2015-2100) -- 3 impact models x {5,5,2} CMIP6 GCMs = 12 members/scenario at the shared 2015soc-from-histsoc/default combination, ssp126/370/585, ~190 MB. LPJmL5-7-10-fire is in the permafrost sector; JULES-ES-VN6P3 and CLASSIC publish it in `biomes` and are NOT in the permafrost sector at all."
      - "ISIMIP2b `thawdepth` (annual, 2006-2099) -- 4 models x 4/4/4/2 CMIP5 GCMs = 14 members at rcp26 and rcp60 under uniform 2005soc/co2, but only 2 models / 8 members at rcp85. A fifth model (JULES-ES-55, biomes only) adds 4 members per scenario at the cost of soc uniformity: it publishes rcp26soc/rcp60soc and no 2005soc. ~230 MB."
      - "`tsl` (soil temperature by layer) is published by more models than thawdepth in both rounds, but carries a soil-layer dimension the (decade, lat, lon) contract cannot take without choosing a depth. `soilmoistfroz` and `snd`/`swe` are supporting fields, not hazard variables."
    blocker: >-
      RESOLVED 2026-08-14 for the thaw-depth route -- `permafrost-3b` is shipped. The three
      download-time unknowns were measured and are recorded in
      config/isimip_search_catalog.yaml search_results.permafrost_thaw: a non-permafrost cell
      is published AT the model's soil column depth (not NaN, not 0), the column differs per
      model (CLASSIC 61.4 m, LPJmL 13.0 m, JULES 3.0 m) so raw metres are not poolable, and
      the annual value is a MAXIMUM per long_name with cell_methods absent in all 36 files.
      The layer normalises per model and reports the CHANGE; see DATASET-ATTRIBUTES.md.
      STILL OPEN: (1) the ISIMIP2b route (5 models, 18 members at rcp26/rcp60, only 8 at
      rcp85) is un-ingested and almost certainly has the same column-ceiling structure -- it
      would need the same measurement before any cross-round comparison. (2) `tsl` (soil
      temperature by layer) is published by more models than thawdepth in both rounds but
      carries a soil-layer dimension the (decade, lat, lon) contract cannot take without
      choosing a depth; it remains the only route to a ground-temperature framing.
      SOLIFLUCTION IS A SEPARATE HAZARD AND STILL HAS NO CANDIDATE: no slope, terrain,
      mass-movement or soil-creep variable exists in any ISIMIP sector, and the missing
      ingredient is not ISIMIP data at all. It has no family of its own in this file yet --
      see the AR 11 / CDP 3.1.1 gap review of 2026-08-14.

  landslide:
