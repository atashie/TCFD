# Hazard taxonomy -- what a physical-risk disclosure is expected to address, and which of
# it we can actually evidence.
#
# WHY THIS FILE EXISTS
# --------------------
# A compliance report that lists the hazards we assessed, and stops there, reads as though
# the hazards we did NOT assess were assessed and found immaterial. That is the single most
# damaging thing this pipeline could do to a customer, because it is invisible: every number
# in the report is correct and the document is still misleading.
#
# So coverage is declared here, positively AND negatively, and the caveat generator reads
# this file to emit a mandatory "hazards not assessed" section into every report. A hazard
# family absent from this file is absent from that section -- which is why `families:` is
# the full expected list, not the list we happen to cover.
#
# THE FIELDS THAT MATTER
#   covered_by:       registry layer_ids that evidence this family. Empty list = not covered.
#   esrs_class:       acute | chronic. ESRS E1-9 requires the acute/chronic split; IFRS S2
#                     and CDP use the same two-way division.
#   isimip_candidate: what would close the gap, named precisely enough to act on, with the
#                     blocker that stopped it. "No candidate" is itself a finding.
#   candidates_enumerated_on:
#                     WHEN the candidate list was last checked against a DIRECTORY LISTING,
#                     and which. REQUIRED alongside any non-empty candidate list. Absent =
#                     the list is INCOMPLETE, not complete (GUARDRAILS 13).
#
# A CANDIDATE LIST IS A POSITIVE CLAIM OF COMPLETENESS, AND IT IS THE MOST DECISION-BEARING
# CLAIM IN THIS FILE -- work gets planned off it and hazards get deferred off it. From
# 2026-07-24 to 2026-08-13 this family's flood entry named two 0.5 deg exposure products and
# a blocker explaining why neither could ship, while the CaMa-Flood inundation suite sat
# unlisted one directory level up from a path we had already walked. Nobody was wrong about
# the two products named; the list was wrong by omission, and omission is invisible.
#
# CUSTOMER-FACING vs INTERNAL -- the split matters and is enforced in code
#   customer_note:    RENDERED INTO REPORTS. What a reader needs to know about the gap, in
#                     their language: what is missing and what that means for their assets.
#   materiality_note / blocker / isimip_candidate:
#                     INTERNAL. Written for whoever would do the work. These carry repository
#                     paths, dataset defects, phrases like "the most consequential gap in
#                     this pipeline", and the word UNVERIFIED -- all of which mean something
#                     precise to us and something alarming, or simply confusing, in a filing.
#                     `report_common.coverage_summary()` exposes `customer_note` and the
#                     compliance report reads only that field. Do not swap them.
#
# PROVENANCE OF THE FRAMEWORK VOCABULARY -- READ THIS BEFORE QUOTING "19 FAMILIES"
# ------------------------------------------------------------------------------
# THE FAMILY LIST BELOW IS OURS. It is a working taxonomy assembled for this pipeline, not
# a list any standard publishes. Do not describe it as "the standard disclosure taxonomy",
# and do not present "3 of 19" as a coverage ratio against a standards-defined denominator
# -- the denominator is a choice we made, and a differently-grouped list would give a
# different fraction.
#
# What IS standards-derived:
#   * the ACUTE / CHRONIC split, which TCFD introduced and IFRS S2, CDP and ESRS all use.
# What is NOT:
#   * the number of families, and where the boundaries between them fall. TCFD's Table A1
#     gives broad examples (cyclones, floods; temperature, precipitation, sea level), not an
#     enumerated list. ESRS E1 AR 11 publishes a substantially LONGER four-column hazard
#     classification derived from EU Regulation 2021/2139. Ours sits between the two and
#     matches neither.
#
# When a report needs a coverage statement, name the hazards covered and the hazards not
# covered. That is true regardless of how the list is grouped. A fraction is not.
#
# `cdp_label` values are our best mapping onto CDP's question 3.1.1 hazard dropdown and are
# marked UNVERIFIED: as of 2026-08-13 the 2026 questionnaire was NOT enumerated -- neither
# its dropdown options NOR its field list. Before a delivery is filed against CDP, open the
# live questionnaire and reconcile both (GUARDRAILS.md §11: a recorded claim needs its
# receipt or the word UNVERIFIED).
#
# ISIMIP source facts are NOT unverified -- they are copied from
# config/isimip_search_catalog.yaml, which carries its own enumeration dates.

taxonomy_version: 1
seeded_on: "2026-08-13"
framework_basis: "OUR OWN working taxonomy. The acute/chronic split follows TCFD and is inherited by IFRS S2, CDP and ESRS E1; the family list and its boundaries are ours and match no published list."
cdp_labels_verified: false
cdp_labels_note: >-
  UNVERIFIED as of 2026-08-13. Neither the 2026 CDP question 3.1.1 hazard dropdown NOR its
  per-risk field list was enumerated against the live questionnaire; both the labels here
  and the field mapping in the compliance report are inferences. Enumerate before filing.

# ---------------------------------------------------------------------------------------
# Layers that are NOT hazards
# ---------------------------------------------------------------------------------------
# `conifer-npp` measures the asset's own productivity, not a hazard acting on it. It is
# `higher_is_better` and its percentile is already inverted, so it reads on the same 1-100
# risk axis as the hazards -- which makes it easy to file as a fourth hazard and wrong to.
# It answers "how is the asset performing under this scenario", not "what is the asset
# exposed to". Reports must place it in an asset-condition section, and any statement of
# hazard coverage must exclude it.
non_hazard_layers:
  conifer-npp:
    role: asset_response
    reports_as: "Asset condition / productivity"
    why_not_a_hazard: >-
      Net primary productivity is an outcome of climate acting on the stand, not a climate
      hazard. Counting it as a hazard would inflate any "N hazards assessed" claim and would
      put a productivity gain and a cyclone exposure in the same average without saying so.
    note_for_climate_score: >-
      The Climate Score DOES average it with the hazards, because percentile is the only
      cross-layer comparable axis. That is a declared composition choice, not an oversight,
      and every report carrying a Climate Score must state that the score mixes an
      asset-condition axis with hazard-exposure axes.

# ---------------------------------------------------------------------------------------
# The families
# ---------------------------------------------------------------------------------------
families:

  # -- COVERED ---------------------------------------------------------------------------

  tropical-cyclone:
    name: "Tropical cyclone (wind)"
    esrs_class: acute
    cdp_label: "Cyclone, hurricane, typhoon"        # UNVERIFIED
    covered_by: [cyclone]
    coverage_note: >-
      Wind exposure only. Storm surge, rainfall flooding and the compound coastal event are
      NOT in this layer and are not covered by any other. A cyclone-exposed coastal site is
      therefore under-assessed, not fully assessed.
    scenario_coverage: "rcp26, rcp60 only -- no high-forcing member exists for this hazard"

  wildfire:
    name: "Wildfire"
    esrs_class: acute
    cdp_label: "Wildfire"                            # UNVERIFIED
    covered_by: [wildfire]
    coverage_note: >-
      Burnt-area fraction from the fire-enabled DGVM ensemble. Measures the modelled
      probability that land burns, not ignition source, defensible space, or suppression
      capacity -- so it is a landscape hazard signal, not a site fire risk.
    scenario_coverage: "ssp126, ssp370, ssp585"

  drought:
    name: "Drought"
    esrs_class: chronic
    cdp_label: "Drought"                             # UNVERIFIED
    covered_by: [drought-3b, drought-2b]
    coverage_note: >-
      Soil-moisture drought exposure: the frequency with which a cell falls below a fixed
      preindustrial percentile. It measures DEPARTURE FROM A HISTORICAL REFERENCE, not
      absolute aridity -- a permanently dry site can read low and a wettening-then-drying
      site high. Two sibling layers are shipped and neither supersedes the other.
    scenario_coverage: "drought-3b: ssp126/370/585. drought-2b: rcp26/rcp60."

  # -- NOT COVERED, CANDIDATE EXISTS -----------------------------------------------------

  flood-riverine:
    name: "Riverine (fluvial) flood"
    esrs_class: acute
    cdp_label: "Flood (riverine)"                    # UNVERIFIED
    covered_by: []
    materiality_note: >-
      The most consequential gap in this pipeline. Riverine flood is the hazard a reader is
      most likely to assume was covered, and for built assets near a watercourse it usually
      dominates.
    customer_note: >-
      Not assessed. River flooding is frequently the dominant physical risk for assets near a watercourse, and its absence here should not be read as a low result. A dedicated flood dataset is required.
    candidates_enumerated_on: >-
      2026-08-14 -- listed the DerivedOutputData/ root of ALL FOUR rounds and opened every
      publication to file level (config/isimip_search_catalog.yaml repository_publication_map).
      The 2026-08-13 version of this list named only the two 0.5 deg exposure products,
      because no session had ever listed ISIMIP2b/DerivedOutputData/ -- only walked into
      Lange2020/ inside it. NOT covered by this sweep: InputData/ roots.
    isimip_candidate:
      - "ISIMIP2b DerivedOutputData/Zimmer2023 `flddph` / `fldfrc` (CaMa-Flood v3.6.2) -- ENUMERATED 2026-08-13. ABSOLUTE INUNDATION at 150 arcsec (~4.6 km), 144x finer than every shipped layer, in three protection variants (none / 100yr / flopros). 6 GHM x 4 CMIP5 GCM x rcp26/60/85 = 432 files. The only ISIMIP product carrying flood DEPTH in metres with future scenarios; measured, it puts the Amazon main stem at 6.11 m mean depth where `floodedarea` reads 0.000."
      - "ISIMIP3b DerivedOutputData/TipESM2025 `fldfrcmax` (CaMa-Flood) -- ENUMERATED 2026-08-14, NOT yet value-checked. Annual maximum flooded FRACTION at 15 arcmin (0.25 deg), 7 GHMs x 5 CMIP6 GCMs = 32 members per scenario, ssp126/370/585, 5 protection levels, ~6.4 GB for one protection level across all three scenarios. The SSP-bearing inundation option; heterogeneous soc per model is an open decision."
      - "ISIMIP2a DerivedOutputData/Zimmer2023 -- the observational (gswp3, 1971-2010) edition of the 2b CaMa-Flood product, at 150 AND 300 arcsec. Not a scenario source: use for validating whichever inundation layer is chosen."
      - "ISIMIP2b DerivedOutputData/Lange2020 `ler` -- 218 datasets, 8 GHM/land models x 4 CMIP5 GCMs, rcp26/rcp60. Same file structure as the shipped `led` layer, so process_led_drought.py adapts. NOT YET ENUMERATED as of 2026-08-13; the count is from the Lange2020 family block, not a listing."
      - "ISIMIP3b DerivedOutputData/Heinicke2026 `floodedarea` -- ENUMERATED and value-checked 2026-08-13. Complete 3 models x 5 CMIP6 GCMs x 3 SSPs = 45 files, uniform 2015soc/default, ~53 MB. Full measurement: config/isimip_search_catalog.yaml search_results.river_flood; reproduce with scripts/measure_floodedarea_characteristics.py."
    blocker: >-
      NOT a data defect -- three open decisions. (1) MASKING: `floodedarea` publishes ocean
      as exact ZERO rather than NaN, hence non-NaN over 94.4-96.5% of the globe. Measured
      2026-08-13 across all 45 members, only 258 of 165,774 ocean cells are ever flagged and
      78.3% of those touch land (fjords, small islands) -- a convention with a one-line fix,
      not the corrupt field the earlier one-line note implied. The mask is still MANDATORY:
      unmasked, 64% of the grid enters the percentile baseline as zeros. (2) PUBLICATION
      MASK: solo-model cells read 2.19x the 3-model level at only 1.21x inter-model spread,
      matching NEITHER `led`'s >=2-model rule nor `driedarea`'s full union -- undecided, and
      it must be decided on this layer's evidence. (3) DEFINITION: the variable is binary
      {0,1}, so a decadal mean is a FREQUENCY of flagged years, not the area share that
      units='1' and long_name='Exposed Area Share' imply; and the Amazon floodplain reads
      ~0.000 in every member, which is the family's departure-from-preindustrial reference
      showing through. The exact threshold and return period are UNVERIFIED -- read
      Heinicke2026/Lange2020 before shipping. This is not a flood-hazard map and a customer
      would read it as one.

  heatwave:
    name: "Heatwave / extreme heat"
    esrs_class: acute
    cdp_label: "Heat wave"                           # UNVERIFIED
    covered_by: []
    materiality_note: >-
      Drives workforce safety, equipment derating and cooling demand. THE SELECTED LAYER
      DOES NOT EVIDENCE THAT SENTENCE: `heatwave-3b` is a temperature-only index with no
      humidity term, so it speaks to unprecedented heat, not to heat STRESS. The
      health-anchored alternative (`heatwave-2b`, HWMId AND Humidex >= 45) exists and is
      built, but is silent over most of the extratropics. Any customer-facing claim about
      worker safety limits or wet-bulb thresholds needs that layer, or a constructed index
      from daily tasmax+hurs -- not this one.
    customer_note: >-
      Not assessed. Extreme heat drives workforce safety limits, equipment derating and cooling demand, and is often the leading hazard for occupied buildings and data centres.
    isimip_candidate:
      - "ISIMIP2b DerivedOutputData/Lange2020/HWMId-humidex `leh` (+`peh` population twin) -- 1 impact model x 4 CMIP5 GCMs x rcp26/rcp60 = 8 projection files, annual 2006-2099, uniform nosoc/co2, ~35 MB. Enumerated 2026-08-13."
      - "ISIMIP3b DerivedOutputData/Zantout2025/HWMID-NONE `heatwave` -- 1 impact model x 5 CMIP6 GCMs x ssp126/370/585 = 15 projection files, annual 2015-2100, uniform 2015soc/default, ~63 MB. Declared long_name 'heatwave area share', units '1'. Enumerated 2026-08-13."
      - "ISIMIP2b OutputData/health/TRM-Tsukuba `an-tot-heat-all` -- gridded annual COUNT of heat-attributable excess deaths at a fixed 2005 population, 4 GCMs x rcp26/rcp60, ~113 MB. A different quantity, not an asset-facing exposure layer."
      - "ISIMIP3b InputData bias-adjusted daily `tasmax` (+`hurs`) -- a CONSTRUCTED index, not an aggregation (GUARDRAILS 1-2); ~254 GB for tasmax alone across 5 GCMs x 3 SSPs."
    blocker: >-
      RESOLVED 2026-08-14: the user reviewed the dataset and selected `heatwave-3b`
      (ISIMIP3b `heatwave`, ssp126/370/585) as the heatwave layer. It is registered
      `status: preferred` with `qa_reviewed_on: 2026-08-14` -- the only layer in the
      registry carrying a human QA date. `heatwave-2b` (ISIMIP2b `leh`, rcp26/60) remains
      built and contract-passing but NOT selected, retained as the only health-anchored
      heat source; it stays blocked pending its own QA review.
      COVERAGE IS STILL EMPTY ON PURPOSE. `covered_by` is left `[]` because no asset type in
      config/asset_catalog.yaml routes to `heatwave-3b` yet, so no delivery would actually
      carry the hazard. Declaring coverage before the asset->layer mapping exists would
      produce exactly the failure this file was built to prevent: a report that lists
      heatwave as assessed while delivering nothing for it. Populate `covered_by` in the
      SAME change that adds the layer to the asset catalog, and that mapping needs user
      sign-off.
      BEFORE THE FIRST DELIVERY QUOTES IT, rewrite materiality_note/customer_note: the
      selected layer carries NO humidity term and cannot support a workforce-safety or
      equipment-derating reading. Two must-disclose caveats now travel automatically from
      the file -- RELATIVE-BASELINE (departure from each cell's own preindustrial normal;
      Chicago outranks Delhi) and CENSORED-CEILING (45.9% of ssp585 2090s cells pinned at
      1.0, where both slopes go to ~0 and agree, so a flat trend means "no headroom left").
      See config/isimip_search_catalog.yaml search_results.heatwave, DATASET-ATTRIBUTES.md,
      WORKFLOW-ISSUES.md 2026-08-14.
  heat-stress-chronic:
    name: "Chronic heat / rising mean temperature"
    esrs_class: chronic
    cdp_label: "Changing temperature (air, freshwater, marine water)"   # UNVERIFIED
    covered_by: []
    customer_note: >-
      Assessed as the number of days per year crossing fixed air-temperature thresholds (30/35/40/45 C by day, 20/25 C by night). This counts how often a fixed physical threshold is crossed; it carries no humidity term, so it is not a heat-stress or wet-bulb measure.
    isimip_candidate:
      # BUILT 2026-08-16. One ingest served this family AND cold-frost -- once the day is
      # read, testing it against nine thresholds instead of one costs nothing.
      - "ISIMIP3b InputData + SecondaryInputData bias-adjusted daily `tasmax`/`tasmin` -> `heatdays-hd30/hd35/hd40/hd45`, `tropicalnights-tr20/tr25`. 12 GCMs x ssp126/370/585. ~1.34 TB streamed, sha512-verified against publisher sidecars, reduced to annual counts and DELETED; provenance in data/interim/tasthresh/download_provenance.csv."
      - "ISIMIP3b DerivedInputData/SPARCCLE2025 `temp-annual-max` (TXx) and `temp-variability` (TV) -- 4 scenarios x 5 GCMs, annual 0.5 deg, ~580 MB. NOT ingested. An INTENSITY measure (how hot the hottest day gets) rather than a FREQUENCY one, so it would complement rather than duplicate the count layers. Enumerated 2026-08-14."
    candidates_enumerated_on: >-
      2026-08-14 -- listed ISIMIP3b/InputData/climate/atmosphere/bias-adjusted/global/{daily,hourly}/
      for all 4 scenarios x 5 group-I GCMs; the same tree under SecondaryInputData/ for 9
      extended GCMs; and ISIMIP3b/DerivedInputData/ in full, which had never been listed by this
      repo and yielded SPARCCLE2025. tasmax coverage is 7 of 9 in the extended root, NOT 9 of 9.
      NO tasmax exists at hourly cadence in any root (vocabulary there is exactly
      [hurs, pr, ps, rlds, rsds, sfcwind, tas]), so an hourly index must be built on `tas`.
      Full matrices in config/isimip_search_catalog.yaml search_results.chronic_heat.
    blocker: >-
      RESOLVED 2026-08-16 by user decision (2026-08-14): build a dry-bulb
      threshold-exceedance ladder as the ABSOLUTE complement to the relative `heatwave-3b`.
      THE ORIGINAL OBJECTION IS ANSWERED, NOT DISMISSED, AND ONE THIRD OF IT STILL STANDS.
      It read: "this is a forcing variable, not an impact... its percentile would not mean
      what the others' means."
      (a) It is no longer a raw forcing variable -- a threshold count is a CONSTRUCTED INDEX
      (GUARDRAILS 1-2), an exposure-frequency measure of the same class as the Lange 2020
      family, not `tas` republished.
      (b) The percentile DOES mean what the others' means: percentile-of-score against the
      2020s ensemble land distribution, two-tier, higher_is_worse -- the identical construction.
      (c) STILL TRUE: there is NO IMPACT MODEL IN THE CHAIN, so the confidence band carries
      GCM spread and interannual variability ONLY, with no impact-model structural uncertainty.
      Declared in every file's `impact_models` and `interpretation_caveat` rather than left to
      be inferred. The 12 GCMs are also not 12 independent models (two shared-lineage pairs),
      which is declared in the same place.
      COVERAGE IS EMPTY ON PURPOSE: `covered_by` stays [] until an asset type in
      config/asset_catalog.yaml routes to a rung, which needs user sign-off. Declaring
      coverage first would produce a report listing chronic heat as assessed while delivering
      nothing for it.
      HEADLINE RUNG `heatdays-hd35` (status preferred); the rest are built, contract-passing
      and `status: alternate`. 35 C is defensible on CONVERGENCE (World Bank CCKP hd35,
      Climate Impact Lab 95F, IIED, ILO onset, rail/pavement literature), NOT on physiology --
      do not write "physiological limit", and never conflate it with the WET-BULB 35 C
      survivability number, itself revised to ~30.6 C by Vecellio et al. 2022.

  crop-failure:
    name: "Crop failure"
    esrs_class: acute
    cdp_label: "Drought / heat -- crop loss"         # UNVERIFIED
    covered_by: [cropfailure-3b]
    coverage_note: >-
      Cropland area share exposed to unprecedented crop failure, from the 8-model ISIMIP3b
      crop-model ensemble. Shipped 2026-08-13. It is an EXPOSURE index, not a yield
      response: it reports how often conditions cross an unprecedentedness threshold, not
      how much yield is lost. A site can be highly exposed on this layer and still harvest a
      crop, and the layer says nothing about price, insurance or substitution.
    materiality_note: >-
      Covered as of 2026-08-13, but read the boundary. This closes the "agricultural sites
      carry hazard exposure with no crop-specific layer" gap; it does NOT close "no yield
      response is modelled". The remaining yield routes are enumerated in
      config/isimip_search_catalog.yaml search_results.crop_failure (Jaegermeyr2021
      yieldchange, and the raw agriculture-sector yield from which an index would have to be
      constructed under GUARDRAILS 1-2).
    customer_note: >-
      Assessed as exposure, not as yield loss. This assessment reports how often cropland at each site is projected to face conditions unprecedented against its own history. It does not model how much yield would be lost, and a site can be highly exposed and still harvest a crop. Scores are RELATIVE TO EACH SITE'S OWN HISTORY, so a reliably productive region with a narrow historical range can rank above a region that has always been marginal -- read a high score as "this place is moving furthest from what it is built for", not as an absolute statement about agricultural viability or food security. Which crops the index aggregates is not documented by the data publisher, so for a site growing a specific crop the result should be treated as a regional signal rather than a crop-specific one.
    isimip_candidate:
      # ENUMERATED 2026-08-13. Full matrices in config/isimip_search_catalog.yaml
      # search_results.crop_failure. Four representations, two of them ready-made indices.
      - "ISIMIP3b DerivedOutputData/Zantout2025 `cropfailure` -- 8 crop models x 5 CMIP6 GCMs x {ssp126,ssp370,ssp585}, COMPLETE 120-file matrix, 40 members/scenario, uniform 2015soc/default, annual 2015-2100, ~705 MB. Crop composition of the index is UNDOCUMENTED."
      - "ISIMIP2b DerivedOutputData/Lange2020 `lec` -- gepic AND pepic (2 models, not 1) x 4 CMIP5 GCMs x {rcp26,rcp60}, COMPLETE 16-file matrix, 8 members/scenario, ~100 MB. `pec` population twin available."
      - "ISIMIP3b DerivedOutputData/Jaegermeyr2021 `yieldchange-{mai,ric,soy,whe}` -- 12 models, 57 members at ssp126/585 but 45 at ssp370. A signed yield change, not a failure flag."
      - "ISIMIP3b agriculture sector `yield-{crop}-{firr,noirr}` -- 14 models, 11 crops, up to 62 members. Raw yield; a failure index would have to be constructed."
    blocker: >-
      RESOLVED 2026-08-13 for the exposure route -- `cropfailure-3b` is shipped. History
      worth keeping, because it cost weeks: the previous blocker read "`lec` is a single
      impact model, so its CI would carry no structural uncertainty", and it was false. It
      rested on a 2026-07-24 API listing capped at 20 rows. `lec` has two models and the 3b
      re-issue has eight -- the deepest ensemble in the product. An UNDERSTATED POSITIVE in
      our own catalog is more dangerous than a recorded negative, because a negative at
      least looks like something to re-check while `impact_models: "gepic"` reads as a
      measured fact (GUARDRAILS §11, and see WORKFLOW-ISSUES 2026-08-13).
      STILL OPEN for the yield route: the crop composition inside the crop-aggregated index
      is undocumented, and the direct yield route carries the sugarcane precedent -- the
      ISIMIP2b LPJmL sugarcane layers were WITHDRAWN 2026-08-11 because the run does not
      simulate cane in the cane belt while passing the OUTPUT-SPEC contract. Any yield-based
      crop layer needs a GUARDRAILS §12 reference-site check before it is trusted;
      `cropfailure-3b` passed one on 12 named cropland sites, raw and processed.

  water-stress:
    name: "Water stress / availability"
    esrs_class: chronic
    cdp_label: "Water stress"                        # UNVERIFIED
    covered_by: []
    materiality_note: >-
      Distinct from drought: drought here is departure from a historical reference, water
      stress is demand against available supply. A data centre's water question is this one.
    customer_note: >-
      Not assessed. Water stress is the balance of demand against available supply and is a different question from the drought exposure reported here. It is the relevant metric where water is a process input.
    isimip_candidate:
      - "The Water Risk Index product in this repository already processes discharge, runoff, soil moisture, total water storage, evapotranspiration and precipitation monthly."
    blocker: >-
      SEPARATE PRODUCT, different output contract (20 value types, monthly, no percentile,
      no trends) -- see CLAUDE.md. It cannot be joined to a TCFD delivery without a
      deliberate bridge. Do not silently substitute it.
      THE ALTERNATIVE ROUTE IS DESIGNED BUT NOT BUILT: docs/water-stress-formulations.md
      (2026-08-15) works out three candidate layers on the TCFD contract -- W1 soil-moisture
      deficit, W2 streamflow stress, W3 water stress -- with the formulations, thresholds and
      sources for each. READ IT BEFORE PROPOSING ANY OF THEM. Three things in it bear on this
      family directly. (1) ONLY W3 MAY POPULATE covered_by: ESRS E3 defines water stress as
      withdrawal against availability, so filing W1 or W2 here would assert that the
      demand-versus-supply question had been assessed when it had not -- the precise overclaim
      this file exists to prevent. W1 belongs beside drought and W2 (hydrological drought /
      low flow) has no family yet. (2) Total soil matrix storage potential is NOT available,
      which removes SWDI, REW and the FAO-56 stress coefficient outright and forces W1 to be a
      departure-from-local-baseline layer -- i.e. relative_baseline: true and a must-disclose
      caveat -- while W3 is absolute. (3) Nothing is codeable until the seven pre-flight
      measurements in its section 5 are taken; every property of our own data in that document
      is marked UNVERIFIED, including the pivotal one -- whether the demand files are
      time-varying, since fixed socioeconomic forcing would make every trend in the ratio
      supply-side. This blocker text needs rewriting when one of the three ships.

  soil-degradation:
    name: "Soil degradation"
    esrs_class: chronic
    cdp_label: "Soil degradation"                    # UNVERIFIED
    covered_by: []
    definition_note: >-
      INTERNAL. NO FRAMEWORK DEFINES THIS HAZARD, which is why this field exists and why the
      customer_note below is narrower than the family name. Read 2026-08-14: ESRS E1 AR 11
      NAMES soil degradation and defines nothing -- it is a bare classification table
      attributed to Commission delegated regulation (EU) 2021/2139, whose Appendix A *is*
      that table. The citation chain is circular. Four definitions circulate, none written
      for a climate-hazard purpose:
        * ESRS Annex II glossary defines LAND degradation on the IPBES framing ("the many
          processes that drive the decline or loss in biodiversity, ecosystem functions or
          their benefits to people"). The causality is INVERTED -- that is the E4 world, the
          undertaking degrading nature, not climate degrading the undertaking's soil.
          UNVERIFIED: read from a search summary, not from Annex II itself (PDF, and this
          machine has no PDF text extractor).
        * IPCC SRCCL: "a negative trend in land condition, caused by direct or indirect
          human-induced processes including anthropogenic climate change, expressed as
          long-term reduction or loss of at least one of: biological productivity, ecological
          integrity, or value to humans." Closest to a hazard framing -- it names climate as a
          driver -- but attaches no measurable quantity.
        * UNCCD Art. 1: restricted to "arid, semi-arid and dry sub-humid areas". Geographically
          useless for a temperate portfolio.
        * Directive (EU) 2025/2360 (Soil Monitoring Law, in force 2025-12-16, Member State
          transposition due ~2028-12) defines soil health, soil resilience and soil descriptor
          but NOT "soil degradation" -- it operates through descriptors and trigger values.
          Its recital 4 is the only EU enumeration of what the term covers, verbatim: physical
          degradation (soil sealing and artificialisation, soil erosion, soil compaction,
          reduction of soil water retention and infiltration) and chemical or biological
          degradation (excess and depletion of nutrients, acidification, salinisation, soil
          contamination, loss of soil organic carbon, soil biodiversity and soil biological
          activity).
      OF THOSE TEN PROCESSES A CLIMATE MODEL CAN DRIVE AT MOST FIVE, and the one that dominates
      EU soil policy -- sealing -- is pure land use. Sealing, compaction, contamination and
      nutrient management are not climate-driven at all. Any layer shipped here therefore
      addresses a SUBSET and must name which subset, or the family name overclaims by a factor
      of two. AR 11 also lists soil EROSION and COASTAL erosion as separate chronic hazards;
      those sit in the `soil-coastal-erosion` family, and solifluction has no family at all.
    materiality_note: >-
      Material where the soil IS the asset or its productive base -- agricultural land, timber
      land, soil-carbon and land-restoration projects, and any holding whose valuation rests on
      land condition. For a warehouse or an office it is not material and should not be routed.
      Note the framing question this family has not resolved: soil organic carbon stock is
      `higher_is_better` with an inverted percentile, structurally identical to `conifer-npp`,
      which this file classifies under `non_hazard_layers` as ASSET CONDITION rather than a
      hazard. Declining soil carbon on a farm reads more like the asset's condition than a
      hazard acting on it. Whether the eventual layer files as a hazard family here or as an
      asset-condition layer under non_hazard_layers is an OPEN USER DECISION, and it changes
      what every coverage statement says.
    customer_note: >-
      Not assessed. Soil degradation covers the loss of the soil's capacity to function -- through erosion, compaction, sealing, salinisation, contamination, nutrient imbalance and the loss of soil organic carbon -- and is material wherever land condition underpins the value of the asset. Most of those processes are driven by land use and management rather than by climate, so a climate assessment can speak to only part of the question, and none of that part is reported here yet.
    candidates_enumerated_on: >-
      2026-07-25 -- files.isimip.org biomes sector enumerated directly, because the API listing
      was INCOMPLETE for the carbon variables; see config/isimip_search_catalog.yaml
      search_results.soil_carbon (GUARDRAILS §8). THIS PREDATES THE 2026-08-14 SECTOR-TRAP
      FINDING and is therefore incomplete in the same way the permafrost enumeration was:
      csoil-total is published under more than one sector (the catalog records elm-eca
      csoil-total appearing in biomes AND permafrost), and `thawdepth`'s ensemble went from
      1 model / 5 members to 3 models / 12 members once every sector was listed. The
      "3 models, 12 members" count below is UNVERIFIED AS A MAXIMUM and must be re-listed
      across sectors before any rebuild.
    isimip_candidate:
      - "ISIMIP3b OutputData/biomes `csoil-total` (soil organic carbon stock, annual 2015-2100) -- 3 models x {2,5,5} CMIP6 GCMs = 12 members/scenario, ssp126/370/585, raw kg C m-2. Value-checked 2026-07-25: per-model 2020s medians 5.76 (classic) / 10.28 (jules-es-vn6p3) / 7.67 (mc2-usfs), same unit, exact-zero shares 4.48/0.00/0.00%. THE ENTRY-LEVEL INDICATOR: more soil carbon = healthier soil, less = degrading soil. Addresses exactly ONE of recital 4's ten processes -- loss of soil organic carbon."
      - "ELM-ECA and VISIT also publish csoil in ISIMIP3b but MONTHLY only; excluded from the annual layer 2026-07-25. Re-check whether an annual aggregation is defensible before treating 3 models as the ceiling."
      - "ISIMIP2b biomes `csoil` -- ~8 annual models (lpj-guess, lpjml, orchidee, orchidee-dgvm, caraib, dlem, jules-es-55, mc2-usfs) plus visit monthly, rcp26/60/85. A DEEPER ensemble on older scenarios; entirely un-ingested."
      - "NO ISIMIP VARIABLE EXISTS for soil sealing, compaction, contamination, nutrient balance, acidification or salinisation. Nine of recital 4's ten processes have no candidate in this repository and are not closable from it. Soil erosion would be a CONSTRUCTED index from rainfall erosivity (SPARCCLE2025 `pr-extreme-99-9` / `pr-annual-max`), which is GUARDRAILS §1-2 territory, and belongs to the `soil-coastal-erosion` family in any case."
    blocker: >-
      THE LAYER IS BUILT AND REGISTERED (2026-08-15) BUT COVERAGE STAYS EMPTY ON PURPOSE.
      `csoil` is in config/layer_registry.yaml at `status: alternate`, contract-passing, with
      a per-member diagnostic and a dashboard. `covered_by` is still `[]` because TWO
      decisions are open and both are the user's, and declaring coverage before either is
      settled would produce exactly the failure this file exists to prevent.
        (1) HAZARD OR ASSET CONDITION? The layer is `higher_is_better` with an inverted
            percentile -- structurally identical to `conifer-npp`, which this file already
            classifies under `non_hazard_layers`. Declining soil carbon reads more like the
            asset's condition than a hazard acting on it, unless the asset IS the soil
            (agricultural land, timber land, soil-carbon and restoration projects).
        (2) NO ASSET TYPE ROUTES TO IT. config/asset_catalog.yaml has no entry pointing at
            `csoil`, so no delivery would carry the hazard even if it were declared.
            Populate `covered_by` in the SAME change that adds the routing, and that routing
            needs user sign-off.
      WHAT THE REBUILD SETTLED, so it is not re-litigated: the 2026-07-25 output had been
      LOST from disk and its ensemble was understated -- LPJmL5-7-10-fire publishes
      csoil-total annually and was missing from the catalog, so 12 members / 3 models became
      17 / 4. Every framing decision was re-measured rather than inherited: normalization
      still declined but on new grounds (2.92x median spread, a gradient not clusters),
      `pooled_median` retained at a largest adjacent-model gap of 0.59x IQR, smoothing
      declined on a model-stratified split-half (roughness 0.148, halves 0.149/0.150,
      r=0.992), `sen_slope` confirmed by --measure-slopes (6.8% Sen-zero, 70.3% agreement).
      The five post-2026-07-25 standards are all applied; see WORKFLOW-ISSUES.md 2026-08-15.
      BEFORE THE FIRST DELIVERY QUOTES IT, rewrite customer_note into the "assessed as X,
      not as Y" form the crop-failure and permafrost entries use, and carry three boundaries
      into it. First, soil ORGANIC CARBON is one of recital 4's ten processes and the layer
      must be named for that, not for this family. Second, land use is held FIXED in every
      member, so it cannot see management-driven loss -- deliberate, because it isolates the
      climate signal, and a hard limit on any claim about soil condition. Third, and least
      obvious to a reader, A ZERO-CARBON CELL SCORES AS MAXIMUM RISK: the inversion puts the
      Sahara at the 96th risk percentile and the Greenland ice sheet at the 97th, because a
      place that never held soil carbon holds the least of it. Every number is correct and
      the conclusion inverts, which is the RELATIVE-BASELINE class of trap; either restrict
      the layer to sites with soil worth losing or say plainly that a high percentile over a
      near-zero stock means "no soil carbon here", never "soil carbon is being lost here".
  # -- NOT COVERED, NO CANDIDATE IN SCOPE ------------------------------------------------

  flood-coastal:
    name: "Coastal flood / storm surge"
    esrs_class: acute
    cdp_label: "Flood (coastal)"                     # UNVERIFIED
    covered_by: []
    customer_note: >-
      Not assessed. Storm surge, tides and wave action are not covered by any layer in this assessment. The tropical cyclone layer measures wind exposure only, and the sea level layer measures permanent inundation from mean sea level, which is a different question -- most coastal flood damage occurs at extreme water levels well above mean sea level. A site can show low permanent inundation and still face severe coastal flooding.
    materiality_note: >-
      STILL UNCOVERED, and the gap narrowed rather than closed on 2026-08-14. `sealevel-2b`
      answers the chronic half (permanent inundation) and is filed under sea-level-rise;
      the acute half -- surge, tide, wave setup -- has no layer. Do not let the presence of
      a coastal-looking layer be read as coverage here.
    candidates_enumerated_on: >-
      2026-08-14 -- listed OutputData/ for all four rounds (2a 11 sectors, 2b 13, 3a 9,
      3b 9: no coastal or surge sector in any), every DerivedOutputData publication
      (Lange2020 15 model dirs, Zimmer2023 9, Heinicke2026 3, ISIMIP2a Zimmer2023 only),
      ISIMIP3a/SecondaryInputData/climate/tropical_cyclones_flooding/ to file level, and
      ISIMIP3b/SecondaryInputData/climate/ (no tropical_cyclones_flooding branch).
    isimip_candidate:
      - "ISIMIP3a SecondaryInputData/climate/tropical_cyclones_flooding/1mslr/global/storm/historical/GeoClaw -- `fldarea` (binary flooded-cell mask per storm) and `flddph` (depth), each at tidesmax/tidesmean/tidesmin, 30 arcsec, 456 files, ~113 GB. Enumerated 2026-08-14. HISTORICAL ONLY (1950-2025) and `1mslr` is a fixed +1 m sensitivity, not a scenario, so it cannot produce a decadal projection panel. VERIFIED ABSENT in ISIMIP3b on 2026-08-14 -- listed ISIMIP3b/SecondaryInputData/climate/ = atmosphere_composition, atmosphere, ocean."
      - "ISIMIP3b DerivedInputData/TipESM2025/MIT `yearlymaxwind` -- 5 arcmin, 100 stochastic realizations/year, knots, ssp126/245/370/585, H08-wind only. The TC wind field, not surge; a surge layer from it is a CONSTRUCTED MODEL under GUARDRAILS 1-2, not an aggregation."
    blocker: >-
      No coastal-flood impact model exists anywhere in ISIMIP. Verified 2026-08-14 by
      listing OutputData/ for all four rounds (2a 11 sectors, 2b 13, 3a 9, 3b 9 -- no
