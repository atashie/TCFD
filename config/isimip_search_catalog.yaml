          (20CRv3*, GSWP3-W5E5) carry the full 10-11 variable set, 120-140 files each.
    chosen_2026_08_14: |
      USER DECISION. Build a dry-bulb THRESHOLD-EXCEEDANCE layer, deliberately as the
      ABSOLUTE complement to the existing relative `heatwave-3b`, and cover the cold tail in
      the same pass so one ingest serves two hazard families (heat-stress-chronic and
      cold-frost, the latter still recorded UNVERIFIED-absent in hazard_taxonomy.yaml).
        ensemble   12 GCMs = group-I 5 + extended 7 (the 2 extended GCMs without tasmax
                   are excluded by construction, not by choice)
        scenarios  ssp126, ssp370, ssp585 (ssp245 declined -- it would add a fourth
                   scenario axis no other layer has)
        frost      higher_is_worse on the frost-day COUNT, matching the ESRS hazard as
                   written. Consequence accepted: the layer will report a hazard falling
                   almost everywhere, because frost days decline in every scenario.
        ladder     computed in ONE pass because the marginal cost of a rung is zero once
                   the day is read -- hd30/hd35/hd40/hd45 (CCKP hd*), ID (ETCCDI, tasmax<0),
                   FD (ETCCDI, tasmin<0), FDm10 (tasmin<-10, NOT a standard index),
                   TR20/TR25 (ETCCDI TR). HEADLINE RUNGS: hd35 and FD.
      UPPER THRESHOLD = 35 degC, and the justification is CONVERGENCE, not physiology.
      The skin-gradient story (skin sits ~35 degC, so above it dry heat loss reverses) is
      the CLASSICAL ASSUMPTION and the PSU HEAT work revised it -- measured skin temperature
      at critical limits runs 36-38.5 degC. Do not write "physiological limit" in a report.
      It is also NOT the survivability number: that one is WET-BULB 35 degC, revised down to
      ~30.6 degC by Vecellio et al. 2022. Conflating the two is the commonest error in this
      literature. What 35 degC dry-bulb has: World Bank CCKP `hd35`, Climate Impact Lab /
      American Climate Prospectus (95 degF), IIED's global-cities tracker, the ILO's
      rule-of-thumb onset, and an infrastructure literature clustering near it (rail
      buckling, pavement rutting). Plus the discrimination argument -- 30 saturates the
      tropics, 40 is near-silent outside subtropical deserts.
    data_nature_measured: >-
      PILOT 2026-08-14, scripts/check_tas_thresholds_nature.py, GFDL-ESM4 ssp585 2021_2030
      (a GROUP-I member, chosen because those five publish no sidecar netcdf_header).
      The FILE does declare what the sidecar omits: units K, calendar proleptic_gregorian,
      time `days since 2021-1-1`, dims (time=3652, lat=360, lon=720) -> 365.20 days/yr,
      i.e. the same calendar as the seven extended GCMs. The ~1.5% low bias a 360_day member
      would carry into a day COUNT does not appear here. Values: tasmax [203.75, 322.15] K =
      [-69.40, +49.00] degC; tasmin [199.83, 308.59] K = [-73.32, +35.44] degC. Both sane at
      both ends. Kelvin is detected FROM VALUES (min > 150) in the reducer, so a degC member
      would be handled and recorded rather than silently counted as zero.
      MASK: 100% of the 259,200 cells finite, in both variables. The forcing is atmospheric
      and NOT land-masked -- `isfinite` is not a footprint (same trap as `cropfailure` and
      `leh`). The official ISIMIP3b landseamask must be applied at processing;
      scripts/utils/land_mask.py already resolves it.
    reference_sites_measured: >-
      GUARDRAILS 12, 14 sites, ssp585 2021_2030 (near-present), days per year. Every site
      lands where it must, at BOTH ends -- Jacobabad hd35 215.5 / FD 0, Kuwait 185.9 / 0,
      Timbuktu 260.4 / 0, Phoenix 138.3 / FD 3.9, Delhi 137.7 / 0, Alice Springs 102.6 /
      FD 4.2, Paris hd35 0.7 / FD 28.4 / ID 4.6, Chicago 4.1 / 106.7 / 22.6, Yakutsk 1.3 /
      FD 231.4 / ID 181.4, Fairbanks 0.0 / 203.7 / 150.1, Ulaanbaatar 0.6 / 221.6 / 139.8.
      THE FINDING THAT MUST REACH CUSTOMER COPY: SINGAPORE reads hd30 344.5 and hd35 0.5,
      with TR20 at 365.2 -- every night a tropical night. Maritime tropical humidity caps
      the daily MAXIMUM, so an hd35-only reading says the equator has no heat hazard, while
      `heatwave-3b` puts Singapore at 0.889 -> 0.952. The dry-bulb and humid-heat layers are
      therefore COMPLEMENTARY, not redundant, and hd35 must never be presented alone as
      "heat risk" in the humid tropics. This is the concrete argument for the ladder: hd30
      carries the signal there that hd35 cannot. Treat as must_disclose-class.
    ingest_design: >-
      scripts/download_reduce_tasthresh_isimip3b.py. 36 jobs (12 GCMs x 3 scenarios) x 2
      variables x ~9 chunks = ~1,341 GB MOVED but NOT RETAINED: each chunk is verified
      against the publisher sidecar sha512, reduced to per-year counts, and deleted. Peak
      disk ~8.3 GB staging (4 workers) + ~14.4 GB counts, against ~600 GB available -- so
      storage is not the binding constraint and the GCM pool did not have to be cut.
      Wall clock is: ~41 h at the measured throughput (5.1 and 3.5 MB/s single-stream on the
      two pilot files; 9.0 MB/s aggregate across 4 parallel streams -- parallelism helps
      SUBLINEARLY). Idempotent per (GCM, scenario); an interruption costs one chunk.
      Chunk spans are DISCOVERED from the server, never hardcoded (GUARDRAILS 3).
      Provenance is written BEFORE deletion, so the ingest is auditable against files we no
      longer hold -- a declared deviation from the data/raw/ retention convention.
      ISIMIP's server-side land masking would have cut ~70% of the bytes and is UNAVAILABLE:
      files.isimip.org/api/v1 returned 502 on both endpoint forms, retried, while a
      nonexistent sibling path returned 404 -- a service outage, not a wrong URL (2026-08-14).
      Separately, data.isimip.org/api/v1 answered normally that day, which contradicts the
      "behind Anubis anti-bot" note carried elsewhere in this repo. Re-verify before relying
      on either statement.
    negative_findings: |
      * NO days-above-a-temperature-threshold variable in ANY round, in ANY product root.
        verified_absent_on: "2026-08-14 -- listed every round root; every round's
        DerivedOutputData (2026-08-14 sweep, 9 publications); ISIMIP3b/DerivedInputData/
        (2 publications, all 10 SPARCCLE2025 variables read from sidecars); and the full
        variable vocabulary of both 3b daily forcing roots and the hourly root."
        The nearest published counts are SPARCCLE2025 `fwi-ndays-extreme` (fire weather,
        >95th pct of 1851-1900) and `pr-wetdays-gt1mm` (precipitation) -- neither is
        temperature. Extends the 2026-08-14 heat-index negative under `heatwave`.
      * NO monthly or annual bias-adjusted forcing. verified_absent_on: "2026-08-14 --
        listed ISIMIP3b/InputData/climate/atmosphere/bias-adjusted/global/ = ['daily/']
        and the SecondaryInputData equivalent = ['daily/', 'hourly/']." So there is no
        cheap pre-aggregated route; a threshold count means reading daily data.
      * NO tasmax at hourly cadence. verified_absent_on: "2026-08-14 -- listed all 5 GCM
        dirs in hourly/{historical,ssp126,ssp370,ssp585}; the vocabulary is exactly
        [hurs, pr, ps, rlds, rsds, sfcwind, tas]." Expected -- a daily maximum is not an
        hourly quantity -- but it means an hourly index must be built on `tas`.
      * ssp534-over CANNOT carry the shared 2020s baseline. verified_absent_on:
        "2026-08-14 -- all 5 GCMs start at 2040 (7 chunks, 2040-2100)."
    resolved_2026_08_16: |
      ALL NINE LAYERS BUILT AND CONTRACT-PASSING. The open_decisions below are kept as the
      record of what was undecided at search time; each is answered here. Do not read them
      as still open.
      1. THRESHOLD FAMILY -> dry-bulb `tasmax`/`tasmin` only. No humidity term; the
         humidity-aware read stays with `heatwave-3b`, and every file says so.
      2. ABSOLUTE vs LOCAL-PERCENTILE -> ABSOLUTE, deliberately, as the complement to the
         relative `heatwave-3b`. MEASURED consequence: over the 65,797 shared land cells the
         2020s rank correlation is only +0.554 and the two layers agree on just 47.2% of
         their worst-decile cells. They are not substitutes; deliver both.
      3. LADDER vs ONE THRESHOLD -> a nine-rung ladder from ONE ingest, headline rungs
         `hd35` (preferred) and `FD` (preferred); the other seven `status: alternate`.
      4. GCM POOL -> 12, the union across both roots. Bias adjustment is w5e5 in both and all
         32 members measured `proleptic_gregorian` + Kelvin, so the union is homogeneous on
         every property that could have biased a day count.
      5. SCENARIO SET -> ssp126/370/585. ssp245 declined (it would add a scenario axis no
         other layer has).
      6. VOLUME -> streamed and reduced per chunk, raw NOT retained. Peak disk ~10 GB against
         the ~600 GB limit, so storage never became the binding constraint and the GCM pool
         did not have to be cut. The API's server-side land mask was unreachable (502).
      7. GUARDRAILS 9 VALUE CHECK -> done. Kelvin detected from VALUES not the declared unit;
         all 32 members `proleptic_gregorian`, 86 years; counts are FINITE OVER THE WHOLE
         GLOBE INCLUDING OCEAN, so `isfinite` is not a mask and the landseamask does all the
         work; per-member spread 1.31x (hd35) / 1.09x (FD), ordered by climate sensitivity.
      8. SPARCCLE2025 -> still NOT ingested. An intensity measure (TXx), complementary rather
         than duplicative. Remains a live option.
      NEW DECISION NOT ON THE ORIGINAL LIST: the LAND MASK. `landseamask_no-ant.nc` (65,797
      cells), not the full 92,889-cell mask. Antarctica carried 98.85% of FD's calendar-ceiling
      censoring; including it took FD from 2.01% to 30.25% censored and would have broken the
      dual-slope diagnostic on every cold rung.
    open_decisions: |
      HISTORICAL -- all resolved, see resolved_2026_08_16 above. Kept as the search-time record.
      NOT pre-answered. Every one is a user decision or an unmade measurement.
      1. WHICH THRESHOLD FAMILY -- this decides which variables to download, so it is
         upstream of everything else. Dry-bulb Tmax needs `tasmax` alone; a heat index or
         humidex needs `tasmax`+`hurs`; WBGT/UTCI needs tas+hurs+ps+sfcwind+rsds+rlds and
         arguably the hourly root. The literature/provider review is in the 2026-08-14
         session notes: peer products publish a LADDER, not one number (World Bank CCKP
         ships hd30/35/40/42/45/50, hi35/37/39/41, swbgt26/29/32, wbt25/27/29/31,
         tr23/26/29/32 -- enumerated from its public S3 bucket 2026-08-14).
      2. ABSOLUTE vs LOCAL-PERCENTILE threshold. These rank places in opposite orders and
         both are defensible for different questions. Measured consequences already exist
         in this repo: the absolute Humidex-45 gate inside `leh` leaves 59.7% of land
         never non-zero and Paris/Frankfurt/Yakutsk at exactly 0 in every member and year,
         and only 8.4% of land active in all 4 GCMs; the relative 3b `heatwave` has 74.8%
         active in 5/5 but saturates at 45.9% of cells by ssp585 2090s.
      3. ONE threshold or a ladder, and which rung is the headline number.
      4. GCM POOL. 5 (group I only, one root, uniform) or 12 (union across two roots, and
         2 of the 9 extended GCMs have no tasmax at all). A union mixes publication roots;
         re-verify bias-adjustment (w5e5 in both, unverified whether identically produced).
      5. SCENARIO SET. ssp126/370/585 at 12 GCMs, or add ssp245 (12 GCMs, extended root
         only) -- ssp245 is the scenario most disclosure frameworks reference and it exists
         in exactly one root.
      6. VOLUME. ~670 GB for tasmax across 12 GCMs x 3 SSPs; roughly double with hurs.
         Whether to stream-and-reduce per chunk (keep only the annual count) rather than
         retain raw, and whether the API's server-side mask_landonly is reachable -- it is
         behind Anubis, so this is unverified.
      7. GUARDRAILS 9 VALUE CHECK -- entirely unmade. Units (K vs degC), calendar per GCM,
         land mask per GCM, and whether bias-adjusted tasmax carries a physically plausible
         upper tail. Not one of these has been measured.
      8. Whether SPARCCLE2025 temp-annual-max / temp-variability is wanted ALONGSIDE (or
         instead of) a constructed count -- ~580 MB and contract-shaped, but an intensity.
         temp-variability is also the only candidate for an ESRS hazard we do not declare.

  # -------------------------
  # cold wave / frost searches
  # -------------------------
  cold_frost:
    last_searched: "2026-08-14"
    description: >
      Cold waves, frost and ice days. SEARCHED AND BUILT AS A CONSTRUCTED INDEX. ISIMIP
      publishes NO cold or frost IMPACT variable in any round -- the Lange 2020 exposure
      family has six codes (drought, river flood, wildfire, crop failure, heatwave, tropical
      cyclone) and none is cold, and no DerivedOutputData publication in 2a/2b/3a/3b carries
      one. That negative is scoped to what was listed on 2026-08-14 and is the REASON this
      family is served by counting days against a threshold in the bias-adjusted daily
      forcing, exactly as chronic_heat is. It is NOT a claim that no cold data exists.
    built_2026_08_16: >-
      SHIPPED: frostdays-fd (ETCCDI FD, tasmin < 0 C), frostdays-fdm10 (tasmin < -10 C, NOT a
      standard index), icedays-id (ETCCDI ID, tasmax < 0 C). 12 GCMs x ssp126/370/585.
      frostdays-fd is status:preferred; all three qa_reviewed_on 2026-08-16.
      ONE INGEST SERVED THIS FAMILY AND chronic_heat -- see search_results.chronic_heat for
      the full availability matrix, the enumeration receipts, the data-nature measurements and
      the ingest design. Do not re-enumerate; nothing here is specific to the cold rungs
      except the thresholds and the direction below.
    direction_decision: >-
      higher_is_worse ON THE FROST-DAY COUNT (user decision 2026-08-14), matching the ESRS
      hazard as written. CONSEQUENCE, ACCEPTED AND DECLARED: these layers report a hazard
      FALLING almost everywhere -- FD declines ~1.9 d/decade at ssp126 early and ~0.95 by the
      2080s. THE OPPOSITE READING IS ALSO LEGITIMATE and these layers DO NOT CARRY IT: assets
      harmed by LOSING reliable frost -- crops needing vernalisation chill hours, winter and
      ice roads needing frozen ground, pest overwintering kill -- face rising risk as these
      counts fall. Recorded in hazard_taxonomy.yaml families.cold-frost.materiality_note.
      Revisit before any agricultural or northern-logistics delivery.
    reference_sites_measured: >-
      2020s baseline, days per year (2026-08-16, 12-member ensemble): Yakutsk FD 228.5 /
      FDm10 180.9 / ID 177.6; Winnipeg FD 172.8 / FDm10 92.5 / ID 100.2; Chicago FD 95.8 /
      ID 23.5; Stockholm FD 97.8 / ID 31.1. Tropics (Singapore, Delhi, Manaus, Nairobi,
      Kuwait) are 0.0 on every cold rung. FD >= ID holds everywhere by construction -- if the
      day's MAXIMUM is below freezing its minimum is too -- and was verified as a containment
      check with 0 violations.

  # -------------------------
  # crop failure searches
  # -------------------------
  crop_failure:
    last_searched: "2026-08-13"
    description: >
      FOUR distinct representations. Two ship the failure index already computed
      (Zantout2025 `cropfailure` 3b, Lange2020 `lec` 2b); two are yield products from
      which a failure index would have to be CONSTRUCTED (Jaegermeyr2021 `yieldchange-*`,
      agriculture-sector `yield-{crop}-{firr,noirr}`) -- a modelling decision under
      GUARDRAILS 1-2, not an aggregation.
    corrections_2026_08_13: >
      This search overturned two recorded claims. (1) drought.exposure_lange2020.family.lec
      read `impact_models: "gepic"` (from a 2026-07-24 API listing capped at 20 rows);
      Lange2020 publishes `lec` from **GEPIC and PEPIC**, 2 models not 1. That single-model
      claim is the stated `blocker` in config/hazard_taxonomy.yaml crop-failure and is now
      false as written. (2) The Zantout2025 sibling note "cropfailure (240 files)" was a
      raw count with no matrix; the future/ SSP set is 120 files in a complete 8x5x3.

    cropfailure_isimip3b:
      publication: "ISIMIP3b/DerivedOutputData/Zantout2025/"
      path: "{MODEL}/{gcm}/future/"
      enumerated: "2026-08-13 -- 8 model listings + 40 future/ listings, 0 empty, 0 gaps; variable field projected at $(NF-4), 160/160 files = `cropfailure` (no crop suffix, no PFT split)"
      impact_models: ["crover", "cygma1p74", "epic-iiasa", "isam", "ldndc", "lpjml", "pepic", "promet"]  # 8 crop models
      climate_forcings: ["gfdl-esm4", "ipsl-cm6a-lr", "mpi-esm1-2-hr", "mri-esm2-0", "ukesm1-0-ll"]  # 5 CMIP6
      scenarios: ["ssp126", "ssp370", "ssp585"]   # + picontrol (5 per model, excluded from reports)
      matrix: "COMPLETE 8 x 5 x 3 = 120 future files. 40 members/scenario. Composition IDENTICAL across the three SSPs -> shared 2020s baseline valid."
      soc_sens: "UNIFORM 2015soc / default across all 160 files -- no harmonization compromise, no model dropped"
      bias_adjustment: "w5e5"
      timestep: "annual"
      period: "2015-2100 (2020s baseline decade is complete)"
      volume: "2-9 MB/file, measured one file per model at gfdl-esm4/ssp370: promet 3.13, ldndc 3.78, lpjml 4.71, pepic 5.53, epic-iiasa 5.98, crover 7.26, cygma1p74 7.90, isam 8.74 MB. Sum x 15 (5 GCM x 3 SSP) = ~705 MB for the full SSP set."
      sidecars: >
        PRESENT at `{stem}.json` with size + sha512 + parsed specifiers + a netcdf_header
        block. CORRECTED 2026-08-14: this entry previously read "NONE -- .json 404s", which
        was wrong and came from probing only `{stem}.nc.json` (that form does 404). The
        crop-failure ingest therefore ran with Content-Length as its only integrity check
        until the error was caught; all 120 files were then re-verified against the
        publisher's sha512. The identical trap was recorded for `lec_isimip2b` in this same
        file hours earlier and not applied here. A 404 on a GUESSED sidecar path is
        UNVERIFIED, never a negative -- try both forms or read the directory listing.
      size_spread_flag: "CONFIRMED 2026-08-13: the 2.8x file-size spread is a real footprint difference -- promet simulates crops on 33,339 cells, isam on 39,249."
      data_nature: >
        MEASURED 2026-08-13 across all 120 members (scripts/check_cropfailure_nature.py):
        CONTINUOUS fraction in [0,1], NOT binary -- 82,962-130,168 distinct values per
        member, so it inherits neither `led`'s binary nature nor anything from `lec`.
        long_name "cropfailure area share", units "1". 96.14% of finite cell-years are
        exact zeros, but that figure is an artifact of zero-fill; WITHIN the cropland
        footprint the annual exact-zero share is 46.37%-80.63%, median 60.89%.
      zero_fill_WARNING: >
        THE PUBLISHER ZERO-FILLS THE ENTIRE GLOBE. Every member is non-NaN over ~100% of
        the 259,200-cell grid (only 236 land cells are NaN anywhere); ocean, Antarctica,
        Greenland and the Sahara all read exact 0 rather than NaN. `isfinite` therefore
        carries NO footprint on this product and must NOT be used as a land mask -- doing
        so puts 87% ocean zeros into the percentile baseline and reports n_members=40 over
        open ocean. The footprint comes from where the field is ever NON-ZERO: union 39,890
        cells across the 8 models, 39,406 of them (98.8%) inside the official ISIMIP3b
        land-sea mask.
        This is NOT the `floodedarea` ocean leak, and the difference was measured rather
        than assumed: of the 484 off-mask cells, 63% are directly adjacent to land
        (coastline disagreement at 0.5 deg) and the rest are small islands the generic mask
        does not resolve (Lofoten 68.25N 13.25E, Shetland 60.25N -1.75E), with marginal
        values (median 0.0016). They come from ldndc (476) and lpjml (453) only; the other
        six models have none. `floodedarea` by contrast carries REAL values over open ocean.
      time_axis_WARNING: >
        The `time` coordinate carries long_name/standard_name/axis and NO `units` attribute
        at all, so xarray cannot decode it (`.dt` raises AttributeError) and there is no
        epoch to read. Values are a bare contiguous integer sequence, 165..250 for a file
        declaring 2015_2100 -- `years since 1850`, undeclared. Decode from the filename span
        and assert contiguity; do NOT hardcode the epoch. Contrast Heinicke2026
        `driedarea`, whose axis is a properly declared `days since 1601-01-01`. Time-axis
        handling is per-PUBLICATION, not per-round.
      population_twin: "NONE -- 3b publishes no population-exposed counterpart to `cropfailure` (2b's `lec` does have `pec`)."
      processed: >
        DONE 2026-08-13 -> TCFD layer id `cropfailure-3b`, folder
        cropfailure-isimip3b_cropfailure_annual. 40 members/scenario. Framing, all measured
        here and none inherited: pooled_mean_zero_inflated statistic (OUTPUT-SPEC third
        branch, DECLARED deviation, user decision 2026-08-13 -- the median branch leaves
        96.83% of the footprint at exactly zero, 1,265 exposed cells against the mean
        branch's 39,872); NO smoothing, settled by a split-half test rather than draw count
        (roughness 0.347 full vs 0.351/0.359 on disjoint 20-member halves, halves correlate
        Pearson 0.977 / Spearman 0.991, and roughness is 0.790 on footprint edge cells vs
        0.304 interior -- real cropland structure, not sampling noise); FULL-footprint mask,
        no minimum-model cut, because the coverage-tier level gradient runs the OPPOSITE way
        from `led`'s artifact (1 model 0.00001 rising to 8 models 0.00670: low-coverage
        cells are marginal cropland, not one high model undiluted); single_tier percentile
        (baseline exact-zero 0.05%); higher_is_worse; no normalization (6.69x inter-model
        spread is structural). See scripts/process_cropfailure_isimip3b.py and
        scripts/download_cropfailure_isimip3b.py.
      crop_composition_UNKNOWN: >
        `cropfailure` carries no crop token, so which crops are inside and how they are
        weighted is not readable from the filename or the (absent) sidecar. This is a
        documentation question for the Zantout2025 publication, and it is material: a
        crop-aggregated index over crops a site does not grow is not that site's risk.

    lec_isimip2b:
      publication: "ISIMIP2b/DerivedOutputData/Lange2020/"
      path: "{GEPIC,PEPIC}/{gcm}/future/"
      enumerated: "2026-08-13 -- 2 model listings + 8 future/ listings, 0 empty, 0 gaps; 48 files = 24 lec + 24 pec"
      impact_models: ["gepic", "pepic"]   # CORRECTED from "gepic" only
      climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]  # 4 CMIP5
      scenarios: ["rcp26", "rcp60"]   # + picontrol. NO rcp85 -- matches the documented family gap
      matrix: "COMPLETE 2 x 4 x 2 = 16 future files. 8 members/scenario. Composition IDENTICAL across both RCPs."
      soc_sens: "UNIFORM 2005soc / co2"
      bias_adjustment: "ewembi"
      timestep: "annual"
      period: "2006-2099"
      volume: "~6.2 MB/file -> ~100 MB for 16 lec files; the pec twin is another 16."
      sidecars: >
        PRESENT but named {stem}.json, NOT {stem}.nc4.json (the .nc4.json form 404s -- the
