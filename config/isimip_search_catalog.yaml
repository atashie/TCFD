        timestep: "daily, 0.5 deg, 2015-2100 in 9 chunks"
        volume_measured: "tasmax 2.06-2.07 GB per 10-yr chunk (HEAD) -> ~18.6 GB per GCM-scenario -> ~279 GB for tasmax across 5 GCMs x 3 SSPs"
      constructed_from_extended_daily:
        path: "ISIMIP3b/SecondaryInputData/climate/atmosphere/bias-adjusted/global/daily/{scenario}/{GCM}/"
        THE_GCM_POOL_IS_DISJOINT_FROM_GROUP_I: >-
          For ssp126/ssp370/ssp585 the 9 GCMs here (CESM2-WACCM, CNRM-CM6-1, CNRM-ESM2-1,
