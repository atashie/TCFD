  cross_sector_duplication:
    measured: "2026-08-12"
    finding: >
      ISIMIP3b `fire` and `permafrost` republish the SAME files as `biomes` for the models
      they share. lpjml5-7-10-fire cveg-tene ssp370 matched on BOTH Content-Length
      (7,616,747) and ETag (6a54d8a3-7438eb) across biomes and fire. Walk ONE sector and
      ingest ONE sector; the others neither add members nor change coverage.
    known_pairs:
      - "biomes == fire == permafrost for LPJmL5-7-10-fire, CLASSIC, JULES-ES-VN6P3, ELM-ECA, VISIT"
      - "biomes == permafrost for elm-eca csoil-total (byte-identical, same sha512)"
      - "biomes == permafrost == water_global for `thawdepth` -- 2b CLM45 rcp60 and 3b LPJmL5 ssp370 each matched on Content-Length AND ETag across sectors (2026-08-14)"
    but_look_everywhere: >
      DUPLICATION IS A RULE ABOUT WHAT TO INGEST, NEVER ABOUT WHERE TO LOOK. Measured
      2026-08-14 on `thawdepth`: the 3b `permafrost` sector holds 2 models and only ONE of
      them publishes the variable, while JULES-ES-VN6P3 and CLASSIC publish it in `biomes`
      and are absent from the permafrost sector entirely -- so a sector-only walk reports
      1 model / 5 members against a true 3 models / 12 members. Same in 2b, where
      JULES-ES-55 publishes thawdepth in `biomes` only. Probe every sector's vocabulary
      (one GCM per model is enough), then ingest from exactly one.
    exception: >
      `fire` publishes a few variables `biomes` does not (npp/gpp/fapar for LPJmL5 PFT
      classes) -- but for ukesm1-0-ll ONLY. Check per-GCM before treating it as coverage.
  per_gcm_not_pooled:
    rule: >
      Coverage claims must be made PER GCM. Pooling GCMs before counting makes a metric
      published for 1 of 5 GCMs look like a full ensemble. Measured 2026-08-12:
      npp-tene / gpp-tene / fapar-tene appear in the `fire` sector for ukesm1-0-ll only,
      which reads as "the fire sector adds npp and gpp" in a pooled view and as a
      1-of-5 fragment in a per-GCM view.
  wall_clock_notes:
    biomes_listing: "~3,000 files per {model}/{gcm}/future/ dir for LPJmL5/JULES/CLASSIC; 2-4 min each"
    small_models: "ELM-ECA ~123 files, VISIT ~168, MC2-USFS ~216 -- seconds"
    full_3b_vegetation_sweep: "59 listings across biomes+fire+permafrost; budget ~2 h serial"
    agriculture_sweep: "150 listings across all four rounds; ~25 min serial"
