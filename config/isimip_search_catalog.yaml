# -----------------------------------------------------------------------------
# SEARCH RESULTS BY VARIABLE
# -----------------------------------------------------------------------------
search_results:

  # -------------------------
  # drought searches
  # -------------------------
  # NOTE: "drought" is a cascade, not one variable. ISIMIP offers (a) a ready-made
  # exposure layer (Lange 2020 derived output) and (b) the raw hydrologic building
  # blocks in the water sector from which SPI/SPEI/soil-moisture drought is computed.
  # Counts below are floor values: the CLI listing caps at 20 rows per query.
  drought:
    last_searched: "2026-07-28"   # re-enumerated for tree-relevant drought; Heinicke2026/Zantout2025 found

    exposure_lange2020:
      description: "Pre-computed extreme-event exposure (Lange et al. 2020, Earth's Future). Drought = land fraction where monthly soil moisture falls below the 2.5th percentile of the preindustrial baseline."
      type: "DerivedOutputData (annual, ready to process)"
      # AUTHORITATIVE ENUMERATED FAMILY — verified 2026-07-24 via paginated datasets API;
      # CORRECTED 2026-07-28 by walking all 15 Lange2020 model dirs on files.isimip.org.
      # Lange 2020 covers SIX hazards x TWO exposure denominators = TWELVE variables.
      # The 2026-07-24 entry documented only the `le*` half and called the family "six";
      # that was wrong. Every hazard also publishes a `pe*` twin:
      #   le{d,r,w,c,h,t} = LAND AREA fraction exposed
      #   pe{d,r,w,c,h,t} = POPULATION fraction exposed   <-- was entirely missing here
      # The code is always 'le'/'pe' + ONE letter. DO NOT GUESS codes. A prior session
      # guessed 'letc' for tropical cyclone, got 0 hits, and wrongly concluded TC
      # exposure didn't exist — the real code is 'let'.
      # This family ALSO answers searches for tropical-cyclone / heatwave / river-flood /
      # wildfire / crop-failure exposure, not only drought.
      # FILES ARE .nc4, NOT .nc — grepping a listing for '.nc"' returns zero and reads
      # as "no data". This cost a false negative on 2026-07-28.
      family:
        led: {hazard: "drought",         datasets: 219, impact_models: "8 GHM/land (clm45,h08,jules-w1,lpjml,mpi-hm,orchidee,pcr-globwb,watergap2)", data_nature: "binary {0,1} per cell (verified)"}
        ler: {hazard: "river flood",     datasets: 218, impact_models: "8 GHM/land (same set as led); 31 future members/scenario (mpi-hm/hadgem2-es is a genuine 404)", data_nature: "FRACTIONAL [0, 0.9988] per cell (verified 2026-07-28, NOT binary) — 239,812 unique values, 6.1% strictly in (0,1). Equals the 100yr protection level of Zimmer2023 fldfrc (mean ratio 0.99). See search_results.flooding."}
        lew: {hazard: "wildfire",        datasets: 134, impact_models: "5 DGVM/fire (caraib,lpj-guess,lpjml,orchidee,visit) x 4 GCMs; future rcp26=31/rcp60=19; data_nature UNVERIFIED. NOTE: this is the EXPOSURE member -- distinct from the direct 'burntarea' burnt-area-fraction fire output, which was the one actually processed (see search_results.wildfire)."}
        lec: {hazard: "crop failure",    datasets: 90,  impact_models: "gepic AND pepic (corrected 2026-07-28 — the old 'gepic' only was wrong)"}
        leh: {hazard: "heatwave",        datasets: 30,  impact_models: "hwmid-humidex (derived index)"}
        let: {hazard: "tropical cyclone", datasets: 28, impact_models: "ke-tg-meanfield (Emanuel KE wind model, derived)", data_nature: "FRACTIONAL area [0,1) per cell (verified 2026-07-24, NOT binary); 1 impact model x 4 GCMs = thin ensemble -> spatial smoothing applied"}
      population_twins:  # verified 2026-07-28; same models/GCMs/scenarios/mask as their le* counterpart
        ped: {hazard: "drought",          note: "population fraction exposed"}
        per: {hazard: "river flood",      data_nature: "FRACTIONAL [0,1] (verified) — identical mask to ler (61,995 cells). Arguably more decision-relevant than ler for a severity product."}
        pew: {hazard: "wildfire",         note: "published by caraib, lpj-guess, lpjml, orchidee, visit"}
        pec: {hazard: "crop failure",     note: "published by gepic and pepic"}
        peh: {hazard: "heatwave",         note: "hwmid-humidex, nosoc"}
        pet: {hazard: "tropical cyclone", note: "ke-tg-meanfield, nosoc"}
      not_real: ["letc", "lecdd", "letr"]  # guessed codes; each returns 0 hits
      common_coverage:  # identical across all twelve members
        product: "DerivedOutputData"
        simulation_round: "ISIMIP2b only (NO ISIMIP3b/SSP version of this family)"
        climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]  # 4 CMIP5 GCMs
        scenarios: ["historical", "picontrol", "rcp26", "rcp60"]  # NO rcp85, NO SSP
        timestep: "annual"
        grid: "global 0.5deg"
        data_nature: "VARIES BY HAZARD -- value-check each member before processing. led=binary{0,1} (verified 2026-07-24), let=fractional[0,1) (verified 2026-07-24), ler=fractional[0,0.9988] and per=fractional[0,1] (both verified 2026-07-28); lew/lec/leh still UNVERIFIED. Note the binary/fractional split does NOT follow the le-vs-pe or the hazard grouping, so there is no shortcut -- check every member. Decadal stat = MEAN either way (mean of binary flags OR mean of fractional area = expected annual exposed-area fraction)."
      isimip2b:
        led:
          # TRUE coverage via paginated API (CLI listing caps at 20): 219 datasets.
          impact_models: ["clm45", "h08", "jules-w1", "lpjml", "mpi-hm", "orchidee", "pcr-globwb", "watergap2"]  # 8 GHM/land models
          climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]  # 4 GCMs
          bias_adjustment: ["ewembi"]
          scenarios: ["historical", "picontrol", "rcp26", "rcp60"]  # NO rcp85/SSP
          timestep: "annual"
          period: "2006-2099 (some members extend to 2299 - not used)"
          future_members: "rcp26=31, rcp60=31 (mpi-hm missing 2 GCM combos)"
          data_nature: "BINARY per-cell annual flag {0,1}; fraction emerges on aggregation"
          processed: "2026-07-24 -> TCFD layer. See memory project_led_drought_layer, scripts/process_led_drought.py"
        lec:
          impact_models: ["gepic"]
          scenarios: ["historical", "picontrol", "rcp26", "rcp60"]
          timestep: "annual"
          datasets_seen: ">=20 (listing capped)"
      notes: |
        Most "drought-specific" off-the-shelf product in ISIMIP, and the whole family
        (le/pe x d,r,w,c,h,t) shares the same structure so any member is processable
        with an adapted process_led_drought.py. All ISIMIP2b (EWEMBI, RCP, CMIP5 GCMs),
        annual, rcp26/rcp60 only.
        CORRECTED 2026-07-28: "ISIMIP3b/SSP version of this family NOT found (0 hits)"
        is TRUE only for the Lange2020 publication itself. An SSP-era equivalent DOES
        exist under a different publication name -- ISIMIP3b/DerivedOutputData/
        Heinicke2026 publishes `floodedarea` and `driedarea` (h08, jules-w2,
        watergap2-2e x 5 CMIP6 GCMs x ssp126/370/585, annual, 0.5deg, 2015-2100).
        `driedarea` is the SSP sibling of `led` -- BINARY like led, and correctly
        land-masked -- so the drought layer CAN be moved to SSP. Searching for a
        variable NAME across rounds misses this; the publication directory changes.
        See search_results.flooding for the full Heinicke2026 assessment and its
        floodedarea mask defect.
        Processing status: led=DONE, let=DONE (2026-07-24; let uses 5x5 spatial
        smoothing + two-tier zero-inflated percentile, see process_let_cyclone.py).
        ler/lew/lec/leh remaining -- value-check binary-vs-fractional before each.
        For WILDFIRE the direct 'burntarea' fire output (NOT the lew exposure member)
        was chosen and processed 2026-07-24 -- see search_results.wildfire.

    exposure_heinicke2026:
      description: "ISIMIP3b/SSP drought exposure -- the SSP-era sibling of Lange2020 `led`, and the SHIPPED drought layer. Same hazard definition, same binary data nature, CMIP6 GCMs."
      type: "DerivedOutputData (annual, ready to process)"
      path: "ISIMIP3b/DerivedOutputData/Heinicke2026/{MODEL}/{gcm}/future/"
      filename: "{model}_{gcm}_w5e5_{ssp}_2015soc_default_driedarea_global_annual_2015_2100.nc"
      variables:
        driedarea: "Drought exposure flag. long_name 'Exposed Area Share', units '1', cell_methods 'time: maximum'."
        floodedarea: "River-flood exposure, same structure. SEPARATE layer -- see search_results.flooding for its mask defect."
      coverage:
        impact_models: ["h08", "jules-w2", "watergap2-2e"]   # 3 GHMs
        climate_forcings: ["gfdl-esm4", "ipsl-cm6a-lr", "mpi-esm1-2-hr", "mri-esm2-0", "ukesm1-0-ll"]
        scenarios: ["ssp126", "ssp370", "ssp585"]   # + historical 1850-2014 (NOT ingested)
        members_per_scenario: 15   # complete 3 x 5 matrix, verified by directory listing
        soc_sens: "2015soc/default for all three models -- uniform, no divergence"
        timestep: "annual"
        period: "2015-2100"
        grid: "global 0.5deg"
        file_size: "~3.8 MB each; 45 files ~= 170 MB"
      hazard_definition: |
        Inherited from Lange et al. 2020 (Earth's Future): a cell is exposed in a month
        when ROOT-ZONE soil moisture falls below the 2.5th percentile of the preindustrial
        baseline for at least SEVEN CONSECUTIVE months. The annual value is the maximum of
        the monthly flag ("exposed at any point this year"). Root-zone is why this member
        is more tree-relevant than "generic land drought" suggests -- the paper argues it
        is the variable relevant to plant growth. What it does NOT carry is where the trees
        are; that is the forest weight below.
      data_nature: |
        BINARY {0,1} per cell per year -- VERIFIED across all 45 members 2026-07-28:
        n_unique == 2, range [0,1], zero intermediate values, calendar
        `proleptic_gregorian`, time units `days since 1601-01-01`. Decadal statistic is
        therefore the MEAN (drought frequency), never the median.
        This is an occurrence FREQUENCY, not a within-cell area share -- "area affected"
        is a downstream derivation (cell area x frequency) that assumes the whole cell is
        affected when flagged. State that assumption when reporting area.
      land_masks: |
        The three GHMs do NOT share a land mask, and the spread is large:
          h08           53,713 cells
          jules-w2      57,523
          watergap2-2e  56,410
          union         63,455    intersection  46,024
        17,431 cells (27% of the union) are missing at least one model; 5,396 (8.5%) rest
        on a single model. The shipped layer KEEPS the union and emits per-cell n_members /
        n_models rather than masking. NOTE this drives the zero-inflation question below.
      percentile_note: |
        The 2020s baseline's exact-zero mass is 3.59% over the UNION but only 0.18% over
        fully-covered cells. The zeros are an artefact of uneven coverage -- a single-model
        cell rests on 30 samples (1 member x 10 yr x 3 ssp) against 450 for a fully covered
        one -- NOT evidence that drought is rare. burntarea's automatic >2% two-tier switch
        would therefore fire for the wrong reason and crush every never-dry cell onto
        percentile 1. SINGLE-TIER was applied by explicit decision; the measured zero
        fraction is recorded in the output attrs. Visible consequence: the percentile floor
        is 3.59 and ~3.6% of land ties there.
      baseline_note: |
        Shared 2020s baseline averages each member across all three SSPs before pooling.
        Measured 2026-07-28: the per-member cross-SSP spread in 2020-2029 (mean |max-min|
        0.104) sits BELOW the pure-sampling-noise floor of a 10-year Bernoulli mean
        (1.693*sqrt(p(1-p)/10) = 0.139) and below a within-scenario 5yr-vs-5yr split
        (0.079), and the scenario global means agree to 0.005 (0.0756/0.0726/0.0708).
        So the SSPs have not meaningfully diverged by then and the averaging suppresses
        weather noise rather than smearing forced signal. Do NOT read a high per-cell
        cross-scenario ratio as evidence of divergence for a rare-event binary field.
      processed: |
        2026-07-28 -> TCFD layer `drought_driedarea_annual` (v2026-07-28_62512ee-dirty).
        scripts/download_driedarea_drought.py + scripts/process_driedarea_drought.py.
        Union mask, nothing filtered; single-tier percentile; baseline-anchored trend;
        no smoothing (15 members). QA 48/52 passed, 0 failed, 4 warnings.
        Global-mean drought frequency 2020s 0.0707 -> 2090s 0.0954 / 0.1687 / 0.1920
        (ssp126/370/585) = +35% / +139% / +171%. Clean monotonic scenario ordering.
        SUPERSEDES `led` as the drought layer: newer round, SSP scenario family, and
        consistent with the wildfire and soil-carbon layers.

    exposure_zantout2025:
      description: "The OTHER ISIMIP3b successor publication to Lange2020 -- non-hydrological hazards. Not yet processed."
      path: "ISIMIP3b/DerivedOutputData/Zantout2025/{MODEL}/{gcm}/future/"
      hazards:
        heatwave: "model hwmid-none, 5 GCMs"
        wildfire: "models classic, lpjml5-7-10-fire, visit"
        cropfailure: "crop models crover, cygma1p74, epic-iiasa, isam, ldndc, lpjml, pepic, promet"
      coverage: "annual, global 0.5deg, 2015-2100, ssp126/370/585 (+picontrol, historical)"
      note: |
        Variable names are HAZARD WORDS (`heatwave`, `wildfire`, `cropfailure`), not the
        `le*` codes. Together with Heinicke2026 (driedarea/floodedarea) this is the full
        ISIMIP3b re-issue of the Lange2020 exposure concept, split across two publications.
        Data nature UNVERIFIED for all three -- value-check binary-vs-fractional first.

    forest_cover_weight:
      description: "Not a hazard -- the forest fraction needed to turn any all-land drought layer into a tree-relevant one at extraction time."
      path: "ISIMIP3b/InputData/socioeconomic/landuse/{2015soc,ssp126soc,ssp370soc,ssp585soc}/"
      file: "landuse-forests-and-natural-vegetation_{soc}_annual_{1850_2014,2015_2100}.nc"
      variables:
        primary_forests: "Primary vegetation on LUH2 potential forest land, fraction [0,1]."
        secondary_forests: "Secondary vegetation on LUH2 potential forest land, fraction [0,1]."
        secondary_mean_biomass: "Secondary mean biomass carbon density, kg m-2."
      verified_2026_07_28: |
        Grid-IDENTICAL to driedarea (lat/lon match exactly) -- no regridding needed.
        67,721 land cells; mean primary 0.157 + secondary 0.107 => ~26% forest by area.
        TWO METADATA TRAPS: `primary_forests` declares `units: years` (MISLABELLED -- the
        values are fractions [0,1]); and the time axis is `years since 1901-1-1` on a
        `365_day` calendar, which cftime REFUSES to decode ("units must be one of
        microseconds..days"). Open with decode_times=False and add 1901 to the raw values.
      decision: "Fixed 2015soc chosen (user, 2026-07-28) -- isolates the climate signal, consistent with how csoil and burntarea fix land use. Intersection deferred to extraction time; the drought layer itself ships all-land."
      measured_effect: |
        Forest-weighting is NOT cosmetic. Single member (h08/gfdl-esm4/ssp370), exposed
        fraction 2020s->2090s: all land 0.0750 -> 0.1628, forest-area-weighted
        0.0738 -> 0.1839. Forests come out DISPROPORTIONATELY exposed.

    hydrologic_building_blocks:
      description: "Raw water-sector variables for computing hydrological/agricultural drought. Most are ALREADY pulled/processed in the Water Risk Index."
      variables:
        soilmoist: "Soil moisture (agricultural/soil drought). NL search parser did NOT map 'soil moisture' -> use exact code 'soilmoist'."
        rootmoist: "Root-zone soil moisture. ALREADY in Water Index (WEB-DHM-SG)."
        dis: "River discharge; low-flow percentiles = hydrological drought. ALREADY in Water Index (5 models)."
        tws: "Total water storage (GRACE-like). ALREADY in Water Index (4 models)."
        potevap: "Potential ET; combine with precip for SPEI. ALREADY in Water Index (4 models)."
        qtot: "Total runoff. ISIMIP2a hist confirmed across 5 models (caraib, dlem, jules-b1, lpj-guess, lpjml), monthly, >=20 datasets. ISIMIP3b versions also exist."
        qs: "Surface runoff."
        qsb: "Subsurface runoff / baseflow (baseflow drought)."
        groundwstor: "Groundwater storage (groundwater drought)."
        swe: "Snow water equivalent (snow drought)."
        pr: "Precipitation (climate InputData) for SPI. = Water Index 'precip', the one remaining variable."
      notes: |
        A soil-moisture or water-balance drought index could be assembled largely
        from data already in hand (dis, tws, potevap, rootmoist), with precip pending.

    vegetation_impacts:
      description: "Ecological drought impacts (secondary indicators)."
      variables:
        npp: "Net primary productivity - declines under drought."
        gpp: "Gross primary productivity."
        burntarea: "Burnt area - drought-driven fire."
        ffire: "Fire carbon flux."
        yield-noirr: "Rainfed crop yields ({crop}-noirr) - drought-sensitive."
        aet: "Actual ET (growing-season water use)."
        gsprcp: "Growing-season precipitation."
      tree_water_stress:
        description: |
          TREE-SPECIFIC drought-stress diagnostics in the biomes sector, ADDED 2026-07-28
          -- the list above omitted them. These are the physiologically direct signals for
          forest drought, and all are PFT-resolved in at least one model.
        variables:
          trans: "Transpiration. 2b: caraib, clm45, jules-es-55, lpj-guess, lpjml, orchidee, orchidee-dgvm (7 models). 3b: classic/elm-eca/visit publish `trans-total`; JULES publishes PER-TREE-PFT (trans-ndlevg, trans-bdldcd, trans-bdlevgtemp/trop, ...). clm45 (2b) is also PFT-resolved."
          lai: "Leaf area index, PFT-resolved in caraib/clm45/lpj-guess/orchidee (2b) and classic/jules (3b). mc2-usfs publishes `lai-tree` directly."
          fapar: "Fraction of absorbed PAR -- canopy greenness deficit. JULES-ES-VN6P3 (3b) ONLY, incl. per-tree-PFT."
          pft: "Fractional cover per PFT (`pft-{type}`). ANNUAL. 2b: caraib(44), lpjml(44), orchidee/orchidee-dgvm(17), lpj-guess(14). 3b: classic(9), jules(13+), mc2-usfs(30 biome types incl. named forest classes)."
          npp-tree: "Tree-only NPP, published directly by mc2-usfs (2b and 3b), annual."
        cadence_trap: |
          `trans` and `soilmoist` are MONTHLY-ONLY in EVERY model, BOTH rounds -- there is
          no annual version to fall back on. A tree-transpiration-deficit layer therefore
          means a monthly ingest (order 40-60 GB for a thick 3b ensemble). `pft-*`,
          `lai-tree` and `npp-tree` ARE annual and far cheaper.
        why_not_chosen_2026_07_28: |
          Considered and rejected as the drought layer, in favour of `driedarea`:
          - trans deficit is the most physiological, but CO2-induced stomatal closure
            LOWERS transpiration while the tree is doing fine -- the sign is ambiguous
            without a demand reference (potevap, which is not in the biomes sector).
          - npp/lai shortfall is annual and multi-model, but NPP change is a composite of
            CO2 fertilization, warming and nutrient limitation; attributing it to drought
            is not defensible. Better framed as a forest-PRODUCTIVITY companion layer.
          - a self-computed index from 3b `soilmoist` (8 models x 5 GCMs, water_global,
            ssp126/370/585) is the only route to CONTINUOUS severity rather than a binary
            flag, and would let us control the baseline -- but it is a monthly ingest that
            largely duplicates what Heinicke2026 already computed. Note `rootmoist` (the
            tree-relevant depth) exists in only 2 of those 8 models; the rest publish
            whole-column `soilmoist`.
        forestry_sector_dead_end: |
          ISIMIP2b `forestry` has TEN models (see cwood.forestry_sector), but every one is
          SITE-LEVEL -- filenames carry kroof, hyytiala, bily-kriz, collelongo, peitz,
          solling-beech (European experimental stands). Unusable for a global layer.
          ISIMIP3b and 3a have NO forestry sector at all.

  # -------------------------
  # wildfire searches (fire sector + biomes burntarea + Lange2020 exposure)
  # -------------------------
  wildfire:
    last_searched: "2026-07-28"   # re-enumerated in full; corrections below
    description: "Wildfire has SEVERAL distinct ISIMIP representations -- enumerate all, don't assume the exposure family or any single one is the only option."
    enumeration_2026_07_28: |
      Re-walked the file server: 240 leaf directories, 224,762 filenames, 0 failed
      requests; 8 representative files downloaded and value-checked.
      CORRECTIONS to the 2026-07-24 entry:
      1. THE DEDICATED `fire` SECTOR WAS NEVER WALKED. The old section was titled
         "fire sector + biomes burntarea" but only `biomes` was enumerated.
         - ISIMIP3b/OutputData/fire: harmless. Its 451 burntarea-total files are a
           STRICT SUBSET of ISIMIP3b/OutputData/biomes (intersection 451, fire-only 0).
         - ISIMIP3a/OutputData/fire: A REAL GAP. 10 models exist there and nowhere
           else -- CLASSIC, ELM-ECA, JULES-INFERNO-VN6P3, LPJ-GUESS-SIMFIRE-BLAZE,
           LPJ-GUESS-SPITFIRE, LPJmL5-7-10-fire, MC2-USFS, ORCHIDEE-MICT,
           SSiB4-TRIFFID-Fire, VISIT -- plus fire variables absent from this catalog:
           firesize, firenr, fireints, fireduration, fireros, firemortality, ffireluc.
           3a is observed-climate (obsclim/counterclim), HISTORICAL ONLY, so it cannot
           project; it is the natural EVALUATION reference, not a layer source.
      2. "mc2-usfs is a 5-7x hotter outlier" IS BACKWARDS AS A CHARACTERIZATION. The
         ratio is right but the sign of the judgement is not. Area-weighted global
         burnt area vs GFED4 (~348 Mha/yr = ~3.5 Mkm2/yr):
           mc2-usfs 5.63 / visit 4.88 / classic 7.26 Mkm2/yr  -> right order
           lpj-guess 1.09 / lpjml 0.94                        -> ~3.5x TOO LOW
           caraib 0.32                                        -> ~11x too low
         So the 2b trio that was shipped (lpj-guess + lpjml + mc2-usfs) was 2 low-biased
         models against 1 roughly-calibrated one -> its median burnt area was biased LOW.
      3. "coarse biome model" READS AS A GRID CLAIM AND IS NOT ONE. mc2-usfs is
         genuinely 0.5 deg: 4.6% constant 2x2 blocks, clean grid_periodicity (0.95-1.10),
         no seam spacing. The retired 2b layer had NO elm-eca-class spatial defect.
      4. MISSING PER-MODEL CAVEATS: caraib and orchidee-dgvm have NO rcp85;
         orchidee-dgvm has only 2 GCMs. 3b mc2-usfs has 5 GCMs, not 4.
      5. THE DECLARED UNIT CANNOT GATE A POOLING DECISION. clm45, orchidee and
         orchidee-dgvm all declare units='%' yet sit ~1000x lower -- they are on a 0-1
         FRACTION scale, mislabeled. Value-check magnitudes, never the unit string.
      6. NEW -- MONTHLY burntarea ACCUMULATES: annualize by SUM, not mean. classic
         publishes the same run at daily AND monthly cadence; each published monthly
         value equals the SUM of that month's daily values (1e-6 agreement,
         r=1.00000000 in all 12 months). A mean under-scales by 12x. This is the
         OPPOSITE of csoil (a stock, correctly annualized by mean).
      7. NEW -- 3b classic is EFFECTIVELY 1.0 deg: 100.0% of its 2x2 cell blocks are
         exactly constant at offset (0,1). Retained deliberately (still informative);
         elm-eca at ~4x5 deg is excluded.
      8. NEW -- annual burnt area is CUMULATIVE and legitimately exceeds 100% where a
         cell reburns within a year (visit 0.15% of annual values, <=120%; classic
         0.05%, a few to ~182%; decadal means peak ~107%). Do NOT clamp to 100 --
         clamping upper_ci there would drive it below the median.
    products:
      lew_exposure:
        note: "Lange 2020 land-area-exposed-to-unprecedented-wildfire. See drought.exposure_lange2020.family (lew). Exposure framing; NOT processed."
        verified_2026_07_28: "5 models (caraib, lpj-guess, lpjml, orchidee at 4 GCMs; visit at only 3) -> 19 members per scenario. Scenarios rcp26 + rcp60 ONLY -- there is NO rcp85. The earlier 'rcp26=31' was a DATASET count including soc/sens variants, not members. Lives in ISIMIP2b/DerivedOutputData/Lange2020/ (filenames carry a 'lange2020_' prefix, which shifts field offsets by one vs OutputData)."
      burntarea:
        long_name: "Burnt area fraction (percent of grid cell burned per reporting interval)"
        note: "DIRECT biophysical fire output -- the chosen representation. API count for bare 'burntarea' = 1001 (TRUNCATED) -> enumerated per round from the file server."
        gotcha: "ISIMIP2b publishes .nc4; ISIMIP3a/3b publish .nc. A '*.nc' filter silently drops the ENTIRE 2b round."
        variable_form: "2b = bare 'burntarea'; 3a/3b = 'burntarea-total' plus PFT splits (burntarea-c3crop/-c3grass/...)"
        isimip2b:
          datasets: 648
          impact_models_all: ["caraib", "clm45", "lpj-guess", "lpjml", "mc2-usfs-r87g5c1", "orchidee-dgvm", "orchidee", "visit"]  # 8 models, CONFIRMED
          annual_models: ["lpj-guess", "lpjml", "mc2-usfs-r87g5c1"]  # only these 3 publish ANNUAL -- CONFIRMED
          climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]
          scenarios: ["historical", "picontrol", "rcp26", "rcp60", "rcp85"]
          per_model_caveats: "caraib rcp26/60 only; orchidee-dgvm rcp26/60 only AND 2 GCMs; hadgem2-es + ipsl-cm5a-lr additionally have future_extended runs to 2299"
          soc_variants: "many (1860soc/2005soc/rcpXXsoc/histsoc/nosoc); pin 2005soc (lpj-guess,lpjml) / nosoc (mc2-usfs) + co2 to isolate the climate signal"
          units: "declared '%' for all 8 -- but only lpj-guess/lpjml/mc2-usfs/caraib/visit are actually on a percent scale; clm45/orchidee/orchidee-dgvm are on a 0-1 fraction scale (see correction 5)"
          data_nature: |
            Continuous, zero-inflated to varying degrees. Value-checked 2026-07-24, re-verified 2026-07-28:
            lpj-guess  units=% min=0.1 max=98 mean=0.71 zeros=0.00% (FLOORED at 0.1%, no true zeros; long_name MISLABELED 'Fire Return Interval' but data are burnt-%)
            lpjml      units=% min=0   max=80 mean=0.63 zeros=1.05% long_name='burnt area fraction'
            mc2-usfs   units=% min=0   max=100 mean=4.04 zeros=45.0% (genuinely 0.5 deg; TIME AXIS = 'days since 1661', others 'years since')
            visit      units=% (monthly) -> annual SUM 3.33 %/yr; long_name ABSENT (None)
            caraib     units=% (monthly) -> annual SUM 0.18 %/yr; long_name ABSENT (None); no rcp85
            clm45/orchidee/orchidee-dgvm  declare '%' but are FRACTION-scaled (~1000x low) -- unusable for an absolute burnt-area layer
        isimip3b:
          datasets: 560
          annual_models: ["mc2-usfs-r87g5c1"]        # 5 GCMs, ssp126/370/585
          monthly_models: ["classic", "elm-eca", "visit"]   # annualizable by SUM
          daily_models: ["classic"]
          scenarios: ["ssp126", "ssp370", "ssp585", "historical", "picontrol"]
          matrix: "mc2-usfs annual 5 GCMs (nat/default); visit monthly 5 GCMs (2015soc/default); classic monthly 2 GCMs (gfdl-esm4, ukesm1-0-ll; 2015soc-from-histsoc/default); elm-eca monthly 5 GCMs (EXCLUDED ~4x5 deg)"
          effective_resolution: "mc2-usfs 0.5 deg clean; visit 0.5 deg clean; classic EFFECTIVE 1.0 deg (100% constant 2x2 blocks); elm-eca ~4x5 deg -> EXCLUDED"
      ffire:
        long_name: "Fire carbon emissions flux (kg C m-2 s-1), PFT-split"
        note: "797 datasets, ISIMIP3a/3b only (no 2b -- confirmed), mostly monthly but 3b DOES publish ffire-total annual (35 files). Emissions metric -- least aligned with an asset-facing wildfire risk layer."
      fire_sector_only:
        note: "ISIMIP3a `fire` sector only (historical, no projections): firesize, firenr, fireints, fireduration, fireros, firemortality, ffireluc. Useful for evaluation / model weighting, not as a TCFD layer source."
    chosen: "burntarea-total, ISIMIP3b, ssp126/370/585. 12 members/scenario = mc2-usfs (annual, 5 GCMs) + visit (monthly->annual SUM, 5 GCMs) + classic (monthly->annual SUM, 2 GCMs); elm-eca EXCLUDED. Raw %, NO normalization (same unit AND within 1.6x), NO spatial smoothing (12/scenario is thick), baseline-anchored trend, shared 2020s baseline (3b starts 2015 -> no 2010s decade)."
    chosen_rationale: "Newer round and scenario family are preferred wherever the newer data is viable (user decision 2026-07-28). The 2b option was thicker (4 models x 4 GCMs = 16/scenario incl. visit) and better calibrated in aggregate, but rests on CMIP5 forcing; recency won."
    superseded: "The ISIMIP2b/RCP build (2026-07-24, 3 models x 4 GCMs x rcp26/60/85) is RETIRED. Its outputs went to local data/processed/, which the S3 migration removed and which was never in git, so that layer no longer exists as data anywhere -- only as the numbers recorded here (global-mean burnt% flat rcp26, +6.6% rcp60, +14.8% rcp85 by 2090s, on a LOW-biased ensemble; see correction 2)."
    processed: "2026-07-28 -> TCFD layer wildfire_burntarea_annual (ISIMIP3b). scripts/process_burntarea_fire.py; S3 tcfd/layers/wildfire_burntarea_annual/. Global-mean burnt%: 2020s baseline 3.42, 2090s 3.74/4.36/4.65 for ssp126/370/585 = +9.3/+27.5/+35.9%. See memory project_burntarea_fire_layer, WORKFLOW-ISSUES.md 2026-07-28, GUARDRAILS §9-§11."
    open_issues:
      visit_high_latitude_bias: |
        OPEN as of 2026-07-28 -- NO decision taken; do not record this as resolved.
        The 5 `visit` members have an INVERTED zonal profile. 2090s ssp585 land-mean
        burnt %/yr by latitude band:
                     45-60N  60-70N  70-75N  >75N
          visit        4.76    3.36    5.95   25.94
          mc2-usfs     0.65    1.35    1.45    0.67
          classic      1.15    0.10    0.02    0.00
        visit therefore burns MORE above 75N (25.9%) than in the tropics (7.3% at
        23S-0), which is not physical. Worst cells are visit-only Arctic islands
        (Franz Josef Land, Severnaya Zemlya, Novaya Zemlya) saturated near 100%/yr --
        e.g. 81.25N/56.75E reads 0.000% in the 2020s and 100.04% in the 2090s on a
        single model. In the POOLED layer, >75N reaches 6.5/9.0/10.0 %/yr
        (ssp126/370/585), exceeding the tropical band.
        Why no aggregate check caught it: polar cells carry negligible area, so visit's
        global area-weighted total (4.56 Mkm2/yr) is the CLOSEST of the three models to
        GFED4's ~3.5. Found only by rendering and by a per-latitude breakdown.
        Status: all 12 members RETAINED, nothing masked, pending review of the results
        (user decision 2026-07-28: "note the potential issue with polar region
        anomalies, but make no decision about exclusion until the results land").
        Instrumented: the layer declares `zonal_expectation: low_latitude_dominated`,
        and generate_qa_report.py now reports the zonal profile for every layer and
        WARNS when a polar band exceeds the tropical band.
        If exclusion is later chosen: dropping visit leaves 2 models / 7 members per
        scenario (mc2-usfs 5 GCMs = 71% of members, classic 2), 8,245 cells (12.3% of
        land) resting on classic alone at an effective 1.0 deg with only 2 members, and
        mc2-usfs as the sole genuine 0.5 deg model -- which would reopen the
        thin-ensemble spatial-smoothing question. visit adds only 202 unique land cells,
        so this is about ensemble depth and grid quality, not coverage.
        Meanwhile: treat burnt-area values poleward of ~70N as unreliable.
      coastal_low_burn_dilution: |
        OPEN as of 2026-07-28 -- ACCEPTED, to be masked downstream (user: "there are
        issues with low burn % along coastlines but we can mask these after the fact").
        Coastal land cells carry implausibly LOW burnt-area %. Measured on the 2020s
        baseline (coastal = a land cell 8-adjacent to non-land):
                     cells    mean   median   zeros   <0.5%   mean n_models  1-model
          coastal    8,337    4.428   0.029   33.2%   72.3%      1.54         67.5%
          interior  59,029    3.278   0.520    7.9%   49.1%      2.90          3.7%
        The coastal median is ~18x below the interior median.
        Two compounding causes, both structural rather than a processing bug:
          1. PARTIAL-LAND DILUTION. burntarea is a fraction of the WHOLE cell, so a cell
             that is 10% land can report at most ~10% burnt even if all its land burns.
             An asset sited on the land portion experiences the land's fire regime, not
             the cell average -> the published value understates its exposure.
          2. SINGLE-MODEL COVERAGE. 67.5% of coastal cells are backed by ONE model
             (vs 3.7% inland), because the models' land masks differ (classic 66,684
             cells, mc2-usfs 58,919, visit 58,714). The coastal ring is largely the
             widest mask alone, so it gets neither ensemble averaging nor a meaningful CI.
        Remedies, in preference order:
          a. Mask the coastal ring downstream (agreed approach for now). n_models == 1
             plus coastal adjacency identifies it without new data.
          b. Normalize by land fraction (divide by each cell's land area share) to
             recover the land-only burnt fraction. Needs a land-fraction field, which
             ISIMIP does not ship with these outputs.
        NOT a wildfire-specific problem: any per-cell FRACTION hazard (led, let, lew,
        fldfrc) is diluted the same way at coastlines. Check before shipping any of them.

  # -------------------------
  # flooding searches (river / fluvial)
  # -------------------------
  flooding:
    last_searched: "2026-07-28"
    description: >
      Severe / regional river flooding, target metric = AREA IMPACTED PER YEAR.
      Four distinct representations exist; they are NOT interchangeable and two of
      them do not measure what their metadata says. No dedicated 'flood' sector
      exists -- flood products live in DerivedOutputData (CaMa-Flood post-processing).
    enumeration_2026_07_28: |
      Walked every round x product x sector on files.isimip.org serially, then
      downloaded and value-checked 10 files. Findings, in order of importance:

      1. THERE IS NO INUNDATION VARIABLE IN THE RAW water_global SECTOR. Confirmed
         across all 17 ISIMIP2b + 9 ISIMIP3b water_global models: no fldfrc, no
         flddph, no floodedarea. Flooded area exists ONLY as DerivedOutputData.
         `maxdis` (annual max discharge, the obvious peak-flow proxy) exists in just
         2 of 17 2b models (clm45, mpi-hm) and ZERO 3b models -> unusable as an
         ensemble. Building flood area from daily `dis` is possible but daily dis is
         ~929 MB per 10-year chunk per member (~1 TB+ for a full ensemble) and would
         mean re-deriving the GEV fit + hydrodynamic routing that Zimmer2023 already
         published. Rejected.

      2. Heinicke2026 `floodedarea` IS NOT AN AREA SHARE -- IT IS BINARY. ISIMIP3b
         Heinicke2026 declares long_name="Exposed Area Share", units="1",
         definition="Flood fraction from cama flood". The values are strictly {0,1}.
         Verified on 6 of 15 members spanning all 3 models, 4 GCMs and all 3 SSPs:
         n_unique == 2 every time. Per cell it is a flood OCCURRENCE FLAG, so the
         decadal mean is flood FREQUENCY (fraction of years flooded), not area share.
         GUARDRAILS §8 again: value-check, never trust long_name/definition/units.
         RE-VERIFIED HARD 2026-07-28 after the finding was challenged (the natural
         objection is that `ler`, the 2b analogue, IS fractional -- so why not this?):
           - download is byte-identical to the sidecar (sha512 + size match), so it is
             not a truncation artifact;
           - dtype float32 with NO scale_factor and NO add_offset, so nothing is being
             silently unpacked;
           - read with set_auto_maskandscale(False), the RAW stored values are exactly
             {0.0, 1.0, 1e20} -- 20,885,979 zeros / 226,419 ones / 1,178,802 fill;
           - ALL 86 timesteps have exactly 2 unique values (min=max=2);
           - point time series switch cleanly 0->1->0 (Mississippi 32N/-91E flags in
             years 2021, 2033, 2037), the signature of an occurrence flag.
         It is genuinely binary. Do not re-litigate this without redoing these checks.

      2b. BINARISING AT 0.5deg INFLATES FLOODED AREA BY 17-28x, so `floodedarea`
         CANNOT be read as "% area impacted per year" even after spatial aggregation.
         Measured directly by taking Zimmer2023 fldfrc (true sub-grid fraction),
         coarsening it two ways to 0.5deg and area-weighting (h08/miroc5/rcp60, 2020s):
           protection   TRUE area km2/yr   BINARY-flag km2/yr   inflation
           none                6,104,969        106,330,690       17.4x
           100yr                 260,894          6,951,831       26.6x
           flopros               743,970         20,693,916       27.8x
         A 0.5deg cell is ~2,500 km2 at mid-latitudes; flagging the whole cell when any
         part of it floods counts ~71% of global land as "flooded" under `none` against
         a true ~4%. The binary field answers "does this cell contain flooding?", not
         "how much area flooded?" -- only a sub-grid fractional product answers the
         second question.

      3. Heinicke2026 `floodedarea`'S MASK IS BROKEN -- IT INCLUDES OCEAN. 245,493 of
         259,200 cells (94.7% of the GLOBE) are non-NaN, and mid-Pacific, mid-Atlantic
         and Antarctica all read 0.0 rather than NaN -- while Sahara and Greenland ARE
         NaN. The NaN pattern tracks the CaMa-Flood river network, with ocean
         zero-filled. Only 13-15% of "valid" cells are EVER flooded in 86 years. Any
         processor must impose its own land+floodplain mask or global statistics get
         computed over the Pacific. Note `driedarea`, from the SAME product and model,
         IS correctly land-masked (53,713 cells) -- the defect is specific to
         floodedarea, so a per-variable mask check is mandatory.

      4. Lange2020 IS TWELVE VARIABLES, NOT SIX. The catalog documented only the `le*`
         (land area exposed) half. Every hazard also publishes a `pe*` twin =
         POPULATION fraction exposed: ped/per/pew/pec/peh/pet. Verified by listing all
         15 Lange2020 model dirs. `per` (population fraction exposed to river flood)
         is arguably more decision-relevant than `ler` for a severity product.
         Also: `lec` is NOT gepic-only -- pepic publishes it too.

      5. `ler` ~= THE 100yr PROTECTION LEVEL OF Zimmer2023, PRE-AGGREGATED TO 0.5deg.
         Matched member (h08/miroc5/rcp60), 2020s decadal mean, Zimmer2023 fldfrc
         aggregated 12x12 to 0.5deg vs Lange2020 ler on the shared 61,483 cells:
           none     mean ratio 25.04   Pearson 0.319  Spearman 0.321
           100yr    mean ratio  0.99   Pearson 0.723  Spearman 0.784   <-- match
           flopros  mean ratio  2.54   Pearson 0.467  Spearman 0.613
         So choosing `ler` is choosing a fixed 1-in-100 protection assumption with no
         way to vary it, and no rcp85.

      6. THE PROTECTION LEVEL IS THE SEVERITY DIAL AND IT DOMINATES THE ANSWER.
         Same member (h08/miroc5/rcp60), global flooded area, 2020s -> 2090s decadal
         means (km2/yr, area-weighted at 150arcsec):
           none     6,104,969 -> 6,282,904   +2.9%   <-- flat; NO risk signal
           100yr      260,894 ->   501,993  +92.4%
           flopros    743,970 -> 1,130,053  +51.9%
         `none` counts routine seasonal floodplain wetting, which happens every year in
         both decades, so the metric SATURATES and its trend is muted. A severity
         threshold is what exposes the climate signal.

      6b. PROTECTION ORDERING IS none < flopros < 100yr, AND "flopros ~= none WHERE
         UNDEFENDED" IS FALSE. Tempting assumption, measured and rejected. 2020s mean
         fldfrc by region (x1e4, area-weighted), with the flopros/none ratio:
           region                none    100yr  flopros   flopros/none
           Bangladesh/Ganges  1664.15   261.12   313.85      0.189
           Mississippi         803.32    28.98    11.67      0.015
           Netherlands/NW Eur  813.03    12.80     6.50      0.008
           Niger/Nigeria       214.31    13.16    78.11      0.364
           Amazon              729.82    15.98    58.40      0.080
           Mekong              645.20    48.75   224.70      0.348
           Japan                94.64     1.23     4.08      0.043
           Rhine/Germany       549.47    13.09    12.85      0.023
         FLOPROS assigns non-trivial protection EVERYWHERE -- even the least-defended
         regions retain only 19-36% of the undefended signal. So flopros is NOT a
         proxy for "unprotected". It is spatially real, though: flopros is LESS
         protective than a uniform 100yr in Niger (78 vs 13) and Bangladesh (314 vs
         261), and MORE protective in the Mississippi (12 vs 29) and Netherlands
         (6.5 vs 12.8), where defenses exceed 1-in-100. That is the correct physical
         behaviour and it validates the layer.
         CONSEQUENCE FOR METRIC CHOICE:
           - want "all inundation, credit no defenses"  -> `none`   (saturating, weak trend)
           - want "SEVERE events, credit no real-world defenses" -> `100yr`, which is a
             1-in-100 SEVERITY THRESHOLD; calling it "protection" understates that it is
             the natural choice when you do not want to rely on FLOPROS at all
           - want "residual risk given actual defenses" -> `flopros`

      7. ANNUAL FLOODED AREA IS EXTREMELY VOLATILE. Same member, flopros, global
         area: 2080 = 1,207,332 km2 vs 2100 = 69,751 km2 -- a 17x swing between
         single years. Decadal means are mandatory and a within-decade slope is
         meaningless -> use the BASELINE-ANCHORED trend, as for burntarea and csoil.

      8. NO COASTAL / SEA-LEVEL FLOODING EXISTS ANYWHERE IN ISIMIP. Sector listings
         across all four rounds: agriculture, biodiversity, biomes, fire, forestry,
         health, lakes_global, lakes_local, marine-fishery_*, peat, permafrost,
         water_global, water_regional. There is no coastal sector. Coastal flood risk
         cannot be sourced from ISIMIP.

    options:
      zimmer2023_fldfrc:
        recommended: true
        description: "CaMa-Flood v3.6.2 annual flooded FRACTION, downscaled to 150 arcsec (~4.6 km). The only true area-impacted metric with a protection dial and rcp85."
        path: "ISIMIP2b/DerivedOutputData/Zimmer2023/{MODEL}/{gcm}/future/"
        product: "DerivedOutputData (annual, ready to process)"
        variables:
          fldfrc: "Flooded area fraction [0,1]. VERIFIED fractional: 3,775 unique values in one year, 1.8% of cells strictly in (0,1)."
          flddph: "Flood depth (m) -- severity intensity companion, same matrix."
        protection_levels: ["none", "100yr", "flopros"]   # flopros = FLOod PROtection Standards database (real-world defenses)
        impact_models: ["clm45", "cwatm", "h08", "lpjml", "matsiro", "watergap2"]   # 6 with FUTURE runs
        historical_only_models: ["clm50", "mpi-hm", "pcr-globwb"]  # 404 on future/
        climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]
        scenarios: ["rcp26", "rcp60", "rcp85"]   # ALL THREE -- unlike Lange2020
        members_per_scenario: 24   # 6 models x 4 GCMs, complete (432 future files = 24 x 3 scen x 2 vars x 3 protections)
        soc_sens: "2005soc / co2, UNIFORM across all 432 future files -- no soc/sens divergence to reconcile (§9)"
        timestep: "annual"
        period: "2006-2100 (95 years) -- 2020s baseline fully available"
        grid: "4320 x 8640 (150 arcsec, 1/24 deg). Aggregates EXACTLY 12x12 to the 0.5deg TCFD grid -> a true sub-grid area-impacted fraction, not a flag."
        file_sizes: "fldfrc: ~0.12 GB (flopros), ~0.07 GB (100yr), ~0.55 GB (none). fldfrc/flopros full ensemble = 24 x 3 = 72 files ~= 9 GB."
        coverage: "8,143,012 of 37,324,800 cells at 150arcsec (21.8%); aggregates to 62,066 of 259,200 0.5deg cells (23.9%). This is the CaMa-Flood floodplain domain -- ~76% of the grid is structurally NaN, which is scientifically correct but is a PRODUCT decision to confront."
        provenance: "Global attrs are rich and self-documenting: created_with=github.com/swillner/flood-processing, citation=10.5281/zenodo.1241051, discharge_threshold=0.1mm/d, fit=gev, fit_scenario=picontrol, fit_soc=1860soc, cama_flood_version=3.6.2. Method = GEV fit to picontrol discharge -> return-period exceedance -> protection subtraction -> CaMa-Flood inundation -> 150arcsec downscale."
        metadata_warning: "The fldfrc variable carries ONLY _FillValue -- no units, no long_name. Value-checking is not optional here."
        evaluation_counterpart: "ISIMIP2a/DerivedOutputData/Zimmer2023 -- 12 GHMs x 4 observational forcings (gswp3, princeton, watch, watch-wfdei), historical only. The validation reference, not a layer source."
      lange2020_ler_per:
        description: "Pre-aggregated 0.5deg river-flood exposure. The fast path; equals a fixed 100yr protection assumption."
        path: "ISIMIP2b/DerivedOutputData/Lange2020/{MODEL}/{gcm}/future/"
        variables:
          ler: "Land area fraction exposed to river flood. VERIFIED fractional [0, 0.9988] -- 239,812 unique values, 6.1% strictly in (0,1). Contrast led, which is binary."
          per: "Population fraction exposed to river flood. Fractional [0,1], identical mask to ler."
        impact_models: ["clm45", "h08", "jules-w1", "lpjml", "mpi-hm", "orchidee", "pcr-globwb", "watergap2"]
        climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]
        scenarios: ["rcp26", "rcp60"]   # NO rcp85
        members_per_scenario: 31   # 8 x 4 minus mpi-hm/hadgem2-es (genuine 404)
        soc_divergence: "orchidee publishes led/ler under nosoc but lew under 2005soc; the GHMs use 2005soc. Filter loosely or the ensemble collapses (§9)."
        mask_varies_by_model: "clm45 58,567 cells vs h08/watergap2 61,995 -> n_members per cell varies, as with csoil. Emit n_members/n_models."
        file_extension: ".nc4  -- NOT .nc. A `grep '\\.nc\"'` returns zero and reads as 'no data'."
        file_sizes: "~8.5 MB per member-scenario. The whole ler+per ensemble is well under 1 GB."
        timestep: "annual"
        period: "2006-2099"
      heinicke2026_floodedarea:
        description: "ISIMIP3b/SSP river-flood exposure. Newest round, but the metric is flood FREQUENCY (binary flag), not area share, and the mask includes ocean."
        path: "ISIMIP3b/DerivedOutputData/Heinicke2026/{MODEL}/{gcm}/{future,historical}/"
        variables:
          floodedarea: "BINARY {0,1} despite long_name='Exposed Area Share'. Decadal mean = flood frequency. Mask covers 94.7% of the globe INCLUDING OCEAN (see finding 3)."
          driedarea: "BINARY {0,1} drought flag, CORRECTLY land-masked (53,713 cells). This is the SSP-era sibling the existing rcp-only `led` drought layer lacks."
        impact_models: ["h08", "jules-w2", "watergap2-2e"]
        climate_forcings: ["gfdl-esm4", "ipsl-cm6a-lr", "mpi-esm1-2-hr", "mri-esm2-0", "ukesm1-0-ll"]
        scenarios: ["ssp126", "ssp370", "ssp585"]
        members_per_scenario: 15   # 3 x 5, complete; historical 1850-2014 also complete
        soc_sens: "2015soc / default, uniform"
        bias_adjustment: "w5e5"
        timestep: "annual"
        period: "future 2015-2100; historical 1850-2014"
        grid: "360 x 720 (0.5 deg)"
        file_sizes: "~1.0-1.4 MB per member-scenario-variable; the ENTIRE 120-file product is ~120 MB."
        contact: "Stefanie Heinicke <heinicke@pik-potsdam.de>, PIK"
      rejected_raw_discharge:
        description: "Building flood area from raw water_global discharge. Rejected -- see findings 1 and 6."
        maxdis_coverage: "ISIMIP2b clm45 + mpi-hm only (monthly); ISIMIP3b: none."
        dis_coverage: "Daily dis is broad (2b: 11 models incl. rcp85; 3b: 6 models) but ~929 MB per 10-year chunk per member."
    quesada_chacon2026:
      description: "ISIMIP3a CaMa-Flood daily discharge at GRDC / no-basin gauge locations, obsclim + counterclim, 1901-2019, 9 GHMs. POINT/station data, historical only -- a routing-validation product, not a gridded flood layer."
      path: "ISIMIP3a/DerivedOutputData/Quesada-Chacon2026/CaMa-Flood/{grdc,noba}/{obsclim,counterclim}/"
    recommendation_2026_07_28: |
      PRIMARY: Zimmer2023 `fldfrc`, ISIMIP2b, rcp26/60/85, 24 members/scenario,
      aggregated 12x12 from 150arcsec to the 0.5deg TCFD grid. It is the ONLY option
      that is a genuine area-impacted fraction -- Heinicke2026 is a binary occurrence
      flag that overstates area 17-28x (finding 2b), and `ler` is fixed at one
      protection level with no rcp85. Accepts the CMIP5/RCP round; no SSP equivalent
      of a fractional flood-area product exists.
      PROTECTION LEVEL depends on the stated use case, and it is the single biggest
      choice in this layer (finding 6/6b). For "impacts across large areas in
      UNPROTECTED regions" -- the 2026-07-28 user framing -- ship `none` and `100yr`
      as the pair, NOT flopros: `none` gives unprotected magnitude, `100yr` gives the
      severe-event signal without relying on FLOPROS defense data. flopros retains
      only 19-36% of the signal even in the least-defended regions, so it answers a
      different question (residual risk given actual defenses) and is the natural
      THIRD layer, not the primary. All three are cheap enough to ship together
      (fldfrc: none 0.55 GB, flopros 0.12, 100yr 0.07 per member-scenario).
      CROSS-CHECK / FAST PATH: Lange2020 `ler` (+`per` for population). ~1 GB total,
      0.5deg native, 31 members, and a process_led_drought.py sibling -- but rcp26/60
      only and a fixed 100yr protection assumption.
      PROCESSING NOTES: decadal MEAN (exposed-area fraction, never median);
      baseline-anchored trend, NOT a within-decade slope (finding 7); two-tier
      zero-inflated percentile (88% of 0.5deg cells are zero in a given year), as for
      `let`; NO spatial smoothing (24 members is thick); NO normalization (shared
      fraction unit); higher_is_worse (flooding is a hazard, unlike csoil); emit
      n_members/n_models; impose an explicit land+floodplain mask.

  # -------------------------
  # soil / subsurface carbon searches (biomes sector)
  # -------------------------
  soil_carbon:
    last_searched: "2026-07-27"   # re-enumerated in full; corrections below
    description: "Subsurface / root-zone carbon. Lives in the biomes sector as carbon-pool STATE variables; there is no dedicated soil sector. Enumerate STOCKS (csoil soil, croot/cvegbg root-zone) vs the net-sink FLUX (nbp)."
    note: "Catalog's biomes_models variable lists were INCOMPLETE for carbon -> enumerated the file server directly. The data.isimip.org API is behind Anubis anti-bot -> use files.isimip.org + curl (WebFetch truncates long listings). See GUARDRAILS §8."
    enumeration_2026_07_27: |
      Re-enumerated 98 directories (66,902 filenames parsed) + 17 file headers read.
      CORRECTIONS to the 2026-07-25 entry below:
      1. VARIABLE NAME DIFFERS BY ROUND: ISIMIP2b publishes bare 'csoil'; ISIMIP3b
         publishes 'csoil-total' (plus PFT/pool splits). Searching 'csoil-total' in
         2b returns NOTHING and must not be read as "absent".
      2. ISIMIP2b csoil has 11 models, not the 9 listed: the 2026-07-25 list MISSED
         CLM45 (annual) and VEGAS (monthly).
      3. ELM-ECA cross-publishes csoil-total under BOTH the biomes and permafrost
         sectors, BYTE-IDENTICAL (same sha512, 237,500,430 B). Ingesting both would
         silently double-weight ELM-ECA. Use the biomes copy only.
      4. ISIMIP3b biomes has NO ssp245 for any variable -- only ssp126/370/585
         (+historical, picontrol).
      5. Parallel curl of the file server gets RATE-LIMITED and returns EMPTY
         listings that look like real "no data" answers (13 of 22 dirs on the first
         pass). Harvest serially with retries and assert non-empty per directory.
      NEW variables found, absent from the 2026-07-25 'variables' list:
        csoillayer-total  Depth-resolved SOC. CLASSIC (20 layers) + JULES. UNUSABLE
                          as shipped: CLASSIC's depth coord is integer-rounded so
                          the top 10 layers all read "0 m" (cannot cut 0-30 cm, the
                          conventional SOC accounting depth) and layer 0 holds ~81%
                          of the column; JULES's copy has depth=1 and column values
                          ~1042 kg C m-2, ~100x its own csoil-total. Do not use.
        rsoil / rsoil-total   Soil respiration. ELM-ECA only (3b).
        fvegsoil-total        Vegetation->soil C input flux. JULES only (3b).
        flittersoil-total / flitter-total  Litter fluxes. CLASSIC, ELM-ECA (3b).
        clitterag-total       Above-ground litter pool. 4 models (3b).
        nsoil-total           Soil nitrogen. CLASSIC (3b).
    variables:
      csoil: "Soil organic carbon stock (kg C m-2) -- the direct subsurface storage pool. ISIMIP2b: bare 'csoil'. ISIMIP3b: 'csoil-total' (CLASSIC PFT-split, JULES RothC pool-split, MC2 single)."
      croot: "Root biomass carbon (kg C m-2). ISIMIP3b only; NOT in ISIMIP2b future runs."
      cvegbg: "Below-ground vegetation carbon (roots + below-ground woody); cvegag = above-ground. ISIMIP2b: JULES-ES-55, MC2-USFS. ISIMIP3b: CLASSIC, JULES, MC2, ELM-ECA."
      nbp: "Net Biome Production = net land carbon-sink flux (kg C m-2 s-1) = sequestration RATE. ISIMIP3b: 5 biomes models, 22 model x GCM members per ssp. ABSENT from ISIMIP2b future runs (2b has only 'rh'). This is the SEQUESTRATION-RATE product, distinct from the csoil STOCK."
    availability:
      isimip2b:  # RCP26/60/85, CMIP5, 4 GCMs, 2006-2099 (+historical 1861-2005)
        csoil_annual: ["caraib", "clm45", "dlem", "jules-es-55", "lpj-guess", "lpjml", "mc2-usfs", "orchidee", "orchidee-dgvm"]   # 9 annual
        csoil_monthly: ["vegas", "visit"]
        csoil_members: "rcp26/rcp60: 33 model x GCM annual; rcp85: 20 (only clm45, lpj-guess, lpjml, mc2-usfs, orchidee). Uniform transient-CO2 + fixed-land-use runs available for 29 (rcp26/60) / 20 (rcp85)."
        cvegbg_models: ["jules-es-55", "mc2-usfs"]
        croot: "absent (future runs)"
        nbp: "absent (future runs); 'rh' present for 11 models"
      isimip3b:  # SSP126/370/585, CMIP6, 2015-2100 (+historical 1850-2014)
        csoil_annual: ["classic", "jules-es-vn6p3", "mc2-usfs"]
        csoil_monthly: ["elm-eca", "visit"]   # annualizable; visit IS in the layer, elm-eca EXCLUDED (~4x5 deg)
        csoil_gcms: "classic 2 (gfdl-esm4, ukesm1-0-ll); elm-eca / jules / mc2-usfs / visit 5 each"
        croot_annual: ["classic", "jules-es-vn6p3", "mc2-usfs"]   # + elm-eca monthly
        cvegbg_annual: ["classic", "jules-es-vn6p3", "mc2-usfs"]  # + elm-eca monthly
        nbp: ["classic", "jules-es-vn6p3", "mc2-usfs", "elm-eca", "visit"]
    resolution: |
      DECLARED grid: 0.5 deg x 0.5 deg, 360 lat x 720 lon, lat -89.75..89.75 -- identical
      for all 17 headers read, both rounds, every model. No regridding needed.
      EFFECTIVE resolution DIFFERS from declared, measured 2026-07-28 after a user
      noticed the maps looked blocky. Declared dims CANNOT reveal this -- a natively
      coarse model replicated onto the ISIMIP grid still reports 360x720.
        classic          NATIVE 1.0 deg x 1.0 deg, replicated 2x2 onto 0.5 deg with a
                         ONE-CELL LONGITUDE OFFSET. Proof: 100% of lon pairs at offset 1
                         identical, 100% of lat pairs at offset 0, and 100% of 2x2 blocks
                         at offset (lat=0, lon=1) constant. 99.35% of lon runs are exactly
                         2 columns; the 0.38% longer runs are constant-value desert/ice
                         plateaus, NOT a coarser grid. Nothing coarser than 1 deg exists.
        elm-eca          NOT 0.5 deg -- effectively ~4 deg lat x 5 deg lon (seams every
                         10 cols / 8 rows, fine variation inside each block). EXCLUDED
                         from the layer 2026-07-28. Its blocks are SMOOTH inside, so
                         exact-tie tests score it clean -- use seam spacing.
        jules-es-vn6p3   genuine 0.5 deg
        mc2-usfs         genuine 0.5 deg (coarse *biome* model, but 0.5 deg output; it
                         merely has the smallest land mask -- do not confuse the two)
        visit            genuine 0.5 deg
      No GCM contributes block structure (all 5 checked; ratios 0.94-1.08).
      Detection methods that WORK: (a) exact-tie fraction between adjacent cells, tested
      at BOTH offsets -- an aligned-only test misses an offset grid; (b) inside-vs-seam
      gradient ratio per candidate block width; (c) FFT of the column-gradient profile.
      A variance-loss-under-coarsening test does NOT discriminate blockiness from normal
      geophysical smoothness -- all 5 models looked alike under it.
    chosen: "csoil-total, ISIMIP3b, {ssp126,ssp370,ssp585}. 17 members/scenario = classic(2 GCMs) + jules-es-vn6p3(5) + mc2-usfs(5) + visit(5); visit is MONTHLY, annualized by the mean of each year's 12 months. elm-eca(5) is EXCLUDED (user decision 2026-07-28) -- declares 0.5 deg but is effectively ~4x5 deg; see resolution block. Path was 12 -> 22 (2026-07-27, all 5 models) -> 17 (2026-07-28, elm-eca dropped). Raw kg C m-2, NO normalization (same unit, medians within 1.8x), NO spatial smoothing (thick), higher_is_better (risk=loss, percentile INVERTED), baseline-anchored trend. Layer starts at 2020s baseline (3b begins 2015)."
    co2_treatment: "MIXED: jules-es-vn6p3 publishes ONLY the fixed-2015-CO2 (2015co2) csoil run; classic/elm-eca/mc2-usfs/visit are transient (default). CORRECTED 2026-07-27 -- the earlier claim that JULES's soil-C trend is 'muted' by fixed CO2 is WRONG and was measured to be backwards: JULES has the STRONGEST, most scenario-sensitive response of the five (+1.57/-2.92/-4.37% by 2090s for ssp126/370/585), because without fertilization nothing offsets warming-driven decomposition. JULES is the ensemble's main source of soil-carbon LOSS. Land use fixed for all: 2015soc-from-histsoc (classic/elm-eca/jules), 2015soc (visit), nat (mc2-usfs). See GUARDRAILS §9."
    data_nature: |
      All 5 models report kg C m-2 (units + long_name 'Carbon Mass in Soil Pool' identical
      across all 66 files -- no mislabelling), value-checked 2026-07-27:
      model             GCMs cadence  median  p99.9   max   zeros  land cells  calendar
      classic            2   annual     5.74   53.9   70.2  4.42%    ~66,678   365_day
      mc2-usfs           5   annual     7.60   26.1   37.2  0.00%     58,919   365_day
      elm-eca            5   MONTHLY    7.67  135.6  162.4  2.82%     62,482   365_day
      visit              5   MONTHLY    8.84  152.3  180.4  0.00%     58,714   365_day
      jules-es-vn6p3     5   annual    10.34   51.2   66.0  0.00%     67,647   proleptic_gregorian
      Medians agree within 1.8x, BUT global MEANS span 2.6x (6.70 classic .. 17.72 elm-eca,
      the latter 2.3x its own median) because elm-eca and visit carry much fatter peat tails.
      Those extremes are TROPICAL/subtropical (median lat of top 0.1%: 5.8N elm-eca, 31.9N
      visit) = deep tropical peat, NOT boreal permafrost. Since members are pooled with a
      MEAN, the pooled value is more tail-sensitive than the median agreement suggests.
      Land masks DIFFER by model (each model's GCMs share its mask exactly). With the
      shipped 17-member ensemble: 81% of land carries all 17 members, 9.2% is
      single-model, 2 cells single-member. (Was 5.9% single-model at 22 members --
      dropping elm-eca left fewer models covering the thin margins, which also raised
      zero-width-CI cells from 0.52% to 3.6%.)
      Time axis 'days since 1601' for ALL; calendar differs -> decode with cftime, NOT
      days/365 arithmetic, which misassigns December of each monthly member.
      Every member spans 2015-2100 with exactly 1 or 12 steps per year.
      Annualizing monthly members is immaterial: within-year CV 0.012% (elm-eca) / 0.108%
      (visit); |Dec - annual mean|/mean 0.014% / 0.103% -- ~3 orders below the model spread.
    processed: "2026-07-28 -> TCFD layer, 17 members (current: v2026-07-28_b203c3a-dirty; supersedes the 22-member 2026-07-27 run and the 12-member 2026-07-25 run, whose version prefixes were pruned from S3 on 2026-07-28 to reclaim 853 MB -- see _VERSION.json pruned_versions). Global-mean csoil 2020s baseline 9.3142 kg m-2; by 2090s +2.81% ssp126 / +1.18% ssp370 / +0.72% ssp585. QA 48/52 passed, 0 failed, 4 warnings -- all effective-resolution checks now PASS (no dominant seam spacing detected). Trade-off of dropping elm-eca: single-model cells rose 5.91% -> 9.23% of land and zero-width-CI cells 0.52% -> 3.6%, since fewer models cover the thin margins. EARLIER (superseded) 22-member run: scripts/process_csoil_soilcarbon.py -> S3 layer soilcarbon_csoil_annual. Verified 37/37 QA checks: CI ordering 0 violations, 2020s baseline bit-identical across scenarios, trend*span == change to 2.4e-07, percentile inverted (corr median<->pct = -0.956), scenario ordering monotonic. Global-mean csoil by 2090s: +2.50% ssp126 / +1.57% ssp370 / +1.24% ssp585. NOTE the SIGN FLIPPED vs the 12-member run (+1.1/-1.4/-2.2%): recomputing the old 3-model ensemble from the same files reproduces it to within 0.05pp, so the change is ensemble MEMBERSHIP, not processing. Per-model 2090s change is contested: visit +7.1%, elm-eca +2.6%, classic +0.8%, mc2-usfs ~0%, jules -4.4% (ssp585). See WORKFLOW-ISSUES.md 2026-07-27, GUARDRAILS §8-§9."

  # -------------------------
  # biodiversity searches (BioScen1.5)
  # -------------------------
  biodiversity:
    last_searched: "2026-07-22"

    isimip2b:
      project: "BioScen1.5"
      sectors: ["biodiversity"]
      impact_models:
        - "BioScen15-SDM-GAM"   # stacked species distribution model, GAM algorithm
        - "BioScen15-SDM-GBM"   # stacked species distribution model, GBM algorithm
        - "BioScen15-MEM-GAM"   # macroecological richness model, GAM algorithm
        - "BioScen15-MEM-GBM"   # macroecological richness model, GBM algorithm
      not_archived: "BioScen1.5-SDM-MaxEnt (impact model registered on isimip.org, no output on file server)"
      climate_forcings: ["GFDL-ESM2M", "HadGEM2-ES", "IPSL-CM5A-LR", "MIROC5"]  # 4 GCMs
      bias_adjustment: ["EWEMBI"]
      scenarios:
        climate: ["rcp26", "rcp60"]   # NO rcp85; historical + pre-industrial baselines also present
        soc: ["nosoc"]
        sens: ["co2"]
      temporal:
        resolution: "30-year running mean"
        future_period: "2009-2080 (10 time slices)"
        historical: "single 30yr-mean labeled 1990"
        preindustrial: "baseline slice present"
      spatial:
        resolution: "0.5 degree"
        grid: "720 x 360"
        coverage: "global"
      taxa:
        - "amphibians (2964 species)"
        - "birds (8493 species)"
        - "mammals (4039 species)"
      variables:
        sdm: ["{taxon}sumprob", "end{taxon}sumprob (endemic subset)", "thr{taxon}sumprob (IUCN-threatened subset)"]
        sdm_note: "SDM-GAM archives all/endemic/threatened; SDM-GBM archives all-species only"
        mem: ["{taxon}sr"]
        internal_dispersal_layers: ["presence (no dispersal)", "dispersal1-4 (d/2, d, 2d buffers)", "fulldisp (unlimited)"]
      units:
        sdm: "summed probability of occurrence per cell (species-richness proxy)"
        mem: "species richness (count) per cell"
      notes: >
        BioScen1.5. SDM = stacked single-species distribution models (15496 vertebrates) summed to a
        richness proxy; MEM = macroecological model of community richness. ISIMIP2b only (no ISIMIP3b
        biodiversity output). Refs: Biber et al. 2019 J. Biogeography; Warren et al. 2018.

  # -------------------------
  # cwood searches
  # -------------------------
  cwood:
    last_searched: "2026-07-28"   # re-enumerated in full; corrections below

    # PFT-RESOLVED cwood EXISTS ONLY IN ISIMIP3b, from exactly TWO models.
    # Verified 2026-07-28 by enumerating every biomes model in 3b/3a/2b and
    # grepping for a `cwood-*` token. See `pft_value_conventions` below before use.
    isimip3b:
      sectors: ["biomes"]
      impact_models: ["CLASSIC", "JULES-ES-VN6P3"]   # JULES was MISSING from this catalog
      bias_adjustment: ["w5e5"]
      scenarios:
        climate: ["picontrol", "ssp126", "ssp370", "ssp585"]  # JULES: no picontrol for cwood
        soc: ["2015soc", "2015soc-from-histsoc"]   # CLASSIC both; JULES 2015soc-from-histsoc only
      temporal: {resolution: "annual", period: "2015-2100"}
      spatial: {resolution: "0.5 degree (declared)", coverage: "global"}
      per_model:
        CLASSIC:
          climate_forcings: ["GFDL-ESM4", "UKESM1-0-LL"]   # only 2 -- NOT the 5 listed under biomes_models
          cwood_pfts: [dcdcldbdltr, dcddrybdltr, dcdndltr, evgbdltr, evgndltr,
                       c3crop, c4crop, c3grass, c4grass, total]
          sens: "default (transient CO2) at every SSP; ssp585 adds 2015co2/nondep/nondep2015co2/ssp585ndep"
          zeros: "42.6% of land cells are 0 for cwood-evgndltr (PFT absent)"
        JULES-ES-VN6P3:
          climate_forcings: ["GFDL-ESM4", "IPSL-CM6A-LR", "MPI-ESM1-2-HR", "MRI-ESM2-0", "UKESM1-0-LL"]
          cwood_pfts: [bdldcd, bdlevgtemp, bdlevgtrop, ndldcd, ndlevg, shrubdcd, shrubevg,
                       c3crop, c4crop, c3grass, c4grass, c3pasture, c4pasture, total]
          sens: "default AND 2015co2 for every SSP (unlike csoil-total, which is 2015co2-only)"
          zeros: "4.5% -- JULES reports a per-tile density almost everywhere"
      conifer_pfts: |
        Needleleaf-evergreen cwood = CLASSIC `evgndltr` (2 GCMs) + JULES `ndlevg` (5 GCMs)
        = 7 transient-CO2 members per SSP. BOTH are all-climate classes: measured share of
        global PFT wood in the boreal 55-70N band is 34.6% (CLASSIC) and 29.3% (JULES).
        NO climate-zone-resolved conifer PFT carries cwood in ANY round.
        The only 3b cwood token containing "temp" is JULES `cwood-bdlevgtemp`, which is
        temperate BROADLEAF evergreen (a hardwood class), not a conifer.
        JULES splits broadleaf evergreen into bdlevgtemp/bdlevgtrop but publishes a SINGLE
        ndlevg -- proof the needleleaf-evergreen class is not internally climate-split.
      magnitudes: "kg m-2, 'Carbon Mass in Wood'. global p50(>0): CLASSIC 2.61, JULES 6.01.
                   UK/IRL 11.03 / 10.23; PNW-BC-SEAK 5.99 / 9.81. cwood/cveg ratio p50 0.77 / 0.90."
      notes: "Only source of PFT-resolved wood carbon in ISIMIP. Companion `pft-{code}` cover
              fractions published by both models under the same SSPs."

    isimip2b:
      verdict: "NO PFT-resolved cwood anywhere in 2b -- not in `biomes` (11 models grepped),
                not in `permafrost` (CLM45/LPJmL/ORCHIDEE/ORCHIDEE-DGVM). 2b PFT output is
                cveg / npp / gpp / pft only. Substituting cveg costs the root+leaf fraction:
                wood is p50 77% (CLASSIC) to 90% (JULES) of conifer cveg."
      forestry_sector:   # CORRECTED 2026-07-28: catalog previously said 1 model / 4 species / no oak
        sectors: ["forestry"]
        impact_models: ["3D-CMCC-CNR-BGC", "3D-CMCC-FEM", "3PGN-BW", "4C", "BASFOR",
                        "CARAIB", "ForClim", "GOTILWAplus", "LPJ-GUESS", "PREBAS"]  # 10, not 1
        climate_forcings: ["GFDL-ESM2M", "IPSL-CM5A-LR", "MIROC5", "HadGEM2-ES"]  # 3-4 per model
        scenarios: {climate: ["picontrol", "rcp26", "rcp60"], note: "rcp85 only in 3PGN-BW"}
        temporal: {resolution: "annual", period: "2006-2099"}
        spatial: {resolution: "stand-level", coverage: "8-9 European sites: bily-kriz,
                  collelongo, hyytiala, kroof, le-bray, peitz, solling-beech, solling-spruce, soro"}
        species_available:   # 9 codes -- Quercus and Douglas-fir DO exist
          - acpl  # Acer platanoides (CARAIB)
          - bepe  # Betula pendula (4C)
          - fasy  # Fagus sylvatica (beech)
          - lade  # Larix decidua (CARAIB)
          - piab  # Picea abies (Norway spruce) -- nearest congener to Sitka
          - pipi  # Pinus pinaster (maritime pine)
          - pisy  # Pinus sylvestris (Scots pine)
          - psme  # Pseudotsuga menziesii (Douglas-fir) -- 4C only
          - quro  # Quercus robur (OAK) -- 4C, FORMIND. Catalog previously said "NO oak"
        wood_variables: "cwood, cvegag, vol (stem volume), mai (MEAN ANNUAL INCREMENT --
                         the actual forestry productivity metric), harv, nppagwood, dbh, hei"
        cwood_by_model: "4C (piab at 5 sites, + psme/pisy/quro/bepe/fasy), 3D-CMCC-CNR-BGC
                         (piab 2 sites), 3D-CMCC-FEM (piab 1 site), GOTILWAplus (no piab)"
      notes: "Site-level only, so not a griddable layer source -- but it is the ONLY place
              ISIMIP resolves individual species, and the only place `mai` exists."

    isimip2a:
      forestry_sector:
        impact_models: ["3D-CMCC-CNR-BGC", "3D-CMCC-FEM", "3PG", "3PGN-BW", "4C", "BASFOR",
                        "CARAIB", "FORMIND", "ForClim", "GOTILWAplus", "LPJ-GUESS",
                        "Landscape-DNDC", "PREBAS", "SALEM", "SIBYLA"]   # 15
        forcings: ["gswp3", "localclim", "princeton", "watch", "watch-wfdei"]
        notes: "Historical only (no futures). Same 8-9 European sites and same 9-species set."

    sitka_spruce: |
      NO Picea sitchensis anywhere in ISIMIP. Verified 2026-07-28 across all 10 ISIMIP2b and
      all 15 ISIMIP2a forestry models: the species vocabulary is exactly
      {acpl, bepe, fasy, lade, piab, pipi, pisy, psme, quro}. Nearest congener is `piab`
      (Picea abies) at European stand sites. For a gridded Sitka-relevant layer the choice is
      between an all-climate conifer PFT (3b, has cwood) and a temperate-needleleaf-evergreen
      PFT (2b, cveg/npp only) -- see `temperate_needleleaf_evergreen_2b` below.

  # -------------------------
  # npp searches
  # -------------------------
  npp:
    last_searched: "2026-01-15"

    isimip3b:
      total_datasets: ~70  # for ssp370 alone
      sectors: ["biomes", "fire"]
      impact_models: ["CLASSIC"]
      climate_forcings: ["GFDL-ESM4"]
