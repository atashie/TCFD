  # -------------------------
  # tropical cyclone searches
  # -------------------------
  tropical_cyclone:
    last_searched: "2026-08-11"
    description: "Intense winds due to tropical cyclones. FOUR distinct representations; only one is a global gridded annual projection."
    enumerated: |
      2026-08-11, walked serially: OutputData/ + DerivedOutputData/ + InputData/ +
      SecondaryInputData/ for ISIMIP2a/2b/3a/3b.
      METHOD BUG THAT HID THE BEST DATASET, recorded so it is not repeated: the first
      pass listed InputData/ and then jumped straight to climate/atmosphere/ WITHOUT
      listing climate/ itself, which is where tropical_cyclones/ lives. List EVERY
      intermediate level; do not path-guess past one.
    no_dedicated_sector: |
      There is NO tropical-cyclone sector in OutputData in any round. TC lives in
      DerivedOutputData (2b exposure) and InputData/climate (3a/3b storm footprints).
    representations:
      let_exposure_2b:
        path: "ISIMIP2b/DerivedOutputData/Lange2020/KE-TG-meanfield/{gcm}/future/"
        variable: "let (land area fraction exposed) + pet (population exposed twin)"
        ensemble: "1 impact model (ke-tg-meanfield) x 4 CMIP5 GCMs = 4 members/scenario"
        scenarios: "rcp26, rcp60 (+picontrol, historical 1861-2005, pre-industrial 1661-1860). NO rcp85."
        timestep: "annual, 0.5deg gridded, 2006-2099"
        volume: "7.2 MB/file; 58 MB for the 8 projection `let` files"
        soc_sens: "uniformly nosoc / co2 -- no harmonization compromise needed"
        status: "THE ONLY ready-to-use gridded annual TC product. Chosen 2026-08-11."
      mit_storm_footprints_3b:
        path: "ISIMIP3b/InputData/climate/tropical_cyclones/MIT/global/storm/{scenario}/{wind_model}/{GCM}/"
        variables: "windlifetimemax (lifetime max 1-min sustained wind, m s-1), maxrain"
        reference: "Frieler et al. 2025, doi:10.5194/egusphere-2025-2103 (PIK)"
        wind_models: "ER11-wind (Emanuel & Rotunno 2011) and H08-wind (Holland 2008). The sibling ER11/ and H08/ dirs (no -wind) exist but are EMPTY placeholders at every scenario x GCM probed."
        structure: "NOT a gridded annual time series -- per-STORM footprints, dims (storm<=1500, lat=2160, lon=4320) at 5 arcmin, indexed by IBTrACS serial ID, time(storm)."
        coverage_ragged: |
          historical: 1850-2014 all 5 GCMs EXCEPT mri-esm2-0 which starts 1950.
          ssp126: GFDL-ESM4 ABSENT; other 4 GCMs 2061-2100 ONLY (no 2020s baseline).
          ssp370: GFDL-ESM4 ABSENT; other 4 GCMs 2015-2100.
          ssp585: GFDL-ESM4 2061-2100; other 4 GCMs 2015-2100.
          Both wind models have identical coverage.
        volume: "305 MB/yr-file windlifetimemax, 189 MB maxrain; ~26.2 GB per GCM-scenario-windmodel; ~542 GB for windlifetimemax across all three SSPs and both wind models"
        status: "NOT PROCESSED. Blocked on: (a) the annual statistic must be DEFINED not aggregated (per-cell annual max? storm count over a Saffir-Simpson threshold? integrated wind energy?), (b) regridding 5arcmin -> 0.5deg is a second explicit choice, (c) ssp126 has no 2020s so the shared-baseline contract is not constructible as published."
      obsclim_3a:
        path: "ISIMIP3a/InputData/climate/tropical_cyclones/obsclim/"
        contents: "global/storm/historical/{ER11,H08}-wind windlifetimemax+maxrain 1950-2021 (~45 MB/file); global/hourly per-storm-ID files (~15,900 nc); tracks/3hr/historical single IBTrACS tracks file 1950-2021"
        status: "historical only -- cannot produce a decadal projection panel"
      tc_coastal_flooding_3a:
        path: "ISIMIP3a/SecondaryInputData/climate/tropical_cyclones_flooding/1mslr/global/storm/historical/GeoClaw/"
        variable: "fldarea, 30 arcsec, tides-max, +1 m SLR, 1950-2025 (76 annual files, 103 MB each)"
        status: "historical only; NO ISIMIP3b equivalent -- this product is observational-only"
        verified_absent_on: "UNVERIFIED -- negative inherited from the 2026-08-11 TC inventory; the 3a path was listed but no ISIMIP3b search was run for a flooding equivalent. Re-enumerate before relying on it (GUARDRAILS 11)."
    future_delivery:
      sfcwind:
        noted: "2026-08-11 -- user decision: note for a FUTURE delivery, not this one."
        path: "ISIMIP3b/InputData/climate/atmosphere/bias-adjusted/global/daily/{scenario}/{GCM}/"
        variable: "sfcwind, daily MEAN near-surface wind, m s-1"
        ensemble: "5 CMIP6 GCMs (GFDL-ESM4, IPSL-CM6A-LR, MPI-ESM1-2-HR, MRI-ESM2-0, UKESM1-0-LL) x ssp126/ssp370/ssp585, 2015-2100"
        volume: "9 nc chunks per GCM-scenario, 1.71 GB (2015-2020) + 2.84 GB per 10-yr chunk = ~24 GB per GCM-scenario, ~366 GB for all 15"
        caveats: |
          NO sfcwindmax is published in ISIMIP3b -- only the daily MEAN. Daily-mean wind
          at 0.5deg does not resolve a cyclone eyewall, and this field is ALL winds, not
          TC-attributed. An 'intense wind' layer from it is a CONSTRUCTED INDEX (annual
          max of daily means, days over a threshold, block maxima) and that choice is a
          modelling decision to make with the user, not an aggregation (GUARDRAILS 1-2).
    negative_findings: |
      * The Lange 2020 TC EXPOSURE family was NOT re-issued for ISIMIP3b. The exposure
        concept was carried over but split across Heinicke2026 (driedarea, floodedarea)
        and Zantout2025 (heatwave, wildfire, cropfailure). ke-tg-meanfield appears in NO
        3a or 3b publication directory. There is no SSP TC-exposure product.
      * ISIMIP3b/DerivedOutputData/TipESM2025/MIT/ is a NAME COLLISION -- it holds WATER
        models (CLASSIC, CWATM, H08, JULES-W2, MIROC-INTEG-LAND, WATERGAP2-2E,
        WEB-DHM-SG), not tropical cyclones.
      * No tropical_cyclones_flooding branch exists in ISIMIP3b (3a only).
    chosen_2026_08_11: |
      `let` (representation 1) -- user decision. Rebuilt onto the OUTPUT-SPEC contract;
      the 2026-07-24 layer was family-B (emitted the retired single `trend`, mean +/- 1 SD
      CI, no ols_slope/sen_slope/n_members/n_models, no members.nc).
      MEASURED data nature 2026-08-11 (GUARDRAILS 9): continuous [0, 0.952], NEVER exactly
      1, is_boolean_field=False, 97.84% of finite cell-years EXACTLY ZERO, land mask
      identical across all 8 files (68,249 cells).

  # -------------------------
  # heatwave / extreme heat searches
  # -------------------------
  heatwave:
    last_searched: "2026-08-13"
    description: >
      Extreme heat. FOUR distinct representations. Two are ready-to-process global gridded
      annual projections (2b `leh`, 3b `heatwave`); one is a gridded annual COUNT of
      heat-attributable excess deaths (2b health sector); one is raw daily climate forcing
      from which an index would have to be CONSTRUCTED, which is a modelling decision, not
      an aggregation (GUARDRAILS 1-2).
    enumerated: |
      2026-08-13, serial listings, every intermediate directory level listed, no target-token
      pre-filter (variable field projected from the END, $(NF-4)). 0 empty listings, 0 retries.
        ISIMIP2b/DerivedOutputData/                    -> Lange2020, Zimmer2023
        ISIMIP2b/DerivedOutputData/Lange2020/          -> 15 model dirs incl. HWMId-humidex
        .../HWMId-humidex/                             -> 4 gcm dirs
        .../HWMId-humidex/{gcm}/                       -> future, historical, pre-industrial
        .../HWMId-humidex/{4 gcm}/future/              -> 6 files each (24 total)
        ISIMIP3b/DerivedOutputData/Zantout2025/        -> 12 model dirs incl. HWMID-NONE
        .../HWMID-NONE/                                -> 5 gcm dirs
        .../HWMID-NONE/{5 gcm}/future/                 -> 4 files each (20 total)
        ISIMIP2b/OutputData/                           -> 12 sectors incl. health
        ISIMIP2b/OutputData/health/                    -> TRM-Tsukuba (only model)
        .../TRM-Tsukuba/{4 gcm}/future/                -> 3 files each (12 total)
        ISIMIP3b/OutputData/                           -> 8 sectors
        ISIMIP3a/DerivedOutputData/                    -> Quesada-Chacon2026, Zantout2025
        ISIMIP3a/.../Zantout2025/HWMID-NONE/{4 forcings}/ -> historical/ ONLY, all four
        ISIMIP3b/InputData/ -> climate/ -> atmosphere/ -> bias-adjusted/ -> global/ -> daily/
          -> {historical,picontrol,ssp126,ssp370,ssp585}/ -> 5 GCM dirs -> 99 files per
          GCM-scenario = 11 variables x 9 decade chunks
      NOTE the model-token spelling differs by round and is case-inconsistent on the server:
      2b is `HWMId-humidex`, 3b is `HWMID-NONE`. Copy them, do not retype them.
    representations:
      leh_exposure_2b:
        path: "ISIMIP2b/DerivedOutputData/Lange2020/HWMId-humidex/{gcm}/future/"
        variables: "leh (land area fraction exposed) + peh (population exposed twin) -- BOTH published, 1:1"
        ensemble: "1 impact model (hwmid-humidex) x 4 CMIP5 GCMs (gfdl-esm2m, hadgem2-es, ipsl-cm5a-lr, miroc5) = 4 members/scenario"
        scenarios: "rcp26, rcp60 (+picontrol 2006-2099, historical 1861-2005, pre-industrial dir present). NO rcp85, NO SSP."
        matrix: "COMPLETE 1 x 4 x 2 = 8 projection files per variable; no missing combination"
        timestep: "annual, declared 0.5deg global, 2006-2099"
        soc_sens: "uniformly nosoc / co2 -- no harmonization compromise"
        bias_adjustment: "ewembi"
        volume: "~4.4-4.5 MB/file -> 35 MB for the 8 `leh` projection files, 71 MB with `peh`"
        sidecars: ".json present WITH sha512, but NO netcdf_header block (2b Lange2020 sidecars carry specifiers only)"
        data_nature: >-
          MEASURED 2026-08-14 across all 8 members (scripts/check_leh_nature.py): BINARY
          {0,1}, exactly 2 unique values per member, range [0,1]. NOT inherited -- the
          sibling `let` in this same publication is a continuous fraction. Declared
          units/long_name still unread (the 2b sidecars carry no netcdf_header) but the
          nature is settled from the values. -> pooled_mean_boolean.
          time axis `years since 1661-1-1` on a 360_day calendar, integer step 1 -- a THIRD
          convention, different from Heinicke2026 (`days since 1601-01-01`) and Zantout2025
          (`days since 2015-01-01`, mid-year stamps). Per-publication, always.
        mask_measured: >-
          NO MASK AT ALL -- finite on all 259,200 cells, i.e. the product ZERO-FILLS the
          whole grid including ocean, exactly like its 3b cousin `cropfailure`. `isfinite`
          is NOT a footprint here and any share must be quoted against land (67,420 ISIMIP2b
          land cells). Time-invariant in all 8 members.
        sparsity_measured: >-
          THE DECISIVE MEASUREMENT FOR THIS LAYER, and it confirms the paper. The absolute
          Humidex >= 45 gate is SILENT over most of the extratropics under rcp26/rcp60:
          40,265 of 67,420 LAND cells (59.7%) are never non-zero in ANY member or year over
          2006-2099, and 84.6% of those sit poleward of 35 degrees. By belt, silent share of
          land: 60-90N 99%, 35-60N 81%, 23.5-35N 30%, tropics 18%, 23.5-35S 19%, 35-60S 68%.
          Annual exact-zero share per member is 97.9%-99.3% (against 45% for the 3b layer).
          Reference sites, mean over 2006-2099 -> mean over 2090s: Jacobabad 0.553->0.713,
          Kuwait 0.548->0.575, Lagos 0.363->0.500, Delhi 0.134->0.225, Singapore
          0.134->0.250, Phoenix 0.112->0.213, Cordoba 0.036->0.038, Sydney 0.019->0.025,
          Chicago 0.0027->0.0125, Sao Paulo 0.0027->0.0125, and PARIS, FRANKFURT AND YAKUTSK
          ARE EXACTLY ZERO IN EVERY MEMBER AND EVERY YEAR.
          This is the absolute threshold behaving as designed, NOT a data defect -- contrast
          sugarcane, where the model simply did not run. But a layer built on it reports no
          heat hazard at all across most of a Northern-Hemisphere portfolio, and a zero here
          means "never crosses Humidex 45", never "low heat risk". Any delivery using it
          must say which. UNRESOLVED: whether it can be a primary heat layer on that basis.
        ingested: >-
          2026-08-14, 8/8 files sha512-matched against the publisher sidecars, 36.3 MiB ->
          data/raw/heatwave-isimip2b_leh_annual/. scripts/download_leh_isimip2b.py.
        processed: >-
          2026-08-14 -> data/processed/heatwave-isimip2b_leh_annual/,
          scripts/process_leh_isimip2b.py. test_shared_baseline.py: ALL CHECKS PASSED
          (baseline at decade index 1, 2020s bit-identical across scenarios, 0 CI
          violations, 0 ocean leak, n_members 4-4, n_models 1-1). Registered as
          `heatwave-2b`, status BLOCKED pending the user's determination against
          `heatwave-3b`.
          MEASURED AT BUILD: global-mean frequency rcp26 0.0259 (2010s) -> 0.0444 (2090s),
          PLATEAUING after the 2040s; rcp60 0.0234 -> 0.0916, with the silent share of land
          falling 78.0% -> 65.7%. Even at rcp60 2090s, 65.7% of land is exactly zero.
          71.5% of land sits in percentile tier 1 on the baseline.
          ENSEMBLE AGREEMENT IS THE SECOND CAVEAT, separate from sparsity: only 8.4% of land
          is active in all 4 GCMs, and of the 28.5% active in ANY member, 22% rests on a
          SINGLE GCM. Per-member land mean spans 0.0204 (gfdl-esm2m) to 0.0440
          (ipsl-cm5a-lr), 2.16x, CV 28.5%. Contrast heatwave-3b: 74.8% active in all 5,
          1.58x, CV 17.5%. A hard absolute threshold amplifies small GCM differences.
          CONTACT SHEET VIEWED: the active footprint is a coherent humid-heat belt (Central
          America, Amazon, Sahel/West Africa, Horn of Africa, Arabian Gulf, Indus/Ganges,
          maritime SE Asia, northern Australia), broad and contiguous rather than speckle --
          which is why NO smoothing was applied despite the 4-member ensemble matching
          `let`'s depth. The sparsity is a THRESHOLD boundary; smoothing would bleed
          non-zero frequency across it into cells the index says never cross Humidex 45.
          TIME AXIS: `years since 1661-1-1` on a 360_day calendar, which xarray CANNOT
          decode (decode_times=True raises). The processor parses the epoch from the units
          string and asserts the span against the filename. Third convention in three
          publications of the same concept.
      heatwave_exposure_3b:
        path: "ISIMIP3b/DerivedOutputData/Zantout2025/HWMID-NONE/{gcm}/future/"
        variables: "heatwave ONLY"
        ensemble: "1 impact model (hwmid-none) x 5 CMIP6 GCMs (gfdl-esm4, ipsl-cm6a-lr, mpi-esm1-2-hr, mri-esm2-0, ukesm1-0-ll) = 5 members/scenario"
        scenarios: "ssp126, ssp370, ssp585 (+picontrol 2015-2100, historical 1850-2014)"
        matrix: "COMPLETE 1 x 5 x 3 = 15 projection files, no missing combination"
        timestep: "annual, 2015-2100 (86 steps); future starts 2015 so there is no complete 2010s decade, but the 2020s baseline IS constructible"
        soc_sens: "uniformly 2015soc / default -- no harmonization compromise"
        bias_adjustment: "w5e5"
        volume: "3.8-4.5 MB/file -> ~63 MB for all 15"
        sidecars: >-
          .json present WITH sha512 AND a netcdf_header block -- at `{stem}.json`, NOT
          `{stem}.nc.json`. The `.nc.json` form 404s for the same file (verified
          2026-08-13), which looks exactly like "this publication has no sidecars" and is
          how the cropfailure ingest concluded Zantout2025 publishes none. It does.
        declared_header: "dims (time=86, lat=360, lon=720); variable `heatwave`, long_name 'heatwave area share', units '1', _FillValue 1.0000000200408773e+20"
        data_nature: >-
          MEASURED 2026-08-13 across all 15 members (scripts/check_heatwave_nature.py):
          BINARY {0,1} -- exactly 2 unique values per member, range [0,1], is_boolean=True
          in 15/15. The declared long_name "heatwave area share" is a MISNOMER: the field
          is an occurrence flag, so its decadal mean is a FREQUENCY, not an area. Same
          trap as `floodedarea` (units='1', binary). -> pooled_mean_boolean branch.
        zero_inflation_measured: >-
          Annual exact-ZERO share 19.6%-69.1% (ensemble median 45.3%) -- nowhere near
          `let`'s 97.84%, so pooled_mean_zero_inflated is NOT in scope. The degeneracy on
          this layer is at the OTHER end; see saturation_measured.
        saturation_measured: >-
          THE DEFINING PROPERTY OF THIS LAYER, and one no other shipped layer has. Because
          exposure is "HWMId above the 97.5th percentile of THIS cell's picontrol", warming
          pushes cells permanently over the threshold and the flag pins at 1. Pooled
          (year x member) decadal exposure frequency, measured on the ingested files:
            2020s ~0.31 in all three SSPs (shared baseline consistent: 0.316/0.310/0.316)
            ssp126  -> 0.473 (2050s) -> 0.462 (2090s), plateaus;  1.2% of cells at 1.0
            ssp370  -> 0.607 (2050s) -> 0.846 (2090s);           32.6% of cells at 1.0
            ssp585  -> 0.650 (2050s) -> 0.903 (2090s);           45.9% of cells at 1.0
          Two consequences that must be decided before processing, NOT after:
            * TREND IS CENSORED AT THE CEILING. A cell exposed every year of the decade in
              every member has slope ~0 late century. That reads as "no trend" and means
              "permanently and maximally exposed" -- the opposite. Both slopes fail here,
              so the two-slope disagreement rule does not rescue it.
            * PERCENTILE LOSES DISCRIMINATION. With 45.9% of ssp585 2090s cells tied at
              exactly 1.0, a percentile-of-score ranking produces one enormous tie block at
              the top. The tie treatment is an open decision.
        mask_measured: >-
          67,420 finite cells, IDENTICAL across all 15 members and time-invariant (so the
          coverage-tier mask is degenerate: every cell is in 5 of 5 members). 26.0% of the
          grid -- a land footprint, NOT the `floodedarea` ocean leak (94.7% of grid).
          1,623 cells fall off the ISIMIP3b land-sea mask (945 coastal fringe, 678
          isolated, half of those tropical islands the 0.5deg mask does not resolve); the
          shipped `driedarea` carries 1,236 off the same mask and `led` 46, so this is a
          mask-CONVENTION difference, not a defect. The 27,092 land cells the product never
          covers are 100% Antarctica.
        reference_sites_measured: >-
          GUARDRAILS 12, 13 sites, all non-trivial in all 15 members, all rising to the
          2090s. Kuwait 0.957->0.982, Singapore 0.889->0.952, Cordoba 0.688->0.818,
          Chicago 0.688->0.836, Paris 0.406->0.636, Frankfurt 0.345->0.576,
          Sydney 0.226->0.461, Yakutsk 0.271->0.509. Chicago reading ABOVE Delhi (0.548)
          is the relative baseline working as designed, not a defect.
      an_tot_heat_health_2b:
        path: "ISIMIP2b/OutputData/health/TRM-Tsukuba/{gcm}/future/"
        variable: "an-tot-heat-all -- specifiers split it as variable=`an-tot-heat`, ages=`all`"
        declared_units: "'number of heat-related excess mortality' (from the sidecar netcdf_header) -- an absolute COUNT per grid cell, not an intensity"
        ensemble: "1 impact model (trm-tsukuba, Univ. of Tsukuba) x 4 CMIP5 GCMs = 4 members/scenario"
        scenarios: "rcp26, rcp60 (+picontrol). NO rcp85, NO SSP."
        matrix: "COMPLETE 1 x 4 x 2 = 8 projection files"
        timestep: "annual, 0.5deg global (720x360), 2006-2099 (94 steps), time in 'years since 1661-1-1'"
        soc_sens: "2005soc, NO sens token in the filename (one field shorter than the Lange2020 grammar -- parse from the END)"
        volume: "14.1 MB/file -> ~113 MB for the 8 projection files"
        caveat: >-
          A mortality count is a hazard x exposed-population product held at a FIXED 2005
          population, so its spatial pattern is substantially population density, and a
          percentile-of-score ranking would rank where people live as much as where heat
          rises. Only `all` ages is published in future/. Not a drop-in asset-facing layer.
      constructed_index_from_forcing_3b:
        path: "ISIMIP3b/InputData/climate/atmosphere/bias-adjusted/global/daily/{scenario}/{GCM}/"
        variables_available: "hurs, huss, pr, prsn, ps, rlds, rsds, sfcwind, tas, tasmax, tasmin (11, each in 9 decade chunks)"
        ensemble: "5 CMIP6 GCMs x ssp126/ssp370/ssp585, daily, 2015-2100"
        volume_measured: "tasmax ~1.97 GB per 10-yr chunk -> ~17 GB per GCM-scenario, ~254 GB for all 15; hurs ~2.39 GB per chunk -> ~308 GB more if a humidity-aware index is wanted"
        caveat: >-
          This is climate forcing, not impact-model output. Any heat metric from it (days
          over a threshold, annual max of daily max, WBGT/humidex, heatwave duration) is a
          CONSTRUCTED INDEX -- a modelling decision to make with the user, per GUARDRAILS
          1-2, not an aggregation. Same standing as the sfcwind route recorded under
          tropical_cyclone.future_delivery.
    method_difference_VERIFIED: >-
      RESOLVED 2026-08-13 from the two publications' own methods. The index CHANGED between
      rounds; this is not a version bump and the two products are not the same measurement.
        ISIMIP2b  Lange2020 / `HWMId-humidex` -> HWMId (relative) AND Humidex (absolute)
        ISIMIP3b  Zantout2025 / `HWMID-NONE`  -> HWMId ONLY; "NONE" is the humidity term
      Lange et al. 2020 (Earth's Future, doi:10.1029/2020EF001616) combines a RELATIVE
      indicator -- the Heat Wave Magnitude Index daily (HWMId), which depends only on daily
      maximum temperature -- with an ABSOLUTE indicator, the Humidex (daily max and mean
      temperature plus relative humidity), so the events counted "would also adversely
      affect human health". Zantout et al. 2025 (Nat. Commun.,
      doi:10.1038/s41467-025-65600-7, Methods) drops the absolute criterion: a cell is
      exposed "if the HWMId of that year exceeds the 97.5th percentile of the picontrol
      distribution of that grid cell", and "the exposed grid cell area fraction is one if
      the percentile threshold is exceeded and zero else".
      CONSEQUENCE FOR CUSTOMER TEXT: the 3b layer measures UNPRECEDENTED heat relative to a
      per-cell preindustrial control, NOT dangerous-to-humans heat. Copy for this hazard
      must not promise a workforce-safety or wet-bulb reading. It is also expected to flag
      MORE area than 2b `leh`, especially in arid and high-latitude cells where the Humidex
      gate would never have opened -- so a 3b-vs-2b difference is a definitional
      difference, never a trend.
    absolute_vs_relative:
      question: >-
        "Which heatwave sources quantify events by ABSOLUTE impact (heat index, human
        health) rather than by departure from a per-cell distribution?" Enumerated
        2026-08-14. Three candidates carry an absolute criterion; NONE of them is purely
        absolute, and the way each is not absolute differs. Read this before promising a
        customer a heat-stress or wet-bulb reading.
      leh_2b_is_an_INTERSECTION_not_an_absolute_index: >-
        `leh` requires BOTH criteria to be exceeded, not either. Lange et al. 2020, as
        restated by the nismod/isimip-exposure implementation: "Land area is exposed to
        extreme heat if BOTH a relative indicator based on temperature (Russo et al. 2015,
        2017) AND an absolute indicator based on temperature and relative humidity
        (Masterton & Richardson, 1979) exceed their respective threshold values."
        So the absolute Humidex gate makes the counted events health-relevant, but the
        relative HWMId gate still has to open first -- `leh` does NOT escape the
        per-cell-distribution framing, it ADDS a health filter on top of it.
        HUMIDEX THRESHOLD = 45, which sits in Environment Canada's 40-45 "great
        discomfort; avoid exertion" band. Lange et al. further report that below 2 degC
        global warming the Humidex "hardly ever exceeds their threshold value of 45 in the
        temperate regions" -- and ISIMIP2b publishes `leh` for rcp26/rcp60 ONLY, i.e.
        exactly the forcing range where that gate mostly stays shut. EXPECT A SPARSE OR
        NEAR-ZERO TEMPERATE FIELD. This is a claim from the paper, NOT a measurement:
        the files are 35 MB and the temperate signal can and should be measured directly
        before anything is built on it.
      health_2b_is_an_absolute_OUTCOME_on_an_UNVERIFIED_temperature_reference: >-
        `an-tot-heat-all` (TRM-Tsukuba) outputs "number of heat-related excess mortality"
        -- an absolute health outcome, the only one in the repository. But the exposure
        response is built on an "optimum temperature" (OT), the temperature at which
        mortality is lowest, and WHETHER OT IS AN ABSOLUTE VALUE OR A LOCATION-SPECIFIC
        PERCENTILE OF THE LOCAL TEMPERATURE DISTRIBUTION IS UNVERIFIED as of 2026-08-14.
        The ISIMIP model page (isimip.org/impactmodels/details/57/) says only "heat-related
        excess deaths based on the daily level temperature-mortality relation" and points
        at Honda et al., Environ. Health Prev. Med. 2013, doi:10.1007/s12199-013-0354-6,
        which is paywalled and could not be read here; the ISIMIP2a health protocol PDF is
        published but this machine has no PDF text extractor (no poppler, no pypdf).
        If OT is a local percentile then this layer is ALSO relative in its temperature
        reference even though its output unit is deaths. Resolve before quoting it.
        Separately it holds population fixed at 2005soc, so its spatial pattern carries
        population density, and it is a COUNT per grid cell, not an intensity.
      constructed_index_is_the_only_fully_absolute_route: >-
        Humidex, heat index, WBGT or days-over-a-fixed-threshold computed from the
        bias-adjusted forcing is absolute by construction and answerable at any threshold
        the customer's standard names. It is a modelling decision, not an aggregation
        (GUARDRAILS 1-2), and the volumes are large -- see forcing_routes_enumerated.
      forcing_routes_enumerated: |
        ENUMERATED 2026-08-14, every intermediate level listed.
        (a) ISIMIP3b group I daily -- InputData/climate/atmosphere/bias-adjusted/global/
            daily/{historical,picontrol,ssp126,ssp370,ssp585}/{5 GCMs}/
            11 vars (hurs huss pr prsn ps rlds rsds sfcwind tas tasmax tasmin), 9 chunks.
            tasmax 1.98 GB/decade, hurs 2.41 GB/decade, tas ~1.97 GB/decade.
        (b) ISIMIP3b EXTENDED daily -- SecondaryInputData/climate/atmosphere/bias-adjusted/
            global/daily/ -- TEN scenarios: hist-nat, historical, picontrol, ssp119,
            ssp126, ssp245, ssp370, ssp460, ssp534-over, ssp585. Same 11 variables.
            GCM depth varies BY SCENARIO -- ssp245 has 14 GCMs (CESM2-WACCM, CNRM-CM6-1,
            CNRM-ESM2-1, CanESM5, EC-Earth3, GFDL-ESM4, IITM-ESM, IPSL-CM6A-LR, KACE-1-0-G,
            MIROC6, MPI-ESM1-2-HR, MRI-ESM2-0, TaiESM1, UKESM1-0-LL) while ssp119 has 4
            (GFDL-ESM4, IPSL-CM6A-LR, MRI-ESM2-0, UKESM1-0-LL). Count per scenario, never
            pooled. This is by far the deepest GCM pool available for any heat product.
        (c) ISIMIP3b HOURLY -- same SecondaryInputData path, hourly/{historical,ssp126,
            ssp370,ssp585}/{5 GCMs}/ -- 7 vars (hurs pr ps rlds rsds sfcwind tas), 17
            five-year chunks. NO tasmax (not meaningful hourly). tas 4.31 GB/chunk, hurs
            4.95 GB/chunk -> ~157 GB per GCM-scenario for tas+hurs, ~2.4 TB for all 15.
            The only route that supports a sub-daily heat-stress metric.
        (d) ISIMIP2b daily -- NOT under InputData/climate/ (that path is a REAL 404). It is
            InputData/GCM_atmosphere/biascorrected/global/{historical,piControl,rcp26,
            rcp60,rcp85}/{GFDL-ESM2M,HadGEM2-ES,IPSL-CM5A-LR,MIROC5}/ -- 12 vars (adds psl;
            sfcWind is CAMEL-CASED here), EWEMBI, 10 decade chunks 2006-2099.
            tasmax 1.98 GB, hurs 2.22 GB, tas 1.97 GB per decade.
            NOTE rcp85 EXISTS for the forcing even though `leh` publishes rcp26/rcp60 only.
            FILENAME GRAMMAR IS DIFFERENT AGAIN: variable is the FIRST field
            (tasmax_day_HadGEM2-ES_rcp60_r1i1p1_EWEMBI_20210101-20301231.nc4), not NF-4.
    negative_findings: |
      * NO health sector in ISIMIP3b. verified_absent_on: "2026-08-13 -- listed
        https://files.isimip.org/ISIMIP3b/OutputData/ = agriculture, biomes, fire,
        lakes_global, lakes_local, marine-fishery_global, permafrost, water_global."
        The 2b health sector (TRM-Tsukuba) has no SSP successor in OutputData.
      * NO population-exposed twin for the 3b `heatwave` product. verified_absent_on:
        "2026-08-13 -- listed all 5 HWMID-NONE/{gcm}/future/ (20 files) and
        HWMID-NONE/gfdl-esm4/historical/; the only variable emitted is `heatwave`."
        The 2b `peh` twin has no 3b counterpart under this publication.
      * NO labour-productivity or energy-demand sector in either round. verified_absent_on:
        "2026-08-13 -- listed ISIMIP2b/OutputData/ (12 sectors) and ISIMIP3b/OutputData/
        (8 sectors); neither list contains a labour or energy entry."
      * ISIMIP3a `heatwave` (Zantout2025/HWMID-NONE) is HISTORICAL ONLY and cannot produce
        a decadal projection panel. verified_absent_on: "2026-08-13 -- listed all four
        forcing dirs (20crv3, 20crv3-era5, 20crv3-w5e5, gswp3-w5e5); every one contains
        historical/ and nothing else. Files are obsclim + counterclim, histsoc/default,
        annual 1901-2016." Value as a benchmark/validation reference only.
      * The HEALTH SECTOR EXISTS IN ISIMIP2b ONLY -- across all four rounds.
        verified_absent_on: "2026-08-14 -- listed ISIMIP2a/OutputData/ (10 sectors),
        ISIMIP3a/OutputData/ (8 sectors, incl. a `peat` sector 3b lacks) and
        ISIMIP3b/OutputData/ (8 sectors). None contains health. Only
        ISIMIP2b/OutputData/health/ exists, and it holds ONE model, TRM-Tsukuba."
        So an SSP-scenario heat-MORTALITY layer cannot be built from ISIMIP output at all;
        the mortality route is RCP-only and CMIP5-only.
      * `an-tot-heat-all` is the ONLY health variable published, in future AND historical.
        verified_absent_on: "2026-08-14 -- listed TRM-Tsukuba/{4 gcm}/future/ (12 files)
        and gfdl-esm2m/historical/ (2 files); every file is `an-tot-heat-all`."
        There is no cold-related twin and no age split despite the `ages` specifier.
      * NO published heat-index / humidex / WBGT / UTCI product exists in ANY round's
        DerivedOutputData. verified_absent_on: "2026-08-14 -- listed
        ISIMIP2b/DerivedOutputData/ (Lange2020, Zimmer2023 = 9 WATER models),
        ISIMIP3a/DerivedOutputData/ (Quesada-Chacon2026 = CaMa-Flood + GHM, Zantout2025)
        and ISIMIP3b/DerivedOutputData/ (Heinicke2026, Jaegermeyr2021 = 12 CROP models,
        TipESM2025 = MIT water models, Zantout2025)." An absolute heat index therefore has
        to be CONSTRUCTED from forcing; none is published ready-made.
    chosen_2026_08_13: |
      ISIMIP3b `heatwave` (Zantout2025/HWMID-NONE) -- user decision, "prefer the more recent
      data unless there is a strong reason not to". No strong reason was found: unlike the
      drought pair, 3b is not the thinner ensemble here (5 members/scenario vs 2b's 4), and
      it adds a third scenario and the CMIP6 generation. The one material difference is
      definitional, not qualitative -- see method_difference_VERIFIED -- and it is carried
      as disclosure, not as a reason to prefer 2b.
      INGESTED 2026-08-13: 15/15 files, 62.3 MiB, every one sha512-matched against the
      publisher sidecar. data/raw/heatwave-isimip3b_heatwave_annual/,
      scripts/download_heatwave_isimip3b.py, provenance in download_provenance.csv.
      VALUE-CHECKED 2026-08-13: scripts/check_heatwave_nature.py, results recorded under
      representations.heatwave_exposure_3b (data_nature, saturation, mask, sites).
      PROCESSED 2026-08-14 -> data/processed/heatwave-isimip3b_heatwave_annual/,
      scripts/process_heatwave_isimip3b.py. test_shared_baseline.py: ALL CHECKS PASSED
      (2020s panel bit-identical across scenarios, 0 CI violations, 0 ocean leak, baseline
      slopes NaN, n_members 5-5, n_models 1-1). Per-member contact sheet rendered and
      VIEWED: five spatially coherent members, no block structure, seams, banding or mask
      defect; GCM level spread 1.58x (gfdl-esm4 0.2583 -> ukesm1-0-ll 0.4073).
      Registered as `heatwave-3b` in config/layer_registry.yaml with status BLOCKED -- it is
      built and contract-passing but not cleared for delivery, pending the saturation
      tie-ranking decision and a rewrite of the hazard's workforce-safety copy. No asset
      type references it, so it cannot reach a delivery.
      SELECTED 2026-08-14 -- user reviewed the dataset and chose this layer as THE heatwave
      layer. Registry status `preferred`, `qa_reviewed_on: 2026-08-14` (the only layer with a
      human QA date). `leh` remains built but not selected; see representations.leh_exposure_2b.
      Its two defining limitations now travel automatically as MUST-DISCLOSE caveats
      (CENSORED-CEILING from `saturation_caveat`, RELATIVE-BASELINE from the registry), after
      `saturation_caveat`/`sparsity_caveat` were added to the closed LAYER_ATTRS_EXPORTED
      allowlist in scripts/utils/delivery.py -- before that they were dropped before reaching
      layers.csv or either report.
      STILL OPEN: no asset type routes to this layer, so hazard_taxonomy `covered_by` is
      deliberately still empty; and the hazard's workforce-safety copy must be rewritten,
      since this index carries no humidity term.
      2026-08-14 earlier decision: prefer the ABSOLUTE, health-anchored quantification over the
      out-of-distribution one, which is why `leh` was ingested alongside -- see
      representations.leh_exposure_2b.sparsity_measured before assuming it can be primary.
    open_decisions: |
      NOT pre-answered here; they are measurements or user decisions, not inheritances.
      RESOLVED by the 2026-08-13 ingest + value check:
        - data nature of 3b `heatwave`: BINARY, measured -> pooled_mean_boolean
        - zero-inflation: 45.3% median, third branch NOT in scope
        - land mask: land footprint, no ocean leak, mask identical across all 15 members
      STILL OPEN, and the first two are new to this layer:
      1. SATURATION / CENSORING. 45.9% of ssp585 2090s cells sit at exactly 1.0. Both
         slopes go to ~0 there and mean "permanently exposed", not "no trend". Decide the
         treatment before processing: publish the slope with a censoring flag, mask the
         slope where the decade is saturated, or report a time-to-saturation instead.
      2. PERCENTILE TIE TREATMENT under that saturation -- one tie block holding nearly
         half the cells. The two-tier zero rule does not address a tie at the TOP.
      3. Smoothing decay length. 5 members/scenario is thin. L is a per-layer measurement.
      4. Publication mask. n_models = 1, so `led`'s ">=2 impact models" rule has no
         meaning. Measured here the question may be moot -- the finite mask is identical
         across all 5 GCM members, so every cell is in 5 of 5 and no tier exists to cut on.
      5. Whether to ALSO ship 2b `leh` as a sibling (as drought does with led/driedarea).
         Note `leh` remains UNVERIFIED on data nature and is a DIFFERENT index, so a
         sibling pair here would not be two views of one measurement the way drought's is.
      6. Whether the health mortality count belongs in an asset-facing product at all
         (see its caveat above).

  # -------------------------
  # crop failure searches
  # -------------------------
  crop_failure:
    last_searched: "2026-08-13"
    description: >
      FOUR distinct representations. Two ship the failure index already computed
      (Zantout2025 `cropfailure` 3b, Lange2020 `lec` 2b); two are yield products from
      which a failure index would have to be CONSTRUCTED (Jaegermeyr2021 `yieldchange-*`,
      agriculture-sector `yield-{crop}-{firr,noirr}`) -- a modelling decision under
      GUARDRAILS 1-2, not an aggregation.
    corrections_2026_08_13: >
      This search overturned two recorded claims. (1) drought.exposure_lange2020.family.lec
      read `impact_models: "gepic"` (from a 2026-07-24 API listing capped at 20 rows);
      Lange2020 publishes `lec` from **GEPIC and PEPIC**, 2 models not 1. That single-model
      claim is the stated `blocker` in config/hazard_taxonomy.yaml crop-failure and is now
      false as written. (2) The Zantout2025 sibling note "cropfailure (240 files)" was a
      raw count with no matrix; the future/ SSP set is 120 files in a complete 8x5x3.

    cropfailure_isimip3b:
      publication: "ISIMIP3b/DerivedOutputData/Zantout2025/"
      path: "{MODEL}/{gcm}/future/"
      enumerated: "2026-08-13 -- 8 model listings + 40 future/ listings, 0 empty, 0 gaps; variable field projected at $(NF-4), 160/160 files = `cropfailure` (no crop suffix, no PFT split)"
      impact_models: ["crover", "cygma1p74", "epic-iiasa", "isam", "ldndc", "lpjml", "pepic", "promet"]  # 8 crop models
      climate_forcings: ["gfdl-esm4", "ipsl-cm6a-lr", "mpi-esm1-2-hr", "mri-esm2-0", "ukesm1-0-ll"]  # 5 CMIP6
      scenarios: ["ssp126", "ssp370", "ssp585"]   # + picontrol (5 per model, excluded from reports)
      matrix: "COMPLETE 8 x 5 x 3 = 120 future files. 40 members/scenario. Composition IDENTICAL across the three SSPs -> shared 2020s baseline valid."
      soc_sens: "UNIFORM 2015soc / default across all 160 files -- no harmonization compromise, no model dropped"
      bias_adjustment: "w5e5"
      timestep: "annual"
      period: "2015-2100 (2020s baseline decade is complete)"
      volume: "2-9 MB/file, measured one file per model at gfdl-esm4/ssp370: promet 3.13, ldndc 3.78, lpjml 4.71, pepic 5.53, epic-iiasa 5.98, crover 7.26, cygma1p74 7.90, isam 8.74 MB. Sum x 15 (5 GCM x 3 SSP) = ~705 MB for the full SSP set."
      sidecars: >
        PRESENT at `{stem}.json` with size + sha512 + parsed specifiers + a netcdf_header
        block. CORRECTED 2026-08-14: this entry previously read "NONE -- .json 404s", which
        was wrong and came from probing only `{stem}.nc.json` (that form does 404). The
        crop-failure ingest therefore ran with Content-Length as its only integrity check
        until the error was caught; all 120 files were then re-verified against the
        publisher's sha512. The identical trap was recorded for `lec_isimip2b` in this same
        file hours earlier and not applied here. A 404 on a GUESSED sidecar path is
        UNVERIFIED, never a negative -- try both forms or read the directory listing.
      size_spread_flag: "CONFIRMED 2026-08-13: the 2.8x file-size spread is a real footprint difference -- promet simulates crops on 33,339 cells, isam on 39,249."
      data_nature: >
        MEASURED 2026-08-13 across all 120 members (scripts/check_cropfailure_nature.py):
        CONTINUOUS fraction in [0,1], NOT binary -- 82,962-130,168 distinct values per
        member, so it inherits neither `led`'s binary nature nor anything from `lec`.
        long_name "cropfailure area share", units "1". 96.14% of finite cell-years are
        exact zeros, but that figure is an artifact of zero-fill; WITHIN the cropland
        footprint the annual exact-zero share is 46.37%-80.63%, median 60.89%.
      zero_fill_WARNING: >
        THE PUBLISHER ZERO-FILLS THE ENTIRE GLOBE. Every member is non-NaN over ~100% of
        the 259,200-cell grid (only 236 land cells are NaN anywhere); ocean, Antarctica,
        Greenland and the Sahara all read exact 0 rather than NaN. `isfinite` therefore
        carries NO footprint on this product and must NOT be used as a land mask -- doing
        so puts 87% ocean zeros into the percentile baseline and reports n_members=40 over
        open ocean. The footprint comes from where the field is ever NON-ZERO: union 39,890
        cells across the 8 models, 39,406 of them (98.8%) inside the official ISIMIP3b
        land-sea mask.
        This is NOT the `floodedarea` ocean leak, and the difference was measured rather
        than assumed: of the 484 off-mask cells, 63% are directly adjacent to land
        (coastline disagreement at 0.5 deg) and the rest are small islands the generic mask
        does not resolve (Lofoten 68.25N 13.25E, Shetland 60.25N -1.75E), with marginal
        values (median 0.0016). They come from ldndc (476) and lpjml (453) only; the other
        six models have none. `floodedarea` by contrast carries REAL values over open ocean.
      time_axis_WARNING: >
        The `time` coordinate carries long_name/standard_name/axis and NO `units` attribute
        at all, so xarray cannot decode it (`.dt` raises AttributeError) and there is no
        epoch to read. Values are a bare contiguous integer sequence, 165..250 for a file
        declaring 2015_2100 -- `years since 1850`, undeclared. Decode from the filename span
        and assert contiguity; do NOT hardcode the epoch. Contrast Heinicke2026
        `driedarea`, whose axis is a properly declared `days since 1601-01-01`. Time-axis
        handling is per-PUBLICATION, not per-round.
      population_twin: "NONE -- 3b publishes no population-exposed counterpart to `cropfailure` (2b's `lec` does have `pec`)."
      processed: >
        DONE 2026-08-13 -> TCFD layer id `cropfailure-3b`, folder
        cropfailure-isimip3b_cropfailure_annual. 40 members/scenario. Framing, all measured
        here and none inherited: pooled_mean_zero_inflated statistic (OUTPUT-SPEC third
        branch, DECLARED deviation, user decision 2026-08-13 -- the median branch leaves
        96.83% of the footprint at exactly zero, 1,265 exposed cells against the mean
        branch's 39,872); NO smoothing, settled by a split-half test rather than draw count
        (roughness 0.347 full vs 0.351/0.359 on disjoint 20-member halves, halves correlate
        Pearson 0.977 / Spearman 0.991, and roughness is 0.790 on footprint edge cells vs
        0.304 interior -- real cropland structure, not sampling noise); FULL-footprint mask,
        no minimum-model cut, because the coverage-tier level gradient runs the OPPOSITE way
        from `led`'s artifact (1 model 0.00001 rising to 8 models 0.00670: low-coverage
        cells are marginal cropland, not one high model undiluted); single_tier percentile
        (baseline exact-zero 0.05%); higher_is_worse; no normalization (6.69x inter-model
        spread is structural). See scripts/process_cropfailure_isimip3b.py and
        scripts/download_cropfailure_isimip3b.py.
      crop_composition_UNKNOWN: >
        `cropfailure` carries no crop token, so which crops are inside and how they are
        weighted is not readable from the filename or the (absent) sidecar. This is a
        documentation question for the Zantout2025 publication, and it is material: a
        crop-aggregated index over crops a site does not grow is not that site's risk.

    lec_isimip2b:
      publication: "ISIMIP2b/DerivedOutputData/Lange2020/"
      path: "{GEPIC,PEPIC}/{gcm}/future/"
      enumerated: "2026-08-13 -- 2 model listings + 8 future/ listings, 0 empty, 0 gaps; 48 files = 24 lec + 24 pec"
      impact_models: ["gepic", "pepic"]   # CORRECTED from "gepic" only
      climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]  # 4 CMIP5
      scenarios: ["rcp26", "rcp60"]   # + picontrol. NO rcp85 -- matches the documented family gap
      matrix: "COMPLETE 2 x 4 x 2 = 16 future files. 8 members/scenario. Composition IDENTICAL across both RCPs."
      soc_sens: "UNIFORM 2005soc / co2"
      bias_adjustment: "ewembi"
      timestep: "annual"
      period: "2006-2099"
