  # sugarcane (agriculture sector)
  # -------------------------
  sugarcane:
    last_searched: "2026-08-11"
    notes: >
      OUTPUT crop code is 'sug' (NOT 'sgc' -- 'sgc' is the ISIMIP3b crop-calendar InputData
      code and no 3b model publishes output for it). Enumerated exhaustively: ISIMIP3b (63
      model x GCM future/ dirs), ISIMIP2b (4 models x 4 GCMs, future/ + historical/),
      ISIMIP3a (13 models, gswp3-w5e5 historical/), ISIMIP2a (24 models, one forcing each;
      all forcings for the two models that carry 'sug'). File sizes ~3.8-4.0 MB each.

    isimip3b:
      total_datasets: 0
      notes: >
        NO sugarcane output. 3b agriculture publishes 11 crops only
        (bea cas mai mil pot ri1 ri2 sor soy swh wwh). 'sgc' exists solely as
        InputData/socioeconomic/crop_calendar/{soc}/*_sgc_{firr,noirr}.nc.
        Jaegermeyr2021 DerivedOutputData is yieldchange-{mai,ric,soy,whe} only.

    isimip2b:
      total_datasets: 44   # all sug metrics, 4 GCMs, future/ + historical/
      sectors: ["agriculture"]
      impact_models: ["LPJmL"]     # ONLY model with sugarcane; CLM45/GEPIC/PEPIC have none
      climate_forcings: ["GFDL-ESM2M", "HadGEM2-ES", "IPSL-CM5A-LR", "MIROC5"]
      bias_adjustment: ["ewembi"]
      scenarios:
        # CORRECTED 2026-08-11: rcp85 DOES exist in 2b agriculture -- CLM45 publishes it for
        # mai + soy only. Sugarcane (LPJmL) genuinely has no rcp85. Scope the negative.
        climate: ["rcp26", "rcp60", "historical", "picontrol"]   # no rcp85 for THIS crop
        soc: ["2005soc"]
        sensitivity: ["co2", "2005co2"]   # 2005co2 for rcp26 only
      temporal:
        resolution: "annual"
        period: "2006-2099 (future), 1861-2005 (historical)"
      spatial:
        resolution: "0.5 degree (declared)"
        coverage: "global"
      variables_available:
        - yield-sug-firr
        - yield-sug-noirr
        - biom-sug-{firr,noirr}
        - aet-sug-{firr,noirr}
        - plantday-sug-{firr,noirr}
        - matyday-sug-{firr,noirr}
        - pirrww-sug-firr
      notes: >
        4 members per scenario per irrigation regime (1 impact model x 4 GCMs) -- thin
        ensemble. Yield files are ~3.9 MB; a rcp26+rcp60 x firr+noirr pull is 16 files
        (~62 MB). Sidecars DO exist -- the name drops the extension ({stem}.json, NOT
        {stem}.nc4.json, which 404s) and carries size + sha512 + parsed specifiers but
        no netcdf_header, so units are a download-time measurement.
      DATA_DEFECT: >
        *** DO NOT USE THIS DATASET FOR A YIELD LAYER. Measured 2026-08-11. ***
        The ISIMIP2b LPJmL `sug` run does not simulate sugarcane in the sugarcane belt.
        Sao Paulo, Uttar Pradesh, Guangxi, Thailand, Pakistan Punjab, Veracruz, KZN,
        Cauca, Queensland, Florida and Louisiana ALL read yield = 0, with sentinel
        companions: biom-sug pinned at exactly 0.267 t ha-1 and plantday = matyday = 1
        (no season simulated). 12,966 land cells (19.2%) carry that signature and 0% of
        them have a non-zero yield. The mask is near-identical across all 8 members
        (Jaccard 0.98-0.998), so it is static, not climate-driven crop failure. Maize
        from the same model/GCM/run IS simulated in those cells (Florida 5.65,
        Sao Paulo 1.64 t ha-1), so the cells are live cropland.
        CONTRAST ISIMIP2a, same model: Florida 19.49, Sao Paulo 11.69, UP 8.33,
        Queensland 7.17 t ha-1 -- sensible -- while 2b gives 0 for all four and leaves
        the US Midwest (13.35) as the global-looking maximum. 75.2% of the cells where
        the 2a run grows cane are zero in 2b; 90.3% of 2b's sentinel cells are 2a cane
        land. Both LPJmL rounds do report marginal POTENTIAL yield in temperate cells
        (2a Midwest 10.61) -- that part is a model property, not the defect.
      processed: >
        WITHDRAWN 2026-08-11 (same day it was built). Two layers were produced and
        passed test_shared_baseline.py in full -- data/processed/sugarcane_yield-sug-
        {noirr,firr}_annual via scripts/process_sug_sugarcane.py -- and are retained ONLY
        as evidence, each carrying INVALID-DO-NOT-USE.md. Contract conformance says
        nothing about whether the input means what its name says (GUARDRAILS 9 checks the
        data NATURE; nothing checked the data's SPATIAL PLAUSIBILITY until the user asked
        why the US Midwest out-yielded Florida).
      raw_deleted: >
        2026-08-12 -- data/raw/sugarcane_yield-sug-{noirr,firr}_annual removed. The URLs
        and sha512 of all 16 files survive in download_provenance.csv, now kept alongside
        the retained (INVALID) processed layers.
      conclusion: >
        No usable future-scenario sugarcane yield exists in ISIMIP: 2b LPJmL is the only
        scenario-bearing source and it is defective; ISIMIP3b publishes no sugarcane;
        ISIMIP2a is correct but historical-only.

    isimip2a:
      total_datasets: ~35   # sug files across LPJmL (4 forcings) + CLM-Crop (watch-wfdei)
      sectors: ["agriculture"]
      impact_models: ["LPJmL", "CLM-Crop"]
      climate_forcings: ["GSWP3", "Princeton", "WATCH", "WATCH-WFDEI"]  # CLM-Crop: WATCH-WFDEI only
      bias_adjustment: ["nobc"]
      scenarios:
        climate: ["hist"]
        harmonization: ["default", "harmnon", "fullharm"]   # fullharm CLM-Crop only
      temporal:
        resolution: "annual"
        period: "1971-2012 (LPJmL, varies by forcing); 1980-2012 (CLM-Crop)"
      notes: "Historical only -- no scenarios. Useful for evaluation/baseline, not projection."

