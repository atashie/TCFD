    yield_isimip3b_agriculture:
      sector: "ISIMIP3b/OutputData/agriculture/{MODEL}/{gcm}/future/"
      enumerated: "2026-08-13 -- 14 model listings + 63 future/ listings, vocabulary projected over 41,023 filename records"
      note: "The raw-yield route. A failure layer from these is a CONSTRUCTED INDEX (yield below a baseline percentile), i.e. GUARDRAILS 1-2 territory."
      impact_models: "14 -- ACEA(2 GCMs), CROVER, CYGMA1p74, DayCent(1 GCM), DSSAT-Pythia, EPIC-IIASA, ISAM, LDNDC, LPJ-GUESS, LPJmL, pDSSAT, PEPIC, PROMET, SIMPLACE-LINTUL5 (5 GCMs each unless noted)"
      crops_observed: ["bea", "cas", "mai", "mil", "pot", "ri1", "ri2", "sor", "soy", "swh", "wwh"]  # 11, confirms the sugarcane-entry finding
