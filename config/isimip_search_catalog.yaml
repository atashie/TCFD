          ssp370         9     7/9    2015-2100       IITM-ESM ends 2098
          ssp460         2     2/2    2015-2100       IPSL-CM6A-LR, MRI-ESM2-0 only
          ssp534-over    5     5/5    2040-2100 ONLY  no 2015-2039, so NO 2020s baseline
          ssp585         9     7/9    2015-2100
        union_with_group_I: >-
          For a tasmax-based index on ssp126/ssp370/ssp585: 5 + 7 = 12 GCMs, deeper than
          any layer currently shipped. For ssp245: 12 GCMs, from this root alone.
        volume_measured: "tasmax 2.04-2.08 GB per chunk (HEAD, CanESM5 and EC-Earth3 ssp245) -> ~18.6 GB per GCM-scenario; ~670 GB for 12 GCMs x 3 SSPs, ~223 GB more for ssp245"
      constructed_from_hourly:
        path: "ISIMIP3b/SecondaryInputData/climate/atmosphere/bias-adjusted/global/hourly/{scenario}/{GCM}/"
        ensemble: "5 GCMs (the group-I five) x historical/ssp126/ssp370/ssp585, 5/5 for every variable"
        variables: "7 -- hurs pr ps rlds rsds sfcwind tas. NO tasmax, NO tasmin, NO huss."
        timestep: "hourly, 17 five-year chunks 2015-2100 (34 for historical)"
        relevance: "The only route to a sub-daily heat-stress metric (WBGT/UTCI need wind + radiation at the hour). tas 4.31 GB/chunk, hurs 4.95 GB/chunk -> ~157 GB per GCM-scenario for tas+hurs, ~2.4 TB for all 15."
      observational_baseline_3a:
        path: "ISIMIP3a/InputData/climate/atmosphere/obsclim/global/daily/historical/{FORCING}/"
        forcings: "20CRv3, 20CRv3-ERA5, 20CRv3-W5E5, CHELSA-W5E5, CHELSA-W5E5v1.0, GSWP3-W5E5"
        relevance: >-
          Historical ONLY -- no scenarios, so it cannot produce a decadal projection panel.
          Its use is calibration/validation of a constructed threshold against observed
