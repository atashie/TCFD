# ISIMIP Search Results Catalog
# ==============================
# This file tracks empirical search results from ISIMIP repository queries.
# Update this file as new searches are conducted to build institutional knowledge
# and avoid redundant API queries.
#
# -----------------------------------------------------------------------------
# HOW TO WRITE A NEGATIVE IN THIS FILE  (GUARDRAILS §11 — read before adding one)
# -----------------------------------------------------------------------------
# A negative ("X does not exist", "no SSP version", "0 hits") ends the next session's
# search before it starts, so it is never tested the way a positive is. This file
# carried "ISIMIP3b/SSP version of this family NOT found (0 hits)" for the drought
# section from 2026-07-24 to 2026-08-11. It was FALSE — 3b publishes `driedarea`
# under DerivedOutputData/Heinicke2026, a complete 3 x 5 x 3 = 45-file SSP matrix —
# and the `led` layer shipped on rcp26/rcp60 because of it.
#
# Therefore EVERY negative in this file must carry its receipt inline:
#
#     verified_absent_on: "2026-08-11 — listed https://files.isimip.org/ISIMIP3b/DerivedOutputData/"
#
# naming the directory ACTUALLY enumerated. If you cannot name the path you listed,
# write UNVERIFIED instead of the negative. Two further rules:
#
#   * A negative about a CODE is not a negative about a HAZARD. "`led` returns 0 hits
#     in 3b" is true and nearly useless — re-issues are renamed by hazard word
#     (driedarea, floodedarea, heatwave, wildfire, cropfailure).
#   * If this file and the /isimip-search-download skill disagree, STOP, enumerate,
#     and write the answer back to BOTH. Believing the skill and leaving this file
#     stale is exactly how the above survived four days after the skill was corrected.
#
# Last updated: 2026-01-20

# -----------------------------------------------------------------------------
# VARIABLE DEFINITIONS
# -----------------------------------------------------------------------------
variable_definitions:

  # ---------------------------------------------------------------------------------------
  # CONSTRUCTED variables -- NOT published by ISIMIP. Built here from bias-adjusted daily
  # forcing (GUARDRAILS 1-2: a constructed index is a modelling decision, not an aggregation).
  # Searching the repository for any of these codes returns nothing, correctly. Built and
  # signed off 2026-08-16; see search_results.chronic_heat and search_results.cold_frost.
  # ---------------------------------------------------------------------------------------
  hd30:
    long_name: "Hot days above 30 C"
    units: "days per year"
    constructed_from: "ISIMIP3b bias-adjusted daily tasmax > 30 C"
    description: "Annual count of days whose daily MAXIMUM temperature exceeds 30 C. Naming follows World Bank CCKP (hd30/35/40/45)."
    use_case: "Broad chronic-heat screen. Saturates in the humid tropics -- 11.8% of observations at the calendar ceiling by ssp585 2090s."
  hd35:
    long_name: "Hot days above 35 C"
    units: "days per year"
    constructed_from: "ISIMIP3b bias-adjusted daily tasmax > 35 C"
    description: "Annual count of days whose daily MAXIMUM temperature exceeds 35 C. THE HEADLINE HOT RUNG. 35 C is defensible on CONVERGENCE across providers (CCKP hd35, Climate Impact Lab 95F, IIED, ILO onset, rail/pavement literature), NOT on physiology -- never write 'physiological limit', and never conflate it with the WET-BULB 35 C survivability figure, itself revised to ~30.6 C by Vecellio et al. 2022."
    use_case: "Chronic heat exposure for workforce, equipment derating and cooling demand -- but it carries NO humidity term, so it is not a heat-stress index."
  hd40:
    long_name: "Hot days above 40 C"
    units: "days per year"
    constructed_from: "ISIMIP3b bias-adjusted daily tasmax > 40 C"
    description: "Annual count of days whose daily MAXIMUM temperature exceeds 40 C."
    use_case: "Severe heat. Near-silent outside subtropical deserts on the 2020s baseline."
  hd45:
    long_name: "Hot days above 45 C"
    units: "days per year"
    constructed_from: "ISIMIP3b bias-adjusted daily tasmax > 45 C"
    description: "Annual count of days whose daily MAXIMUM temperature exceeds 45 C. SPARSE -- 70.8% of land is exactly 0 on the 2020s baseline, and the layer carries a sparsity_caveat."
    use_case: "Extreme heat tail. A portfolio reading all zeros is the layer working, not an extraction failure."
  TR20:
    long_name: "Tropical nights above 20 C"
    units: "days per year"
    constructed_from: "ISIMIP3b bias-adjusted daily tasmin > 20 C"
    description: "Annual count of nights whose daily MINIMUM temperature stays above 20 C. ETCCDI 'TR'. A HEAT metric despite reading on tasmin -- a 'tropical night' is one that fails to cool."
    use_case: "Overnight recovery. Consecutive hot nights predict heat mortality better than daytime peaks; Singapore is already at 365.2 in the 2020s."
  TR25:
    long_name: "Tropical nights above 25 C"
    units: "days per year"
    constructed_from: "ISIMIP3b bias-adjusted daily tasmin > 25 C"
    description: "Annual count of nights whose daily MINIMUM temperature stays above 25 C. An extension of ETCCDI TR, not the standard 20 C form."
    use_case: "Severe overnight heat load."
  ID:
    long_name: "Ice days"
    units: "days per year"
    constructed_from: "ISIMIP3b bias-adjusted daily tasmax < 0 C"
    description: "Annual count of days whose daily MAXIMUM temperature stays below 0 C -- days that never thaw. ETCCDI 'ID'. STRICT SUBSET of FD."
    use_case: "Persistent freezing: frozen ground, ice roads, winter shutdown conditions."
  FD:
    long_name: "Frost days"
    units: "days per year"
    constructed_from: "ISIMIP3b bias-adjusted daily tasmin < 0 C"
    description: "Annual count of nights whose daily MINIMUM temperature falls below 0 C. ETCCDI 'FD'. THE HEADLINE COLD RUNG. Distinct from ID: FD asks whether it froze at some point, ID whether it never thawed -- Chicago is 95.8 FD against 23.5 ID."
    use_case: "Frost damage, which happens at dawn. Scored higher_is_worse, so the layer reports this hazard FALLING -- see search_results.cold_frost.direction_decision before delivering it."
  FDm10:
    long_name: "Hard frost days below -10 C"
    units: "days per year"
    constructed_from: "ISIMIP3b bias-adjusted daily tasmin < -10 C"
    description: "Annual count of nights below -10 C. NOT a standard ETCCDI index -- an extension chosen here, so do not cite it as one."
    use_case: "Deep-cold exposure: pipe freezing, equipment cold limits, permafrost-adjacent operations."

  cwood:
    long_name: "Carbon Mass in Wood"
    units: "kg m-2"
    description: "Includes sapwood and hardwood carbon content. Stock variable (not flux)."
    use_case: "Proxy for timber volume/biomass. Convert to dry biomass via ~0.5 kg C per kg dry biomass."

  npp:
    long_name: "Net Primary Productivity"
    units: "kg m-2 s-1"
    description: "Carbon flux from atmosphere to vegetation minus plant respiration."
    use_case: "Proxy for vegetation growth rate."

  gpp:
    long_name: "Gross Primary Productivity"
    units: "kg m-2 s-1"
    description: "Total carbon uptake by photosynthesis."
    use_case: "Total photosynthetic capacity indicator."

  cveg:
    long_name: "Carbon Mass in Vegetation"
    units: "kg m-2"
    description: "Total vegetation carbon pool (above + below ground)."
    use_case: "Total biomass proxy."

  cleaf:
    long_name: "Carbon Mass in Leaves"
    units: "kg m-2"
    description: "Leaf carbon pool."
    use_case: "Canopy biomass indicator."

  csoil:
    long_name: "Carbon Mass in Soil Pool"
    units: "kg m-2"
    description: "Total soil organic carbon stock (subsurface storage pool). Stock, not flux. Bulk pool = 'csoil-total'."
    use_case: "Subsurface / soil carbon storage. Processed csoil-total (ISIMIP3b) -> TCFD layer 2026-07-25 (see search_results.soil_carbon)."

  croot:
    long_name: "Carbon Mass in Roots"
    units: "kg m-2"
    description: "Root biomass carbon (root-zone living carbon). Stock. ISIMIP3b only (not published in ISIMIP2b future runs)."
    use_case: "Root-zone biomass carbon."

  cvegbg:
    long_name: "Carbon Mass in Below-Ground Vegetation"
    units: "kg m-2"
    description: "Below-ground vegetation carbon (roots + below-ground woody); cvegag is the above-ground counterpart. Stock."
    use_case: "Broader root-zone biomass carbon than croot."

  nbp:
    long_name: "Net Biome Production"
    units: "kg m-2 s-1"
    description: "Net land carbon sink = NPP - Rh - disturbance. Flux; >0 = land absorbing carbon."
    use_case: "Carbon sequestration RATE (net sink). ISIMIP3b biomes."

  burntarea:
    long_name: "Burnt Area Fraction"
    units: "fraction"
    description: "Fraction of grid cell affected by fire."
    use_case: "Fire disturbance metric."

  b30cm:
    long_name: "Biomass Density of Consumers >30cm"
    units: "g C m-2"
    description: "Biomass density of marine consumers with asymptotic length (L∞) greater than 30cm. Size-class threshold for 'large fish'."
    use_case: "Large fish abundance proxy (tuna, salmon, etc.)."
    notes: "Monthly data requires aggregation - use mean for density metrics."

  tcb:
    long_name: "Total Consumer Biomass"
    units: "g C m-2"
    description: "Total biomass of all marine consumers regardless of size."
    use_case: "Overall fishery productivity indicator."

  b10cm:
    long_name: "Biomass Density of Consumers >10cm"
    units: "g C m-2"
    description: "Biomass density of marine consumers with L∞ > 10cm."
    use_case: "Medium-to-large fish abundance."

