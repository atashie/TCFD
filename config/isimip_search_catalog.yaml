# ---------------------------------------------------------------------------
# REPOSITORY STRUCTURE CACHE  (generated 2026-08-12)
# Consult this BEFORE walking the file server. It records what 59 ISIMIP3b +
# 30 ISIMIP2b directory listings established, so the walk need not be repeated.
# Depth is uniform in OutputData: {ROUND}/OutputData/{SECTOR}/{MODEL}/{GCM}/{future|historical}/
# ---------------------------------------------------------------------------
# =========================================================================================
# PUBLICATION MAP -- the container listing that was never done
# =========================================================================================
# WHY THIS BLOCK EXISTS
# Until 2026-08-14 no session had ever listed `ISIMIP2b/DerivedOutputData/`. We entered
# `ISIMIP2b/DerivedOutputData/Lange2020/` on 2026-08-08 -- a path we already had the name of,
# from a variable-code search -- and recorded its contents as though we had searched. The
# directory has TWO entries. The second is the CaMa-Flood inundation suite, which is the
# best river-flood product in the repository by a wide margin and was invisible for 3 weeks.
#
# HOW TO USE THIS BLOCK: start every hazard search here, not with a variable name. A
# publication is identified by its FILES -- three of the nine below are CaMa-Flood and not
# one of them says so above the file level. Directory names are institutions and first
# authors. See GUARDRAILS 13.
repository_publication_map:
  swept_on: "2026-08-14"
  method: >-
    Listed https://files.isimip.org/ (4 rounds), then each round's DerivedOutputData/ root,
    then descended each publication to its first directory containing .nc/.nc4 and read two
    filenames. Publications are identified by FILE CONTENT, never by directory name.
  rounds_present: ["ISIMIP2a", "ISIMIP2b", "ISIMIP3a", "ISIMIP3b"]
  output_data_sectors:
    ISIMIP3b: [agriculture, biomes, fire, lakes_global, lakes_local, marine-fishery_global, permafrost, water_global]
    ISIMIP3a: [agriculture, biomes, fire, lakes_global, lakes_local, peat, permafrost, water_global]
    ISIMIP2b: [agriculture, biodiversity, biomes, forestry, health, lakes_global, lakes_local, marine-fishery_global, marine-fishery_regional, permafrost, water_global, water_regional]
    ISIMIP2a: "NOT LISTED as of 2026-08-14"
  derived_output_data:
    ISIMIP2a:
      Zimmer2023: "CaMa-Flood. flddph/fldfrc at 150 AND 300 arcsec, dis at 900 arcsec. gswp3, nobc, annual 1971-2010. The observational counterpart to the 2b edition."
    ISIMIP2b:
      Lange2020: "The le*/pe* extreme-event exposure family, 12 codes, 0.5 deg, rcp26/rcp60."
      Zimmer2023: "CaMa-Flood. flddph/fldfrc at 150 arcsec, protection none/100yr/flopros, rcp26/60/85. THE ONE THAT WAS MISSED."
    ISIMIP3a:
      Zantout2025: "cropfailure / heatwave / wildfire exposure, obsclim, historical."
      Quesada-Chacon2026: "CaMa-Flood + GHM `dis` AT GRDC GAUGE LOCATIONS, daily 1901-2019, counterclim/obsclim. Gauge-referenced, not gridded -- a validation product."
    ISIMIP3b:
      Heinicke2026: "driedarea, floodedarea -- 0.5 deg binary exposure flags, ssp126/370/585."
      Zantout2025: "heatwave, wildfire, cropfailure exposure, ssp126/370/585."
      Jaegermeyr2021: "yieldchange-{crop} (mai, ric, ...), ssp126+, annual 2015-2099. NOT otherwise enumerated."
      TipESM2025: "CaMa-Flood. fldfrcmax at 15 arcmin, 5 protection levels, ssp126/370/585, 32 members. Recorded as 'water models' from 2026-08-11 to 2026-08-14 -- the note identified its model dirs and never opened a file."
  derived_input_data:
    swept_on: "2026-08-14"
    THE_ROOT_NOBODY_LISTED: >-
      `DerivedOutputData/` is NOT the only derived root. ISIMIP3b -- and ONLY ISIMIP3b, the
      other three rounds have no such directory -- also publishes
      https://files.isimip.org/ISIMIP3b/DerivedInputData/. Round roots listed 2026-08-14:
      2a/2b/3a = [DerivedOutputData, InputData, OutputData, SecondaryInputData,
      SecondaryOutputData]; 3b = [DerivedInputData, DerivedOutputData, InputData,
      OutputData, SecondaryInputData]. The 2026-08-14 publication sweep listed each round's
      DerivedOutputData root and stopped, so this root went unlisted for as long as the map
      has existed. It holds ready-made annual CLIMATE INDICATORS -- the exact product class
      you go looking for when a hazard needs a constructed index.
    ISIMIP3b:
      SPARCCLE2025: >-
        TEN annual 0.5 deg indicators derived from the bias-adjusted forcing.
        {scenario}/{GCM}/ (3 levels, scenario ABOVE the GCM, like TipESM2025).
        4 scenarios (historical, ssp126, ssp370, ssp585) x 5 GCMs (GFDL-ESM4,
        IPSL-CM6A-LR, MPI-ESM1-2-HR, MRI-ESM2-0, UKESM1-0-LL) = 20 dirs, 10 files each.
        Variables, read from the sidecar netcdf_header (2026-08-14):
          temp-annual-max    "Annual maximum temperature (TXx)"                 K
          temp-variability   "Temperate Variability (TV)" [sic -- Temperature]  K
          fwi                daily Fire Weather Index                           (daily file)
          fwi-annual-max / fwi-avg-seasonal / fwi-season-length                 FWI suite
          fwi-ndays-extreme  "Number of days With Extreme Fire Weather (above
                              95th percentile of 1851-1900 baseline (FWIXD)"    days
          pr-annual-max                                                         mm
          pr-extreme-99-9    "Extreme Daily Precipitation Annual Sum (above
                              99.9th percentile of baseline period daily data)" mm a-1
          pr-wetdays-gt1mm   "Number of wet days (W)"                           days
        86 annual steps 2015-2100, dims (time=86, lat=360, lon=720), proleptic_gregorian,
        time units `days since 2015-1-1`. 18.5 MB (temp-annual-max) / 20.3 MB
        (temp-variability) / 7.7 MB (fwi-ndays-extreme) / 10.1 MB (pr-extreme-99-9) per
        file. Sidecars ARE published at `{stem}.json` with checksum + full netcdf_header.
        RELEVANCE BEYOND HEAT: temp-variability is the only candidate in the repository for
        the ESRS AR 11 "temperature variability" hazard, which has no family in
        config/hazard_taxonomy.yaml at all; pr-* are candidates for `heavy-precipitation`;
        fwi-* are a SECOND wildfire representation (fire weather, not burnt area).
        NOT VALUE-CHECKED -- units/nature are declared, not measured (GUARDRAILS 9).
      TipESM2025: >-
        Also present under DerivedInputData (MIT/{scenario}/{gcm}/), alongside its
        DerivedOutputData entry. Not re-enumerated here; see derived_output_data.
  depth_is_not_uniform: >-
    Most publications are {MODEL}/{gcm}/{period}/ (3 levels). TipESM2025 is
    MIT/{scenario}/{GHM}/{gcm}/ -- FIVE levels with the scenario ABOVE the model. A walker
    that assumes 3 levels returns it as empty, which is not a negative (GUARDRAILS 8).
    SPARCCLE2025 (DerivedInputData) is {scenario}/{GCM}/ -- THREE levels, scenario above
    the GCM and no period level at all.
  resolutions_observed: >-
    0.5 deg, 15 arcmin, 150 arcsec, 300 arcsec, 900 arcsec -- ALL WITHIN ONE HAZARD.
    Resolution is a per-publication property and belongs in every availability matrix.
    Every layer we ship being 0.5 deg is a fact about us, not about ISIMIP.
  known_gaps_in_this_map:
    - "ISIMIP2a OutputData sectors not listed."
    - "Jaegermeyr2021 (3b) identified from 2 filenames only -- crop coverage not enumerated."
    - "Quesada-Chacon2026 GHM/ subtree not enumerated (only its CaMa-Flood/grdc/counterclim leaf)."
    - "InputData/ roots partially swept: ISIMIP3b climate/atmosphere and ISIMIP3a climate/atmosphere were walked 2026-08-14 (see search_results.chronic_heat); 3b AND 3a climate/lightning were walked 2026-08-18 (see search_results.lightning). NOT swept: 3b InputData/climate/{atmosphere_composition,ocean}, 3a climate/{sealevel,tropical_cyclones_flooding,...}, and every InputData root in 2a/2b/3a beyond climate/atmosphere and climate/lightning."
    - "SecondaryInputData swept for ISIMIP3b ONLY (climate/atmosphere). 2a, 2b and 3a each have a SecondaryInputData root that has never been listed."
    - "SecondaryOutputData exists in 2a, 2b and 3a and has NEVER been listed in any round. UNVERIFIED in both directions."
    - "DerivedInputData exists in ISIMIP3b only and was first listed 2026-08-14 -- see derived_input_data. Its sibling roots in other rounds are absent, not unlisted (round roots were enumerated)."

