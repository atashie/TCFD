  permafrost_thaw:
    last_searched: "2026-08-14"
    SHIPPED: >-
      `permafrost-3b` shipped 2026-08-14 from the ISIMIP3b thawdepth route below
      (scripts/process_thawdepth_permafrost.py; 12 members, ssp126/370/585). The layer
      publishes thaw depth NORMALISED BY EACH MODEL'S OWN SOIL COLUMN, because the raw metres
      are not poolable across models, and takes the OUTPUT-SPEC fourth branch
      (`pooled_mean_multimodel`) because the normalised members form two clusters. Framing,
      caveats and the measurements behind each choice are in DATASET-ATTRIBUTES.md and the
      processor docstring; the ISIMIP2b route below is NOT ingested.
    description: >
      Permafrost thaw / ground stability. Exactly ONE published variable names the hazard:
      `thawdepth` (seasonal thaw / active-layer depth, annual AND monthly). There is NO
      permafrost-extent, ground-ice, subsidence or solifluction variable in any round, and
      NO derived exposure index -- unlike drought, river flood, heatwave, wildfire and crop
      failure, neither Lange2020 (2b) nor Heinicke2026 / Zantout2025 (3b) publishes a
      permafrost member. A permafrost layer would be built from the PHYSICAL variable, not
      from a ready-made "area exposed" index, which is the opposite starting point from
      every exposure layer shipped so far.
      Supporting variables: `tsl` (soil temperature BY LAYER -- carries a depth dimension the
      (decade, lat, lon) contract cannot ingest without choosing a layer), `soilmoistfroz`
      (frozen soil moisture), `snd` / `swe` (the insulating snow control).
    enumerated: |
      2026-08-14, serial listings, empty listing treated as failure, variable field projected
      from the END ($(NF-4)), no target-token pre-filter. 1 empty listing found and re-checked
      (see watergap2_empty_dir below); 0 retries needed elsewhere.
        ISIMIP3b/OutputData/permafrost/  -> ELM-ECA, LPJmL5-7-10-fire
        ISIMIP2b/OutputData/permafrost/  -> CLM45, LPJmL, ORCHIDEE, ORCHIDEE-DGVM
        ISIMIP3a/OutputData/permafrost/  -> ELM-ECA, LPJmL5-7-10-fire, ORCHIDEE-MICT
        ISIMIP2a/OutputData/permafrost/  -> IAPRAS-DSS, JULES-B1, LPJmL
        3b permafrost {2 models} x {5 gcm}/future/  -> 140-token vocabulary (13,500 files)
        2b permafrost {4 models} x {4|2 gcm}/future/ -> 229-token vocabulary (11,170 files)
        3b biomes {JULES-ES-VN6P3 x5, CLASSIC x2, MC2-USFS x5, VISIT}/future/
        2b biomes -> 11 models, one GCM probed each
        3b water_global -> 10 models, one GCM probed each
        2b water_global -> 17 models, one GCM probed each
        3b DerivedOutputData -> Heinicke2026, Jaegermeyr2021, TipESM2025, Zantout2025
        2b DerivedOutputData -> Lange2020, Zimmer2023
    THE_SECTOR_TRAP: >
      READ THIS BEFORE TRUSTING ANY PERMAFROST MODEL COUNT. `thawdepth` is NOT confined to
      the `permafrost` sector, and walking only that sector understates the ensemble by
      more than half. Measured 2026-08-14: 3b `permafrost` holds 2 models of which only ONE
      (LPJmL5-7-10-fire) publishes thawdepth, while JULES-ES-VN6P3 and CLASSIC publish it in
      `biomes` and are absent from the permafrost sector entirely -- so the sector-only
      answer is "1 model, 5 members" and the true answer is "3 models, 12 members". Same in
      2b: JULES-ES-55 publishes thawdepth in `biomes` and is not in the permafrost sector.
      This is the mirror image of the "walk one sector, ingest one sector" rule: that rule
      is about DUPLICATES and remains true (see cross_sector_duplication), but it is a rule
      about what to INGEST, never about where to LOOK.
    representations:
      thawdepth_3b:
        path: "ISIMIP3b/OutputData/{permafrost|biomes|water_global}/{MODEL}/{gcm}/future/"
        publishing_models: >-
          LPJmL5-7-10-fire (5 GCMs, in permafrost+biomes+water_global);
          JULES-ES-VN6P3 (5 GCMs, biomes+water_global, NOT in permafrost);
          CLASSIC (2 GCMs -- gfdl-esm4, ukesm1-0-ll -- biomes+water_global, NOT in permafrost).
          ELM-ECA is in the permafrost sector and does NOT publish thawdepth (tsl/snd only).
        ensemble: >-
          At the one soc/sens combination all three share (2015soc-from-histsoc / default):
          12 members per scenario, 3 impact models x {5,5,2} CMIP6 GCMs.
          At 2015soc/default: 7 members, 2 models. At 1850soc/default: 5 members, 1 model.
        scenarios: "ssp126, ssp370, ssp585 for all three models (+picontrol). No ssp245."
        timestep: "annual (LPJmL5, JULES, CLASSIC) and monthly (JULES-ES-VN6P3 also)"
        span: "2015-2100"
        volume: "LPJmL5 6.7 MB, JULES 4.7 MB, CLASSIC 3.3 MB per annual file -> 36 files ~190 MB"
        sidecars: "NONE -- {stem}.json 404s in the permafrost sector (verified 2026-08-14, both GCMs sampled). Verify downloads by HTTP status/Content-Length, not sha512."
        extra_sens: "CLASSIC and JULES also publish ssp585-only nitrogen-deposition variants (nondep, nondep2015co2, ssp585ndep). Not members -- sensitivity runs."
      thawdepth_2b:
        path: "ISIMIP2b/OutputData/{permafrost|biomes|water_global}/{MODEL}/{gcm}/future/"
        publishing_models: >-
          CLM45 (4 GCMs), LPJmL (4), ORCHIDEE (4), ORCHIDEE-DGVM (2: gfdl-esm2m, ipsl-cm5a-lr)
          -- all four in the permafrost sector -- plus JULES-ES-55 (4 GCMs) which publishes
          thawdepth in `biomes`/`water_global` ONLY.
        ensemble: >-
          At uniform 2005soc/co2: rcp26 = 14 members / 4 models, rcp60 = 14 / 4,
          rcp85 = 8 / 2 (CLM45 + ORCHIDEE only).
          Accepting JULES-ES-55's scenario-tied soc (rcp26soc/rcp60soc -- it publishes NO
          2005soc): rcp26 = 18 / 5, rcp60 = 18 / 5, rcp85 unchanged at 8 / 2.
        scenarios: "rcp26, rcp60 for all five; rcp85 for CLM45 and ORCHIDEE only (+picontrol)"
        timestep: "annual (all five); monthly also for JULES-ES-55"
        span: "2006-2099"
        volume: "CLM45 2.7 MB, ORCHIDEE 4.3, ORCHIDEE-DGVM 4.5, JULES-ES-55 5.8, LPJmL 8.8 -> ~44 files ~230 MB"
        sidecars: "NONE -- {stem}.nc4.json 404s (verified 2026-08-14 on CLM45 rcp60). 2b sidecars are NOT universal; do not assume them from the Lange2020 publication."
      supporting_variables:
        tsl: >-
          Soil temperature by layer. 3b: ELM-ECA, LPJmL5-7-10-fire, JULES-ES-VN6P3, CLASSIC,
          MC2-USFS (annual, soc=nat), H08, JULES-W2, MIROC-INTEG-LAND. 2b: the four permafrost
          models plus JULES-ES-55, LPJ-GUESS, H08, JULES-W1, MATSIRO, VIC. Deeper than
          thawdepth in BOTH rounds -- but it carries a soil-layer dimension, so it is not a
          drop-in for a (decade, lat, lon) layer.
        soilmoistfroz: "Frozen soil moisture. 3b: LPJmL5, JULES-ES-VN6P3, CLASSIC, JULES-W2, MIROC-INTEG-LAND. 2b: CLM45, LPJmL, JULES-ES-55, MATSIRO."
        snd_swe: "Snow depth / snow water equivalent -- the insulating control on ground temperature, not a hazard variable."
    absent:
      solifluction: >-
        NO representation anywhere. Verified 2026-08-14 against the full 3b (140) and 2b (229)
        permafrost-sector variable vocabularies and the biomes/water_global probes: no slope,
        terrain, mass-movement, subsidence or soil-creep variable exists in any ISIMIP sector.
        The missing ingredient (slope + geotechnical properties) is not ISIMIP data at all, so
        this is a structural absence, not a gap to be closed by another listing.
      permafrost_extent: "No permafrost-area / permafrost-fraction / ground-ice variable is published. `thawdepth` is the only representation, and no domain mask ships with it."
      derived_index: >-
        No permafrost publication under DerivedOutputData in either round (verified
        2026-08-14 at publication-group level; Zantout2025/CLASSIC spot-checked one level
        deeper and publishes `wildfire` only). The Lange 2020 six-hazard family is drought,
        river flood, wildfire, crop failure, heatwave, tropical cyclone -- permafrost is not
        and never was a member, in either round.
    non_scenario_rounds: >-
      ISIMIP3a permafrost (ELM-ECA, LPJmL5-7-10-fire, ORCHIDEE-MICT under gswp3-w5e5,
      obsclim/counterclim, 1901-2019) and ISIMIP2a (IAPRAS-DSS/watch, JULES-B1/princeton,
      LPJmL under 4 forcings) are HISTORICAL ONLY -- `future/` does not exist. ORCHIDEE-MICT
      is a permafrost-specialised model found in NO other round; it publishes thawdepth, tsl
      and soilmoistfroz, and it can serve evaluation but cannot carry a scenario layer.
    watergap2_empty_dir: >-
      ISIMIP2b/OutputData/water_global/WaterGAP2/gfdl-esm2m/future/ returns HTTP 200 with a
      body containing only '../' -- a genuinely empty published directory, re-checked
      2026-08-14, not a rate-limit artifact. Irrelevant to this hazard (WaterGAP2 has no soil
      thermal physics) but recorded so the next harvest does not re-investigate it.
    data_nature_measured: >-
      INGESTED AND MEASURED 2026-08-14 (scripts/check_thawdepth_nature.py over all 36 files;
      raw evidence in data/raw/permafrost-isimip3b_thawdepth_annual/value_check.json).
      The download-time unknowns are now answered, and one of the answers disqualifies the
      obvious processing route.
        * units are uniformly `m`. `long_name` is "Annual Maximum Thaw Depth" (CLASSIC) and
          "Maximum Thaw Depth" (JULES, LPJmL), so the annual value IS a maximum -- active
          layer thickness, not an annual mean. `cell_methods` is ABSENT in all 36 files, so
          that reading rests on long_name alone.
        * A NON-PERMAFROST CELL IS PUBLISHED AT THE MODEL'S SOIL COLUMN DEPTH, not as NaN
          and not as 0. Nairobi and Paris read exactly the ceiling in all three models.
        * THE CEILING DIFFERS PER MODEL: CLASSIC 61.4 m, LPJmL 13.0 m, JULES 3.0 m. The
          point mass at it is 85.2% / 69.2% / 80.2% of finite cell-years respectively. The
          field is also censored at the bottom (exact 0 = never thaws: JULES 4.5%,
          LPJmL 2.6%, CLASSIC 0.3%), so it is DOUBLY censored with the informative signal
          in between.
        * THE RAW DEPTHS ARE THEREFORE NOT COMMENSURABLE ACROSS MODELS. Yakutsk in the
          2020s reads 8.03 m (CLASSIC), 2.995 m (JULES, i.e. already at 99.8% of its own
          3 m column) and 0.94 m (LPJmL). An ensemble median over those three is an average
          of three different soil discretisations, not a depth.
        * MEASUREMENT NOTE, kept because it nearly inverted the finding: a ceiling test with
          an ABSOLUTE 1e-4 tolerance reported LPJmL's at-ceiling share as 0.0% while its
          median sat on the ceiling -- that model's max is 13.001 and the pinned mass is at
          13.000. Any ceiling test on a float field needs relative slack.
    domain_measured: >-
      Permafrost domain proxied as "2020s annual maximum thaw stays strictly below the
      model's ceiling", area-weighted (cells shrink with latitude; a count is not comparable
      to anything published). Against Obu et al. 2019: ~14 M km2 permafrost AREA and ~21 M
      km2 permafrost REGION (probability > 0) in the Northern Hemisphere.
        CLASSIC        12.27 M km2 (2 members, range 12.02-12.51)  -- plausible
        JULES-ES-VN6P3 14.72 M km2 (5 members, range 12.62-15.67)  -- plausible
        LPJmL5-7-10-fire 29.08 M km2 (5 members, range 27.54-29.63) -- 2x the observed
                       permafrost area and ABOVE the whole permafrost region
      The 12 members agree far less than the totals suggest: only 7,563 cells (8.44 M km2)
      are called permafrost-bearing by all 12, while the >=1-member union is 30.95 M km2.
      For a SITE-level product that is the decisive number -- at a given customer site the
      models frequently disagree on whether permafrost exists at all.
      Reference sites: CLASSIC misses Tibetan-plateau permafrost entirely (Nagqu pinned at
      ceiling throughout) and JULES is effectively censored across the continuous-permafrost
      belt (Yakutsk 2.995 -> 2.998 m against a 3 m column).
    open_decisions:
      representation: >-
        THE BLOCKING DECISION, and it is a framing question, not a defect. The raw depth
        cannot be pooled across models (see data_nature_measured). What IS commensurable is
        the binary PRESENCE of permafrost -- "did the column stay partly frozen this year" --
        which each model answers on its own column. Turning the published depth into a
        presence frequency is CONSTRUCTING AN INDEX (GUARDRAILS 1-2), not aggregating one,
        so it needs the user's decision. The alternatives are a per-model normalised depth
        (bounded but still not physically comparable: 0.5 of 3 m is not 0.5 of 61.4 m), a
        single-model depth layer (keeps metres, loses structural uncertainty, and each
        candidate model has a measured defect), or recording the hazard as unassessable.
      trend_censoring: >-
        Where a cell has lost its permafrost the depth pins at the ceiling and BOTH slopes go
        to ~0 -- reading as "no trend" and meaning "no permafrost left". The two-slope
        disagreement rule does not rescue this, the same way it did not rescue `heatwave`.
      classic_time_varying_mask: >-
        All 6 CLASSIC files have a TIME-VARYING finite mask; the other 30 do not. Any loader
        must not assume a time-invariant footprint for this layer.
      off_land_cells: >-
        The finite-ever union is 71,251 cells (27.5% of the grid -- a land footprint, not the
        `floodedarea` ocean leak), of which 5,454 fall off the ISIMIP3b land-sea mask. That is
        larger than the shipped `driedarea` (1,236) and `led` (46) and is not yet explained.
      round_tradeoff: >-
        3b = newer forcing, SSPs, 3 models / 12 members, uniform soc available at no cost.
        2b = 5 models / 18 members at rcp26+rcp60 but only 2 models / 8 members at rcp85, and
        the fifth model costs soc uniformity. Neither dominates; this is a user decision.
      dedup_mandatory: >-
        thawdepth files are republished byte-identically across sectors. VERIFIED 2026-08-14:
        2b CLM45 rcp60 permafrost vs biomes matched on Content-Length (2,714,904) AND ETag
        ("5c3c5fab-296d18"); 3b LPJmL5 ssp370 permafrost vs biomes matched on 6,697,198 /
        "6899d4e4-6630ee". Ingesting from two sectors would double-weight those models.

  # -------------------------
  # soil / subsurface carbon searches (biomes sector)
  # -------------------------
  soil_carbon:
    last_searched: "2026-07-25"
    description: "Subsurface / root-zone carbon. Lives in the biomes sector as carbon-pool STATE variables; there is no dedicated soil sector. Enumerate STOCKS (csoil soil, croot/cvegbg root-zone) vs the net-sink FLUX (nbp)."
    note: "Catalog's biomes_models variable lists were INCOMPLETE for carbon -> enumerated the file server directly (11 ISIMIP2b + 5 ISIMIP3b biomes models). The data.isimip.org API is behind Anubis anti-bot -> use files.isimip.org + curl (WebFetch truncates long listings). See GUARDRAILS §8."
    variables:
      csoil: "Soil organic carbon stock (kg C m-2) -- the direct subsurface storage pool. Bulk = 'csoil-total' (CLASSIC PFT-split, JULES RothC pool-split, MC2 single)."
      croot: "Root biomass carbon (kg C m-2). ISIMIP3b only; NOT in ISIMIP2b future runs."
      cvegbg: "Below-ground vegetation carbon (roots + below-ground woody); cvegag = above-ground. ISIMIP2b: JULES-ES-55, MC2-USFS. ISIMIP3b: CLASSIC, JULES, MC2, ELM-ECA."
      nbp: "Net Biome Production = net land carbon-sink flux (kg C m-2 s-1) = sequestration RATE. ISIMIP3b (all 5 biomes models); NOT in ISIMIP2b future."
    availability:
      isimip2b:  # RCP26/60/85, CMIP5; csoil broad but NO croot/nbp in future runs
        csoil_models: ["lpj-guess", "lpjml", "orchidee", "orchidee-dgvm", "caraib", "dlem", "jules-es-55", "mc2-usfs", "visit(monthly)"]  # ~8 annual + visit monthly
        cvegbg_models: ["jules-es-55", "mc2-usfs"]
        croot: "absent (future runs)"
        nbp: "absent (future runs)"
      isimip3b:  # SSP126/370/585, CMIP6 -- the FULL below-ground story
        csoil_annual: ["classic", "jules-es-vn6p3", "mc2-usfs"]   # + elm-eca, visit monthly-only
        croot_annual: ["classic", "jules-es-vn6p3", "mc2-usfs"]   # + elm-eca monthly
        cvegbg_annual: ["classic", "jules-es-vn6p3", "mc2-usfs"]  # + elm-eca monthly
        nbp: ["classic", "jules-es-vn6p3", "mc2-usfs", "elm-eca", "visit"]
    chosen: "csoil-total, ISIMIP3b, annual, {ssp126,ssp370,ssp585}. 12 members/scenario = classic(2 GCMs) + jules-es-vn6p3(5) + mc2-usfs(5). Raw kg C m-2, NO normalization (comparable magnitudes, same unit), NO spatial smoothing (thick), higher_is_better (risk=loss, percentile INVERTED), baseline-anchored trend. Layer starts at 2020s baseline (3b begins 2015)."
    co2_treatment: "MIXED (user decision 2026-07-25 to retain 12 members): jules-es-vn6p3 publishes ONLY the fixed-2015-CO2 (2015co2) csoil run; classic/mc2-usfs are transient (default). JULES's soil-C trend is muted (no fertilization). Land use fixed: 2015soc-from-histsoc (classic/jules) / nat (mc2-usfs). See GUARDRAILS §9."
    data_nature: |
      All 3 models report kg C m-2 with COMPARABLE magnitudes (2020s medians ~5.8/7.7/10.3), value-checked 2026-07-25:
      classic         kg C m-2  median 5.76  max 70.3  zeros 4.48% (desert/ice)  calendar=365_day
      jules-es-vn6p3  kg C m-2  median 10.28 max 67.9  zeros 0.00%               calendar=proleptic_gregorian
      mc2-usfs        kg C m-2  median 7.67  max 37.8  zeros 0.00% (coarse biome model, nat soc)  calendar=365_day
      Time axis 'days since 1601' for ALL; only the calendar differs -> calendar-aware year parse.
    processed: "2026-07-25 -> TCFD layer. scripts/process_csoil_soilcarbon.py; data/processed/soilcarbon_csoil_annual/csoil_{ssp126,ssp370,ssp585}_processed.nc. Verified: CI ordering 100%, baseline bit-identical, trend<->change corr 1.0, global-mean csoil +1.1% ssp126 / -1.4% ssp370 / -2.2% ssp585 by 2090s. See memory project_csoil_soilcarbon_layer, WORKFLOW-ISSUES.md 2026-07-25, GUARDRAILS §8-§9."

