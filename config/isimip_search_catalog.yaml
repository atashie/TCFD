      publication: "ISIMIP3b/DerivedOutputData/Jaegermeyr2021/"
      path: "{MODEL}/{gcm}/future/"
      enumerated: "2026-08-13 -- 12 model listings + 57 future/ listings; 636 files"
      note: "NOT a failure index -- a signed relative yield change. Deriving `failure` from it is a threshold decision (GUARDRAILS 1-2). Percentile would need higher_is_better."
      variables: ["yieldchange-mai", "yieldchange-ric", "yieldchange-soy", "yieldchange-whe"]  # 4 crops, named per crop
      impact_models: ["acea", "crover", "cygma1p74", "dssat-pythia", "epic-iiasa", "isam", "ldndc", "lpjml", "pdssat", "pepic", "promet", "simplace-lintul5"]  # 12
      climate_forcings: "5 CMIP6 each EXCEPT acea (mri-esm2-0, ukesm1-0-ll only)"
      scenarios: ["ssp126", "ssp370", "ssp585"]
      matrix_per_crop: "57 members at ssp126 and ssp585; 45 at ssp370."
      scenario_asymmetry: >
        ACEA, pDSSAT and SIMPLACE-LINTUL5 publish NO ssp370. Ensemble composition therefore
        DIFFERS across scenarios, unlike `cropfailure` and `lec`. Either drop those 3 models
