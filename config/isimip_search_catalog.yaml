          scenario      nGCM  tasmax  span            note
          hist-nat       6     6/6    1850-2020       counterfactual, no-forcing
          historical     9     7/9    1850-2014
          ssp119         4     4/4    2015-2100       hurs only 3/4
          ssp126         9     7/9    2015-2100
