# -----------------------------------------------------------------------------
# BIOMES SECTOR - COMPLETE MODEL REGISTRY
# -----------------------------------------------------------------------------
# This section documents ALL biomes models across simulation rounds with their
# PFT (Plant Functional Type) naming schemes. Different models use different
# PFT classifications - some generic, some climate-zone specific.
#
# ALWAYS CHECK MULTIPLE MODELS when searching for vegetation data.
# Generic PFTs (like CLASSIC's evgndltr) may miss climate-specific data.

biomes_models:

  isimip3b:
    CLASSIC:
      full_name: "Canadian Land Surface Scheme Including Biogeochemical Cycles"
      impactmodels_url: "https://www.isimip.org/impactmodels/details/170/"
      pft_scheme: "generic"
      pft_naming: "short-code"
      climate_specificity: "NONE - all needleleaf combined"
      pfts:
        evgndltr: "Evergreen needleleaf trees (ALL conifers - boreal AND temperate)"
        dcdndltr: "Deciduous needleleaf trees (larch)"
        evgbdltr: "Evergreen broadleaf trees"
        dcdcldbdltr: "Deciduous cold-climate broadleaf trees (temperate hardwoods)"
        dcddrybdltr: "Deciduous dry-climate broadleaf trees"
        c3grass: "C3 grasses"
        c4grass: "C4 grasses"
        c3crop: "C3 crops"
        c4crop: "C4 crops"
        total: "All PFTs combined"
      variables: ["cwood", "cleaf", "cveg", "cvegag", "cvegbg", "npp", "gpp", "lai",
                  "pft", "ra", "rh", "burntarea", "csoil-total"]
      climate_forcings: ["GFDL-ESM4", "UKESM1-0-LL"]   # CORRECTED 2026-07-28: only 2 GCMs
      # The other three (MPI-ESM1-2-HR, IPSL-CM6A-LR, MRI-ESM2-0) have NO `future/` directory
      # for CLASSIC in the biomes sector -- a real 404, not an empty listing.
      scenarios: ["ssp126", "ssp370", "ssp585", "picontrol"]
      period: "2015-2100"
      value_convention: "PER-TILE DENSITY; pft- fractions are 0-1 despite units '%'"
      notes: |
        WARNING: No climate-zone distinction in PFTs.
        'evgndltr' includes BOTH boreal spruce AND temperate pine -- measured, 34.6% of its
        global wood sits in the 55-70N band and 29.4% in the subtropical 23-40N band.
        For climate-specific analysis use CLM45/ORCHIDEE/LPJmL/CARAIB from ISIMIP2b --
        NOT MC2-USFS, which publishes no carbon by biome type (see its entry).
        42.6% of land cells are zero for cwood-evgndltr (PFT absent).

    JULES-ES-VN6P3:
      # ADDED 2026-07-28 -- this model was entirely missing from the catalog, yet it is the
      # DEEPEST 3b source of PFT-resolved wood carbon (5 GCMs vs CLASSIC's 2).
      full_name: "Joint UK Land Environment Simulator - Earth System, vn6.3"
      pft_scheme: "generic conifers, climate-split broadleaf"
      pft_naming: "short-code"
      climate_specificity: "PARTIAL - broadleaf evergreen is split temperate/tropical,
                            needleleaf evergreen is NOT split"
      pfts:
        ndlevg: "Needleleaf evergreen trees (ALL conifers - boreal AND temperate)"
        ndldcd: "Needleleaf deciduous trees (larch)"
        bdldcd: "Broadleaf deciduous trees"
        bdlevgtemp: "Broadleaf evergreen trees, TEMPERATE (a hardwood class, NOT a conifer)"
        bdlevgtrop: "Broadleaf evergreen trees, tropical"
        shrubevg: "Evergreen shrubs"
        shrubdcd: "Deciduous shrubs"
        c3grass: "C3 grasses"
        c4grass: "C4 grasses"
        c3crop: "C3 crops"
        c4crop: "C4 crops"
        c3pasture: "C3 pasture"
        c4pasture: "C4 pasture"
        total: "All PFTs combined"
        # non-vegetation tiles also published: pft-soil, pft-ice, pft-lake, pft-urban
      variables: ["cwood", "cveg", "cvegag", "cvegbg", "cleaf", "npp", "gpp", "lai",
                  "pft", "csoil-total"]
      climate_forcings: ["GFDL-ESM4", "IPSL-CM6A-LR", "MPI-ESM1-2-HR", "MRI-ESM2-0", "UKESM1-0-LL"]
      scenarios: ["ssp126", "ssp370", "ssp585"]   # no picontrol for cwood
      soc: ["2015soc-from-histsoc"]
      period: "2015-2100"
      value_convention: "PER-TILE DENSITY; closure sum(frac*value)/total = 1.000 exactly;
                         13 veg + 4 non-veg tiles sum to exactly 100%"
      notes: |
        cwood-ndlevg publishes BOTH `default` (transient CO2) and `2015co2` at all three SSPs.
        This differs from csoil-total, where JULES publishes ONLY the fixed-CO2 run -- so the
        CO2 caveat recorded for the soil-carbon layer does NOT transfer to cwood. Check per
        variable, not per model.
        Only 4.5% of land cells are zero, so JULES reports a per-tile density almost
        everywhere -- including where the PFT is implausible (cwood-bdlevgtemp reads
        p50 10.1 kg m-2 in the UK on 2.8% cover). Non-zero density is not evidence of presence.

  isimip3a:
    MC2-USFS:
      full_name: "MC2 Dynamic Global Vegetation Model - US Forest Service"
      impactmodels_url: "https://www.isimip.org/impactmodels/details/282/"
      pft_scheme: "biome-specific"
      pft_naming: "concatenated-lowercase"
      climate_specificity: "DETAILED - 47 biome-specific PFTs"
      pfts:
        # Needleleaf forest types (best for conifer analysis)
        borealneedleleafforest: "Boreal needleleaf forest"
        subalpineforest: "Subalpine forest"
        maritimeevergreenneedleleafforest: "Maritime evergreen needleleaf forest"
        mesictemperateneedleleafforest: "Mesic temperate needleleaf forest (LOBLOLLY PINE PROXY)"
        moisttemperateneedleleafforest: "Moist temperate needleleaf forest"
        drytemperateneedleleafforest: "Dry temperate needleleaf forest"
        subtropicalevergreenneedleleafforest: "Subtropical evergreen needleleaf forest (SE US PROXY)"
        subtropicalevergreenneedleleafwoodland: "Subtropical evergreen needleleaf woodland"
        temperateevergreenneedleleafwoodland: "Temperate evergreen needleleaf woodland"
        xericneedleleafwoodland: "Xeric needleleaf woodland"
        # Boreal types
        borealdeciduousforest: "Boreal deciduous forest"
        borealwoodland: "Boreal woodland"
        # Temperate broadleaf types
        temperatedeciduousbroadleafforest: "Temperate deciduous broadleaf forest"
        temperatedeciduousbroadleafwoodland: "Temperate deciduous broadleaf woodland"
        coolmixedforest: "Cool mixed forest"
        temperatewarmmixedforest: "Temperate warm mixed forest"
        # Subtropical types
        subtropicaldeciduousbroadleafforest: "Subtropical deciduous broadleaf forest"
        subtropicalmixedforest: "Subtropical mixed forest"
        subtropicalevergreenbroadleafwoodland: "Subtropical evergreen broadleaf woodland"
        # Tropical types
        tropicalevergreenbroadleafforest: "Tropical evergreen broadleaf forest"
        # Grasslands and shrubs
        c3grassland: "C3 grassland"
        c4grassland: "C4 grassland"
        c3shrub: "C3 shrub"
        # Deserts
        temperatedesert: "Temperate desert"
        subtropicaldesert: "Subtropical desert"
      variables: ["cwood", "cveg", "cvegag", "cvegbg", "cleaf", "croot", "csoil", "clitterag", "npp", "nbp", "lai", "burntarea", "ffire"]
      climate_forcings: ["20crv3", "20crv3-era5", "20crv3-w5e5", "gswp3-w5e5"]
      scenarios: ["obsclim", "counterclim"]  # Historical only - no future projections
      period: "1901-2019"
      notes: |
        READ THIS BEFORE REACHING FOR MC2's BIOME NAMES. Corrected 2026-07-28.
        The 47 biome types are published ONLY as `pft-{biome}` fields, and they are
        ONE-HOT PRESENCE FLAGS: values are exactly 0 or 100 (MC2 assigns a single dominant
        biome per cell), despite units "%" and long_name "Plant Functional Type Grid Fraction".
        MC2's CARBON and NPP output is NOT resolved by biome type -- it is only
        `-total`, `-tree`, `-grass` (cveg-total, cvegag-total, cwood-total, npp-tree, ...).
        So there is NO WAY to get biome-specific cwood/cveg/npp from MC2, in any round.
        The previous line "For loblolly pine: use 'mesictemperateneedleleafforest'" was
        therefore not actionable, and is withdrawn.
        WORSE, for maritime conifers: `pft-maritimeevergreenneedleleafforest` is IDENTICALLY
        ZERO in every run checked -- 3b ssp370/gfdl-esm4, 3b ssp126/ukesm1-0-ll, and
        3a obsclim historical (7,008,981 finite values, all 0). MC2's global configuration
        never realizes that class, so it cannot serve as a Sitka-spruce biome proxy.
        Non-zero shares for reference (3b ssp370/gfdl): borealneedleleafforest 12.0%,
        mesictemperateneedleleafforest 6.7%, temperatedeciduousbroadleafforest 4.0%.
        Useful only as a categorical biome MASK, never as a productivity signal.
        3a is historical only; MC2 DOES have 3b futures (5 GCMs, ssp126/370/585) -- but
        still only with -total/-tree/-grass carbon.

    CLM45:
      full_name: "Community Land Model 4.5"
      impactmodels_url: "https://www.isimip.org/impactmodels/details/198/"
      pft_scheme: "climate-zone"
      pft_naming: "hyphenated-descriptive"
      climate_specificity: "GOOD - temperate vs boreal distinction"
      pfts:
        needleleaf-evergreen-tree-temperate: "Temperate needleleaf evergreen tree (LOBLOLLY PINE PROXY)"
        needleleaf-evergreen-tree-boreal: "Boreal needleleaf evergreen tree"
        needleleaf-deciduous-tree-boreal: "Boreal needleleaf deciduous tree (larch)"
        broadleaf-evergreen-tree-tropical: "Tropical broadleaf evergreen tree"
        broadleaf-evergreen-tree-temperate: "Temperate broadleaf evergreen tree"
        broadleaf-deciduous-tree-tropical: "Tropical broadleaf deciduous tree"
        broadleaf-deciduous-tree-temperate: "Temperate broadleaf deciduous tree"
        broadleaf-deciduous-tree-boreal: "Boreal broadleaf deciduous tree"
        broadleaf-evergreen-shrub-temperate: "Temperate broadleaf evergreen shrub"
        broadleaf-deciduous-shrub-temperate: "Temperate broadleaf deciduous shrub"
        broadleaf-deciduous-shrub-boreal: "Boreal broadleaf deciduous shrub"
        c3-arctic-grass: "C3 arctic grass"
        c3-non-arctic-grass: "C3 non-arctic grass"
        c4-grass: "C4 grass"
      variables: ["cveg", "gpp", "npp", "lai", "trans"]
      climate_forcings: ["20crv3-era5", "20crv3-w5e5"]
      scenarios: ["obsclim", "counterclim"]  # Historical only in ISIMIP3a
      period: "1901-2019"
      notes: |
        Good climate-zone specificity with temperate vs boreal PFTs.
        ISIMIP3a has historical data only.
        See ISIMIP2b CLM45 for future projections (RCP scenarios).

    VISIT:
      full_name: "Vegetation Integrative SImulator for Trace gases"
      impactmodels_url: "https://www.isimip.org/impactmodels/details/129/"
      pft_scheme: "aggregated"
      pft_naming: "none - aggregated output"
      climate_specificity: "NONE - outputs not PFT-specific"
      variables: ["npp", "gpp", "cveg", "csoil", "lai", "burntarea", "evap", "rh"]
      notes: "Output variables are aggregated across all vegetation types, not PFT-specific."

  isimip2b:
    CLM45:
      full_name: "Community Land Model 4.5"
      impactmodels_url: "https://www.isimip.org/impactmodels/details/27/"
      pft_scheme: "climate-zone"
      pft_naming: "hyphenated-descriptive"
      climate_specificity: "GOOD - temperate vs boreal distinction"
      pfts:
        needleleaf-evergreen-tree-temperate: "Temperate needleleaf evergreen tree"
        needleleaf-evergreen-tree-boreal: "Boreal needleleaf evergreen tree"
        needleleaf-deciduous-tree-boreal: "Boreal needleleaf deciduous tree"
        broadleaf-evergreen-tree-tropical: "Tropical broadleaf evergreen tree"
        broadleaf-evergreen-tree-temperate: "Temperate broadleaf evergreen tree"
        broadleaf-deciduous-tree-tropical: "Tropical broadleaf deciduous tree"
        broadleaf-deciduous-tree-temperate: "Temperate broadleaf deciduous tree"
        broadleaf-deciduous-tree-boreal: "Boreal broadleaf deciduous tree"
      variables: ["cveg", "gpp", "npp", "lai", "trans", "burntarea"]
      climate_forcings: ["GFDL-ESM2M", "HadGEM2-ES", "IPSL-CM5A-LR", "MIROC5"]
      scenarios: ["rcp26", "rcp60", "rcp85", "picontrol", "historical"]
      period: "2006-2099 (future), 1661-1860 (picontrol)"
      notes: |
        BEST for future projections with climate-zone specificity.
        Has RCP scenarios (2006-2099) with 4 GCMs.
        For loblolly pine: use 'needleleaf-evergreen-tree-temperate'

    LPJmL:
      full_name: "Lund-Potsdam-Jena managed Land"
      impactmodels_url: "https://www.isimip.org/impactmodels/details/81/"
      pft_scheme: "climate-zone"
      pft_naming: "hyphenated-descriptive"
      climate_specificity: "GOOD - temperate vs boreal distinction"
      pfts:
        tropical-broadleaved-evergreen-tree: "Tropical broadleaved evergreen tree"
        tropical-broadleaved-raingreen-tree: "Tropical broadleaved raingreen tree"
        temperate-needleleaved-evergreen-tree: "Temperate needleleaved evergreen tree"
        boreal-needleleaved-evergreen-tree: "Boreal needleleaved evergreen tree"
        temperate-broadleaved-evergreen-tree: "Temperate broadleaved evergreen tree"
        temperate-broadleaved-summergreen-tree: "Temperate broadleaved summergreen tree"
        boreal-broadleaved-summergreen-tree: "Boreal broadleaved summergreen tree"
        boreal-needleleaved-summergreen-tree: "Boreal needleleaved summergreen tree (larch)"
      variables: ["pft"]  # Fractional cover output
      climate_forcings: ["GFDL-ESM2M", "HadGEM2-ES", "IPSL-CM5A-LR", "MIROC5"]
      scenarios: ["rcp26", "rcp60", "rcp85"]
      period: "2006-2299"
      sector: "permafrost"  # PFT data in permafrost sector, not biomes
      notes: |
        PFT fractional cover data available in permafrost sector.
        Extended period to 2299 for some scenarios.
        For loblolly pine: use 'temperate-needleleaved-evergreen-tree'

    CARAIB:
      full_name: "CARbon Assimilation In the Biosphere"
      impactmodels_url: "https://www.isimip.org/impactmodels/details/11/"
      pft_scheme: "functional-detailed"
      pft_naming: "abbreviation"
      climate_specificity: "PARTIAL - functional types, not climate zones"
      pfts:
        # Broadleaf types (brev = broadleaf evergreen, brsu = broadleaf summergreen)
        brevdtt: "Broadleaved evergreen drought-tolerant tropical"
        brevtrt: "Broadleaved evergreen tropical rainforest"
        brevstdit: "Broadleaved evergreen subtropical drought-intolerant"
        brevtecds: "Broadleaved evergreen temperate cool dry summer"
        brevtewms: "Broadleaved evergreen temperate warm moist summer"
        brsutecds: "Broadleaved summergreen temperate cool dry summer"
        brsutecdt: "Broadleaved summergreen temperate cool dry temperate"
        # Needleleaf types (NOT in published output - broadleaf focus)
        # Grass types
        c3dh: "C3 herbs dry"
        c3hh: "C3 herbs humid"
        c4h: "C4 herbs"
        c3p: "C3 pasture"
        c4p: "C4 pasture"
      variables: ["npp", "cveg", "gpp", "burntarea", "clitter", "csoil"]
      climate_forcings: ["GFDL-ESM2M", "HadGEM2-ES", "IPSL-CM5A-LR", "MIROC5"]
      scenarios: ["rcp26", "rcp60", "rcp85", "picontrol"]
      notes: |
        Different PFT naming scheme than CLM45/LPJmL.
        CORRECTED 2026-07-28: this entry previously said "needleleaf PFTs defined but not in
        output -- use for broadleaf analysis, not conifers". WRONG. CARAIB 2b publishes SEVEN
        needleleaf classes for BOTH cveg and npp (plus pft- cover fractions):
          ndevtecdt, ndevteclt, ndevtedtt, ndevtedttht, ndevstdit  (evergreen)
          ndsutecdt, ndsustswt                                     (summergreen = DECIDUOUS)
        The codes carry NO long_name at all (attribute absent), so they were identified by
        cover-weighted biogeography instead:
          ndevteclt   -> peaks 40-55N (48.2%)      = the genuine TEMPERATE needleleaf evergreen
          ndevtecdt   -> peaks 55-70N (65.0%)      = BOREAL, despite "te" in the code
          ndevstdit / ndevtedtt / ndevtedttht      = subtropical / S-hemisphere
        TWO DISQUALIFIERS for pooling (see pft_value_conventions):
          - values are PER-GRIDCELL (already cover-scaled), unlike ORCHIDEE/CLM45/JULES/CLASSIC
          - effective resolution ~1-2 deg: 49% of non-zero 2x2 blocks and 35% of 4x4 blocks
            are exactly constant (controls: JULES 8.5%, CLASSIC 2.4%). GUARDRAILS section 11.
        Also: no rcp85 for the PFT-resolved fields (rcp26/rcp60 only).

# -----------------------------------------------------------------------------
# CROSS-MODEL PFT EQUIVALENCE TABLE
# -----------------------------------------------------------------------------
# Maps equivalent PFT concepts across different model naming schemes.
# Use for multi-model ensemble analysis or when comparing model outputs.
#
# Equivalence is APPROXIMATE - models have different biophysical parameters.
# Always note the source model when reporting results.

pft_equivalences:

  temperate_needleleaf_evergreen:
    description: "Temperate zone evergreen conifers (pines, firs, Douglas fir)"
    example_species: ["loblolly pine", "Douglas fir", "ponderosa pine", "longleaf pine"]
    climate_zone: "Humid subtropical to warm temperate (25-45N latitude)"
    model_codes:
      # NOT INTERCHANGEABLE. Each row is a different model's own PFT with its own
      # parameter set, value convention and effective grid. Verified 2026-07-28.
      CLASSIC: "evgndltr"        # NOT temperate -- all-climate conifer (34.6% of its wood is 55-70N)
      JULES-ES-VN6P3: "ndlevg"   # NOT temperate -- all-climate conifer (29.3% is 55-70N)
      CLM45: "needleleaf-evergreen-tree-temperate"     # genuinely temperate: 44.6% 23-40N + 47.9% 40-55N
      LPJmL: "temperate-needleleaved-evergreen-tree"   # npp/gpp/pft only -- NO cveg per PFT
      ORCHIDEE: "tendev"         # warm-temperate leaning: 43.4% 23-40N, only 18.8% 40-55N
      ORCHIDEE-DGVM: "tendev"    # same model family as ORCHIDEE -- correlated, not independent
      CARAIB: "ndevteclt"        # temperate one of 7 needleleaf classes; ndevtecdt is BOREAL
      MC2-USFS: null             # NOT AVAILABLE -- biome names are one-hot presence flags,
                                 # carbon/NPP is -total/-tree/-grass only. See MC2 notes.
    variable_availability:
      cwood: "ISIMIP3b ONLY, and ONLY for the all-climate classes (CLASSIC evgndltr,
              JULES ndlevg). No temperate-resolved conifer PFT carries cwood in any round."
      cveg: "2b: CLM45, ORCHIDEE, ORCHIDEE-DGVM, CARAIB. NOT LPJmL."
      npp:  "2b: all of the above plus LPJmL. 3b: CLASSIC (monthly only) + JULES (annual)."
    best_for_loblolly_pine:
      # first_choice previously named MC2-USFS -- WITHDRAWN 2026-07-28, not actionable
      # (MC2 publishes no carbon by biome type).
      with_future_scenarios: "CLM45 ISIMIP2b needleleaf-evergreen-tree-temperate, but note
                              its PFT coverage is ragged: 2 GCMs at rcp26, 1 transient + 1
                              fixed-CO2 at rcp60, 2 at rcp85. Deepen with ORCHIDEE tendev (4 GCMs)."
      generic_fallback: "CLASSIC evgndltr or JULES ndlevg (both include boreal data)"
    notes: |
      A generic class is NOT an internally-weighted mixture of climate-specific conifers.
      `evgndltr`/`ndlevg` are each a SINGLE PFT with ONE global parameter set; the only
      per-cell variation is the cover fraction and the climate forcing. Proof from the data:
      JULES splits broadleaf evergreen into bdlevgtemp/bdlevgtrop (two tiles, two parameter
      sets) but publishes a single ndlevg. So the cost of a generic class is a shared
      parameterisation, and the climate-zone mixing bites at the RANKING step (percentile-of-
      score ranks a cell against a global distribution spanning boreal to subtropical), not
      in the raw per-cell values.
      SPECIES-DEPENDENT TRADE-OFF: climate-zone specificity helps a single-zone species like
      loblolly, but FRAGMENTS a hyper-oceanic species that straddles zones (e.g. Sitka spruce).
      Measured: LPJmL temperate-NLE covers UK/Ireland (774/774 cells) but only 609/2451 in
      PNW-BC-SEAK; LPJ-GUESS boreal-NLE covers PNW (1866 cells) but just 6 in the UK; the
      generic classes cover both ends (CLASSIC 642/906 UK and 2394/2412 PNW; JULES 795/795
      and 2376/2433). Choose the axis that matches the target species' range.

  boreal_needleleaf_evergreen:
    description: "Boreal zone evergreen conifers (spruce, fir)"
    example_species: ["black spruce", "white spruce", "Norway spruce", "balsam fir"]
    climate_zone: "Boreal/taiga (50-70N latitude)"
    model_codes:
      CLASSIC: "evgndltr"  # WARNING: same code as temperate - no distinction!
      CLM45: "needleleaf-evergreen-tree-boreal"
      LPJmL: "boreal-needleleaved-evergreen-tree"
      MC2-USFS: "borealneedleleafforest"
    notes: |
      CLASSIC does NOT distinguish boreal from temperate needleleaf.
      For boreal-specific analysis, use CLM45, LPJmL, or MC2-USFS.

  temperate_deciduous_broadleaf:
    description: "Temperate zone deciduous hardwoods"
    example_species: ["white oak", "red oak", "beech", "maple", "hickory"]
    climate_zone: "Temperate (35-50N latitude)"
    model_codes:
      CLASSIC: "dcdcldbdltr"  # "cold-climate" = temperate
      CLM45: "broadleaf-deciduous-tree-temperate"
      LPJmL: "temperate-broadleaved-summergreen-tree"
      MC2-USFS: "temperatedeciduousbroadleafforest"
      CARAIB: "brsutecdt"
    notes: |
      Good cross-model agreement for this PFT.
      CLASSIC 'dcdcldbdltr' is closest proxy for temperate oak.

  boreal_deciduous_broadleaf:
    description: "Boreal zone deciduous broadleaf"
    example_species: ["aspen", "birch"]
    climate_zone: "Boreal (50-65N latitude)"
    model_codes:
      CLASSIC: "dcdcldbdltr"  # WARNING: same as temperate deciduous
      CLM45: "broadleaf-deciduous-tree-boreal"
      LPJmL: "boreal-broadleaved-summergreen-tree"
      MC2-USFS: "borealdeciduousforest"

  tropical_evergreen_broadleaf:
    description: "Tropical rainforest evergreen trees"
    example_species: ["mahogany", "kapok", "rubber tree"]
    climate_zone: "Tropical (0-23N/S latitude)"
    model_codes:
      CLASSIC: "evgbdltr"
      CLM45: "broadleaf-evergreen-tree-tropical"
      LPJmL: "tropical-broadleaved-evergreen-tree"
      MC2-USFS: "tropicalevergreenbroadleafforest"
      CARAIB: ["brevtrt", "brevdtt"]
    notes: |
      CARAIB distinguishes drought-tolerant vs rainforest tropical.

  needleleaf_deciduous:
    description: "Deciduous conifers (larch)"
    example_species: ["Siberian larch", "European larch", "tamarack"]
    climate_zone: "Boreal (50-70N latitude)"
    model_codes:
      CLASSIC: "dcdndltr"
      CLM45: "needleleaf-deciduous-tree-boreal"
      LPJmL: "boreal-needleleaved-summergreen-tree"
      MC2-USFS: null  # Not a separate category
    notes: "Primarily larch species. MC2-USFS doesn't separate deciduous needleleaf."

# -----------------------------------------------------------------------------
# PFT VALUE CONVENTIONS  (verified 2026-07-28 -- read before pooling PFT fields)
# -----------------------------------------------------------------------------
# A PFT-resolved carbon/NPP field is reported in ONE OF TWO INCOMPATIBLE WAYS, and the
# choice is per-model. Pooling the two without harmonizing mixes different quantities.
#
#   PER-TILE DENSITY   value is the density on the PFT's OWN tile area, independent of how
#                      much of the cell it covers. Recover the cell total as
#                      sum_i(frac_i * value_i). Reads as "what this PFT would carry here".
#   PER-GRIDCELL       value is already multiplied by cover, so it is the cell's share.
#                      Convert to per-tile by DIVIDING by the cover fraction.
#
# Test that settles it in two file reads: if the PFT field ever EXCEEDS the all-PFT total,
# it is per-tile. Confirm with the closure sum(frac*value)/total == 1.
pft_value_conventions:
  per_tile_density:
    CLASSIC (3b):        "closure exact; pft- fractions are 0-1 DESPITE units '%'"
    JULES-ES-VN6P3 (3b): "closure exact (p05=p50=p95=1.000); pft- is true %; 13 veg +
                          4 non-veg tiles (soil/ice/lake/urban) sum to exactly 100%"
    ORCHIDEE (2b):       "closure exact; pft- is 0-1 despite units '%'"
    ORCHIDEE-DGVM (2b):  "same as ORCHIDEE"
    CLM45 (2b):          "PFT > total in 94.4% of cells, ratio p50 2.28 -- per-tile, BUT
                          CLM45 PUBLISHES NO pft- FRACTION AT ALL, so it can never be
                          converted to per-gridcell and its cover is unknowable from output"
  per_gridcell:
    CARAIB (2b): "cveg p50 = 0 where cover <1%; pft- is true % (max 97.7)"
    LPJmL (2b):  "PFT never exceeds total; cells with cover <1% carry ~10x smaller values.
                  Cover is healthy in maritime-conifer regions (p50 27.3% UK/IRL,
                  56.6% PNW-BC-SEAK -> only 4x / 2x amplification when dividing), but
                  globally 61.8% of its non-zero cells sit below 1% cover (528x at p50),
                  so a cover floor is required when converting."
  metadata_traps:
    - "CLASSIC and ORCHIDEE label pft- as '%' but store 0-1 fractions. Do not trust the unit;
       check whether the fractions sum to 1 or to 100."
    - "ORCHIDEE cveg-* long_name reads 'crop biomass yield' for every PFT -- an ncrename
       artifact (visible in the file's own history attribute). The data are fine."
    - "CARAIB carries NO long_name attribute at all on its PFT fields."
    - "ISIMIP2b files use the .nc4 extension; ISIMIP3b uses .nc. A regex like '\\.nc'
       silently truncates 2b filenames and every URL then 404s."
    - "LPJmL and ORCHIDEE publish the same PFT cveg/npp under BOTH `biomes` and `permafrost`.
       Compare checksums before ingesting both (GUARDRAILS section 8)."

# -----------------------------------------------------------------------------
# TEMPERATE NEEDLELEAF EVERGREEN ENSEMBLE, ISIMIP2b  (assembled 2026-07-28)
# -----------------------------------------------------------------------------
# Basis for the timber layers `timber_cveg-tempnle_annual` and `timber_npp-tempnle_annual`.
# Chosen over 3b cwood because 2b is the only round with climate-zone-resolved conifers;
# the cost is losing the wood-only pool (cveg is whole-plant; wood is p50 77-90% of it).
temperate_needleleaf_evergreen_2b:
  soc: "2005soc for every member (land use held fixed)"
  sens: "co2 (transient) preferred; 2005co2 accepted ONLY where transient is absent"
  temporal: {resolution: "annual", period: "2006-2099"}
  pooled_members_per_scenario:
    cveg: {rcp26: 8, rcp60: 8, rcp85: 6}
    npp:  {rcp26: 12, rcp60: 12, rcp85: 10}
  pooled:
    ORCHIDEE: "tendev -- 4 GCMs x rcp26/60/85"
    ORCHIDEE-DGVM: "tendev -- 2 GCMs (gfdl-esm2m, ipsl-cm5a-lr) x rcp26/60 only.
                    SAME MODEL FAMILY as ORCHIDEE: treat as one model for democracy weighting."
    CLM45: "needleleaf-evergreen-tree-temperate -- ragged: rcp26 {hadgem2-es, miroc5};
            rcp60 {ipsl-cm5a-lr transient, gfdl-esm2m FIXED-CO2 only}; rcp85 {gfdl, hadgem2}"
    LPJmL: "temperate-needleleaved-evergreen-tree -- NPP TRACK ONLY (no cveg per PFT),
            4 GCMs x 3 RCPs; per-gridcell so converted to per-tile with a cover floor"
  excluded:
    CARAIB: "ndevteclt ingested but NOT pooled -- ~1-2 deg effective grid (GUARDRAILS 11),
             per-gridcell convention, and no rcp85. Kept as a sensitivity panel."
  effective_resolution_verified: "ORCHIDEE 3.4%, ORCHIDEE-DGVM 2.8%, CLM45 0.0%, LPJmL 0.3%
    of non-zero 2x2 blocks constant = all native 0.5 deg. CARAIB 49% = coarse.
    NOTE: run this test on STRICTLY POSITIVE blocks -- these fields are zero-inflated and
    all-zero blocks otherwise register as false 'constant' evidence of a coarse grid."
  rcp85_caveat: "rcp85 is thinner by construction (ORCHIDEE-DGVM and CARAIB do not publish it)."

# -----------------------------------------------------------------------------
# USAGE NOTES
# -----------------------------------------------------------------------------
usage_notes:
  - "Prefer ISIMIP3b over ISIMIP2b for new analyses (newer scenarios, updated models)"
  - "ISIMIP2b forestry sector has species-level data but only for beech and conifers"
  - "Global biomes models preferred over regional forestry for cross-geography consistency"
  - "Dataset counts of 1001 indicate pagination limit; actual counts may differ"
  - "Agriculture sector uses compound variable names: {metric}-{crop}-{irrigation}"
  - "Bean crop code changed between rounds: 'ben' (ISIMIP2a) -> 'bea' (ISIMIP3)"
  - "Search for crops using variable patterns like 'yield-bea' not just 'bea'"
  - "Some crops are model-specific: cotton (cot) ONLY in CLM-Crop, not in CGMS-WOFOST or LPJ-GUESS"
  - "Always check multiple models within a simulation round - crop coverage varies by model"
  - "ISIMIP2a variable names include harmonization suffix: {metric}-{crop}-{irr}-{harm} (e.g., yield-cot-firr-default)"
  - "When API returns 0 results, try partial matches or check older simulation rounds (ISIMIP2a/2b)"
