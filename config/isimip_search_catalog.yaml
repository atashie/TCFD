        3a/InputData/climate/atmosphere/             -> counterclim, obsclim, spinclim, transclim
        3a/.../obsclim/global/daily/historical/      -> 6 forcings
      All GCM directories were listed for every scenario, and files listed PER GCM (not
      sampled) for both daily roots -- required, because tasmax coverage is not uniform.
    representations:
      sparccle2025_annual_indicators:
        path: "ISIMIP3b/DerivedInputData/SPARCCLE2025/{scenario}/{GCM}/"
        relevance: "READY-MADE, contract-shaped, and CHEAP -- but an INTENSITY, not a day count."
        variables_for_this_hazard: "temp-annual-max (TXx, K) and temp-variability (TV, K)"
        ensemble: "5 GCMs (GFDL-ESM4, IPSL-CM6A-LR, MPI-ESM1-2-HR, MRI-ESM2-0, UKESM1-0-LL)"
        scenarios: "historical, ssp126, ssp370, ssp585. NO ssp245, NO picontrol."
