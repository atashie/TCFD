        enumerated: "2026-08-08 (ISIMIP2b/DerivedOutputData/Lange2020/{MODEL}/{gcm}/future/ -- note the 3-level depth and the leading 'lange2020_' filename token, which shifts every field by one)"
        matrix: |
          5 models x 4 GCMs = 19 members/scenario (visit has only 3 GCMs; VISIT/hadgem2-es is a genuine HTTP 404):
