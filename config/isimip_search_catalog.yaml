# ISIMIP Search Results Catalog
# ==============================
# This file tracks empirical search results from ISIMIP repository queries.
# Update this file as new searches are conducted to build institutional knowledge
# and avoid redundant API queries.
#
# -----------------------------------------------------------------------------
# HOW TO WRITE A NEGATIVE IN THIS FILE  (GUARDRAILS §11 — read before adding one)
# -----------------------------------------------------------------------------
# A negative ("X does not exist", "no SSP version", "0 hits") ends the next session's
# search before it starts, so it is never tested the way a positive is. This file
# carried "ISIMIP3b/SSP version of this family NOT found (0 hits)" for the drought
# section from 2026-07-24 to 2026-08-11. It was FALSE — 3b publishes `driedarea`
# under DerivedOutputData/Heinicke2026, a complete 3 x 5 x 3 = 45-file SSP matrix —
# and the `led` layer shipped on rcp26/rcp60 because of it.
#
# Therefore EVERY negative in this file must carry its receipt inline:
#
#     verified_absent_on: "2026-08-11 — listed https://files.isimip.org/ISIMIP3b/DerivedOutputData/"
#
# naming the directory ACTUALLY enumerated. If you cannot name the path you listed,
# write UNVERIFIED instead of the negative. Two further rules:
#
#   * A negative about a CODE is not a negative about a HAZARD. "`led` returns 0 hits
#     in 3b" is true and nearly useless — re-issues are renamed by hazard word
#     (driedarea, floodedarea, heatwave, wildfire, cropfailure).
#   * If this file and the /isimip-search-download skill disagree, STOP, enumerate,
#     and write the answer back to BOTH. Believing the skill and leaving this file
#     stale is exactly how the above survived four days after the skill was corrected.
#
# Last updated: 2026-01-20

# -----------------------------------------------------------------------------
# VARIABLE DEFINITIONS
# -----------------------------------------------------------------------------
variable_definitions:
  cwood:
    long_name: "Carbon Mass in Wood"
    units: "kg m-2"
    description: "Includes sapwood and hardwood carbon content. Stock variable (not flux)."
    use_case: "Proxy for timber volume/biomass. Convert to dry biomass via ~0.5 kg C per kg dry biomass."

  npp:
    long_name: "Net Primary Productivity"
    units: "kg m-2 s-1"
    description: "Carbon flux from atmosphere to vegetation minus plant respiration."
    use_case: "Proxy for vegetation growth rate."

  gpp:
    long_name: "Gross Primary Productivity"
    units: "kg m-2 s-1"
    description: "Total carbon uptake by photosynthesis."
    use_case: "Total photosynthetic capacity indicator."

  cveg:
    long_name: "Carbon Mass in Vegetation"
    units: "kg m-2"
    description: "Total vegetation carbon pool (above + below ground)."
    use_case: "Total biomass proxy."

  cleaf:
    long_name: "Carbon Mass in Leaves"
    units: "kg m-2"
    description: "Leaf carbon pool."
    use_case: "Canopy biomass indicator."

  csoil:
    long_name: "Carbon Mass in Soil Pool"
    units: "kg m-2"
    description: "Total soil organic carbon stock (subsurface storage pool). Stock, not flux. Bulk pool = 'csoil-total'."
    use_case: "Subsurface / soil carbon storage. Processed csoil-total (ISIMIP3b) -> TCFD layer 2026-07-25 (see search_results.soil_carbon)."

  croot:
    long_name: "Carbon Mass in Roots"
    units: "kg m-2"
    description: "Root biomass carbon (root-zone living carbon). Stock. ISIMIP3b only (not published in ISIMIP2b future runs)."
    use_case: "Root-zone biomass carbon."

  cvegbg:
    long_name: "Carbon Mass in Below-Ground Vegetation"
    units: "kg m-2"
    description: "Below-ground vegetation carbon (roots + below-ground woody); cvegag is the above-ground counterpart. Stock."
    use_case: "Broader root-zone biomass carbon than croot."

  nbp:
    long_name: "Net Biome Production"
    units: "kg m-2 s-1"
    description: "Net land carbon sink = NPP - Rh - disturbance. Flux; >0 = land absorbing carbon."
    use_case: "Carbon sequestration RATE (net sink). ISIMIP3b biomes."

  burntarea:
    long_name: "Burnt Area Fraction"
    units: "fraction"
    description: "Fraction of grid cell affected by fire."
    use_case: "Fire disturbance metric."

  b30cm:
    long_name: "Biomass Density of Consumers >30cm"
    units: "g C m-2"
    description: "Biomass density of marine consumers with asymptotic length (L∞) greater than 30cm. Size-class threshold for 'large fish'."
    use_case: "Large fish abundance proxy (tuna, salmon, etc.)."
    notes: "Monthly data requires aggregation - use mean for density metrics."

  tcb:
    long_name: "Total Consumer Biomass"
    units: "g C m-2"
    description: "Total biomass of all marine consumers regardless of size."
    use_case: "Overall fishery productivity indicator."

  b10cm:
    long_name: "Biomass Density of Consumers >10cm"
    units: "g C m-2"
    description: "Biomass density of marine consumers with L∞ > 10cm."
    use_case: "Medium-to-large fish abundance."

# -----------------------------------------------------------------------------
# PFT (PLANT FUNCTIONAL TYPE) CODES
# -----------------------------------------------------------------------------
pft_codes:
  # ISIMIP3b CLASSIC model codes
  isimip3b_classic:
    dcdcldbdltr: "Deciduous cold-climate broadleaf trees (best oak proxy)"
    dcddrybdltr: "Deciduous dry-climate broadleaf trees"
    dcdndltr: "Deciduous needleleaf trees"
    evgbdltr: "Evergreen broadleaf trees"
    evgndltr: "Evergreen needleleaf trees"
    c3grass: "C3 grasses"
    c4grass: "C4 grasses"
    c3crop: "C3 crops"
    c4crop: "C4 crops"
    total: "All PFTs combined"

  # ISIMIP2b species codes (regional forestry)
  isimip2b_forestry:
    fasy: "Fagus sylvatica (European beech)"
    piab: "Picea abies (Norway spruce)"
    pipi: "Pinus pinaster (Maritime pine)"
    pisy: "Pinus sylvestris (Scots pine)"
    # NOTE: No Quercus (oak) species available

# -----------------------------------------------------------------------------
# CROP CODES (AGRICULTURE SECTOR)
# -----------------------------------------------------------------------------
# IMPORTANT: Agriculture variables use compound names: {metric}-{crop}-{irrigation}
# Examples: yield-bea-firr, anthday-mai-noirr, biom-soy-firr
#
# Irrigation suffixes:
#   firr  = fully irrigated
#   noirr = rainfed (no irrigation)
#
crop_codes:
  # CORRECTED 2026-08-11: the earlier isimip3b list mixed PROTOCOL codes (crop-calendar
  # InputData) with codes that models actually PUBLISH as output. They are not the same set.
  # Enumerated from all 63 ISIMIP3b agriculture {model}/{gcm}/future/ listings.
  isimip3b:
    # --- measured in OutputData (yield-{crop}-{firr,noirr} and companions) ---
    bea: "Dry beans (Phaseolus vulgaris)"   # LPJ-GUESS only
    cas: "Cassava"                           # LPJmL only
    mai: "Maize"
    mil: "Millet"                            # CYGMA1p74, LPJ-GUESS, LPJmL
    pot: "Potato"                            # SIMPLACE-LINTUL5 only
    ri1: "Rice (first growing period)"
    ri2: "Rice (second growing period)"
    sor: "Sorghum"                           # CYGMA1p74, LPJ-GUESS, LPJmL, SIMPLACE
    soy: "Soybean"
    swh: "Spring wheat"
    wwh: "Winter wheat"
    # --- PROTOCOL-ONLY: present in InputData/socioeconomic/crop_calendar/, but NO ISIMIP3b
    #     model publishes output for them.
    #     verified_absent_on: "2026-08-11 -- projected the variable field $(NF-4) from EVERY
    #     ISIMIP3b agriculture listing (all 14 models x their GCMs, future/, 63 dirs, 0
    #     empty). Observed vocabulary is exactly the 11 codes above; these 9 never appear."
    #   bar, cot, nut, pea, rap, rye, sgb, sgc, sun
    # NOTE: Code 'bea' for beans in ISIMIP3
    # NOTE: 'sgc' is the crop-calendar code for sugarcane. Sugarcane OUTPUT is published
    #       under the code 'sug', and only in ISIMIP2a/2b (see search_results.sugarcane).

  isimip2b:
    # Measured 2026-08-11 from all 4 models x 4 GCMs, future/ + historical/
    cas: "Cassava"          # LPJmL only
    mai: "Maize"            # all 4 models
    mil: "Millet"           # LPJmL only
    nut: "Groundnut"        # LPJmL only
    pea: "Field peas"       # LPJmL only
    rap: "Rapeseed"         # LPJmL only
    ric: "Rice"             # GEPIC, LPJmL, PEPIC
    sgb: "Sugar beet"       # LPJmL only
    soy: "Soybean"          # all 4 models
    sug: "Sugarcane"        # LPJmL ONLY -- the sole sugarcane source with future scenarios
    sun: "Sunflower"        # LPJmL only
    whe: "Wheat"            # GEPIC, LPJmL, PEPIC (single wheat code, not swh/wwh)

  isimip2a:
    ben: "Dry beans (Phaseolus vulgaris)"
    cot: "Cotton"
    mai: "Maize"
    ric: "Rice"
    soy: "Soybean"
    swh: "Spring wheat"
    wwh: "Winter wheat"
    # NOTE: Code 'ben' for beans in ISIMIP2a (different from ISIMIP3!)
    # NOTE: Cotton (cot) only available in CLM-Crop model

  isimip3a:
    # Crop calendar inputs only (no simulation outputs)
    cot: "Cotton"

  available_metrics:
    yield: "Crop yield (dry matter)"
    biom: "Above-ground biomass"
    anthday: "Anthesis (flowering) day"
    matyday: "Maturity day"
    plantday: "Planting day"
    plantyear: "Planting year"
    harvyear: "Harvest year"
    aet: "Actual evapotranspiration"
    gsprcp: "Growing season precipitation"
    gsrsds: "Growing season solar radiation"
    pirrww: "Irrigation water withdrawal"
    sumt: "Growing degree days"

# -----------------------------------------------------------------------------
# SEARCH RESULTS BY VARIABLE
# -----------------------------------------------------------------------------
search_results:

  # -------------------------
  # drought searches
  # -------------------------
  # NOTE: "drought" is a cascade, not one variable. ISIMIP offers (a) a ready-made
  # exposure layer (Lange 2020 derived output) and (b) the raw hydrologic building
  # blocks in the water sector from which SPI/SPEI/soil-moisture drought is computed.
  # Counts below are floor values: the CLI listing caps at 20 rows per query.
  drought:
    last_searched: "2026-07-24"

    exposure_lange2020:
      description: "Pre-computed extreme-event exposure (Lange et al. 2020, Earth's Future). Drought = land fraction where monthly soil moisture falls below the 2.5th percentile of the preindustrial baseline."
      type: "DerivedOutputData (annual, ready to process)"
      # AUTHORITATIVE ENUMERATED FAMILY — verified 2026-07-24 via paginated datasets API.
      # Lange 2020 covers SIX hazard categories; the code is always 'le' + ONE letter.
      # DO NOT GUESS codes. A prior session guessed 'letc' for tropical cyclone, got 0
      # hits, and wrongly concluded TC exposure didn't exist — the real code is 'let'.
      # This family ALSO answers searches for tropical-cyclone / heatwave / river-flood /
      # wildfire / crop-failure exposure, not only drought.
      family:
        led: {hazard: "drought",         datasets: 219, impact_models: "8 GHM/land (clm45,h08,jules-w1,lpjml,mpi-hm,orchidee,pcr-globwb,watergap2)", data_nature: "binary {0,1} per cell (re-verified 2026-08-11 across all 62 future members: exactly 2 unique values each, exact-0 + exact-1 = 100.00%, is_boolean_field=True)"}
        ler: {hazard: "river flood",     datasets: 218, impact_models: "8 GHM/land (same set as led)"}
        lew: {hazard: "wildfire",        datasets: 134, impact_models: "5 DGVM/fire (caraib,lpj-guess,lpjml,orchidee,visit) x 4 GCMs; future rcp26=31/rcp60=19; data_nature UNVERIFIED. NOTE: this is the EXPOSURE member -- distinct from the direct 'burntarea' burnt-area-fraction fire output, which was the one actually processed (see search_results.wildfire)."}
        lec: {hazard: "crop failure",    datasets: 90,  impact_models: "CORRECTED 2026-08-13 -- gepic AND pepic (2 models x 4 GCMs x {rcp26,rcp60} = 16 complete future files, enumerated). The earlier 'gepic' came from a 20-row-capped API listing. Full matrix in search_results.crop_failure.lec_isimip2b", data_nature: "UNVERIFIED"}
        leh: {hazard: "heatwave",        datasets: 30,  impact_models: "hwmid-humidex (derived index)"}
        let: {hazard: "tropical cyclone", datasets: 28, impact_models: "ke-tg-meanfield (Emanuel KE wind model, derived)", data_nature: "FRACTIONAL area [0,1) per cell (re-verified 2026-08-11: max 0.952, NEVER exactly 1, is_boolean_field=False, 97.84% of finite cell-years EXACTLY ZERO); 1 impact model x 4 GCMs = thin ensemble -> aggressive 5x5 L=2.5 smoothing + pooled_mean_zero_inflated statistic. See search_results.tropical_cyclone."}
      # verified_absent_on: "2026-07-24 -- paginated datasets API, each code returned 0."
      # These are GUESSED codes that do not exist, not hazards that lack data.
      not_real: ["letc", "lecdd", "letr"]
      common_coverage:  # identical across all six members
        product: "DerivedOutputData"
        # CORRECTED 2026-08-11. This previously read "ISIMIP2b only (NO ISIMIP3b/SSP
        # version of this family)", which is false and contradicted both CLAUDE.md and
        # the /isimip-search-download skill. The le*/pe* CODES are 2b-only, but the
        # exposure CONCEPT was re-issued for ISIMIP3b under different publication
        # directories and hazard-word names -- see isimip3b_ssp_reissue below. Do not
        # restore the old wording; it is how the drought layer nearly shipped on
        # rcp26/rcp60 without anyone checking whether ssp126/370/585 existed.
        simulation_round: "ISIMIP2b for the le*/pe* codes themselves; the concept IS re-issued in 3b under other names"
        climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]  # 4 CMIP5 GCMs
        scenarios: ["historical", "picontrol", "rcp26", "rcp60"]  # NO rcp85, NO SSP
        timestep: "annual"
        grid: "global 0.5deg"
        data_nature: "VARIES BY HAZARD -- value-check each member before processing. led=binary{0,1} (verified), let=fractional[0,1) (verified 2026-07-24), ler/lew/lec/leh=UNVERIFIED. Decadal stat = MEAN either way (mean of binary flags OR mean of fractional area = expected annual exposed-area fraction)."
      isimip3b_ssp_reissue:
        note: |
          The Lange 2020 exposure CONCEPT carried into ISIMIP3b, split across two
          publication directories and renamed by hazard word rather than le* code.
          DROUGHT is `driedarea` under DerivedOutputData/Heinicke2026.
          It is a DIFFERENT product with a different ensemble, NOT a drop-in newer
          version of the `led` files; a switch is a product decision, not an upgrade.
        # FULLY ENUMERATED 2026-08-11 (15 future/ listings, 0 failures, 0 gaps).
        # NOTE the filename grammar: Heinicke2026 files carry NO leading publication
        # token (h08_gfdl-esm4_w5e5_ssp126_...), unlike Lange2020's `lange2020_...`.
        # DerivedOutputData grammar is per-publication -- parse from the END regardless.
        driedarea:
          path: "ISIMIP3b/DerivedOutputData/Heinicke2026/{MODEL}/{gcm}/future/"
          impact_models: ["h08", "jules-w2", "watergap2-2e"]   # 3
          climate_forcings: ["gfdl-esm4", "ipsl-cm6a-lr", "mpi-esm1-2-hr", "mri-esm2-0", "ukesm1-0-ll"]  # 5 CMIP6
          scenarios: ["ssp126", "ssp370", "ssp585"]
          matrix: "COMPLETE 3 x 5 x 3 = 45 future files, no missing combination"
          soc_sens: "UNIFORM 2015soc / default -- no harmonization compromise"
          bias_adjustment: "w5e5"
          timestep: "annual"
          period: "2015-2100"
          volume: "~3.7 MB/file, ~168 MB for all 45; .json sidecars WITH sha512 ARE published (unlike 3b biomes)"
          data_nature: "UNVERIFIED -- must be value-checked before processing. Do NOT assume it inherits `led`'s binary nature: its Heinicke2026 sibling `floodedarea` is binary {0,1} despite units='1', and the two differ on masking (floodedarea is non-NaN over 94.7% of the globe INCLUDING ocean; driedarea is correctly land-masked)."
          vs_led: "3 models vs led's 8; 5 CMIP6 GCMs vs led's 4 CMIP5; 15 members/scenario vs 31; 3 SSPs vs 2 RCPs. Recorded as facts, NOT as a recommendation."
        flood: "floodedarea (Heinicke2026) -- WARNING: binary {0,1} despite units='1', and non-NaN over 94.7% of the globe INCLUDING ocean (driedarea, same product/model, is correctly land-masked)"
        others: "heatwave, wildfire, cropfailure (Zantout2025)"
        no_reissue: "tropical cyclone -- ke-tg-meanfield appears in no 3a/3b directory"

      isimip2b:
        led:
          # TRUE coverage via paginated API (CLI listing caps at 20): 219 datasets.
          impact_models: ["clm45", "h08", "jules-w1", "lpjml", "mpi-hm", "orchidee", "pcr-globwb", "watergap2"]  # 8 GHM/land models
          climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]  # 4 GCMs
          bias_adjustment: ["ewembi"]
          scenarios: ["historical", "picontrol", "rcp26", "rcp60"]  # NO rcp85/SSP
          timestep: "annual"
          period: "2006-2099 (some members extend to 2299 - not used)"
          # ENUMERATED 2026-08-11 by listing all 32 {MODEL}/{gcm}/future/ directories
          # serially (31 x HTTP 200 + 1 real 404). Supersedes the earlier "31/31 with
          # mpi-hm missing 2 GCM combos" note, which over-counted the gap.
          future_matrix_verified: "62 files = 31 members x {rcp26, rcp60}. Composition IDENTICAL across the two scenarios -> shared 2020s baseline valid."
          missing_combination: "mpi-hm x hadgem2-es ONLY (directory returns a genuine HTTP 404, not an empty listing). Absent from BOTH scenarios, so scenario symmetry is preserved."
          soc_scenario: "MIXED, and each model publishes exactly ONE variant -- 2005soc for clm45,h08,lpjml,mpi-hm,pcr-globwb,watergap2; nosoc for jules-w1,orchidee. Harmonizing would mean DROPPING 2 of 8 impact models, not switching a token. All 31 kept (user decision 2026-08-11)."
          sens_scenario: "co2 -- uniform across all 62 files"
          land_masks: "HETEROGENEOUS: clm45 60,695 / pcr-globwb 67,223 / jules-w1 67,209 / h08,lpjml,mpi-hm,watergap2 67,420 / orchidee 75,438 cells. Union 75,673; all-8 intersection 60,501. Time-invariant per member."
          inter_model_spread: "LARGE -- 2020s global-mean drought frequency runs h08 0.0085 to orchidee 0.0660 (7.8x). Structural, not a unit error; it belongs in the CI."
          file_size: "~7 MB each, 421 MiB for all 62 (sha512-verified from .json sidecars)"
          future_members: "rcp26=31, rcp60=31 (mpi-hm missing 2 GCM combos)"
          data_nature: "BINARY per-cell annual flag {0,1}; fraction emerges on aggregation"
          processed: "2026-07-24 -> TCFD layer. See memory project_led_drought_layer, scripts/process_led_drought.py"
        lec:
          impact_models: ["gepic"]
          scenarios: ["historical", "picontrol", "rcp26", "rcp60"]
          timestep: "annual"
          datasets_seen: ">=20 (listing capped)"
      notes: |
        Most "drought-specific" off-the-shelf product in ISIMIP, and the whole family
        (led/ler/lew/lec/leh/let) shares the same structure so any member is processable
        with an adapted process_led_drought.py. All ISIMIP2b (EWEMBI, RCP, CMIP5 GCMs),
        annual, rcp26/rcp60 only.

        NO ISIMIP3b/SSP re-issue of THIS FAMILY under its own codes -- but read that
        narrowly.
        verified_absent_on: "2026-08-11 -- listed https://files.isimip.org/ISIMIP3b/DerivedOutputData/
        (exactly four publications: Heinicke2026, Jaegermeyr2021, TipESM2025, Zantout2025)
        and walked Heinicke2026 in full; no le*/pe* code appears in any of them."
        The exposure CONCEPT was carried into 3b, split across Heinicke2026
        (driedarea, floodedarea) and Zantout2025 (heatwave, wildfire, cropfailure), named
        by hazard word rather than le* code. And a family having no re-issue is NOT the
        hazard having no newer data: ISIMIP3b's newest tropical-cyclone product lives in
        InputData/climate/tropical_cyclones/MIT, outside DerivedOutputData entirely. That
        conflation produced a false "no SSP TC data exists" inventory on 2026-08-11 --
        see search_results.tropical_cyclone.enumerated.

        Processing status: led=DONE, REBUILT 2026-08-11 onto the OUTPUT-SPEC contract --
        pooled_mean_boolean statistic (the field is measured binary), NO smoothing (31
        members), >=2-impact-model publication mask, two-tier percentile. The 2026-07-24
        build was family-B. See process_led_drought.py and download_led_drought.py.
        let=DONE, REBUILT 2026-08-11 onto the
        OUTPUT-SPEC contract -- pooled_mean_zero_inflated statistic and aggressive 5x5
        L=2.5 smoothing applied per member per YEAR (the 2026-07-24 build used L=0.7,
        which left storm tracks visible, and was family-B). See process_let_cyclone.py.
        ler/lew/lec/leh remaining -- value-check binary-vs-fractional before each.
        For WILDFIRE the direct 'burntarea' fire output (NOT the lew exposure member)
        was chosen and processed 2026-07-24 -- see search_results.wildfire.

    hydrologic_building_blocks:
      description: "Raw water-sector variables for computing hydrological/agricultural drought. Most are ALREADY pulled/processed in the Water Risk Index."
      # ISIMIP3b/SSP coverage ENUMERATED 2026-08-11 (10 models probed at gfdl-esm4/future).
      isimip3b_ssp:
        sector: "ISIMIP3b/OutputData/water_global/{MODEL}/{gcm}/future/"
        models_with_soilmoist: ["classic", "cwatm", "h08", "jules-es-vn6p3", "jules-w2", "lpjml5-7-10-fire", "miroc-integ-land", "web-dhm-sg", "watergap2-2e"]  # 9 of 10; VISIT publishes qtot ONLY
        models_with_rootmoist: ["lpjml5-7-10-fire", "miroc-integ-land", "web-dhm-sg"]
        scenarios: ["ssp126", "ssp370", "ssp585"]
        cadence: "soilmoist is MONTHLY for all 9 (h08/watergap2-2e/miroc-integ-land also publish daily)"
        soc_variants: "SIX per scenario -- 1850soc, 2015soc, ssp{N}soc-{adapt,noadapt}+{image,magpie}. A soc choice is REQUIRED here; contrast driedarea, which is uniform 2015soc."
        volume: "~250 MB per monthly soilmoist file -> ~34 GB for 9 models x 5 GCMs x 3 scenarios at ONE soc variant (GCM completeness per model NOT verified)"
        caveat: "A drought layer from these is a CONSTRUCTED INDEX (SPI/SPEI/soil-moisture percentile threshold), i.e. a modelling decision to make with the user, NOT an aggregation -- GUARDRAILS 1-2. driedarea by contrast ships the index already computed."
      variables:
        soilmoist: "Soil moisture (agricultural/soil drought). NL search parser did NOT map 'soil moisture' -> use exact code 'soilmoist'."
        rootmoist: "Root-zone soil moisture. ALREADY in Water Index (WEB-DHM-SG)."
        dis: "River discharge; low-flow percentiles = hydrological drought. ALREADY in Water Index (5 models)."
        tws: "Total water storage (GRACE-like). ALREADY in Water Index (4 models)."
        potevap: "Potential ET; combine with precip for SPEI. ALREADY in Water Index (4 models)."
        qtot: "Total runoff. ISIMIP2a hist confirmed across 5 models (caraib, dlem, jules-b1, lpj-guess, lpjml), monthly, >=20 datasets. ISIMIP3b versions also exist."
        qs: "Surface runoff."
        qsb: "Subsurface runoff / baseflow (baseflow drought)."
        groundwstor: "Groundwater storage (groundwater drought)."
        swe: "Snow water equivalent (snow drought)."
        pr: "Precipitation (climate InputData) for SPI. = Water Index 'precip', the one remaining variable."
      notes: |
        A soil-moisture or water-balance drought index could be assembled largely
        from data already in hand (dis, tws, potevap, rootmoist), with precip pending.

    vegetation_impacts:
      description: "Ecological drought impacts (secondary indicators)."
      variables:
        npp: "Net primary productivity - declines under drought."
        gpp: "Gross primary productivity."
        burntarea: "Burnt area - drought-driven fire."
        ffire: "Fire carbon flux."
        yield-noirr: "Rainfed crop yields ({crop}-noirr) - drought-sensitive."
        aet: "Actual ET (growing-season water use)."
        gsprcp: "Growing-season precipitation."

  # -------------------------
  # river (fluvial) flood searches
  # -------------------------
  river_flood:
    last_searched: "2026-08-13"
    description: >-
      Riverine flood exposure. TWO products carry it: ISIMIP3b `floodedarea`
      (DerivedOutputData/Heinicke2026, SSP) and ISIMIP2b `ler` (DerivedOutputData/Lange2020,
      RCP). Only `floodedarea` has been enumerated and value-checked so far -- `ler` counts
      below are copied from the Lange2020 family block and are NOT a fresh enumeration.
    isimip3b_floodedarea:
      path: "ISIMIP3b/DerivedOutputData/Heinicke2026/{MODEL}/{gcm}/future/"
      enumerated_on: "2026-08-13 -- 15 future/ listings, 0 empty, 0 retries; variable field projected from the END (no target-token pre-filter)"
      impact_models: ["h08", "jules-w2", "watergap2-2e"]              # 3, same set as driedarea
      climate_forcings: ["gfdl-esm4", "ipsl-cm6a-lr", "mpi-esm1-2-hr", "mri-esm2-0", "ukesm1-0-ll"]  # 5 CMIP6
      scenarios: ["ssp126", "ssp370", "ssp585"]
      matrix: "COMPLETE 3 x 5 x 3 = 45 future files, no missing combination"
      soc_sens: "UNIFORM 2015soc / default"
      bias_adjustment: "w5e5"
      timestep: "annual"
      period: "2015-2100"
      volume: "0.97-1.41 MB/file, ~53 MB for all 45"
      sidecars: >-
        .json WITH sha512 published -- but the name REPLACES the .nc extension
        (`..._2015_2100.json`), it does not append to it. `{file}.nc.json` returns 404,
        which reads exactly like 'no sidecars published'. All 45 downloaded and
        sha512-verified 2026-08-13.
      # ---- MEASURED 2026-08-13 on ALL 45 members. Reproduce: scripts/measure_floodedarea_characteristics.py
      measured:
        data_nature: >-
          BINARY {0,1}. Exactly 2 unique values in every one of the 45 members. A per-cell
          annual occurrence FLAG, so a decadal mean is a FREQUENCY OF FLAGGED YEARS, not an
          area share -- despite units='1' and long_name='Exposed Area Share' (identical
          across all 45; the metadata describes the aggregate, not the cell).
        time_axis: "days since 1601-01-01, proleptic_gregorian -- cftime decode required (same as driedarea, NOT the `years since` axis Lange2020 2b files use)"
        mask: >-
          NOT a corrupt mask -- a MASKING CONVENTION. Non-NaN over 94.4-96.5% of the globe
          because OCEAN IS PUBLISHED AS EXACT ZERO rather than NaN. Of 165,774 finite ocean
          cells (ISIMIP3b landseamask), only 258 (0.16%) are ever flagged non-zero, and
          78.3% of those touch a land cell -- coastal/small-island disagreement between the
          model grid and the generic mask (Greenland fjords, Line Islands, N Caspian), not
          flooding in open ocean. Applying the land mask costs ~258 cells and is required:
          left in, 64% of the grid enters the percentile baseline as zeros and destroys the
          ranking. THE EARLIER 'per-variable mask defect' WORDING OVERSTATED THIS.
        land_coverage: >-
          90.9% of ISIMIP3b land cells published (jules-w2/gfdl-esm4: 84,414 of 92,889).
          Per-model and even per-GCM heterogeneous: h08 78,689-79,587, jules-w2 83,659-84,414,
          watergap2-2e 81,957-83,260 finite land cells. 4,431 land cells (4.8%) are published
          by NO model, median |lat| 28.8 -- the arid belt, i.e. cells with no river network.
        zero_inflation: "93.6-98.0% of finite LAND cell-years are exactly zero (97.9-99.3% including the ocean zeros)"
        signal: >-
          Global land-mean exposure frequency 2020s -> 2090s: ssp126 1.31-1.39x,
          ssp370 2.54-2.97x, ssp585 3.10-3.40x. Monotone in forcing in all 15 members.
        ensemble_spread: >-
          INTER-MODEL spread is unusually tight -- 1.18-1.25x at the 2090s global land mean
          (contrast driedarea 2.69x, led 7.8x), and spatial Spearman rho between models is
          0.742-0.906 on the 3-model core. The GCM spread within one model is LARGER
          (h08 ssp585 2090s: 0.0534-0.0941, 1.76x). Uncertainty here is forcing-dominated,
          not structure-dominated, which is the opposite of `led`.
        publication_mask_evidence: >-
          UNDECIDED -- measured, not resolved. Solo-model cells read 0.0654 vs 0.0299 on
          3-model cells (2.19x) while inter-model spread is only 1.21x, so the elevation is
          NOT one hot model diluted: solo cells split across all three (h08 643 /
          jules-w2 3,298 / watergap2-2e 1,276) and sit at median |lat| 34.8 vs 62.8 for
          3-model cells. led resolved a 1.63x step at 7.8x spread with a >=2-model mask;
          driedarea measured 1.03x and published the full union. This layer matches NEITHER
          precedent and the rule must be decided on this evidence, per layer.
      reference_sites: >-
        GUARDRAILS 12, mean annual flag first-10 vs last-10 years, all 3 models agreeing:
        Ganges-Brahmaputra delta 0.0-0.2 -> 0.2-0.8 (strong, monotone in forcing);
        Lower Mississippi 0.0-0.1 -> 0.0 (ssp126) / 0.3-0.6 (ssp585); Rhine 0.0 -> 0.1-0.2;
        Mekong delta ~0.0 -> 0.0-0.1; AMAZON FLOODPLAIN ~0.000 THROUGHOUT; Sahara and
        Atacama return NaN (not published).
      framing_warning: >-
        THE AMAZON FLOODPLAIN READS ~0 AND THAT IS PROBABLY CORRECT, NOT A DEFECT. The
        Lange2020 family measures DEPARTURE FROM A PREINDUSTRIAL REFERENCE -- the drought
        sibling is documented as soil moisture below the preindustrial 2.5th percentile --
        so a permanently flood-prone floodplain scores 0 unless flooding exceeds its OWN
        historical extreme. A 2020s global land mean of 0.023 is consistent with exceedance
        of a rare historical threshold. THIS IS NOT A FLOOD-HAZARD MAP and must never be
        delivered as one; it is the same trap driedarea carries.
        UNVERIFIED: the exact threshold and return period for `floodedarea` were NOT read
        from Heinicke2026/Lange2020 documentation -- inferred from the family and consistent
        with the measured values. Read the publication before shipping.
    isimip2b_ler:
      status: "NOT YET ENUMERATED as of 2026-08-13 -- counts below are from the Lange2020 family block, not a fresh listing"
      datasets: 218
      impact_models: "8 GHM/land (same set as led)"
      scenarios: ["historical", "picontrol", "rcp26", "rcp60"]
      data_nature: "UNVERIFIED -- value-check before processing; do NOT inherit floodedarea's binary result across rounds"

    # =====================================================================================
    # CaMa-Flood INUNDATION -- the option that answers a different question entirely
    # =====================================================================================
    # DISCOVERED 2026-08-13. `ISIMIP2b/DerivedOutputData/` holds TWO publications, Lange2020
    # and Zimmer2023, and this catalog had only ever recorded the first. Everything the
    # repository knew about river flood was exposure-flag data because the second directory
    # was never listed. One `curl` on the parent directory is what found it.
    isimip2b_cama_flood_zimmer2023:
      path: "ISIMIP2b/DerivedOutputData/Zimmer2023/{MODEL}/{gcm}/future/"
      enumerated_on: "2026-08-13 -- 36 future/ listings: 24 OK, 12 genuine HTTP 404 (not empty bodies)"
      what_it_is: >-
        CaMa-Flood v3.6.2 hydrodynamic routing of ISIMIP2b GHM discharge onto a 150 arcsec
        floodplain, by S. Willner (PIK), github.com/swillner/flood-processing,
        doi:10.5281/zenodo.1241051. Produced 2020-03-23.
      variables:
        flddph: "flood DEPTH -- values 0 to ~17.8 in the probed member. UNITS UNVERIFIED: the variable carries NO attributes at all (no units, no long_name). Metres is the obvious reading and is consistent with the range, but it is an inference -- confirm against the Zenodo record before quoting a depth to a customer."
        fldfrc: "flooded FRACTION of the cell"
      protection_levels:
        none: "protection_threshold=0 -- raw hazard, no defences assumed"
        100yr: "uniform 100-year protection assumed everywhere"
        flopros: "FLOPROS empirical flood-protection database"
      note_on_protection: >-
        THIS IS A MODELLING CHOICE, NOT A FILE FORMAT. `none` is a hazard field; `flopros`
        is closer to a residual-risk field. They will disagree most exactly where defences
        exist, i.e. in developed floodplains where customer assets concentrate. Decide it
        with the user (GUARDRAILS 1-2) -- do not default.
      impact_models_with_future: ["CLM45", "CWatM", "H08", "LPJmL", "MATSIRO", "WaterGAP2"]   # 6
      models_historical_only: ["CLM50", "MPI-HM", "PCR-GLOBWB"]   # future/ returns a genuine 404
      climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]   # 4 CMIP5
      scenarios: ["rcp26", "rcp60", "rcp85"]
      scenario_note: "rcp85 EXISTS here -- the Lange2020 exposure family has none, so this is the only river-flood product in the repository with a high-forcing member."
      matrix: "COMPLETE 6 models x 4 GCMs x 3 scenarios x 2 variables x 3 protection levels = 432 future files"
      resolution: "150 arcsec = 1/24 deg, 4320 x 8640 = 37.3M cells, ~4.6 km at the equator -- 144x the cell count of every shipped 0.5 deg layer. DECLARED, and here also structurally real: the floodplain detail is the product."
      timestep: "annual, 2006-2100 (95 steps); time is `seconds since 2006-01-01`, standard calendar -- a THIRD time-axis convention (Heinicke2026 uses days since 1601, Zantout2025 declares no units at all)"
      volume: >-
        Per file: flddph none ~476 MB, fldfrc none ~542 MB, flopros ~100-128 MB,
        100yr ~63-78 MB (sampled 2 per group). Per scenario across 24 members: none ~11-13 GB
        per variable, flopros ~2-3 GB, 100yr ~1 GB. ONE variable at ONE protection level
        across all three scenarios is ~3-9 GB; the whole publication is ~90 GB.
      sidecars: ".json WITH sha512 published (extension-replacing name, as with Heinicke2026)"
      filename_grammar_warning: >-
        THIS PUBLICATION BREAKS THE FROM-THE-END PARSE. Two EXTRA fields sit between the
        variable and the region -- protection level and resolution:
        cama-flood_h08_gfdl-esm2m_ewembi_rcp60_2005soc_co2_flddph_none_150arcsec_global_annual_2006_2100.nc4
        so $(NF-4) returns `150arcsec`, not the variable. Correct offsets HERE: variable
        $(NF-6), protection $(NF-5), resolution $(NF-4), scenario $(NF-9). The first harvest
        of this directory did exactly this and reported a variable vocabulary of
        "150arcsec". Read the .json `specifiers` block, which names every field explicitly.
      # ---- MEASURED 2026-08-13 on h08/gfdl-esm2m/rcp60/flddph/none (485 MB, sha512-verified)
      measured:
        grid_coverage: "finite over 21.8% of the grid; 4.28% of all cells non-zero in 2100"
        depth_range: "0 to 14.35 m in the 2100 step; 17.81 m maximum in the Amazon box over 2091-2100"
        reference_sites: >-
          Mean over 2091-2100, cells ever flooded / mean depth of flooded cells:
          Amazon main stem 47.2% / 6.11 m (max 17.81);
          Ganges-Brahmaputra 62.5% / 2.81 m;
          Mekong delta 68.9% / 2.31 m;
          Lower Mississippi 48.7% / 2.20 m;
          Rhine NL/DE 38.1% / 2.59 m;
          Sahara control 0.0% / 0.00 m.
        why_this_matters: >-
          THE AMAZON IS THE WETTEST BOX IN THE SAMPLE. `floodedarea` reads 0.000 there in all
          45 of its members because it scores departure from a preindustrial reference; this
          product reports absolute water depth on the floodplain and ranks the world's
          largest floodplain first. A customer asked to accept a flood layer that reads zero
          across the Amazon will not accept it, and they would be right.
        method_attributes: >-
          Declared in the file: fit=gev, fit_scenario=picontrol, fit_soc=1860soc,
          discharge_threshold=0.1mm/d, protection_threshold=0, cama_flood_version=3.6.2.
          So the frequency model is calibrated on the PREINDUSTRIAL CONTROL run while the
          published value is an absolute depth -- a different relationship to the baseline
          than `floodedarea`'s, and one that must be read from the paper, not from these
          attributes alone. UNVERIFIED until then.
      open_questions:
        - "Which protection level. A product decision, not a default."
        - "flddph or fldfrc, or both -- depth drives damage functions, fraction drives area exposed."
        - "The 150 arcsec grid does not fit the delivery tooling as-is: every shipped layer is 0.5 deg, and aggregating to 0.5 deg discards the floodplain detail that is the entire reason to use this product. Native-resolution delivery is a change to the extraction, dashboard and map path, not just to a processor."
        - "CORRECTED 2026-08-14 -- the line that stood here on 2026-08-13 said 'No CaMa-Flood publication exists under ISIMIP3a or 3b'. FALSE, and written from publication NAMES without opening them. CaMa-Flood appears in THREE further publications: ISIMIP3b TipESM2025 (fldfrcmax, 15arcmin, ssp126/370/585 -- see isimip3b_cama_flood_tipesm2025 below), ISIMIP3a Quesada-Chacon2026 (dis at GRDC gauges, daily, counterclim/obsclim, no future scenarios), and ISIMIP2a Zimmer2023 (flddph/fldfrc at 150 AND 300 arcsec, dis at 900 arcsec, gswp3 1971-2010 -- the observational counterpart for validation). What IS true of Zimmer2023 specifically: its 2b edition is the only CaMa-Flood DEPTH product carrying future scenarios."
        - "6 models, 4 GCMs = 24 members per scenario, but ensemble composition across protection levels and variables was verified by COUNT (432 = 6x4x3x2x3), not by per-file diff."

    # =====================================================================================
    # CaMa-Flood INUNDATION, ISIMIP3b/SSP -- found 2026-08-14 during the post-mortem on
    # having missed the 2b one. The catalog had this publication recorded as "water models"
    # since 2026-08-11: a note that identified its MODEL DIRECTORIES and never opened a file.
    # =====================================================================================
    isimip3b_cama_flood_tipesm2025:
      path: "ISIMIP3b/DerivedOutputData/TipESM2025/MIT/{scenario}/{GHM}/{gcm}/"
      enumerated_on: "2026-08-14 -- 21 GHM listings across 3 scenarios, 0 failures; leaf vocabularies sampled on 3 GHMs"
      depth_warning: >-
        FIVE levels, and the SCENARIO sits ABOVE the model -- MIT/{scenario}/{GHM}/{gcm}/,
        not the {MODEL}/{gcm}/{period}/ shape every other publication uses. A three-level
        walker reports this directory as EMPTY, which is how the first sweep pass saw it.
      variable: "fldfrcmax -- annual MAXIMUM flooded fraction of the cell. Note this is a maximum, not a mean: a different statistic from 2b Zimmer2023's flddph/fldfrc, and it cannot be pooled with them."
      resolution: "15 arcmin = 0.25 deg, 1440 x 720 -- 4x the linear resolution of our 0.5 deg layers, 12x coarser than 2b Zimmer2023's 150 arcsec"
      scenarios: ["ssp126", "ssp370", "ssp585"]              # plus historical, picontrol
      impact_models: ["CLASSIC", "CWATM", "H08", "JULES-W2", "MIROC-INTEG-LAND", "WATERGAP2-2E", "WEB-DHM-SG"]  # 7 GHMs
      gcms: "5 CMIP6 (gfdl-esm4, ipsl-cm6a-lr, mpi-esm1-2-hr, mri-esm2-0, ukesm1-0-ll) for 6 of 7 GHMs; CLASSIC publishes gfdl-esm4 + ukesm1-0-ll ONLY"
      members_per_scenario: "32 = (6 GHMs x 5 GCMs) + (CLASSIC x 2). Composition VERIFIED IDENTICAL across ssp126/370/585, so a shared 2020s baseline is valid."
      protection_levels: ["none", "2yr", "40yr", "flopros", "hanze"]   # 5, vs Zimmer2023's 3
      soc_variants: "HETEROGENEOUS PER MODEL -- WATERGAP2-2E publishes 1850soc + 2015soc + 2015soc-from-histsoc (15 files/leaf), WEB-DHM-SG publishes 2015soc only (6 files/leaf). A soc choice is REQUIRED and it is not uniform; contrast Heinicke2026. NOT yet enumerated per model."
      anomaly: "WEB-DHM-SG/gfdl-esm4/ssp585 lists TWO files at protection=none where every other combination has one. Cause NOT established -- inspect before ingesting that member."
      timestep: "annual, 2015-2100"
      volume: "~67 MB per file (h08/gfdl-esm4/ssp585/none). ONE protection level at ONE soc across all 3 scenarios = 96 files, ~6.4 GB."
      vs_zimmer2023: >-
        Recorded as facts, not as a ranking. TipESM2025: SSP/CMIP6, 32 members, 0.25 deg,
        flooded FRACTION only, 5 protection levels, ~6.4 GB for a usable slice.
        Zimmer2023 2b: RCP/CMIP5, 24 members, 150 arcsec, flood DEPTH in metres AND fraction,
        3 protection levels, rcp85 available, ~3-9 GB for a slice. Depth drives damage
        functions; fraction drives area exposed. They are different products of the same
        model chain and neither supersedes the other.
      # ---- FULLY ENUMERATED 2026-08-14: 96 leaves, 0 empty, 915 files. Supersedes the
      # ---- 2026-08-14 first pass, which reported "32 members" by collapsing soc and sens.
      composition_measured:
        sens: "`default` (840 files) and `2015co2` (75). 2015co2 is ssp585 ONLY, from 3 GHMs -- it cannot enter a scenario-symmetric ensemble. Ingest separately if a CO2-sensitivity question is ever asked."
        members_per_scenario: "protection=none -> 32 (7 GHMs). protection=2yr/40yr/flopros/hanze -> 27 (6 GHMs). CWATM PUBLISHES `none` ONLY."
        ensembles_differ_by_protection: >-
          The unprotected field and the protected fields DO NOT share an ensemble. A
          none-minus-flopros difference is not a clean defence effect unless restricted to
          the common 27 members. Say so wherever the two are compared.
        soc_rule_applied: >-
          Prefer 2015soc, fall back to 2015soc-from-histsoc, NEVER 1850soc (a preindustrial-
          society counterfactual, not a projection). Selected: CLASSIC/H08/JULES-W2/
          WATERGAP2-2E/WEB-DHM-SG = 2015soc; CWATM/MIROC-INTEG-LAND = 2015soc-from-histsoc.
          All 7 models kept; strict 2015soc harmonisation would drop CWATM and MIROC.
        soc_must_be_held_across_protection: >-
          MIROC-INTEG-LAND publishes 2015soc for `none` but only 1850soc /
          2015soc-from-histsoc for the protected variants. Choosing soc per
          (member, protection) therefore hands that model a DIFFERENT SIMULATION unprotected
          than protected, and every protection comparison for it silently conflates defences
          with the socioeconomic run. The downloader intersects soc across protection levels
          per member before applying the preference.
      # ---- MEASURED 2026-08-14 on h08/gfdl-esm4/ssp585, three protection variants
      measured:
        metadata: "units='1', long_name='flooded fraction' -- HONEST, unlike floodedarea's 'Exposed Area Share'. Global attrs carry protection_level, resolution, soc, sens, cama_version=v400_20210119 (CaMa-Flood v4.0.0, NOT Zimmer2023's v3.6.2)."
        time_axis: "`days since 1661-01-01`, proleptic_gregorian -- a FOURTH convention in this repo (Heinicke2026 days since 1601, Zimmer2023 seconds since 2006, Zantout2025 no units at all). Time handling is per-PUBLICATION, always."
        data_nature: "CONTINUOUS [0,1] -- 283,749 unique values in the first 3M samples. NOT binary. Zero-inflation VARIES BY PROTECTION: 27.0% exact zeros unprotected, 87.5% under flopros. The decadal-statistic branch may therefore differ per protection variant and must be measured per variant, not chosen once."
        mask: "Clean. Finite over 24.34% of the grid (~252k of 1,036,800 cells), land-shaped. NOT zero-filled like cropfailure, NOT ocean-leaking like floodedarea."
        distribution: "Unprotected non-zero values: p50=0.0065, p90=0.1095, p99=0.9160."
        signal: "Global land-mean, ssp585 h08/gfdl-esm4 flopros: 2020s 0.00495 -> 2050s 0.00566 -> 2090s 0.00900 (1.8x)."
        reference_sites_GUARDRAILS_12: >-
          Box means over 2091-2100, cells with any finite value, unprotected / 2yr / flopros:
          Amazon main stem 0.0743 / 0.0161 / 0.0020 (640 cells, 100% ever flooded unprotected);
          Ganges-Brahmaputra 0.3249 / 0.2059 / 0.0309; Mekong delta 0.4879 / 0.2950 / 0.1146;
          Lower Mississippi 0.1192 / 0.0618 / 0.0001; Rhine NL/DE 0.0605 / 0.0413 / 0.0000;
          Sahara control 0.0000 with only 4% of cells ever non-zero. PASSES -- and note the
          Amazon, which floodedarea reads as 0.000, is fully wet here.
        protection_behaves_correctly: "flopros <= none in EVERY cell (verified, not assumed). Spatial Spearman none-vs-flopros 0.367, none-vs-2yr 0.911 -- defences REORDER the map, they do not scale it."
      defects_found_in_the_probe:
        latitude_orientation_differs_between_protection_variants: >-
          CRITICAL AND SILENT. `none` has DESCENDING lat (89.875 -> -89.875) with header
          dims (time, lon, lat); `2yr` and `flopros` have ASCENDING lat with dims
          (time, lat, lon) -- same publication, same member, same variable. A
          .sel(lat=slice(hi, lo)) returns ZERO cells on half the files (it did, in this
          probe), and any positional indexing builds an upside-down layer that would pass
          every contract check. ALWAYS .sortby("lat") on load; never index by position.
        permanent_water_reads_one: >-
          515 cells sit at exactly 1.000 in the unprotected 2090s mean -- the Caspian and
          other inland water bodies, permanently 'flooded'. They are not flood risk and they
          will dominate a percentile ranking. A permanent-water mask decision is REQUIRED
          before processing.
        rhine_reads_zero_under_flopros: >-
          NOT a defect -- the Netherlands and Germany carry very high FLOPROS standards, so
          residual risk is ~0. But a customer reading a flopros layer sees ZERO at a
          well-defended site, which means 'protected to standard', NOT 'no hazard'. This is
          a must-disclose framing point for any flopros delivery, in the same class as the
          relative-baseline caveat.

    # Build-your-own options, recorded so they are not re-derived
    discharge_route:
      description: >-
        A flood-magnitude index computed by US from river discharge. This is a CONSTRUCTED
        INDEX (GUARDRAILS 1-2), not an aggregation: return-period fitting, threshold choice
        and the depth relationship are all modelling decisions to make with the user.
      isimip3b_dis: "DAILY discharge from 7 models at gfdl-esm4/future (CWatM, H08, JULES-W2, LPJmL5-7-10-fire, MIROC-INTEG-LAND, WaterGAP2-2e, WEB-DHM-SG); monthly from 6. Vocabulary projected 2026-08-13 at ONE GCM -- per-GCM completeness NOT verified."
      isimip2b_dis: "DAILY discharge from 11 models at gfdl-esm2m/future (CLM45, CWatM, H08, JULES-W1, LPJmL, MATSIRO, MPI-HM, ORCHIDEE, ORCHIDEE-DGVM, PCR-GLOBWB, WaterGAP2-2c)."
      isimip2b_maxdis: "`maxdis` / `mindis` (monthly) exist in 2b for CLM45 and MPI-HM ONLY -- 2 models, too thin for an ensemble CI. NOT present in the 3b vocabulary at all."
      note: "The Water Risk Index product already ingests `dis` for 5 models -- a different output contract, monthly, no percentile, no trends. Do not silently bridge them."
    water_regional_2b:
      models: ["HBV-CMA", "HYPE", "SWAT-CMA", "SWAT-IITGN", "SWAT-VUB", "SWIM-NVE", "SWIM-PIK", "VIC-CMA", "VIC-HHU", "VIC-IITGN", "VIC-NVE", "mHM"]
      status: "LISTED 2026-08-13, contents NOT enumerated. Basin-scale models, so coverage is a set of study basins rather than a global field -- against the standing 'global over regional' preference, and not deliverable for arbitrary customer sites."
    no_flood_variable_in_water_sector: >-
      Neither ISIMIP3b nor ISIMIP2b water_global publishes a flood depth or inundation
      variable. Full variable vocabularies were projected 2026-08-13 (3b: 10 models at
      gfdl-esm4/future; 2b: 16 models at gfdl-esm2m/future) with NO target-token filter --
      the only matches for flood/inundation/depth were `thawdepth` and 2b `maxdis`/`mindis`.
      SCOPED: one GCM per round, future period only. Inundation lives in DerivedOutputData
      (Zimmer2023), not in the sector output.

