      impact_models: "14 -- ACEA(2 GCMs), CROVER, CYGMA1p74, DayCent(1 GCM), DSSAT-Pythia, EPIC-IIASA, ISAM, LDNDC, LPJ-GUESS, LPJmL, pDSSAT, PEPIC, PROMET, SIMPLACE-LINTUL5 (5 GCMs each unless noted)"
      crops_observed: ["bea", "cas", "mai", "mil", "pot", "ri1", "ri2", "sor", "soy", "swh", "wwh"]  # 11, confirms the sugarcane-entry finding
