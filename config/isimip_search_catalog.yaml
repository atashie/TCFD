        3b/InputData/.../bias-adjusted/global/       -> daily ONLY (no monthly, no annual)
        3b/InputData/.../daily/                      -> historical, picontrol, ssp126, ssp370, ssp585
        3b/SecondaryInputData/climate/atmosphere/bias-adjusted/global/ -> daily, hourly
