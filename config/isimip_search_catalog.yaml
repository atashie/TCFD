  chronic_heat:
    last_searched: "2026-08-14"
    # BUILT AND SIGNED OFF -- read this before re-searching. Nine layers ship from this
    # entry, and they are CONSTRUCTED (ISIMIP publishes no threshold-count variable in any
    # round, which is the headline finding below and still true).
    built_2026_08_16: >-
      SHIPPED: heatdays-hd30 / hd35 / hd40 / hd45, tropicalnights-tr20 / tr25 (this family),
      and icedays-id, frostdays-fd, frostdays-fdm10 (see search_results.cold_frost -- ONE
      ingest served both). 12 GCMs x ssp126/370/585, uniform. Headline rungs hd35 and FD are
      status:preferred, the other seven status:alternate; ALL NINE qa_reviewed_on 2026-08-16.
      Processors scripts/download_reduce_tasthresh_isimip3b.py (stage 1, streams ~1.34 TB and
      retains none of it) + scripts/process_tasthresh.py (stage 2). Framing, measurements and
      the QA sign-off record are in DATASET-ATTRIBUTES.md; incidents in WORKFLOW-ISSUES.md
      2026-08-16. Do NOT re-derive the availability matrix -- it is below and unchanged.
    description: >
      DISTINCT FROM `heatwave` above. That hazard asks "was this year's heat extreme for
      this cell"; this one asks "how many days does an asset sit above a fixed, externally
      defensible limit". The two rank places in OPPOSITE orders and neither substitutes for
      the other.
      THE HEADLINE FINDING: ISIMIP publishes NO days-above-a-temperature-threshold variable
      anywhere. Any such layer is a CONSTRUCTED INDEX -- a modelling decision under
      GUARDRAILS 1-2, not an aggregation. What IS published is (a) the daily bias-adjusted
      forcing to construct it from, and (b) two ready-made annual TEMPERATURE INTENSITY
      indicators (TXx and a variability metric) that are not day counts.
    enumerated: |
      2026-08-14, serial listings, every intermediate level listed, variable field projected
      from the END, no target-token pre-filter. 0 empty listings.
        https://files.isimip.org/                    -> 4 rounds
        {2a,2b,3a}/                                  -> DerivedOutputData, InputData,
                                                        OutputData, SecondaryInputData,
                                                        SecondaryOutputData
        3b/                                          -> DerivedInputData (!), DerivedOutputData,
                                                        InputData, OutputData, SecondaryInputData
        3b/InputData/climate/                        -> atmosphere, atmosphere_composition,
