# ISIMIP Search Results Catalog
# ==============================
# This file tracks empirical search results from ISIMIP repository queries.
# Update this file as new searches are conducted to build institutional knowledge
# and avoid redundant API queries.
#
# Last updated: 2026-01-20

# -----------------------------------------------------------------------------
# VARIABLE DEFINITIONS
# -----------------------------------------------------------------------------
variable_definitions:
  cwood:
    long_name: "Carbon Mass in Wood"
    units: "kg m-2"
    description: "Includes sapwood and hardwood carbon content. Stock variable (not flux)."
    use_case: "Proxy for timber volume/biomass. Convert to dry biomass via ~0.5 kg C per kg dry biomass."

  npp:
    long_name: "Net Primary Productivity"
    units: "kg m-2 s-1"
    description: "Carbon flux from atmosphere to vegetation minus plant respiration."
    use_case: "Proxy for vegetation growth rate."

  gpp:
    long_name: "Gross Primary Productivity"
    units: "kg m-2 s-1"
    description: "Total carbon uptake by photosynthesis."
    use_case: "Total photosynthetic capacity indicator."

  cveg:
    long_name: "Carbon Mass in Vegetation"
    units: "kg m-2"
    description: "Total vegetation carbon pool (above + below ground)."
    use_case: "Total biomass proxy."

  cleaf:
    long_name: "Carbon Mass in Leaves"
    units: "kg m-2"
    description: "Leaf carbon pool."
    use_case: "Canopy biomass indicator."

  csoil:
    long_name: "Carbon Mass in Soil Pool"
    units: "kg m-2"
    description: "Total soil organic carbon stock (subsurface storage pool). Stock, not flux. Bulk pool = 'csoil-total'."
    use_case: "Subsurface / soil carbon storage. Processed csoil-total (ISIMIP3b) -> TCFD layer 2026-07-25 (see search_results.soil_carbon)."

  croot:
    long_name: "Carbon Mass in Roots"
    units: "kg m-2"
    description: "Root biomass carbon (root-zone living carbon). Stock. ISIMIP3b only (not published in ISIMIP2b future runs)."
    use_case: "Root-zone biomass carbon."

  cvegbg:
    long_name: "Carbon Mass in Below-Ground Vegetation"
    units: "kg m-2"
    description: "Below-ground vegetation carbon (roots + below-ground woody); cvegag is the above-ground counterpart. Stock."
    use_case: "Broader root-zone biomass carbon than croot."

  nbp:
    long_name: "Net Biome Production"
    units: "kg m-2 s-1"
    description: "Net land carbon sink = NPP - Rh - disturbance. Flux; >0 = land absorbing carbon."
    use_case: "Carbon sequestration RATE (net sink). ISIMIP3b biomes."

  burntarea:
    long_name: "Burnt Area Fraction"
    units: "fraction"
    description: "Fraction of grid cell affected by fire."
    use_case: "Fire disturbance metric."

  b30cm:
    long_name: "Biomass Density of Consumers >30cm"
    units: "g C m-2"
    description: "Biomass density of marine consumers with asymptotic length (L∞) greater than 30cm. Size-class threshold for 'large fish'."
    use_case: "Large fish abundance proxy (tuna, salmon, etc.)."
    notes: "Monthly data requires aggregation - use mean for density metrics."

  tcb:
    long_name: "Total Consumer Biomass"
    units: "g C m-2"
    description: "Total biomass of all marine consumers regardless of size."
    use_case: "Overall fishery productivity indicator."

  b10cm:
    long_name: "Biomass Density of Consumers >10cm"
    units: "g C m-2"
    description: "Biomass density of marine consumers with L∞ > 10cm."
    use_case: "Medium-to-large fish abundance."

# -----------------------------------------------------------------------------
# PFT (PLANT FUNCTIONAL TYPE) CODES
# -----------------------------------------------------------------------------
pft_codes:
  # ISIMIP3b CLASSIC model codes
  isimip3b_classic:
    dcdcldbdltr: "Deciduous cold-climate broadleaf trees (best oak proxy)"
    dcddrybdltr: "Deciduous dry-climate broadleaf trees"
    dcdndltr: "Deciduous needleleaf trees"
    evgbdltr: "Evergreen broadleaf trees"
    evgndltr: "Evergreen needleleaf trees"
    c3grass: "C3 grasses"
    c4grass: "C4 grasses"
    c3crop: "C3 crops"
    c4crop: "C4 crops"
    total: "All PFTs combined"

  # ISIMIP2b species codes (regional forestry)
  isimip2b_forestry:
    fasy: "Fagus sylvatica (European beech)"
    piab: "Picea abies (Norway spruce)"
    pipi: "Pinus pinaster (Maritime pine)"
    pisy: "Pinus sylvestris (Scots pine)"
    # NOTE: No Quercus (oak) species available

# -----------------------------------------------------------------------------
# CROP CODES (AGRICULTURE SECTOR)
# -----------------------------------------------------------------------------
# IMPORTANT: Agriculture variables use compound names: {metric}-{crop}-{irrigation}
# Examples: yield-bea-firr, anthday-mai-noirr, biom-soy-firr
#
# Irrigation suffixes:
#   firr  = fully irrigated
#   noirr = rainfed (no irrigation)
#
crop_codes:
  isimip3b:
    bea: "Dry beans (Phaseolus vulgaris)"
    mai: "Maize"
    mil: "Millet"
    nut: "Groundnut"
    pea: "Field peas"
    rap: "Rapeseed"
    ri1: "Rice (first growing period)"
    ri2: "Rice (second growing period)"
    sor: "Sorghum"
    soy: "Soybean"
    sgb: "Sugar beet"
    sgc: "Sugarcane"
    sun: "Sunflower"
    swh: "Spring wheat"
    wwh: "Winter wheat"
    # NOTE: Code 'bea' for beans in ISIMIP3

  isimip2a:
    ben: "Dry beans (Phaseolus vulgaris)"
    cot: "Cotton"
    mai: "Maize"
    ric: "Rice"
    soy: "Soybean"
    swh: "Spring wheat"
    wwh: "Winter wheat"
    # NOTE: Code 'ben' for beans in ISIMIP2a (different from ISIMIP3!)
    # NOTE: Cotton (cot) only available in CLM-Crop model

  isimip3a:
    # Crop calendar inputs only (no simulation outputs)
    cot: "Cotton"

  available_metrics:
    yield: "Crop yield (dry matter)"
    biom: "Above-ground biomass"
    anthday: "Anthesis (flowering) day"
    matyday: "Maturity day"
    plantday: "Planting day"
    plantyear: "Planting year"
    harvyear: "Harvest year"
    aet: "Actual evapotranspiration"
    gsprcp: "Growing season precipitation"
    gsrsds: "Growing season solar radiation"
    pirrww: "Irrigation water withdrawal"
    sumt: "Growing degree days"

# -----------------------------------------------------------------------------
# SEARCH RESULTS BY VARIABLE
# -----------------------------------------------------------------------------
search_results:

  # -------------------------
  # drought searches
  # -------------------------
  # NOTE: "drought" is a cascade, not one variable. ISIMIP offers (a) a ready-made
  # exposure layer (Lange 2020 derived output) and (b) the raw hydrologic building
  # blocks in the water sector from which SPI/SPEI/soil-moisture drought is computed.
  # Counts below are floor values: the CLI listing caps at 20 rows per query.
  drought:
    last_searched: "2026-07-24"

    exposure_lange2020:
      description: "Pre-computed extreme-event exposure (Lange et al. 2020, Earth's Future). Drought = land fraction where monthly soil moisture falls below the 2.5th percentile of the preindustrial baseline."
      type: "DerivedOutputData (annual, ready to process)"
      # AUTHORITATIVE ENUMERATED FAMILY — verified 2026-07-24 via paginated datasets API.
      # Lange 2020 covers SIX hazard categories; the code is always 'le' + ONE letter.
      # DO NOT GUESS codes. A prior session guessed 'letc' for tropical cyclone, got 0
      # hits, and wrongly concluded TC exposure didn't exist — the real code is 'let'.
      # This family ALSO answers searches for tropical-cyclone / heatwave / river-flood /
      # wildfire / crop-failure exposure, not only drought.
      family:
        led: {hazard: "drought",         datasets: 219, impact_models: "8 GHM/land (clm45,h08,jules-w1,lpjml,mpi-hm,orchidee,pcr-globwb,watergap2)", data_nature: "binary {0,1} per cell (verified)"}
        ler: {hazard: "river flood",     datasets: 218, impact_models: "8 GHM/land (same set as led)"}
        lew: {hazard: "wildfire",        datasets: 134, impact_models: "5 DGVM/fire (caraib,lpj-guess,lpjml,orchidee,visit) x 4 GCMs; future rcp26=31/rcp60=19; data_nature UNVERIFIED. NOTE: this is the EXPOSURE member -- distinct from the direct 'burntarea' burnt-area-fraction fire output, which was the one actually processed (see search_results.wildfire)."}
        lec: {hazard: "crop failure",    datasets: 90,  impact_models: "gepic"}
        leh: {hazard: "heatwave",        datasets: 30,  impact_models: "hwmid-humidex (derived index)"}
        let: {hazard: "tropical cyclone", datasets: 28, impact_models: "ke-tg-meanfield (Emanuel KE wind model, derived)", data_nature: "FRACTIONAL area [0,1) per cell (verified 2026-07-24, NOT binary); 1 impact model x 4 GCMs = thin ensemble -> spatial smoothing applied"}
      not_real: ["letc", "lecdd", "letr"]  # guessed codes; each returns 0 hits
      common_coverage:  # identical across all six members
        product: "DerivedOutputData"
        simulation_round: "ISIMIP2b only (NO ISIMIP3b/SSP version of this family)"
        climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]  # 4 CMIP5 GCMs
        scenarios: ["historical", "picontrol", "rcp26", "rcp60"]  # NO rcp85, NO SSP
        timestep: "annual"
        grid: "global 0.5deg"
        data_nature: "VARIES BY HAZARD -- value-check each member before processing. led=binary{0,1} (verified), let=fractional[0,1) (verified 2026-07-24), ler/lew/lec/leh=UNVERIFIED. Decadal stat = MEAN either way (mean of binary flags OR mean of fractional area = expected annual exposed-area fraction)."
      isimip2b:
        led:
          # TRUE coverage via paginated API (CLI listing caps at 20): 219 datasets.
          impact_models: ["clm45", "h08", "jules-w1", "lpjml", "mpi-hm", "orchidee", "pcr-globwb", "watergap2"]  # 8 GHM/land models
          climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]  # 4 GCMs
          bias_adjustment: ["ewembi"]
          scenarios: ["historical", "picontrol", "rcp26", "rcp60"]  # NO rcp85/SSP
          timestep: "annual"
          period: "2006-2099 (some members extend to 2299 - not used)"
          future_members: "rcp26=31, rcp60=31 (mpi-hm missing 2 GCM combos)"
          data_nature: "BINARY per-cell annual flag {0,1}; fraction emerges on aggregation"
          processed: "2026-07-24 -> TCFD layer. See memory project_led_drought_layer, scripts/process_led_drought.py"
        lec:
          impact_models: ["gepic"]
          scenarios: ["historical", "picontrol", "rcp26", "rcp60"]
          timestep: "annual"
          datasets_seen: ">=20 (listing capped)"
      notes: |
        Most "drought-specific" off-the-shelf product in ISIMIP, and the whole family
        (led/ler/lew/lec/leh/let) shares the same structure so any member is processable
        with an adapted process_led_drought.py. All ISIMIP2b (EWEMBI, RCP, CMIP5 GCMs),
        annual, rcp26/rcp60 only. ISIMIP3b/SSP version of this family NOT found (0 hits).
        Processing status: led=DONE, let=DONE (2026-07-24; let uses 5x5 spatial
        smoothing + two-tier zero-inflated percentile, see process_let_cyclone.py).
        ler/lew/lec/leh remaining -- value-check binary-vs-fractional before each.
        For WILDFIRE the direct 'burntarea' fire output (NOT the lew exposure member)
        was chosen and processed 2026-07-24 -- see search_results.wildfire.

    hydrologic_building_blocks:
      description: "Raw water-sector variables for computing hydrological/agricultural drought. Most are ALREADY pulled/processed in the Water Risk Index."
      variables:
        soilmoist: "Soil moisture (agricultural/soil drought). NL search parser did NOT map 'soil moisture' -> use exact code 'soilmoist'."
        rootmoist: "Root-zone soil moisture. ALREADY in Water Index (WEB-DHM-SG)."
        dis: "River discharge; low-flow percentiles = hydrological drought. ALREADY in Water Index (5 models)."
        tws: "Total water storage (GRACE-like). ALREADY in Water Index (4 models)."
        potevap: "Potential ET; combine with precip for SPEI. ALREADY in Water Index (4 models)."
        qtot: "Total runoff. ISIMIP2a hist confirmed across 5 models (caraib, dlem, jules-b1, lpj-guess, lpjml), monthly, >=20 datasets. ISIMIP3b versions also exist."
        qs: "Surface runoff."
        qsb: "Subsurface runoff / baseflow (baseflow drought)."
        groundwstor: "Groundwater storage (groundwater drought)."
        swe: "Snow water equivalent (snow drought)."
        pr: "Precipitation (climate InputData) for SPI. = Water Index 'precip', the one remaining variable."
      notes: |
        A soil-moisture or water-balance drought index could be assembled largely
        from data already in hand (dis, tws, potevap, rootmoist), with precip pending.

    vegetation_impacts:
      description: "Ecological drought impacts (secondary indicators)."
      variables:
        npp: "Net primary productivity - declines under drought."
        gpp: "Gross primary productivity."
        burntarea: "Burnt area - drought-driven fire."
        ffire: "Fire carbon flux."
        yield-noirr: "Rainfed crop yields ({crop}-noirr) - drought-sensitive."
        aet: "Actual ET (growing-season water use)."
        gsprcp: "Growing-season precipitation."

  # -------------------------
  # wildfire searches (fire sector + biomes burntarea)
  # -------------------------
  wildfire:
    last_searched: "2026-08-08"
    description: "Wildfire has FIVE distinct ISIMIP representations -- enumerate all, don't assume the exposure family is the only option: (1) Lange2020 lew/pew exposure (2b), (2) its Zantout2025 SSP re-issue 'wildfire' (3b), (3) direct burntarea burnt-area fraction (2a/2b/3a/3b), (4) ffire emissions flux (3a/3b), (5) the ISIMIP3a fire sector's 10-model pool (no future scenarios)."
    products:
      lew_exposure:
        note: "Lange 2020 land-area-exposed-to-unprecedented-wildfire. See drought.exposure_lange2020.family (lew). Exposure framing; NOT processed. SSP re-issue exists -> see isimip3b_ssp_reissue_exposure below."
        enumerated: "2026-08-08 (ISIMIP2b/DerivedOutputData/Lange2020/{MODEL}/{gcm}/future/ -- note the 3-level depth and the leading 'lange2020_' filename token, which shifts every field by one)"
        matrix: |
          5 models x 4 GCMs = 19 members/scenario (visit has only 3 GCMs; VISIT/hadgem2-es is a genuine HTTP 404):
            caraib, lpj-guess, lpjml, orchidee -> gfdl-esm2m, hadgem2-es, ipsl-cm5a-lr, miroc5
            visit                              -> gfdl-esm2m, ipsl-cm5a-lr, miroc5
          scenarios: rcp26 + rcp60 ONLY (no rcp85 -- confirmed, matches the documented lew gap) + picontrol
          cadence annual 2006-2099; uniform 2005soc/co2; ~12 MB/file; 38 files for both scenarios (~456 MB)
          pew (population-exposed twin) has the same 19 members.
      burntarea:
        long_name: "Burnt area fraction (percent of grid cell burned per year)"
        note: "DIRECT biophysical fire output (the one processed 2026-07-24). API count for bare 'burntarea' = 1001 (TRUNCATED) -> enumerated per round."
        isimip2b:
          datasets: 648
          impact_models_all: ["caraib", "clm45", "lpj-guess", "lpjml", "mc2-usfs-r87g5c1", "orchidee-dgvm", "orchidee", "visit"]  # 8 models
          annual_models: ["lpj-guess", "lpjml", "mc2-usfs-r87g5c1"]  # only these 3 publish ANNUAL (263 annual datasets); the other 5 are monthly-only
          climate_forcings: ["gfdl-esm2m", "hadgem2-es", "ipsl-cm5a-lr", "miroc5"]
          scenarios: ["historical", "picontrol", "rcp26", "rcp60", "rcp85"]
          timesteps: ["monthly (385)", "annual (263)"]
          soc_variants: "many (1860soc/2005soc/rcpXXsoc/histsoc/nosoc); pin 2005soc (lpj-guess,lpjml) / nosoc (mc2-usfs) + co2 to isolate the climate signal"
          variable_form: "plain 'burntarea' (total); NO PFT suffixes in 2b"
          units: "% (percent of cell burned/yr) across all 3 annual models -- SAME unit"
          data_nature: |
            Continuous fraction in PERCENT [0,100], zero-inflated to varying degrees. Value-checked 2026-07-24:
            lpj-guess  units=% min=0.1 max=97 mean=0.71 zeros=0.00% (FLOORED at 0.1%, no true zeros; long_name MISLABELED 'Fire Return Interval' but data are burnt-%)
            lpjml      units=% min=0   max=80 mean=0.57 zeros=1.05% long_name='burnt area fraction'
            mc2-usfs   units=% min=0   max=100 mean=3.84 zeros=44.8% (coarse biome model, ~5-7x hotter outlier); TIME AXIS = 'days since 1661' (others 'years since')
        isimip3b:
          datasets: 560
          note: |
            RE-ENUMERATED 2026-08-08 from the file server; the previous note ("annual is single-model
            (mc2-usfs); thin/messy vs 2b") was compiled from the BIOMES sector only and understated the
            round. ISIMIP3b also has a dedicated OutputData/fire/ SECTOR (this catalog previously recorded
            the fire sector as ISIMIP3a-only).
          scenarios: ["ssp126", "ssp370", "ssp585", "historical", "picontrol"]
          sectors: ["fire", "biomes"]
          cross_sector_duplicate: |
            CRITICAL: fire and biomes publish the SAME burntarea files -- 2001 of 2031 basenames shared,
            and a spot-checked pair (visit gfdl-esm4 ssp370 monthly) returned identical Content-Length
            (101637650) and identical ETag ("639c4a8e-60ede12"). Ingest ONE sector only; taking both
            double-weights those models (same failure mode as elm-eca csoil-total in biomes+permafrost).
          burntarea_total_by_model: |
            model             GCMs                                                cadence         soc tokens (future)
            classic           2 (gfdl-esm4, ukesm1-0-ll)                          daily + monthly 2015soc, 2015soc-from-histsoc
            elm-eca           5 (gfdl,ipsl,mpi,mri,ukesm)                         monthly         2015soc-from-histsoc ONLY
            lpjml5-7-10-fire  5                                                   daily + monthly 1850soc, 2015soc, 2015soc-from-histsoc, nat
            visit             5                                                   monthly         2015soc ONLY (+ nat)
            mc2-usfs-r87g5c1  5                                                   ANNUAL          nat ONLY
            jules-es-vn6p3    -- publishes NO burntarea at all (0 files) despite appearing in the fire/ sector listing
          annual_availability: "mc2-usfs-r87g5c1 is the ONLY annual burntarea publisher in all of ISIMIP3b (fire UNION biomes). Every other model is monthly (classic/lpjml also daily)."
          soc_harmonization: |
            NO single soc token covers all four monthly models:
              2015soc                -> classic(2) + lpjml(5) + visit(5)   = 12 members/scenario
              2015soc-from-histsoc   -> classic(2) + elm-eca(5) + lpjml(5) = 12 members/scenario
                                        BUT classic/2015soc-from-histsoc is documented MIS-SCALED ACROSS
                                        GCMs within the one model (gfdl fraction-scaled, ukesm percent) --
                                        see isimip-process-visualize SKILL.md. Avoid.
              mixed per-model        -> classic+lpjml+visit @2015soc, elm-eca @2015soc-from-histsoc
                                        = 17 members/scenario (GUARDRAILS 9: user decision, record it)
            Extra sens variants seen: 2015co2, nondep, nondep2015co2, ssp585ndep, and lpjml varlightning (ukesm only).
          volumes_measured_2026_08_08: |
            monthly per file: lpjml 192 MB, visit 101 MB, elm-eca 96 MB
            candidate A (2015soc, 3 models x 12 members x 3 ssp = 36 files) = 4545 MB (~4.4 GB)
            adding elm-eca (mixed soc, 15 files @96 MB) -> ~5.8 GB, 17 members/scenario
            mc2-usfs annual: 12 MB/file, 15 files (5 GCM x 3 ssp) = ~180 MB
            classic daily: 153 MB per DECADE-chunk per member -> daily is ~30x monthly, not worth it
          coverage_caveat: "3b future runs start 2015 -> no complete 2010s decade; a 3b layer begins at the 2020s baseline."
      isimip3b_ssp_reissue_exposure:
        publication: "ISIMIP3b/DerivedOutputData/Zantout2025/"
        long_name: "wildfire -- land-area-exposed-to-unprecedented-wildfire, the SSP re-issue of the Lange2020 lew concept (named by hazard word, not le* code)"
        enumerated: "2026-08-08"
        matrix: |
          3 models x GCMs = 12 members/scenario, ANNUAL, 2015-2100, uniform 2015soc/default:
            classic           2 GCMs (gfdl-esm4, ukesm1-0-ll)
            lpjml5-7-10-fire  5 GCMs
            visit             5 GCMs
          scenarios: ssp126, ssp370, ssp585 (+ historical 1850-2014, picontrol)
          Sibling hazards in the same publication: cropfailure (240 files), heatwave (30, HWMID-NONE).
        volume_measured: "ALL 36 ssp files are exactly 425 MB -> 14 GB total (15307 MB). That is ~4.8x a 0.5deg float32 86-year field, so either float64/uncompressed storage or a finer-than-nominal grid -- EFFECTIVE RESOLUTION UNVERIFIED, measure at download."
        units_unverified: "Could not read CF attributes: a 4 MB HTTP range read of the header exposed only dims (lat/lon/time/bnds/time_bnds), variable 'wildfire', _FillValue -- no units/long_name in that range. The venv lacks fsspec/h5netcdf so no lazy open was possible. Value-check per GUARDRAILS 9 before processing."
      ffire:
        long_name: "Fire carbon emissions flux (kg C m-2 s-1), PFT-split"
        note: "797 datasets, ISIMIP3a/3b only (no 2b), mostly monthly, PFT-decomposed (ffire-c3crop...). Emissions metric -- least aligned with an asset-facing wildfire risk layer. 3b future publishers: classic, elm-eca, lpjml5-7-10-fire, visit (all monthly, ffire-total + PFT split)."
      isimip3a_fire_sector:
        enumerated: "2026-08-08"
        models: ["CLASSIC", "ELM-ECA", "JULES-INFERNO-VN6P3", "LPJ-GUESS-SIMFIRE-BLAZE", "LPJ-GUESS-SPITFIRE", "LPJmL5-7-10-fire", "MC2-USFS-r87g5c1", "ORCHIDEE-MICT", "SSiB4-TRIFFID-Fire", "VISIT"]
        note: |
          The DEEPEST fire-model pool anywhere in ISIMIP (10 models) -- but harvest of all 5924 files found
          ZERO ssp/rcp tokens: only histsoc / 2015soc under observational forcing (obsclim/counterclim).
          It CANNOT produce 2030s-2090s decadal projections. Value as a validation/benchmark reference for a
          projection layer, NOT as a TCFD layer source. (Do not re-derive this; it is measured, not assumed.)
    chosen_2026_08_08: |
      ISIMIP3b burntarea-total, ALL of it: 5 impact models x their CMIP6 GCMs = 22 members
      per scenario x {ssp126, ssp370, ssp585} = 66 files, 6.03 GiB. User decision: maximize
      ensemble members across BOTH GCMs and impact models, and prefer ssp over rcp.
      Monthly members SUMMED to annual totals (burnt area accumulates); mc2-usfs read as
      annual and pooled in. Mixed soc by necessity (elm-eca only 2015soc-from-histsoc,
      visit only 2015soc, mc2-usfs only nat); classic pinned to 2015soc to avoid its
      mis-scaled 2015soc-from-histsoc run. Uniform sens=default (transient CO2).
      Raw %, NO normalization, NO spatial smoothing, two-tier percentile, higher_is_worse.
    processed_2026_08_10: |
      -> TCFD layer. scripts/process_burntarea_isimip3b.py (+ download_burntarea_isimip3b.py).
      data/processed/wildfire-isimip3b_burntarea-total_annual/burntarea_{ssp126,ssp370,ssp585}_processed.nc
      test_shared_baseline.py: ALL CHECKS PASSED (2020s panel bit-identical across scenarios,
      0 CI violations, 0 ocean leak, baseline slopes NaN, n_members 1-22 / n_models 1-5).
      Land cells 70,849. Global-mean burnt 0.766% (2020s) -> 0.825 / 1.056 / 1.181 % by 2090s;
      2090s ols_slope +0.031 / +0.153 / +0.212 % dec-1. sen_slope is EXACTLY 0 on 66-76% of
      finite cells (zero-inflated) -> read ols_slope. See WORKFLOW-ISSUES.md 2026-08-10.
    chosen: "[SUPERSEDED for new work by chosen_2026_08_08 above; this is the 2b layer] burntarea, ISIMIP2b, annual, 3 models x 4 GCMs x {rcp26,rcp60,rcp85} = 36 members. Raw %, NO normalization (same unit), NO spatial smoothing (12/scenario is thick), baseline-anchored trend."
    processed: "2026-07-24 -> TCFD layer. scripts/process_burntarea_fire.py; data/processed/wildfire_burntarea_annual/burntarea_{rcp26,rcp60,rcp85}_processed.nc. Verified: global-mean burnt% flat rcp26, +6.6% rcp60, +14.8% rcp85 by 2090s. See memory project_burntarea_fire_layer, WORKFLOW-ISSUES.md 2026-07-24, GUARDRAILS §9-§10."

  # -------------------------
  # soil / subsurface carbon searches (biomes sector)
  # -------------------------
  soil_carbon:
    last_searched: "2026-07-25"
    description: "Subsurface / root-zone carbon. Lives in the biomes sector as carbon-pool STATE variables; there is no dedicated soil sector. Enumerate STOCKS (csoil soil, croot/cvegbg root-zone) vs the net-sink FLUX (nbp)."
    note: "Catalog's biomes_models variable lists were INCOMPLETE for carbon -> enumerated the file server directly (11 ISIMIP2b + 5 ISIMIP3b biomes models). The data.isimip.org API is behind Anubis anti-bot -> use files.isimip.org + curl (WebFetch truncates long listings). See GUARDRAILS §8."
    variables:
      csoil: "Soil organic carbon stock (kg C m-2) -- the direct subsurface storage pool. Bulk = 'csoil-total' (CLASSIC PFT-split, JULES RothC pool-split, MC2 single)."
      croot: "Root biomass carbon (kg C m-2). ISIMIP3b only; NOT in ISIMIP2b future runs."
      cvegbg: "Below-ground vegetation carbon (roots + below-ground woody); cvegag = above-ground. ISIMIP2b: JULES-ES-55, MC2-USFS. ISIMIP3b: CLASSIC, JULES, MC2, ELM-ECA."
      nbp: "Net Biome Production = net land carbon-sink flux (kg C m-2 s-1) = sequestration RATE. ISIMIP3b (all 5 biomes models); NOT in ISIMIP2b future."
    availability:
      isimip2b:  # RCP26/60/85, CMIP5; csoil broad but NO croot/nbp in future runs
        csoil_models: ["lpj-guess", "lpjml", "orchidee", "orchidee-dgvm", "caraib", "dlem", "jules-es-55", "mc2-usfs", "visit(monthly)"]  # ~8 annual + visit monthly
        cvegbg_models: ["jules-es-55", "mc2-usfs"]
        croot: "absent (future runs)"
        nbp: "absent (future runs)"
      isimip3b:  # SSP126/370/585, CMIP6 -- the FULL below-ground story
        csoil_annual: ["classic", "jules-es-vn6p3", "mc2-usfs"]   # + elm-eca, visit monthly-only
        croot_annual: ["classic", "jules-es-vn6p3", "mc2-usfs"]   # + elm-eca monthly
        cvegbg_annual: ["classic", "jules-es-vn6p3", "mc2-usfs"]  # + elm-eca monthly
        nbp: ["classic", "jules-es-vn6p3", "mc2-usfs", "elm-eca", "visit"]
    chosen: "csoil-total, ISIMIP3b, annual, {ssp126,ssp370,ssp585}. 12 members/scenario = classic(2 GCMs) + jules-es-vn6p3(5) + mc2-usfs(5). Raw kg C m-2, NO normalization (comparable magnitudes, same unit), NO spatial smoothing (thick), higher_is_better (risk=loss, percentile INVERTED), baseline-anchored trend. Layer starts at 2020s baseline (3b begins 2015)."
    co2_treatment: "MIXED (user decision 2026-07-25 to retain 12 members): jules-es-vn6p3 publishes ONLY the fixed-2015-CO2 (2015co2) csoil run; classic/mc2-usfs are transient (default). JULES's soil-C trend is muted (no fertilization). Land use fixed: 2015soc-from-histsoc (classic/jules) / nat (mc2-usfs). See GUARDRAILS §9."
    data_nature: |
      All 3 models report kg C m-2 with COMPARABLE magnitudes (2020s medians ~5.8/7.7/10.3), value-checked 2026-07-25:
      classic         kg C m-2  median 5.76  max 70.3  zeros 4.48% (desert/ice)  calendar=365_day
      jules-es-vn6p3  kg C m-2  median 10.28 max 67.9  zeros 0.00%               calendar=proleptic_gregorian
      mc2-usfs        kg C m-2  median 7.67  max 37.8  zeros 0.00% (coarse biome model, nat soc)  calendar=365_day
      Time axis 'days since 1601' for ALL; only the calendar differs -> calendar-aware year parse.
    processed: "2026-07-25 -> TCFD layer. scripts/process_csoil_soilcarbon.py; data/processed/soilcarbon_csoil_annual/csoil_{ssp126,ssp370,ssp585}_processed.nc. Verified: CI ordering 100%, baseline bit-identical, trend<->change corr 1.0, global-mean csoil +1.1% ssp126 / -1.4% ssp370 / -2.2% ssp585 by 2090s. See memory project_csoil_soilcarbon_layer, WORKFLOW-ISSUES.md 2026-07-25, GUARDRAILS §8-§9."

  # -------------------------
  # biodiversity searches (BioScen1.5)
  # -------------------------
  biodiversity:
    last_searched: "2026-07-22"

    isimip2b:
      project: "BioScen1.5"
      sectors: ["biodiversity"]
      impact_models:
        - "BioScen15-SDM-GAM"   # stacked species distribution model, GAM algorithm
        - "BioScen15-SDM-GBM"   # stacked species distribution model, GBM algorithm
        - "BioScen15-MEM-GAM"   # macroecological richness model, GAM algorithm
        - "BioScen15-MEM-GBM"   # macroecological richness model, GBM algorithm
      not_archived: "BioScen1.5-SDM-MaxEnt (impact model registered on isimip.org, no output on file server)"
      climate_forcings: ["GFDL-ESM2M", "HadGEM2-ES", "IPSL-CM5A-LR", "MIROC5"]  # 4 GCMs
      bias_adjustment: ["EWEMBI"]
      scenarios:
        climate: ["rcp26", "rcp60"]   # NO rcp85; historical + pre-industrial baselines also present
        soc: ["nosoc"]
        sens: ["co2"]
      temporal:
        resolution: "30-year running mean"
        future_period: "2009-2080 (10 time slices)"
        historical: "single 30yr-mean labeled 1990"
        preindustrial: "baseline slice present"
      spatial:
        resolution: "0.5 degree"
        grid: "720 x 360"
        coverage: "global"
      taxa:
        - "amphibians (2964 species)"
        - "birds (8493 species)"
        - "mammals (4039 species)"
      variables:
        sdm: ["{taxon}sumprob", "end{taxon}sumprob (endemic subset)", "thr{taxon}sumprob (IUCN-threatened subset)"]
        sdm_note: "SDM-GAM archives all/endemic/threatened; SDM-GBM archives all-species only"
        mem: ["{taxon}sr"]
        internal_dispersal_layers: ["presence (no dispersal)", "dispersal1-4 (d/2, d, 2d buffers)", "fulldisp (unlimited)"]
      units:
        sdm: "summed probability of occurrence per cell (species-richness proxy)"
        mem: "species richness (count) per cell"
      notes: >
        BioScen1.5. SDM = stacked single-species distribution models (15496 vertebrates) summed to a
        richness proxy; MEM = macroecological model of community richness. ISIMIP2b only (no ISIMIP3b
        biodiversity output). Refs: Biber et al. 2019 J. Biogeography; Warren et al. 2018.

