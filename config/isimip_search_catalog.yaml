        variables: "11 -- hurs huss pr prsn ps rlds rsds sfcwind tas tasmax tasmin"
        matrix: >-
          VERIFIED PER GCM 2026-08-14 (not sampled): every one of the 5 GCMs publishes all
          11 variables in 9 decade chunks for each of ssp126/ssp370/ssp585 = 99 files.
