        resolution_is_the_surprise: >-
          CHELSA-W5E5 is 30/90/1800 arcsec, NOT 0.5 deg -- daily tasmax/tasmin/tas/pr/rsds
          1979-2016 in monthly files, 1,824 files per variable across the resolutions, and
