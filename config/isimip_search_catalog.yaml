        Historical data only (1980-2012). No future projections available.
        CLM-Crop is the ONLY model with cotton in ISIMIP.
        Harmonization variants: default (recommended), fullharm, harmnon.
        Irrigation: firr (fully irrigated), noirr (rainfed).

    isimip3a:
      total_datasets: 2
      type: "InputData (crop calendars only, not simulation outputs)"
      files:
        - ggcmi-crop-calendar-phase3_2015soc_cot_firr.nc
        - ggcmi-crop-calendar-phase3_2015soc_cot_noirr.nc
      notes: "Crop calendar inputs for cotton planting/harvest timing. Not yield data."

    isimip3b:
      total_datasets: 0
      notes: "Cotton NOT simulated in ISIMIP3b. No future projections available."

  # -------------------------
  # sugarcane (agriculture sector)
  # -------------------------
  sugarcane:
    last_searched: "2026-08-11"
    notes: >
      OUTPUT crop code is 'sug' (NOT 'sgc' -- 'sgc' is the ISIMIP3b crop-calendar InputData
      code and no 3b model publishes output for it). Enumerated exhaustively: ISIMIP3b (63
      model x GCM future/ dirs), ISIMIP2b (4 models x 4 GCMs, future/ + historical/),
      ISIMIP3a (13 models, gswp3-w5e5 historical/), ISIMIP2a (24 models, one forcing each;
      all forcings for the two models that carry 'sug'). File sizes ~3.8-4.0 MB each.

    isimip3b:
      total_datasets: 0
      notes: >
        NO sugarcane output. 3b agriculture publishes 11 crops only
        (bea cas mai mil pot ri1 ri2 sor soy swh wwh). 'sgc' exists solely as
        InputData/socioeconomic/crop_calendar/{soc}/*_sgc_{firr,noirr}.nc.
        Jaegermeyr2021 DerivedOutputData is yieldchange-{mai,ric,soy,whe} only.

    isimip2b:
      total_datasets: 44   # all sug metrics, 4 GCMs, future/ + historical/
      sectors: ["agriculture"]
      impact_models: ["LPJmL"]     # ONLY model with sugarcane; CLM45/GEPIC/PEPIC have none
      climate_forcings: ["GFDL-ESM2M", "HadGEM2-ES", "IPSL-CM5A-LR", "MIROC5"]
      bias_adjustment: ["ewembi"]
      scenarios:
        # CORRECTED 2026-08-11: rcp85 DOES exist in 2b agriculture -- CLM45 publishes it for
        # mai + soy only. Sugarcane (LPJmL) genuinely has no rcp85. Scope the negative.
        climate: ["rcp26", "rcp60", "historical", "picontrol"]   # no rcp85 for THIS crop
        soc: ["2005soc"]
        sensitivity: ["co2", "2005co2"]   # 2005co2 for rcp26 only
      temporal:
        resolution: "annual"
        period: "2006-2099 (future), 1861-2005 (historical)"
      spatial:
        resolution: "0.5 degree (declared)"
        coverage: "global"
      variables_available:
        - yield-sug-firr
        - yield-sug-noirr
        - biom-sug-{firr,noirr}
        - aet-sug-{firr,noirr}
        - plantday-sug-{firr,noirr}
        - matyday-sug-{firr,noirr}
        - pirrww-sug-firr
      notes: >
        4 members per scenario per irrigation regime (1 impact model x 4 GCMs) -- thin
        ensemble. Yield files are ~3.9 MB; a rcp26+rcp60 x firr+noirr pull is 16 files
        (~62 MB). No .json sidecars in 2b agriculture (404) -- verify by HTTP status.

    isimip2a:
      total_datasets: ~35   # sug files across LPJmL (4 forcings) + CLM-Crop (watch-wfdei)
      sectors: ["agriculture"]
      impact_models: ["LPJmL", "CLM-Crop"]
      climate_forcings: ["GSWP3", "Princeton", "WATCH", "WATCH-WFDEI"]  # CLM-Crop: WATCH-WFDEI only
      bias_adjustment: ["nobc"]
      scenarios:
        climate: ["hist"]
        harmonization: ["default", "harmnon", "fullharm"]   # fullharm CLM-Crop only
      temporal:
        resolution: "annual"
        period: "1971-2012 (LPJmL, varies by forcing); 1980-2012 (CLM-Crop)"
      notes: "Historical only -- no scenarios. Useful for evaluation/baseline, not projection."

  # -------------------------
  # cassava (agriculture sector)
  # -------------------------
  cassava:
    last_searched: "2026-08-11"
    notes: >
      Crop code 'cas'. Botanically a perennial shrub, cultivated as a rainfed tropical root
      crop -- the closest thing ISIMIP has to a tropical smallholder perennial, though it is
      simulated on an annual harvest cycle like every other GGCMI crop.

    isimip3b:
      total_datasets: 40   # yield only: 5 GCMs x 2 scenarios x 2 sens x 2 irrigation
      sectors: ["agriculture"]
      impact_models: ["LPJmL"]     # only 3b model with cassava
      climate_forcings: ["GFDL-ESM4", "IPSL-CM6A-LR", "MPI-ESM1-2-HR", "MRI-ESM2-0", "UKESM1-0-LL"]
      bias_adjustment: ["w5e5"]
      scenarios:
        # Scenario coverage is per (crop, METRIC), not per crop: yield-cas is ssp126/ssp585
        # only, while biom-cas and nleachcum-cas DO carry ssp370. Aggregating scenarios over
        # metrics hides the gap in the one variable the layer needs.
        climate: ["ssp126", "ssp585"]      # yield only; biom-cas also has ssp370
        soc: ["2015soc"]
        sensitivity: ["default", "2015co2"]
      temporal:
        resolution: "annual-gs"            # growing-season annual, NOT plain 'annual'
        period: "2015-2100"
      spatial:
        resolution: "0.5 degree (declared)"
        coverage: "global"
      variables_available:
        - yield-cas-firr
        - yield-cas-noirr
      notes: >
        5 members per scenario per irrigation regime. Missing ssp370 -- the mid-range
        scenario other shipped 3b layers carry -- so a 3-scenario layer is not possible
        from cassava alone.

    isimip2b:
      impact_models: ["LPJmL"]
      scenarios: {climate: ["rcp26", "rcp60", "historical", "picontrol"], soc: ["2005soc"]}
      temporal: {resolution: "annual", period: "2006-2099"}
      notes: "Same LPJmL-only pattern as sugarcane in this round; 4 GCMs."

    isimip2a:
      impact_models: ["CGMS-WOFOST", "LPJ-GUESS", "LPJmL"]
      notes: "Historical only."

# -----------------------------------------------------------------------------
# SEARCHES WITH NO/LIMITED RESULTS
# -----------------------------------------------------------------------------
negative_results:

  timber_yield:
    searched: "2026-01-15"
    result: "No direct timber yield variable in ISIMIP"
    recommendation: "Use cwood or npp as proxy"

  oak_species:
    searched: "2026-01-15"
    result: "No Quercus species in ISIMIP2b forestry sector"
    available_species: ["fasy", "piab", "pipi", "pisy"]
    recommendation: "Use PFT dcdcldbdltr (deciduous broadleaf) as oak proxy in global models"

  stem_volume:
    searched: "2026-01-15"
    result: "No stem volume variable in ISIMIP"
    recommendation: "Derive from cwood using carbon-to-volume conversions"

  coffee:
    searched: "2026-08-11"
    result: "Coffee does not exist anywhere in ISIMIP. Zero files, all rounds."
    evidence: >
      No 'cof'/'coffee' token in: ISIMIP3b agriculture (63 model x GCM future/ listings),
      ISIMIP2b agriculture (4 models x 4 GCMs, future/ + historical/), ISIMIP3a (13 models),
      ISIMIP2a (24 models, one forcing sampled each). Not in the protocol either -- the
      ISIMIP3b crop_calendar InputData vocabulary is 20 crops
      (bar bea cas cot mai mil nut pea pot rap ri1 ri2 rye sgb sgc sor soy sun swh wwh),
      no coffee. DerivedOutputData checked: Jaegermeyr2021 (yieldchange, 4 crops),
      Zantout2025 (cropfailure/heatwave/wildfire), Heinicke2026, TipESM2025, Lange2020,
      Zimmer2023 -- none crop-specific to coffee.
    structural_reason: >
      ISIMIP agriculture (GGCMI) simulates annual field crops on a growing-season cycle.
      No perennial tree/shrub crop of any kind is represented (no coffee, cocoa, oil palm,
      citrus, grape). The forestry sector covers 9 European timber species, none tropical.
    proxies_if_needed: >
      Nothing crop-specific. Options are generic: Zantout2025 'cropfailure' exposure
      (3b, ssp126/370/585), biomes-sector tropical evergreen broadleaf NPP/GPP/cveg,
      or growing-season climate diagnostics attached to another crop's calendar.
      All require the user's framing decision -- none is a coffee yield.
      See negative_results.perennial_crops for the c3per land-use class, which is the
      only place coffee's harvested AREA is represented (aggregated, not coffee-specific).

  perennial_crops:
    searched: "2026-08-11"
    result: >
      No perennial/tree crop yield exists anywhere in ISIMIP -- not cocoa, oil palm,
      almonds, olives, grapes, citrus, tea, rubber, banana, coconut or coffee.
    evidence: >
      Zero matches for any perennial crop token across every agriculture listing
      enumerated 2026-08-11 (3b: 63 model x GCM future dirs; 2b: 4 models x 4 GCMs
      future + historical; 3a: 13 models; 2a: 24 models). Sector lists confirm there is
      no permanent-crop / orchard / plantation sector in any round: 2a
      (agriculture biodiversity biomes forestry lakes marine-fishery permafrost water),
      2b (as 2a plus health, lakes_local), 3a (agriculture biomes fire lakes peat
      permafrost water), 3b (agriculture biomes fire lakes marine-fishery permafrost water).
    structural_reason: >
      GGCMI simulates annual field crops on a plant-to-harvest growing-season cycle. A
      perennial's multi-year carbon carryover, establishment lag and orchard lifetime are
      not represented. The forestry sector is the only tree sector and it is 9 European
      stand SITES (bily-kriz collelongo hyytiala kroof le-bray peitz solling-beech
      solling-spruce soro) with 10 models -- temperate/boreal, not griddable, no tree crops.
    where_perennials_do_appear:
      landuse_area:
        product: "InputData/socioeconomic/landuse (LUH2-based), NOT an impact-model output"
        variables:
          c3per_rainfed_food: "rainfed others perennial -- cocoa, oil palm, almonds, coffee, citrus, grapes aggregated"
          c3per_irrigated_food: "irrigated others perennial"
          c4per_rainfed_food: "rainfed sugarcane"
          c4per_irrigated_food: "irrigated sugarcane"
          c3per_rainfed_bf: "rainfed bioenergy trees"
          c4per_rainfed_bf: "rainfed bioenergy grass"
        units: "1 (grid-cell area fraction)"
        isimip3b: >
          landuse-15crops, 35 variables, annual 2015-2100, ~368 MB/file. Two land-use
          models (image, magpie) x ssp126/ssp370/ssp585 x {soc-noadapt (1 file per LU
          model), soc-adapt (one file per GCM, 5 GCMs)}. Also histsoc 1850-2014, 2015soc.
        isimip2b: >
          landuse-15crops, 35 variables, annual 2006-2099, ~344 MB/file, per GCM
          (gfdl-esm2m hadgem2-es ipsl-cm5a-lr miroc5) x {rcp26soc, rcp60soc}; plus
          histsoc, 2005soc, 1860soc, 2100rcp26soc.
        caveat: >
          This is IAM land-allocation forcing, not a climate-impact response. It carries no
          yield and no per-species detail. Verified from .json sidecars in both rounds
          (2b sidecar names DROP the .nc4: {stem}.json, not {stem}.nc4.json).
      cropland_aggregate_outputs:
        sector: "biomes (ISIMIP3b), enumerated per model 2026-08-11"
        LPJmL5-7-10-fire: "cveg/cvegag/cvegbg-crop-{cirr,noirr}, pft-crop-{cirr,noirr}, fcropharvest-total"
        JULES-ES-VN6P3: "npp/gpp/cveg/cwood/lai/fapar-c3crop|c4crop (+N pools), fcropharvest-total"
        CLASSIC: "npp/gpp/cveg/cwood/csoil/burntarea/ffire-c3crop|c4crop, pft-c3crop|c4crop"
        ELM-ECA: "none"
        VISIT: "none"
        MC2-USFS-r87g5c1: "none (biome presence classes only)"
        caveat: "Aggregated over ALL crops by photosynthetic pathway or irrigation regime; no perennial class."

  cotton_future:
    searched: "2026-01-20"
    result: "No future cotton yield projections in ISIMIP3b"
    historical_available: "Yes - ISIMIP2a CLM-Crop model (1980-2012), 63 datasets"
    recommendation: "Use ISIMIP2a historical data for baseline. For future projections, consider proxy crops (sorghum, maize as C4 plants) or external sources (AgMIP, FAO)."

# -----------------------------------------------------------------------------
# GLOBAL MODELS (BIOMES SECTOR) - PREFERRED FOR CONSISTENCY
# -----------------------------------------------------------------------------
global_models:
  isimip3b:
    - name: "CLASSIC"
      description: "Canadian Land Surface Scheme Including Biogeochemical Cycles"
      sectors: ["biomes", "fire"]
      variables: ["npp", "gpp", "cwood", "cleaf", "cveg", "burntarea", "ch4"]

  isimip2b:
    - name: "CARAIB"
      description: "CARbon Assimilation In the Biosphere"
      sectors: ["biomes"]
      variables: ["npp", "cveg", "gpp"]

    - name: "LPJmL"
      description: "Lund-Potsdam-Jena managed Land"
      sectors: ["agriculture"]  # mainly agriculture in ISIMIP3b
      variables: ["yield"]
      notes: "Agriculture sector only in ISIMIP3b, not biomes"

  isimip2a:
    - name: "CLM-Crop"
      description: "Community Land Model - Crop component"
      sectors: ["agriculture"]
      climate_forcings: ["WATCH-WFDEI"]
      crops_available:
        - cot  # Cotton (unique to this model in ISIMIP2a)
        - mai
        - ric
        - soy
        - swh
        - wwh
      variables: ["yield", "biom", "aet", "gsprcp", "gsrsds", "sumt", "plantday", "matyday", "initr", "leach", "pirrww"]
      notes: "Only agriculture model with cotton. Uses harmonization suffixes: default, fullharm, harmnon"

    - name: "CGMS-WOFOST"
      description: "Crop Growth Monitoring System - World Food Studies"
      sectors: ["agriculture"]
      notes: "Does NOT include cotton"

    - name: "LPJ-GUESS"
      description: "Lund-Potsdam-Jena General Ecosystem Simulator"
      sectors: ["agriculture"]
      notes: "Does NOT include cotton"

# -----------------------------------------------------------------------------
# CLIMATE FORCINGS (GCMs)
# -----------------------------------------------------------------------------
climate_forcings:
  isimip3b:
    - GFDL-ESM4
    - IPSL-CM6A-LR
    - MRI-ESM2-0
    - UKESM1-0-LL
    - MPI-ESM1-2-HR

  isimip2b:
    - GFDL-ESM2M
    - HadGEM2-ES
    - IPSL-CM5A-LR
    - MIROC5

  isimip2a:
    - GSWP3
    - WATCH
    - PGMFD
    - WFDEI

# -----------------------------------------------------------------------------
# BIOMES SECTOR - COMPLETE MODEL REGISTRY
# -----------------------------------------------------------------------------
# This section documents ALL biomes models across simulation rounds with their
# PFT (Plant Functional Type) naming schemes. Different models use different
# PFT classifications - some generic, some climate-zone specific.
#
# ALWAYS CHECK MULTIPLE MODELS when searching for vegetation data.
# Generic PFTs (like CLASSIC's evgndltr) may miss climate-specific data.

biomes_models:

  isimip3b:
    CLASSIC:
      full_name: "Canadian Land Surface Scheme Including Biogeochemical Cycles"
      impactmodels_url: "https://www.isimip.org/impactmodels/details/170/"
      pft_scheme: "generic"
      pft_naming: "short-code"
      climate_specificity: "NONE - all needleleaf combined"
      pfts:
        evgndltr: "Evergreen needleleaf trees (ALL conifers - boreal AND temperate)"
        dcdndltr: "Deciduous needleleaf trees (larch)"
        evgbdltr: "Evergreen broadleaf trees"
        dcdcldbdltr: "Deciduous cold-climate broadleaf trees (temperate hardwoods)"
        dcddrybdltr: "Deciduous dry-climate broadleaf trees"
        c3grass: "C3 grasses"
        c4grass: "C4 grasses"
        c3crop: "C3 crops"
        c4crop: "C4 crops"
        total: "All PFTs combined"
      variables: ["cwood", "cleaf", "cveg", "npp", "gpp", "ra", "rh", "burntarea"]
