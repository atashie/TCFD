  # Global historical landslide hazard -- added 2026-08-19, licence cleared same day.
  #
  # NOT AN OUTPUT-SPEC LAYER. It answers `observational-historical-v1`: no decade axis, no
  # slopes, no ensemble, one historical window (1980-2018). Lifted onto a single-period axis
  # at read time by spatial_extract.as_period_dataset; its rows carry scenario `observed`.
  # Do not compute a decadal change from it -- there is only one period, and no scenario.
  #
  # NOT AN ISIMIP LAYER. ISIMIP publishes no landslide output in any round and its
  # geo_conditions/ carries no slope, elevation or lithology, so the terrain factor cannot
  # come from ISIMIP at all. Receipt: isimip_search_catalog.yaml negative_results.landslide.
  # Options review: docs/landslide-data-options-2026-08-19.md
  #
  # ATTRIBUTION IS REQUIRED, NOT OPTIONAL. Cleared for our limited commercial use by user
  # determination 2026-08-19. "World Bank / GFDRR Global landslide hazard map, produced by
  # Arup (2021)" must appear wherever a value from this layer is published. The layer carries
  # it in `attribution_required`.
  #
  # THE PERCENTILE RANKS ON A DIFFERENT VARIABLE THAN THE CENTRAL VALUE, DELIBERATELY.
  # `median` is the rate over the cell's HAZARD-BEARING ground; `percentile` ranks on
  # `areal_mean_rate` over the WHOLE cell. Spearman between the two orderings is 0.34, so
  # this is not a rounding difference -- it changes essentially every score. The areal mean
  # is the defensible ranking (Apennines 74.2 vs 58.9; Cairo 1.4 vs 5.3 off a single pixel
  # covering 0.1% of the cell). A cell can therefore show median = 0 with a high percentile:
  # most of it is flat, the cell as a whole still carries substantial landslide activity.

  landslide-arup:
    folder: landslide-arup_rf-median_hist
    file_prefix: landslide-arup
    hazard: Landslide (rainfall-triggered)
    hazard_measure: Significant rainfall-triggered landslides per km2 per year, 1980-2018
    status: preferred
    recommended_slope: none
    recommended_slope_rationale: >-
      Not applicable. This layer publishes no slope: the source is a single map summarising
      1980-2018 with no annual series behind it, so a slope would have to be invented rather
      than estimated.
    relative_baseline: false
    # SIGNED OFF 2026-08-19 on reports/maps/landslide/landslide-qa.html, as an INITIAL
    # HIGH-LEVEL landslide risk mapping product. The sign-off covers the four QA panels and
    # the reference sites. It does not extend beyond screening use, and it does not make this
    # a projection -- there is no scenario axis. (Scope is a comment, not a field: LayerSpec
    # rejects unknown keys, so an extra attribute here breaks load_registry for EVERY layer.)
    qa_reviewed_on: "2026-08-19"
    delivery_note: >-
      SCREENING ONLY, AND RAINFALL-TRIGGERED ONLY. Slope stability turns on metres of terrain;
      a 0.25 deg cell is ~28 km and holds ~900 km2 of ground, of which a median 10.1% carries
      any landslide hazard at all (inter-quartile range 1.4%-42.4%). This ranks which sites
      merit a geotechnical investigation and cannot support a design decision or an
      asset-level loss estimate. Earthquake-triggered landsliding is excluded by scope --
      seismic triggering is stationary under every emissions pathway -- so totals here are
      lower than GIRI's or the Arup earthquake layer's. Historical only: it answers where
      significant landsliding HAS been frequent, not where it will become more frequent.
      Attribution to World Bank / GFDRR and Arup is required wherever a value is published.

  # Global very-large-hail occurrence -- added 2026-08-19.
  #
  # NOT AN OUTPUT-SPEC LAYER. It answers `observational-historical-v1`, like the tornado
  # ladder: no decade axis, no slopes, no ensemble, one window (1950-2023), scenario code
  # `observed`, lifted onto a single-period axis at read time. Do not compute a decadal
  # change from it -- there is only one period.
  #
  # NOT ISIMIP, and that is structural rather than a gap: every hail-environment index needs
  # CAPE, deep-layer shear and a freezing level, and the ISIMIP bias-adjusted forcing
  # publishes 11 SURFACE variables and nothing aloft. See negative_results.hail in
  # config/isimip_search_catalog.yaml.
  #
  # THE THRESHOLD IS THE THING TO ARGUE WITH. 5 cm is the violent tail; PV glass, roofing
  # and vehicle panels start failing around 2-3 cm. This layer ranks where the most violent
  # hail falls, NOT how often an asset meets hail that can damage it. A >=2 cm version would
  # be the more useful product and does not exist publicly -- see the parked licence
  # question at reports/maps/hail-vlh/essl_licence_query.md.
  #
  # 0.25 DEG ON THE ERA5 LATTICE, which is offset 0.125 deg from the tornado layers'
  # cell-centre grid. The two share no coordinate values; never union their masks.

  hail-vlh:
    folder: hail-vlh-archamo_ge5cm
    file_prefix: hail-vlh
    hazard: Hail
    hazard_measure: Expected annual number of hail >= 5 cm events per 0.25 deg grid box
    status: alternate
    recommended_slope: none
    recommended_slope_rationale: >-
      Not applicable. This layer publishes no slope. The source's own trend field exists and
      is CC BY, but fitting a slope ourselves would need the annual fields, which are
      CC BY-NC-ND and unusable here; republishing the source's trend is a different artifact
      from a slope we computed. Measured context, in the file's `trend_context_measured`:
      over covered land cells with any modelled VLH (n=241,491) 17.2% trend significantly at
      p<0.05, of which only 20.8% are positive.
    relative_baseline: false
    delivery_note: >-
      SCREENING ONLY. A hail swath is a few km across against a ~28 km cell, and the value is
      PER GRID BOX so it does not survive resampling -- `events_per_1e4km2_per_year` is
      carried for cross-latitude comparison. The window is the whole record, 1950-2023, not a
      recent decade, because the annual fields needed for a 2014-2023 window are under a
      licence this product cannot use. The interval is Poisson SAMPLING on the realised count,
      not uncertainty in AR-CHaMo, which is unquantified and larger outside Europe, the US and
      Australia where the model was trained.
    qa_reviewed_on: "2026-08-19"

blocked:
  sugarcane_yield-sug-firr_annual: >-
    WITHDRAWN 2026-08-11, upstream data defect. ISIMIP2b LPJmL simulates no sugarcane in the
    sugarcane belt (Sao Paulo, Uttar Pradesh, Queensland, Florida all sentinel-zero). Passes
    the output contract and means nothing.
  sugarcane_yield-sug-noirr_annual: >-
    WITHDRAWN 2026-08-11, same upstream data defect as the irrigated variant.

  # ---------------------------------------------------------------------------
  # Water stress -- ISIMIP3b WaterGAP2-2e. Added 2026-08-18.
  #
  # NOT ROUTED IN config/asset_catalog.yaml AND NOT COUNTED IN
  # config/hazard_taxonomy.yaml families.water-stress.covered_by. That is deliberate,
  # not an oversight: (a) a reference-site check found the Nile in Egypt reading
  # n_members = 0 despite 3,024 m3/s of natural flow, so the layer has a live defect;
  # (b) the routed metrics have NO SAFE POINT-EXTRACTION PATH yet -- delivery.py
  # Gaussian-blends four neighbours, which for a river-network variable can average
  # across unrelated catchments (scripts/utils/hydro_extract.py is the replacement and
  # is not wired in). Populating covered_by now would assert to a reader that the
  # demand-versus-supply question had been assessed and deliverable. It has not.
  # ---------------------------------------------------------------------------
  waterstress-3b-routed-annual:
    folder: waterstress-isimip3b
    file_prefix: R_ann
    hazard: Water stress
    hazard_measure: >-
      Upstream-accumulated potential withdrawal divided by naturalised river discharge,
      annual totals. Aqueduct-style baseline water stress; NOT SDG 6.4.2, which deducts
      an environmental flow requirement (out of scope this pass -- it is set by regional
      and legal context, not derivable from hydrology).
    status: development
    qa_reviewed_on: null
    recommended_slope: null
    recommended_slope_rationale: >-
      NOT YET MEASURED. Do not read either slope until it is. The field is CENSORED at
      the declared cap of 100 (0.084% of member-years for this metric), and OUTPUT-SPEC
      is explicit that where cells sit at a bound both estimators go to ~0 and AGREE --
      so the usual "disagreement means fragile" rule gives no warning here.
    relative_baseline: false
    delivery_note: >-
      NOT DELIVERABLE TO POINTS. Numerator and denominator are both upstream-accumulated,
      so the value describes the river at that node, not the site. Two consequences a
      reader will otherwise get wrong. First, THE ANSWER LEGITIMATELY VARIES ALONG A
      RIVER: the Indus reads 1.75 in its upper reach where irrigation withdrawal
      concentrates and 0.24 downstream where that same demand meets the full 5,117 m3/s
      of natural flow. Neither is the basin's number. Second, INTERBASIN TRANSFERS ARE
      INVISIBLE -- Las Vegas returns NO_RIVER_IN_BASIN because its water arrives from the
      Colorado through infrastructure this method cannot see, and refusing is correct.
      Supply is 1850soc, so the layer CANNOT SHOW THE BENEFIT OF RESERVOIR STORAGE: a
      well-dammed basin and an undammed one with the same natural flow read identically.
      ONE IMPACT MODEL -- the interval carries no structural uncertainty, and the omitted
      component was measured as large (68.4% inter-model ordering reversal; 29.7x spread
      on the Colorado). The model was chosen for best reproduction of observed
      loss-dominated flow, which is a SELECTION ON THE OUTCOME and must be stated as such.

  waterstress-3b-routed-month:
    folder: waterstress-isimip3b
    file_prefix: R_max
    hazard: Water stress
    hazard_measure: As waterstress-3b-routed-annual, reduced to the highest-stress month.
    status: development
    qa_reviewed_on: null
    recommended_slope: null
    recommended_slope_rationale: >-
      NOT YET MEASURED, and this metric has TWO reasons to be held back. It is censored
      at the cap on 2.47% of member-years -- thirty times the annual metric -- and the
      max-over-months reduction is a median of member-year maxima whose argmax month can
      switch between years and members, so a trend can appear where typical monthly
      stress is unchanged. Both need measuring before it ships.
    relative_baseline: false
    delivery_note: Inherits every caveat of waterstress-3b-routed-annual.

  waterstress-3b-local-annual:
    folder: waterstress-isimip3b
    file_prefix: L_ann
    hazard: Water stress (local self-sufficiency)
    hazard_measure: >-
      Cell-local potential withdrawal over locally generated runoff. A DIAGNOSTIC, not a
      water-stress layer.
    status: diagnostic
    qa_reviewed_on: null
    recommended_slope: null
    relative_baseline: false
    delivery_note: >-
      DO NOT DELIVER. This is the textbook grid-cell-WTA failure mode, retained only as a
      diagnostic: a site on a large river that generates no local runoff reads as
      infinitely stressed because its water arrives from upstream. Its blow-ups are ~3x
      more common than the routed metric's (0.28% vs 0.084% at the cap). It answers
      "could this cell supply itself?", which is a real question and not the one ESRS E3
      or CDP ask.

  waterstress-3b-local-month:
    folder: waterstress-isimip3b
    file_prefix: L_max
    hazard: Water stress (local self-sufficiency)
    hazard_measure: As waterstress-3b-local-annual, highest-stress month.
    status: diagnostic
    qa_reviewed_on: null
    recommended_slope: null
    relative_baseline: false
    delivery_note: DO NOT DELIVER. See waterstress-3b-local-annual, plus 2.69% censoring.
