    status: alternate
    qa_reviewed_on: '2026-08-20'
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 98.7-98.8% of active cells (2090s; measured 2026-08-14), sign
      agreement 1.0-1.2% -- the most collapsed of the three variants. READ ols_slope. Same
      max_pairs=50000 subsampling as the sibling variants.
    relative_baseline: false
    delivery_note: >-
      A COUNTERFACTUAL, NOT AN OBSERVATION: it assumes a 40-year flood-protection standard
      EVERYWHERE, including places that have no defences at all. Its value is as a uniform
      yardstick for comparing regions without the country-by-country variation FLOPROS
      carries, not as a description of any real place. Not an ordered midpoint between
      `none` and `flopros` -- the ranking reverses by region. Grid 0.25 deg, permanent water
      masked, percentile ranked against the flopros 2020s baseline, statistic
      `pooled_mean_zero_inflated` (median branch would leave 97.25% of cells at zero).

  flood-3b-none:
    folder: flood-isimip3b_fldfrcmax-none_annual
    file_prefix: fldfrcmax-none
    hazard: Riverine flood
    hazard_measure: Annual maximum flooded fraction of the cell, no defences assumed
    status: alternate
    qa_reviewed_on: '2026-08-20'
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      THE ONLY VARIANT WHERE THIS IS A JUDGEMENT RATHER THAN A READING OFF THE NUMBERS, and
      it is open to revision. Measured 2026-08-14: sen_slope == 0 on 33.9-38.1% of active
      cells -- NOT the collapse the protected variants show -- but ols/sen sign agreement is
      only 57.7-62.8%, so the two estimators disagree on roughly 40% of cells and those
      trends are not robust by our own dual-slope rule. ols_slope is chosen because the
      field is still substantially zero-inflated (17.5% of annual cell-years are exactly
      zero) and because the three variants share a percentile reference: reading sen here
      and ols on the siblings would put a third incomparability into a family built to be
      comparable. Both slopes are published; a user who wants the robust estimator on this
      variant has it, and should treat sign disagreement as the signal it is.
    relative_baseline: false
    delivery_note: >-
      THE RAW CLIMATE SIGNAL, WITH NO DEFENCES ASSUMED -- it therefore OVERSTATES residual
      risk anywhere flood protection exists, which is most developed floodplains. Measured
      2026-08-14, last decade: Amazon main stem 0.11496, Mekong delta 0.47296,
      Ganges-Brahmaputra 0.30458, Lower Mississippi 0.14505, Rhine 0.05909. Pair it with
      `flood-3b-flopros` rather than delivering it alone where defences are material.
      DEEPER ENSEMBLE THAN ITS SIBLINGS: 32 members from 7 impact models against 27 from 6,
      because CWATM publishes the unprotected field only -- so a none-minus-flopros
      difference mixes the defence effect with an ensemble change unless restricted to the
      common 27. PERCENTILE COMPRESSES AT THE TOP: ranked against the flopros 2020s
      baseline (a much lower distribution), this variant's median percentile is ~90 with
      ~11% of cells at 99 or above, against 50 and 1% on its own baseline. That is the
      accepted cost of cross-variant comparability, and it means percentile CONTRAST within
      this layer is weaker than its raw values suggest -- read the raw fraction alongside it.
      Grid 0.25 deg, permanent water masked, statistic `pooled_mean_zero_inflated` (taken
      for estimator consistency with the siblings; this variant's own median is healthy at
      13.31% zeros and did not require the deviation -- see `decadal_statistic_rationale`).

  # -------------------------------------------------------------------------------------
  # Soil organic carbon -- an ASSET-CONDITION layer pending a user decision, not a hazard.
  # -------------------------------------------------------------------------------------
  # Rebuilt 2026-08-14/15 after the 2026-07-25 output was lost from disk. It is the
  # entry-level indicator for the `soil-degradation` hazard family (more carbon = healthier
  # soil, less = degrading soil), but it is registered here WITHOUT that family's
  # `covered_by` being populated, because two things are still open and both are the user's:
  #
  #   1. HAZARD OR ASSET CONDITION? Like `conifer-npp` -- which this file's sibling
  #      `hazard_taxonomy.yaml` classifies under `non_hazard_layers` -- this is
  #      `higher_is_better` with an inverted percentile, and declining soil carbon reads more
  #      like the asset's condition than a hazard acting on it. Unless the asset IS the soil.
  #   2. NO ASSET TYPE ROUTES TO IT YET. Declaring hazard coverage before the asset->layer
  #      mapping exists produces exactly the failure hazard_taxonomy.yaml was built to
  #      prevent: a report listing soil degradation as assessed while delivering nothing.
  csoil:
    folder: soilcarbon_csoil_annual
    file_prefix: csoil
    hazard: Soil organic carbon
    hazard_measure: Soil organic carbon stock (subsurface storage pool)
    status: alternate
    qa_reviewed_on: null
    recommended_slope: sen_slope
    recommended_slope_rationale: >-
      MEASURED 2026-08-15 with --measure-slopes: 70,910 active cells, sen exactly zero on
      only 6.8%, sign agreement 70.3%. Sen has NOT collapsed, so the usual reason to fall
      back to ols does not apply -- this is one of only two layers (with `conifer-npp`) that
      reads sen_slope, and the only one in the ols-IS-BIASED regime rather than the
      sen-collapses regime. The two estimators disagree in SIGN on the global mean
      throughout: at ssp585 the 2050s panel reads ols -0.0119 against sen +0.0081, and by the
      2090s ols -0.0475 against sen -0.0072 kg m-2/dec. That is the signature OUTPUT-SPEC
      predicts for an ensemble whose between-member level offset (~68.7x the interannual SD)
      is large and whose member coverage is uneven: CLASSIC contributes 2 GCMs against 5 for
      each of the other three, and the four models' 2020s medians span 5.70 to 16.82 kg m-2,
      so ols absorbs those level offsets as trend. READ sen_slope.
      NOTE the 70.3% agreement is the LOWEST of any sen_slope layer (`conifer-npp` is 87.9%),
      so on nearly a third of active cells the two estimators disagree in sign -- which is
      the standing signal that a cell's trend is not robust. Do not quote a site-level trend
      here without checking both.
    relative_baseline: false
    delivery_note: >-
      NOT A SOIL-DEGRADATION LAYER, AND MUST NOT BE LABELLED ONE. Soil organic carbon is ONE
      of the ten degradation processes enumerated in recital 4 of Directive (EU) 2025/2360;
      it carries nothing about sealing, compaction, contamination, nutrient balance,
      acidification, salinisation or erosion, and no framework defines "soil degradation" as
      a climate hazard at all (ESRS E1 AR 11 names it and defines nothing). LAND USE IS HELD
      FIXED in every member, so the layer cannot see management-driven carbon loss, which is
      most of observed loss -- deliberate, because it isolates the climate signal, and a hard
      limit on any claim about soil condition in general. DIRECTION IS INVERTED: this is
      `higher_is_better`, so a LOW stock or a decline earns a HIGH risk percentile, exactly
      like `conifer-npp`; a Climate Score averaging it with hazard-exposure layers is mixing
      axes and must say so. The models agree on the ordering and disagree on the magnitude,
      most sharply in high-latitude organic soils, and only one of four projects large
      northern peat losses -- read the CI at high latitudes, not the median alone. The full
      statement is in the file's `interpretation_caveat`, which delivery exports.
      A ZERO-CARBON CELL SCORES AS MAXIMUM RISK, AND THAT IS AN ARTIFACT OF THE INVERSION,
      NOT A FINDING. Measured on the processed ssp585 file 2026-08-15: the Sahara reads 0.00
      kg m-2 at the 96th risk percentile, the Taklamakan 0.04 at the 93rd, and the Greenland
      ice sheet 0.00 at the 97th -- because `higher_is_better` maps a low stock to a high
      risk score, and a place that never held soil carbon holds the least of it. The ranking
      is arithmetically correct and the conclusion inverts: a desert or an ice sheet has
      nothing to lose, so it carries no soil-carbon RISK at all. This is the same class of
      trap as RELATIVE-BASELINE. Any delivery routing this layer must either restrict it to
      sites with soil worth losing or state plainly that a high percentile over a
      near-zero stock means "no soil carbon here", never "soil carbon is being lost here".
      Greenland is in the published footprint at all only because two of four models write 0
      over the ice sheet rather than NaN.

  heatdays-hd30:
    folder: heatdays-isimip3b_hd30_annual
    file_prefix: hd30
    hazard: Chronic heat
    hazard_measure: Days per year with daily maximum temperature above 30 C
    status: alternate
    qa_reviewed_on: '2026-08-16'
    recommended_slope: ols_slope
    recommended_slope_rationale: 'ols_slope, decided by which estimator CAN fail on this layer rather
      than by a threshold. (1) ols_slope''s documented failure mode requires UNEVEN member coverage,
      and coverage here is exactly 12 members in EVERY cell of every rung and scenario -- so the bias
      has no mechanism. (2) sen_slope collapses to exactly 0 where most year-pairs are tied, which on
      a threshold count happens wherever the threshold is rarely crossed: measured 18.1%-31.6% of ACTIVE
      cells (either slope non-zero) across all 3 scenarios and every post-baseline panel. One estimator
      across the ladder, for the same reason it takes one statistic. BOTH slopes are in this file and
      their DISAGREEMENT remains the per-cell signal that a trend is not robust -- this names the headline,
      not the only number worth reading. NOTE the denominator: shares quoted over ALL FINITE cells run
      far higher because cells that never cross the threshold have both slopes correctly at 0 and are
      not Sen failures.'
    relative_baseline: false
    delivery_note: Absolute dry-bulb threshold count from ISIMIP3b bias-adjusted daily tasmax, 12 GCMs
      x 3 SSPs, no impact model in the chain -- the confidence band carries GCM spread and interannual
      variability only. THE ABSOLUTE COMPLEMENT TO `heatwave-3b`, NOT A SUBSTITUTE FOR IT. That layer
      scores departure from each cell's own preindustrial normal and ranks Chicago above Delhi; this
      one counts crossings of a fixed physical threshold. Measured over the 65,797 shared land cells,
      the 2020s rank correlation is +0.554 and the two agree on only 47.2% of their worst-decile cells,
      so screening on one gives a materially different site list than screening on the other. Deliver
      them together and say which question each answers. SATURATES at the calendar ceiling in the late
      century, where both slope estimators go to zero and AGREE -- a flat trend there means no headroom
      left, not stability.
