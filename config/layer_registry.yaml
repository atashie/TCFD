# TCFD layer registry -- the delivery-facing catalog of shipped hazard layers.
#
# THIS FILE NEVER RESTATES A FACT THE NetCDF ALREADY CARRIES.
#
# Units, decadal_statistic, percentile_direction, field_nature, ensemble composition,
# scenarios, decades and every caveat live in the processed file's global attributes and
# are read from it at delivery time. Duplicating them here would create a second source of
# truth that drifts silently the moment a layer is reprocessed. What this registry holds is
# only what the file CANNOT say about itself:
#
#   folder / file_prefix   where the layer lives on disk
#   hazard / measure       the customer-facing label for the hazard
#   status                 preferred | alternate | superseded | blocked
#   recommended_slope      which of the two slopes to READ (see below)
#   qa_reviewed_on         date a HUMAN read the QA warnings and viewed the maps
#
# `qa_reviewed_on: null` means nobody has confirmed that review, and the delivery surfaces
# it as "NOT CONFIRMED" in layers.csv and as a warning in the delivered README rather than
# staying quiet. Passing the output contract means a file is SHAPED right, not that its
# input is about what its name says -- both sugarcane layers passed every check and were
# meaningless. Set the date only after actually doing it.
# As of 2026-08-20 TWENTY-NINE layers carry a date: `heatwave-3b` (2026-08-14), the nine
# threshold rungs (2026-08-16), the ten precipitation layers (2026-08-19), `landslide-arup`
# (2026-08-19), `hail-vlh` (2026-08-19), the three riverine flood variants, the two
# drought siblings, and wildfire + tropical cyclone (all 2026-08-20).
# DATASET-ATTRIBUTES.md
# records what each of those reviews had in front of it -- a date whose evidence is not
# written down is worth little more than a null.
# The remaining ten are still null. Do NOT read their nulls as a formality, and do NOT
# infer that a layer sharing a processor with a reviewed one inherits its date: the review is
# of the DATA, not of the code that made it, and rungs from one processor have differed in
# zero-inflation, censoring and sparsity.
#
# Scenarios are NEVER listed here. They are globbed from disk per GUARDRAILS.md §3 --
# a hardcoded scenario list once made 25% of processed data invisible.
#
# ---------------------------------------------------------------------------------------
# recommended_slope
# ---------------------------------------------------------------------------------------
# values.csv carries BOTH ols_slope and sen_slope, so nothing is hidden. This field tells a
# downstream reader which one is trustworthy on THIS layer, because the two estimators fail
# in opposite regimes (OUTPUT-SPEC.md, "The two slopes"):
#
#   - sen_slope collapses to exactly 0 on zero-inflated hazards
#   - ols_slope absorbs member level offsets as trend when coverage is uneven
#
# Every rationale below is MEASURED, not asserted -- the sen==0 share and the sign-agreement
# share are computed on ACTIVE cells only (either slope non-zero) at the final decade, which
# is the view OUTPUT-SPEC requires. Judging on all cells dilutes both figures with ocean and
# with permanently-zero land and produces the opposite conclusion.
#
# Re-measure with: scripts/generate_customer_delivery.py --measure-slopes

registry_version: 1
measured_on: "2026-08-12"
processed_root: data/processed

layers:

  drought-3b:
    folder: drought-isimip3b_driedarea_annual
    file_prefix: driedarea
    hazard: Drought
    hazard_measure: Drought exposure frequency
    status: preferred
    qa_reviewed_on: '2026-08-20'
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 100.0% of active cells (2090s, 61,810 active of 63,455 finite;
      measured 2026-08-12). Sign agreement 0.0%. Sen carries no signal on this layer.
    relative_baseline: true
    relative_baseline_note: >-
      This layer scores how far soil-moisture conditions at a site depart from a fixed
      preindustrial reference, not how dry the site is. A permanently arid place whose
      regime has been stable scores LOW, and a historically reliable place whose regime has
      shifted scores HIGH. Read a high score as "this place is moving furthest from what it
      is built for", not as "this place is dry", and pair it with local water availability
      before drawing any conclusion about consequences.
    delivery_note: >-
      Sibling of drought-2b, not a replacement. See the must-disclose RELATIVE-BASELINE
      caveat for how to read the score.

  drought-2b:
    folder: drought_led_annual
    file_prefix: led
    hazard: Drought
    hazard_measure: Drought exposure frequency (ISIMIP2b/RCP)
    status: alternate
    qa_reviewed_on: '2026-08-20'
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 100.0% of active cells (2090s, 66,741 active of 68,116 finite;
      measured 2026-08-12). Sign agreement 0.0%.
    delivery_note: >-
      SIBLING of drought-3b, not a superseded version -- deeper ensemble (31 members,
      8 impact models) against older CMIP5 scenarios. Not selected by default: the standing
      preference is the more recent / more robust option, which is drought-3b. Select
      explicitly when RCP scenarios or ensemble depth is the requirement. See the
      must-disclose RELATIVE-BASELINE caveat for how to read the score.
      ARID CELLS ARE HAIR-TRIGGER ON THIS INDEX (measured at the 2026-08-20 QA review):
      the deep Sahara ranks at the 94th-99th percentile with 0.16->0.20 of years flagged
      by the 2090s, because the 2.5th-percentile threshold of a near-degenerate
      preindustrial soil-moisture distribution flags on tiny declines -- the same
      low-variance mechanism documented on heatwave-3b, in soil-moisture form. The
      sibling driedarea masks the deep desert out; this layer covers it. Pair an arid
      site's score with absolute water availability before reading it as drought risk.
    relative_baseline: true
    relative_baseline_note: >-
      This layer scores how far soil-moisture conditions at a site depart from a fixed
      preindustrial reference, not how dry the site is. A permanently arid place whose
      regime has been stable scores LOW, and a historically reliable place whose regime has
      shifted scores HIGH. Read a high score as "this place is moving furthest from what it
      is built for", not as "this place is dry", and pair it with local water availability
      before drawing any conclusion about consequences.

  cyclone:
    folder: cyclone_let_annual
    file_prefix: let
    hazard: Tropical cyclone
    hazard_measure: Land area fraction exposed to tropical cyclones
    status: preferred
    qa_reviewed_on: '2026-08-20'
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 97.4% of active cells (2090s, 20,337 active of 68,249 finite;
      measured 2026-08-12). Sign agreement 2.5%.
    delivery_note: >-
      SINGLE impact model (ke-tg-meanfield), so the CI is inter-GCM spread only and carries
      NO structural model uncertainty. Spatially smoothed with an L=2.5 kernel -- a declared
      deviation -- because the raw field is one-cell-wide storm tracks. Only ISIMIP2b/RCP
      exists; there is no SSP re-issue of TC exposure.

  wildfire:
    folder: wildfire-isimip3b_burntarea-total_annual
    file_prefix: burntarea
    hazard: Wildfire
    hazard_measure: Annual burnt area
    status: preferred
    qa_reviewed_on: '2026-08-20'
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 74.0% of active cells (2090s, 64,039 active of 70,849 finite;
      measured 2026-08-12). Sign agreement 22.6%. Higher than the layer's 29.2% grid-level
      zero fraction would suggest -- the collapse is in the year-pair differences, not the
      values, which is exactly why this is measured rather than inferred from field_nature.
    delivery_note: >-
      Values are NOT clipped at 100%: a cell that reburns within a year can legitimately
      exceed full coverage (measured annual maxima up to ~575% for elm-eca).

  conifer-npp:
    folder: conifer-temperate_npp-tempnle_annual
    file_prefix: npp-tempnle
    hazard: Timber productivity
    hazard_measure: Temperate conifer stand net primary productivity
    status: preferred
    qa_reviewed_on: null
    recommended_slope: sen_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on only 2.1% of active cells (2090s, 25,603 active of 25,714 finite;
      measured 2026-08-12) and sign agreement is 87.9%. The only shipped layer where the
      robust estimator is the correct read.
    delivery_note: >-
      higher_is_better -- the percentile is ALREADY INVERTED in the file, so rising
      productivity reads as falling risk. Reported PER TILE (per unit conifer-stand area)
      behind a 2%-cover presence mask, so a site with no modelled conifer stand returns
      OFF_LAYER_MASK rather than zero. Rising NPP is partly a CO2-fertilisation response and
      that caveat belongs in the narrative.

  cropfailure-3b:
    folder: cropfailure-isimip3b_cropfailure_annual
    file_prefix: cropfailure
    hazard: Crop failure
    hazard_measure: Cropland area share exposed to unprecedented crop failure
    status: preferred
    qa_reviewed_on: null
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 100.0% of active cells at ssp126 2090s (measured 2026-08-13).
      Zero-inflated field: most year-pairs are 0->0, so the robust estimator carries no
      signal at low forcing. It does lift slightly at higher forcing (ssp370 reaches
      ~7e-5/decade by the 2080s) as non-zero years become common, but ols_slope is the read
      on this layer at every tier.
    relative_baseline: true
    relative_baseline_note: >-
      This layer scores how far crop-failure conditions at a site depart from that site's
      OWN historical experience, not how bad conditions are in absolute terms. The
      difference reverses the ranking a reader expects. A reliably productive region with a
      narrow historical range crosses its own "unprecedented" threshold more readily than a
      region that has always been marginal and variable, so on this layer Iowa sits at the
      99.3rd percentile of world cropland while the Sahel sits at 69.4. That is the measure
      working as defined: the intensity of change relative to local norms is genuinely
      greater in Iowa, and a farming system built around a stable climate has further to
      fall. It is NOT a statement that Iowan agriculture is more fragile than Sahelian
      agriculture in absolute terms, and it says nothing about food security, yield levels,
      or a region's capacity to absorb a bad year. Read a high score as "this place is
      moving furthest from what it is built for", and pair it with local baseline
      productivity and adaptive capacity before drawing any conclusion about consequences.
    delivery_note: >-
      PUBLISHED ON A CROPLAND FOOTPRINT (39,890 cells, 42.4% of land), NOT on all land. A
      non-agricultural site returns OFF_LAYER_MASK rather than zero, and a percentile here
      is a rank AMONG CROPLAND, not among all land. The index carries NO CROP TOKEN and the
      publication's sidecar names only the variable, so which crops it aggregates is
      UNDOCUMENTED --
      material for any site-level use, since an index over crops a site does not grow is not
      that site's risk. See the must-disclose RELATIVE-BASELINE caveat for how to read the
      score itself.

  permafrost-3b:
    folder: permafrost-isimip3b_thawdepth_annual
    file_prefix: thawfrac
    hazard: Permafrost thaw
    hazard_measure: Thawed fraction of the modelled soil column, and its change against the 2020s
    # REGISTERED 2026-08-16, two days after the layer shipped. Commit 12b758a processed it,
    # documented it in DATASET-ATTRIBUTES.md and set families.permafrost-thaw.covered_by to
    # [permafrost-3b] -- and never added it here. Because coverage_summary() in
    # report_common.py scopes coverage to the layers a DELIVERY actually carries, an
    # unregistered layer can never be delivered, so every report would have listed permafrost
    # thaw under "hazards not assessed" while the taxonomy said it was covered. The blocker
    # enumerates what is still open on this hazard (the ISIMIP2b route, `tsl`, solifluction)
    # and registration was not among them: this was an omission, not a deferral.
    status: preferred
    qa_reviewed_on: null
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      MEASURED 2026-08-14: 14,455 active cells, sen exactly zero on 15.2%, sign agreement
      84.4%. Those two figures read like a well-behaved field on which either estimator would
      do, AND THEY ARE MISLEADING HERE -- this layer is the counter-example to "low sen==0
      means Sen is safe". On a MULTIMODAL ensemble (see the file's decadal_statistic_rationale)
      the pairwise sample Theil-Sen takes its median over is dominated by CROSS-CLUSTER pairs,
      whose slopes carry the between-cluster level offset rather than the trend, and the
      median over those pairs is dragged toward the flat cluster. Measured on ssp585 over the
      published footprint: the 12 members' own OLS trends span +0.0104 to +0.0826 dec-1, their
      mean is +0.0326, the published ols_slope is +0.0326 (exact), and sen_slope is +0.0069 --
      BELOW EVERY SINGLE MEMBER. An estimator outside the range of the things it summarises is
      not robust. READ ols_slope. Read it WITH the Anomaly panel: the file's slope_definition
      records that both slopes are censored where a column is fully thawed, so a flat slope
      there means "no permafrost left", not "no trend".
    relative_baseline: false
    relative_baseline_note: ""
    delivery_note: >-
      THE PERCENTILE IS RANKED WITHIN THE PERMAFROST FOOTPRINT, SO IT IS NOT ON THE SAME AXIS
      AS EVERY OTHER LAYER'S. The file says the rank is among permafrost cells; the delivery
      consequence is what matters here -- a Climate Score that averages this percentile with
      layers ranked against ALL LAND is averaging two different reference populations, and the
      95th percentile of 18.17 M km2 of permafrost is not the 95th percentile of the land
      surface. State the reference population wherever the number travels beside another
      layer's. A site outside the footprint is NaN by design and must render as OFF_LAYER_MASK,
      never as a low score: a place with no permafrost has no thaw hazard, which is an absence
      of the hazard, not safety from it.
      THE MODELS AGREE ON HOW MUCH AND DISAGREE ON WHERE, which is a limit on SITE-level use
      specifically. Over each model's own domain the 2090s ssp585 loss share is comparable
      (CLASSIC 31.0%, JULES 58.0%, LPJmL 32.3%), but on the cells CLASSIC and LPJmL BOTH call
      permafrost, CLASSIC loses 28.6% of them and LPJmL 4.0% -- a Jaccard overlap of 2.8%.
      Comparable totals, different maps. The regional and global figures are far better
      supported than any one cell, and the wide CI is reporting exactly this; read the CI, and
      do not quote a single site's loss without it.
      THIS IS NOT A GROUND-STABILITY LAYER and the delivery must not let it be read as one --
      the file's interpretation_caveat carries the full statement. A high-latitude asset owner
      asks whether the ground under a foundation, runway or pipeline will move; that needs
      ground ice and terrain, and ISIMIP publishes neither. Solifluction has no candidate
      variable in any ISIMIP sector at all. This layer says where permafrost is being lost, and
      nothing about what happens to a structure when it is.
      ONLY ONE PERMAFROST LAYER EXISTS. The ISIMIP2b route (5 models, 18 members at rcp26 and
      rcp60 but only 8 at rcp85) is un-ingested, so there is no RCP sibling and no cross-round
      comparison to offer.

  heatwave-3b:
    folder: heatwave-isimip3b_heatwave_annual
    file_prefix: heatwave
    hazard: Heatwave
    hazard_measure: Land area share exposed to unprecedented heat
    # SELECTED 2026-08-14 (user determination, after reviewing the dataset) as the heatwave
    # layer, over the ISIMIP2b `leh` alternative. The two are different indices, not
    # versions -- see heatwave-2b below and DATASET-ATTRIBUTES.md for the comparison.
    status: preferred
    qa_reviewed_on: "2026-08-14"
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 100.0% of active cells in every scenario's final panel (469,508 of
      471,940 active at ssp126; measured 2026-08-14), sign agreement 0.0%. The field is
      BINARY, so every pairwise difference is -1, 0 or +1 and same-valued pairs dominate --
      the same mechanism as `drought-2b`/`drought-3b`, not zero-inflation. READ ols_slope,
      but read it together with `median`: where the layer is saturated, ols_slope is
      censored toward zero and UNDERSTATES the hazard. The dual-slope disagreement rule
      does not protect you here -- at the ceiling both estimators agree at zero.
    relative_baseline: true
    relative_baseline_note: >-
      This layer scores how far a year's heat departs from that CELL'S OWN preindustrial
      distribution -- the annual HWMId exceeding the 97.5th percentile of its picontrol --
      not how hot it gets in absolute terms. A relative threshold is crossed sooner where
      interannual variance is LOW, and the tropics have the lowest temperature variance on
      the planet, so on the 2020s baseline |lat| <= 23.5 reads 0.561 against 0.149 for
      |lat| > 50, a 3.77x ratio before any warming has accumulated. Site example: Chicago
      0.688 sits ABOVE Delhi 0.548. Read a high score as "this place is moving furthest
      from its own historical normal", never as "this place is hotter".
    delivery_note: >-
      NOT A HEAT-STRESS INDEX. `HWMID-NONE` is the Heat Wave Magnitude Index daily with NO
      humidity term -- the ISIMIP2b predecessor `leh` additionally required Humidex >= 45 so
      that counted events "would also adversely affect human health", and Zantout et al.
      2025 drops that criterion. This layer therefore CANNOT support a wet-bulb,
      heat-stress, workforce-safety or equipment-derating claim, and any hazard copy that
      promises one must be rewritten before a delivery quotes it. It flags MORE area than
      `leh` in arid and high-latitude cells where the Humidex gate would never open.
      The layer also SATURATES at high forcing; that caveat travels automatically from the
      file's `saturation_caveat` attribute and is promoted to MUST-DISCLOSE, so a report
      cannot publish a censored trend silently. Published on a 67,420-cell land footprint;
      Antarctica is absent from the product.

  heatwave-2b:
    folder: heatwave-isimip2b_leh_annual
    file_prefix: leh
    hazard: Heatwave
    hazard_measure: Land area share exposed to health-threshold heatwave (HWMId + Humidex 45)
    # BUILT AND CONTRACT-PASSING, NOT CLEARED FOR DELIVERY. Sibling of heatwave-3b, not a
    # superseded version -- a DIFFERENT INDEX. No asset type references either one yet.
    status: blocked
    blocked_reason: >-
      NOT SELECTED. The 2026-08-14 determination went to `heatwave-3b`; this layer is
      retained, built and contract-passing, as the only health-anchored heat source in the
      repository rather than deleted. It stays BLOCKED for two reasons and either would
      have to be cleared before it ships: (1) it has had NO human QA review of its own --
      `qa_reviewed_on` is null, and the review that took place covered heatwave-3b; (2) it
      is SILENT over most of the extratropics (59.7% of land never registers a single
      exposed year in any member; 81% of the 35-60N belt, 99% of 60-90N; Paris, Frankfurt
      and Yakutsk are exactly zero in every member and every year), 71.5% of land sits in
      percentile tier 1, and its active footprint is substantially single-GCM -- only 8.4%
      of land is active in all four members, 22% of the active area resting on one GCM of
      four. Promoting it to `alternate` is a one-line change if a delivery needs an
      absolute, health-anchored heat reading and can carry the floor caveat.
    qa_reviewed_on: null
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 100.0% of active cells in both scenarios' final panels (155,507
      active at rcp26, 164,118 at rcp60; measured 2026-08-14), sign agreement 0.0%. The
      field is BINARY and extremely sparse, so same-valued pairs dominate every window.
      READ ols_slope. Unlike `heatwave-3b`, a zero here is a TRUE zero over a permanently
      silent cell rather than a censored one -- this layer has the opposite pathology.
    relative_baseline: true
    relative_baseline_note: >-
      This layer counts a year as exposed only when BOTH criteria fire: a RELATIVE heat
      index (HWMId, measured against the cell's own distribution) AND an ABSOLUTE
      humidity-aware threshold (Humidex reaching 45, inside Environment Canada's 40-45
      "great discomfort; avoid exertion" band). The absolute gate makes the counted events
      health-relevant, but the relative gate still has to open first, so a score here is
      neither pure departure-from-normal nor pure absolute heat. Read it as "years when
      this place was both unusually hot for itself and hot enough to harm people", and note
      that a ZERO means "never crossed the Humidex threshold", NOT "no heat risk".
    delivery_note: >-
      SPARSE BY CONSTRUCTION AND THAT IS THE POINT. 59.7% of land is silent across
      2006-2099 and both RCPs; the active footprint is a humid-heat belt (Central America,
      Amazon, Sahel and West Africa, Horn of Africa, Arabian Gulf, Indus/Ganges, maritime
      SE Asia, northern Australia). Only rcp26 and rcp60 exist -- there is NO high-forcing
      member -- and under rcp26 the global mean plateaus after the 2040s. A site outside
      the belt returns a real zero, so any delivery MUST render it as "below the health
      threshold this index measures" and never as "low heat risk". The source product has
      NO land mask (it zero-fills all 259,200 cells); the ISIMIP2b `LSM` mask is applied by
      the processor, so 67,420 land cells are published and nothing else.

  sealevel-2b:
    folder: coastal-inundation
    file_prefix: coastalinundation
    hazard: Sea level rise
    hazard_measure: Coastal land area fraction at or below projected sea level
    # Registered against the SEA-LEVEL-RISE hazard family, NOT flood-coastal (user decision
    # 2026-08-14). It answers permanent-inundation potential from MEAN sea level. There is
    # no tide, no storm surge and no wave setup in it, and most coastal damage happens at
    # extreme water levels well above mean sea level -- so filing it under coastal flood
    # would tell a reader the acute hazard had been assessed when it has not.
    status: preferred
    qa_reviewed_on: null
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 100.0% of active cells (2090s, 10,542 active of 18,964 finite;
      measured 2026-08-14). Sign agreement 0.0%. Sen carries no signal here: most coastal
      cells hold exactly zero exposure for most years, so same-valued pairs dominate every
      window. READ ols_slope.
    relative_baseline: false
    delivery_note: >-
      SCREENING RESOLUTION -- A REGIONAL RESULT, NOT A SITE RESULT. Published on 0.5 deg
      (~55 km); a site's value is its whole cell's value. Terrain is read at 15 arcsec and
      the within-cell elevation DISTRIBUTION is used rather than a cell mean, but sea level
      is one value per cell and connectivity is decided at ~1.85 km. Coastal inundation
      turns on metres of elevation over hundreds of metres of ground, so a quayside and a
      hillside in the same cell get the SAME number. Use it to rank which coastlines and
      sites deserve investigation; it cannot support a site-level conclusion, a design
      elevation or an asset-level financial estimate. Higher-resolution work is required for
      those, and is expected in future deliveries. This is a MUST-DISCLOSE caveat
      (RESOLUTION-SEALEVEL-2B), not an optional note.
      DERIVED, not an ISIMIP output: ISIMIP2b regional sea level (`sealevelrise` total, p50;
      Mengel et al. 2016) applied to GEBCO_2026 terrain, so it is the only layer built from
      two sources. SINGLE sea-level model forced by four CMIP5 GCMs, so the CI is inter-GCM
      spread only and carries NO structural model uncertainty. Its `percentile` is an
      ABSOLUTE calibration (0 m -> 100, 10 m LECZ bound -> 1), NOT the contract's
      percentile-of-score, so it is not on the same axis as other layers' percentiles and any
      Climate Score averaging them must say so. Read `sparsity_caveat` before drawing any
      conclusion from a zero -- the DEM understates absolute exposure and South Florida reads
      0.00000 at every decade.

  # -------------------------------------------------------------------------------------
  # Riverine flood -- THREE PROTECTION VARIANTS OF ONE PRODUCT, not three products.
  # -------------------------------------------------------------------------------------
  # Same model chain, same members, same grid; they differ only in the flood-protection
  # assumption applied. OUTPUT-SPEC has no protection dimension, so they are three layers.
  #
  # ALL THREE RANK AGAINST THE flopros 2020s BASELINE (user decision 2026-08-14), so a
  # percentile means the same thing across them. Every raw value -- median, CIs, both
  # slopes -- is the variant's own. Do not compare a percentile from these layers against
  # one from a layer outside this family without saying that the references differ.
  #
  # THE ENSEMBLES ARE NOT THE SAME SIZE: `none` has 32 members from 7 impact models, the
  # protected variants 27 from 6, because CWATM publishes the unprotected field only. A
  # `none` minus `flopros` difference therefore mixes a defence effect with an ensemble
  # change unless it is restricted to the common 27.

  flood-3b-flopros:
    folder: flood-isimip3b_fldfrcmax-flopros_annual
    file_prefix: fldfrcmax-flopros
    hazard: Riverine flood
    hazard_measure: Annual maximum flooded fraction of the cell, behind FLOPROS defences
    status: preferred
    qa_reviewed_on: '2026-08-20'
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 97.3-98.1% of active cells across the three scenarios (2090s;
      measured 2026-08-14), with ols/sen sign agreement 1.6-2.5%. Heavily zero-inflated
      behind defences -- most year-pairs are 0->0 -- so the robust estimator carries almost
      no signal. READ ols_slope. Theil-Sen pairs are subsampled at max_pairs=50000
      (deterministic, rng_seed=0); ols is unaffected by that cap and sen moves only at the
      1e-7 level, which is immaterial on a collapsed estimator. See the file's `slope_note`.
    relative_baseline: false
    delivery_note: >-
      A ZERO HERE MEANS "PROTECTED TO STANDARD", NOT "NO HAZARD". This variant applies the
      FLOPROS database of observed flood-protection standards, so a well-defended site reads
      at or near zero while its underlying hazard may be large: measured 2026-08-14, the
      Rhine (NL/DE) box falls from 0.05909 unprotected to 0.00122, and the Lower Mississippi
      from 0.14505 to 0.00358. Protection is held CONSTANT into the future, so the layer
      embeds a no-further-adaptation assumption and says nothing about defences being
      maintained, overtopped or breached. Where a customer needs the raw climate signal,
      deliver `flood-3b-none` alongside it -- and note that `flood-3b-40yr` is NOT an
      ordered midpoint between them: a uniform 40-year standard exceeds the empirical
      standard in some countries and falls short in others, so the ranking REVERSES by
      region (Amazon 0.01077 at 40yr vs 0.01607 at flopros; Ganges 0.06853 vs 0.05664).
      GRID: 0.25 deg (~28 km), NOT the 0.5 deg of most layers, so this layer's extraction
      window is proportionally smaller and its footprint figures differ -- see
      `manifest.json` `per_layer_geometry`. Permanent water (inland bodies, mostly the
      Caspian) is masked out. Statistic is `pooled_mean_zero_inflated`: measured on this
      variant, the median branch would leave 92.68% of published cells at exactly zero.

