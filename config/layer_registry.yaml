      them together and say which question each answers. DIRECTION: higher_is_worse on the frost/ice-day
      COUNT (user decision 2026-08-14), so this layer reports a hazard FALLING almost everywhere. A
      declining percentile here is the physical result, not a data defect. Note the opposite reading
      is also legitimate for some assets -- loss of reliable frost harms crops needing vernalisation
