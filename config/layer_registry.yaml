# TCFD layer registry -- the delivery-facing catalog of shipped hazard layers.
#
# THIS FILE NEVER RESTATES A FACT THE NetCDF ALREADY CARRIES.
#
# Units, decadal_statistic, percentile_direction, field_nature, ensemble composition,
# scenarios, decades and every caveat live in the processed file's global attributes and
# are read from it at delivery time. Duplicating them here would create a second source of
# truth that drifts silently the moment a layer is reprocessed. What this registry holds is
# only what the file CANNOT say about itself:
#
#   folder / file_prefix   where the layer lives on disk
#   hazard / measure       the customer-facing label for the hazard
#   status                 preferred | alternate | superseded | blocked
#   recommended_slope      which of the two slopes to READ (see below)
#   qa_reviewed_on         date a HUMAN read the QA warnings and viewed the maps
#
# `qa_reviewed_on: null` means nobody has confirmed that review. It is null on every layer
# below, and the delivery surfaces it as "NOT CONFIRMED" in layers.csv and as a warning in
# the delivered README rather than staying quiet. Passing the output contract means a file
# is SHAPED right, not that its input is about what its name says -- both sugarcane layers
# passed every check and were meaningless. Set the date only after actually doing it.
#
# Scenarios are NEVER listed here. They are globbed from disk per GUARDRAILS.md §3 --
# a hardcoded scenario list once made 25% of processed data invisible.
#
# ---------------------------------------------------------------------------------------
# recommended_slope
# ---------------------------------------------------------------------------------------
# values.csv carries BOTH ols_slope and sen_slope, so nothing is hidden. This field tells a
# downstream reader which one is trustworthy on THIS layer, because the two estimators fail
# in opposite regimes (OUTPUT-SPEC.md, "The two slopes"):
#
#   - sen_slope collapses to exactly 0 on zero-inflated hazards
#   - ols_slope absorbs member level offsets as trend when coverage is uneven
#
# Every rationale below is MEASURED, not asserted -- the sen==0 share and the sign-agreement
# share are computed on ACTIVE cells only (either slope non-zero) at the final decade, which
# is the view OUTPUT-SPEC requires. Judging on all cells dilutes both figures with ocean and
# with permanently-zero land and produces the opposite conclusion.
#
# Re-measure with: scripts/generate_customer_delivery.py --measure-slopes

registry_version: 1
measured_on: "2026-08-12"
processed_root: data/processed

layers:

  drought-3b:
    folder: drought-isimip3b_driedarea_annual
    file_prefix: driedarea
    hazard: Drought
    hazard_measure: Drought exposure frequency
    status: preferred
    qa_reviewed_on: null
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 100.0% of active cells (2090s, 61,810 active of 63,455 finite;
      measured 2026-08-12). Sign agreement 0.0%. Sen carries no signal on this layer.
    relative_baseline: true
    relative_baseline_note: >-
      This layer scores how far soil-moisture conditions at a site depart from a fixed
      preindustrial reference, not how dry the site is. A permanently arid place whose
      regime has been stable scores LOW, and a historically reliable place whose regime has
      shifted scores HIGH. Read a high score as "this place is moving furthest from what it
      is built for", not as "this place is dry", and pair it with local water availability
      before drawing any conclusion about consequences.
    delivery_note: >-
      Sibling of drought-2b, not a replacement. See the must-disclose RELATIVE-BASELINE
      caveat for how to read the score.

  drought-2b:
    folder: drought_led_annual
    file_prefix: led
    hazard: Drought
    hazard_measure: Drought exposure frequency (ISIMIP2b/RCP)
    status: alternate
    qa_reviewed_on: null
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 100.0% of active cells (2090s, 66,741 active of 68,116 finite;
      measured 2026-08-12). Sign agreement 0.0%.
    delivery_note: >-
      SIBLING of drought-3b, not a superseded version -- deeper ensemble (31 members,
      8 impact models) against older CMIP5 scenarios. Not selected by default: the standing
      preference is the more recent / more robust option, which is drought-3b. Select
      explicitly when RCP scenarios or ensemble depth is the requirement. See the
      must-disclose RELATIVE-BASELINE caveat for how to read the score.
    relative_baseline: true
    relative_baseline_note: >-
      This layer scores how far soil-moisture conditions at a site depart from a fixed
      preindustrial reference, not how dry the site is. A permanently arid place whose
      regime has been stable scores LOW, and a historically reliable place whose regime has
      shifted scores HIGH. Read a high score as "this place is moving furthest from what it
      is built for", not as "this place is dry", and pair it with local water availability
      before drawing any conclusion about consequences.

  cyclone:
    folder: cyclone_let_annual
    file_prefix: let
    hazard: Tropical cyclone
    hazard_measure: Land area fraction exposed to tropical cyclones
    status: preferred
    qa_reviewed_on: null
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 97.4% of active cells (2090s, 20,337 active of 68,249 finite;
      measured 2026-08-12). Sign agreement 2.5%.
    delivery_note: >-
      SINGLE impact model (ke-tg-meanfield), so the CI is inter-GCM spread only and carries
      NO structural model uncertainty. Spatially smoothed with an L=2.5 kernel -- a declared
      deviation -- because the raw field is one-cell-wide storm tracks. Only ISIMIP2b/RCP
      exists; there is no SSP re-issue of TC exposure.

  wildfire:
    folder: wildfire-isimip3b_burntarea-total_annual
    file_prefix: burntarea
    hazard: Wildfire
    hazard_measure: Annual burnt area
    status: preferred
    qa_reviewed_on: null
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 74.0% of active cells (2090s, 64,039 active of 70,849 finite;
      measured 2026-08-12). Sign agreement 22.6%. Higher than the layer's 29.2% grid-level
      zero fraction would suggest -- the collapse is in the year-pair differences, not the
      values, which is exactly why this is measured rather than inferred from field_nature.
    delivery_note: >-
      Values are NOT clipped at 100%: a cell that reburns within a year can legitimately
      exceed full coverage (measured annual maxima up to ~575% for elm-eca).

  conifer-npp:
    folder: conifer-temperate_npp-tempnle_annual
    file_prefix: npp-tempnle
    hazard: Timber productivity
    hazard_measure: Temperate conifer stand net primary productivity
    status: preferred
    qa_reviewed_on: null
    recommended_slope: sen_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on only 2.1% of active cells (2090s, 25,603 active of 25,714 finite;
      measured 2026-08-12) and sign agreement is 87.9%. The only shipped layer where the
      robust estimator is the correct read.
    delivery_note: >-
      higher_is_better -- the percentile is ALREADY INVERTED in the file, so rising
      productivity reads as falling risk. Reported PER TILE (per unit conifer-stand area)
      behind a 2%-cover presence mask, so a site with no modelled conifer stand returns
      OFF_LAYER_MASK rather than zero. Rising NPP is partly a CO2-fertilisation response and
      that caveat belongs in the narrative.

  cropfailure-3b:
    folder: cropfailure-isimip3b_cropfailure_annual
    file_prefix: cropfailure
    hazard: Crop failure
    hazard_measure: Cropland area share exposed to unprecedented crop failure
    status: preferred
    qa_reviewed_on: null
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 100.0% of active cells at ssp126 2090s (measured 2026-08-13).
      Zero-inflated field: most year-pairs are 0->0, so the robust estimator carries no
      signal at low forcing. It does lift slightly at higher forcing (ssp370 reaches
      ~7e-5/decade by the 2080s) as non-zero years become common, but ols_slope is the read
      on this layer at every tier.
    relative_baseline: true
    relative_baseline_note: >-
      This layer scores how far crop-failure conditions at a site depart from that site's
      OWN historical experience, not how bad conditions are in absolute terms. The
      difference reverses the ranking a reader expects. A reliably productive region with a
      narrow historical range crosses its own "unprecedented" threshold more readily than a
      region that has always been marginal and variable, so on this layer Iowa sits at the
      99.3rd percentile of world cropland while the Sahel sits at 69.4. That is the measure
      working as defined: the intensity of change relative to local norms is genuinely
      greater in Iowa, and a farming system built around a stable climate has further to
      fall. It is NOT a statement that Iowan agriculture is more fragile than Sahelian
      agriculture in absolute terms, and it says nothing about food security, yield levels,
      or a region's capacity to absorb a bad year. Read a high score as "this place is
      moving furthest from what it is built for", and pair it with local baseline
      productivity and adaptive capacity before drawing any conclusion about consequences.
    delivery_note: >-
      PUBLISHED ON A CROPLAND FOOTPRINT (39,890 cells, 42.4% of land), NOT on all land. A
      non-agricultural site returns OFF_LAYER_MASK rather than zero, and a percentile here
      is a rank AMONG CROPLAND, not among all land. The index carries NO CROP TOKEN and the
      publication's sidecar names only the variable, so which crops it aggregates is
      UNDOCUMENTED --
      material for any site-level use, since an index over crops a site does not grow is not
      that site's risk. See the must-disclose RELATIVE-BASELINE caveat for how to read the
      score itself.

  heatwave-3b:
    folder: heatwave-isimip3b_heatwave_annual
    file_prefix: heatwave
    hazard: Heatwave
    hazard_measure: Land area share exposed to unprecedented heat
    # BUILT AND CONTRACT-PASSING, NOT CLEARED FOR DELIVERY. No asset type references it, so
    # it cannot be selected today; this entry exists so the layer is discoverable rather
    # than invisible. Two things must be settled before the status changes.
    status: blocked
    blocked_reason: >-
      (1) THE FLAG SATURATES and the treatment is an open decision. 45.9% of ssp585 2090s
      cells sit at exactly 1.0, where the CI collapses to zero width, BOTH slopes go to ~0
      and AGREE there, and the percentile ties at 100 (51.9% of cells at >=99.5). A
      near-zero slope on this layer is ambiguous between "no trend" and "pinned at the
      ceiling", so the standing dual-slope disagreement rule does not apply. How the tied
      top block should be ranked, and whether to publish a time-to-saturation companion,
      have not been decided. (2) THE INDEX CARRIES NO HUMIDITY TERM -- `HWMID-NONE` is
      HWMId only -- so it cannot evidence the workforce-safety or equipment-derating
      framing the heatwave hazard note currently uses. That copy needs rewriting before
      this ships. Identify saturated cell-decades as median == 1.0.
    qa_reviewed_on: null
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on 100.0% of active cells in every scenario's final panel (469,508 of
      471,940 active at ssp126; measured 2026-08-14), sign agreement 0.0%. The field is
      BINARY, so every pairwise difference is -1, 0 or +1 and same-valued pairs dominate --
      the same mechanism as `drought-2b`/`drought-3b`, not zero-inflation. READ ols_slope,
      but read it together with `median` and `saturation_by_decade`: where the layer is
      saturated, ols_slope is censored toward zero and understates the hazard.
    relative_baseline: true
    relative_baseline_note: >-
      This layer scores how far a year's heat departs from that CELL'S OWN preindustrial
      distribution -- the annual HWMId exceeding the 97.5th percentile of its picontrol --
      not how hot it gets in absolute terms. A relative threshold is crossed sooner where
      interannual variance is LOW, and the tropics have the lowest temperature variance on
      the planet, so on the 2020s baseline |lat| <= 23.5 reads 0.561 against 0.149 for
      |lat| > 50, a 3.77x ratio before any warming has accumulated. Site example: Chicago
      0.688 sits ABOVE Delhi 0.548. Read a high score as "this place is moving furthest
      from its own historical normal", never as "this place is hotter".
    delivery_note: >-
      NOT A HEAT-STRESS INDEX. `HWMID-NONE` is the Heat Wave Magnitude Index daily with NO
      humidity term -- the ISIMIP2b predecessor `leh` additionally required Humidex >= 45
      so that counted events "would also adversely affect human health", and Zantout et al.
      2025 drops that criterion. This layer therefore cannot support a wet-bulb,
      heat-stress, workforce-safety or equipment-derating claim, and it flags MORE area
      than `leh` in arid and high-latitude cells where the Humidex gate would never open.
      Published on a 67,420-cell land footprint; Antarctica is absent from the product.

  permafrost-3b:
    folder: permafrost-isimip3b_thawdepth_annual
    file_prefix: thawfrac
    hazard: Permafrost thaw
    hazard_measure: Thawed fraction of the soil column (annual maximum)
    status: preferred
    qa_reviewed_on: null
    recommended_slope: ols_slope
    recommended_slope_rationale: >-
      sen_slope == 0 on only 15.2% of active cells (ssp126 2090s, 14,455 active; measured
      2026-08-14) with 84.4% sign agreement, so Sen has NOT collapsed the way it does on the
      zero-inflated layers -- and it is still the wrong read here. A NEW regime, measured on
      this layer: on a MULTIMODAL ensemble Theil-Sen is biased LOW, because the pairwise
      sample is dominated by cross-cluster member pairs whose slopes carry the level offset
      rather than the trend. Measured on ssp585 over the published footprint, each member's
      own OLS trend runs +0.0104 to +0.0826 per decade (JULES members +0.015 to +0.024,
      CLASSIC +0.048/+0.083, LPJmL +0.010 to +0.082); the ensemble mean of those is +0.0326
      and the published ols_slope is +0.0326 -- an exact match -- while sen_slope reads
      +0.0069, BELOW EVERY SINGLE MEMBER. An estimator outside the range of the things it
      summarises is not robust, it is wrong. ols also matches this layer's mean-based central
      value by construction. BOTH are censored where the column is fully thawed, so read
      either one WITH the Anomaly panel, never alone.
    delivery_note: >-
      PUBLISHED ON THE 2020s PERMAFROST FOOTPRINT (15,509 cells, 18.17 M km2, where >=2 of 3
      models find frozen ground), NOT on all land. A site outside it returns OFF_LAYER_MASK
      rather than a low score, because a place with no permafrost has no thaw hazard.
      The value is thaw depth divided by EACH MODEL'S OWN soil column (CLASSIC 61.4 m, LPJmL
      13.0 m, JULES 3.0 m), so 0 = never thaws and 1 = nothing frozen left. The endpoints
      mean the same thing in all three models; intermediate values are comparable only
      ORDINALLY, which is why the customer-facing quantity is the CHANGE against the 2020s --
      the share of the column transitioning from permafrost to none.
      READ THE CI. It is wide (2-SD width median 0.748 on a [0,1] field) because the models
      genuinely disagree: on the cells CLASSIC and LPJmL both call permafrost, CLASSIC loses
      28.6% of them by the 2090s under ssp585 and LPJmL loses 4.0% -- a Jaccard overlap of
      2.8%. Comparable totals, different maps.
      NOT A GROUND-STABILITY OR SUBSIDENCE LAYER. Thaw depth carries nothing about ground
      ice, thaw settlement or slope, and ISIMIP publishes no variable for any of them, so
      losing permafrost here is not a foundation-damage forecast. Solifluction has NO
      representation anywhere in ISIMIP and remains uncovered.

# Layers refused by the loader. A folder carrying INVALID-DO-NOT-USE.md is ALSO refused
# automatically, so this list is belt-and-braces rather than the only guard.
blocked:
  sugarcane_yield-sug-firr_annual: >-
    WITHDRAWN 2026-08-11, upstream data defect. ISIMIP2b LPJmL simulates no sugarcane in the
    sugarcane belt (Sao Paulo, Uttar Pradesh, Queensland, Florida all sentinel-zero). Passes
    the output contract and means nothing.
  sugarcane_yield-sug-noirr_annual: >-
    WITHDRAWN 2026-08-11, same upstream data defect as the irrigated variant.
