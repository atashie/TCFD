# Asset -> layer catalog for customer deliveries.
#
# Maps a customer's asset type onto the hazard layers that get extracted for it. This is a
# LIVING file: it is expected to grow and to be corrected as we learn what a given asset
# class is actually exposed to. See ASSET-CATALOG.md for the maintenance protocol.
#
# Three rules govern its use, and the delivery driver enforces the first one in code:
#
#   1. A run NEVER extracts silently. `generate_customer_delivery.py` prints the resolved
#      asset -> layer mapping and stops; extraction requires an explicit --run.
#   2. An asset type absent from this catalog is an ERROR, not a default. Work out the
#      right layers with the user, then add the entry here.
#   3. Anything learned in a run -- a layer that should not have been there, one that was
#      missing, a user preference -- is written back to this file, dated, in the same
#      session it was learned.
#
# `layers:` entries are layer_ids from config/layer_registry.yaml. Matching on `Asset_Type`
# is case-insensitive and checks `aliases` too.
#
# STATUS: seeded 2026-08-12. Every entry below is a DRAFT pending user sign-off, and the
# catalog is narrow because only five layers are shipped. `confirmed_on` records when a user
# actually approved an entry; entries without it have not been reviewed.

catalog_version: 1
seeded_on: "2026-08-12"

assets:

  timber land:
    aliases: [timberland, forestry, forest, plantation, managed forest]
    layers: [conifer-npp, wildfire, drought-3b]
    rationale: >-
      Productivity is the asset's yield; wildfire is the dominant acute loss mechanism for
      standing timber; drought drives both growth loss and fire preconditioning.
    caveats: >-
      conifer-npp covers TEMPERATE NEEDLELEAF EVERGREEN stands only (Douglas-fir, loblolly
      and ponderosa pine, Norway spruce, radiata pine). A broadleaf or boreal holding will
      return OFF_LAYER_MASK and needs a different productivity layer that is not yet shipped.
    tornado_caveat: >-
      TORNADO IS DELIBERATELY NOT IN THIS BUNDLE (decided 2026-08-18) -- recorded so the
      omission reads as a decision rather than an oversight. Tornado blowdown is real for
      standing timber but affects a path ~100 m wide, which against a holding measured in
      thousands of hectares is immaterial beside wildfire and drought, the two loss
      mechanisms already carried. Add tornado-f2plus if a customer's holding is small,
      concentrated and inside the CONUS tornado maximum.
    confirmed_on: null

  data center:
    aliases: [datacenter, data centre, colocation facility, server farm]
    layers: [drought-3b, cyclone, wildfire, tornado-f2plus]
    rationale: >-
      Drought is a genuine process input here rather than a generic hazard -- evaporative
      cooling and the local grid both depend on water availability. Cyclone, wildfire and
      tornado are direct physical-damage and outage risks; for tornado the transmission
      channel is usually the grid connection and rooftop plant rather than the hall itself.
    tornado_caveat: >-
      ADDED 2026-08-18. tornado-f2plus is CONUS-ONLY and SCREENING-ONLY. It is built from
      the NOAA SPC observational record, not from a climate model, so it carries no scenario
      and no trend: it describes 1950-2025 as observed and says nothing about how tornado
      risk changes with warming. A site outside the United States returns OFF_LAYER_MASK or
      OUTSIDE_DOMAIN, NEVER a low score -- no global tornado record with comparable
      detection exists, so outside CONUS "no data" must not be read as "no hazard". At
      ~28 km cells against a ~100 m damage path it ranks which sites merit investigation
      and cannot support a design wind load or a strike probability.
    confirmed_on: null

  warehouse:
    aliases: [distribution center, distribution centre, logistics facility, depot]
    layers: [cyclone, wildfire, tornado-f2plus]
    rationale: >-
      Built asset whose exposure is physical damage and access interruption. Drought is
      deliberately EXCLUDED -- water is not a process input and including it would report a
      hazard with no transmission channel to the asset. Tornado is the archetypal severe
      convective loss for this class: large low-rise envelopes, long roof spans and
      cladding are what tornadic and downburst winds take first.
    tornado_caveat: >-
      ADDED 2026-08-18. tornado-f2plus is CONUS-ONLY and SCREENING-ONLY. It is built from
      the NOAA SPC observational record, not from a climate model, so it carries no scenario
      and no trend: it describes 1950-2025 as observed and says nothing about how tornado
      risk changes with warming. A site outside the United States returns OFF_LAYER_MASK or
      OUTSIDE_DOMAIN, NEVER a low score -- no global tornado record with comparable
      detection exists, so outside CONUS "no data" must not be read as "no hazard". At
      ~28 km cells against a ~100 m damage path it ranks which sites merit investigation
      and cannot support a design wind load or a strike probability.
    confirmed_on: null

  office:
    aliases: [commercial building, office building, corporate campus, retail]
    layers: [cyclone, wildfire, tornado-f2plus]
    rationale: >-
      Same reasoning as warehouse -- physical damage and business interruption, tornado
      included for the same wind-damage channel.
    tornado_caveat: >-
      ADDED 2026-08-18. tornado-f2plus is CONUS-ONLY and SCREENING-ONLY. It is built from
      the NOAA SPC observational record, not from a climate model, so it carries no scenario
      and no trend: it describes 1950-2025 as observed and says nothing about how tornado
      risk changes with warming. A site outside the United States returns OFF_LAYER_MASK or
      OUTSIDE_DOMAIN, NEVER a low score -- no global tornado record with comparable
      detection exists, so outside CONUS "no data" must not be read as "no hazard". At
      ~28 km cells against a ~100 m damage path it ranks which sites merit investigation
      and cannot support a design wind load or a strike probability.
    confirmed_on: null

  agricultural land:
    aliases: [farmland, cropland, agriculture, farm]
    layers: [cropfailure-3b, drought-3b, wildfire, tornado-f2plus]
    rationale: >-
      Crop failure is the crop-specific exposure and is listed first; drought is the primary
      underlying yield driver and is retained because it covers the site whether or not it
      is inside the crop models' cropland footprint; wildfire is the acute loss mechanism.
    caveats: >-
      ADDED cropfailure-3b 2026-08-13, and it changes what this bundle can claim -- but
      only so far. It is an EXPOSURE index (how often conditions cross an unprecedentedness
      threshold), NOT a yield response: it does not say how much yield is lost, so this
      bundle still returns no modelled yield loss. It is published on a CROPLAND footprint,
      so a site outside the crop models' cropland returns OFF_LAYER_MASK rather than zero --
      which is why drought-3b stays in the bundle. Its scores are RELATIVE TO EACH SITE'S
      OWN HISTORY (see the must-disclose RELATIVE-BASELINE caveat), and which crops it
      aggregates is undocumented by the publisher, so for a specific crop treat it as a
      regional signal. The sugarcane layers were withdrawn 2026-08-11 for an upstream data
      defect and must not be substituted.
    tornado_caveat: >-
      ADDED 2026-08-18. tornado-f2plus is CONUS-ONLY and SCREENING-ONLY. It is built from
      the NOAA SPC observational record, not from a climate model, so it carries no scenario
      and no trend: it describes 1950-2025 as observed and says nothing about how tornado
      risk changes with warming. A site outside the United States returns OFF_LAYER_MASK or
      OUTSIDE_DOMAIN, NEVER a low score -- no global tornado record with comparable
      detection exists, so outside CONUS "no data" must not be read as "no hazard". At
      ~28 km cells against a ~100 m damage path it ranks which sites merit investigation
      and cannot support a design wind load or a strike probability.
    confirmed_on: null
