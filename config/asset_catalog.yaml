# Asset catalog for customer deliveries -- catalog_version 2.
#
# THE DELIVERY MODEL CHANGED 2026-08-20 (user determination, recorded in the walk-through
# that session). Under catalog_version 1 this file mapped asset type -> layers and acted as
# an EXTRACTION FILTER. It no longer does:
#
#   1. EVERY location receives EVERY standard-set layer. The standard set is computed from
#      config/layer_registry.yaml at plan time by the rule under `standard_set:` below --
#      never enumerated here, so a newly signed layer joins without a catalog edit.
#   2. Asset-type relevance enters ONLY as a 0/1 weight on a hazard FAMILY in the Climate
#      Score. An irrelevant hazard is still delivered and visible; it just does not move
#      that asset's score. Family value = mean of its scored layers' percentiles; the
#      score = mean over weighted families PRESENT at the site (renormalizing, with
#      "n of m" disclosed in climate_score.csv).
#   3. OBSERVED families (landslide, storm-convective) enter the score as CONSTANTS across
#      every decade and tier -- user decision 2026-08-20, superseding the 2026-08-18
#      observational exclusion. A constant term damps the score's scenario/time contrast in
#      proportion to its weight share; the caveat machinery must say so wherever the score
#      travels.
#
# Three rules survive from v1 unchanged:
#   1. A run NEVER extracts silently -- the plan prints and stops; extraction needs --run.
#   2. An asset type absent from this catalog is an ERROR, not a default.
#   3. Anything learned in a run is written back here, dated, in the same session.
#
# A fourth rule is new with the model:
#   4. FAMILY WEIGHTS ARE SET WITH THE USER, HAZARD BY HAZARD, NEVER PRE-ASSIGNED. An
#      entry without `family_weights` cannot be used -- the plan fails with instructions
#      to run the weights walk-through. Every entry with weights must name EVERY family in
#      `score_families` explicitly (0 or 1), so a newly added family cannot silently
#      default into or out of anyone's score.

catalog_version: 2
seeded_on: "2026-08-12"
model_changed_on: "2026-08-20"

standard_set:
  rule: >-
    All layers carrying a human QA date (qa_reviewed_on set) with a deliverable status
    (preferred or alternate), minus the explicit exclusions below. Computed from
    config/layer_registry.yaml at plan time.
  excluded:
    drought-2b: "removed from the general list (user, 2026-08-20); available on request via a Layers override"
    conifer-npp: "removed from the general list (user, 2026-08-20); available on request via a Layers override"
    tornado-all: "comparison-only per its registry delivery note; never deliverable"

# Hazard families for the Climate Score. `layers` lists the members whose percentiles are
# averaged into the family value (members absent at a site -- OFF_LAYER_MASK / no tier --
# drop out of the family mean). A standard-set layer appearing in NO family's `layers` is
# DELIVERED UNSCORED: today that is flood-3b-40yr and flood-3b-none (the two counterfactual
# protection variants; user decision 2026-08-20 scores flopros only).
# `observed: true` marks a family whose members carry scenario `observed`; its value is a
# constant folded into every tier x decade cell of the asset's score grid.
score_families:
  chronic-heat:
    layers: [heatdays-hd30, heatdays-hd35, heatdays-hd40, heatdays-hd45,
             tropicalnights-tr20, tropicalnights-tr25]
  cold-frost:
    layers: [frostdays-fd, frostdays-fdm10, icedays-id]
  heatwave:
    layers: [heatwave-3b]
  total-rainfall:
    layers: [pluvial-prcptot, pluvial-wetdays]
    note: "Raw rainfall totals and frequency (rainfall consolidation, user 2026-08-21)."
  extreme-rainfall:
    layers: [pluvial-r10mm, pluvial-r20mm, pluvial-r50mm, pluvial-r100mm,
             pluvial-rx1day, pluvial-rx5day, pluvial-r95pd, pluvial-r99pd]
    note: >-
      Threshold exceedances, annual maxima and the local-relative metrics -- consolidated
      2026-08-21 (user) from the former precip-absolute / precip-local-extreme split. The
      relative pair (R95pD/R99pD) keeps its must-disclose relative-baseline caveat inside
      this family. WEIGHT NOTE: power plant weighted the former relative-only family 0; on
      consolidation extreme-rainfall is 1 for all four walked types (six of its eight
      members are absolute metrics power plants already weighted), which folds the
      relative pair into the power-plant score diluted 1-in-8 -- flagged to the user
      2026-08-21, one edit to reverse.
  drought:
    layers: [drought-3b]
  flood-riverine:
    layers: [flood-3b-flopros]
    note: "Scores on flopros only (user, 2026-08-20); 40yr and none are delivered unscored."
  wildfire:
    layers: [wildfire]
  tropical-cyclone:
    layers: [cyclone]
  crop-failure:
    layers: [cropfailure-3b]
  permafrost-thaw:
    layers: [permafrost-3b]
  sea-level:
    layers: [sealevel-2b]
  landslide:
    layers: [landslide-arup]
    observed: true
  storm-convective:
    layers: [hail-vlh, tornado-f2plus, tornado-f1plus, tornado-f3plus]
    observed: true
    note: >-
      Inside CONUS the family mean holds one hail and three tornado members (tornado 3:1);
      outside CONUS the tornado rungs are off-domain and the family is hail alone. Stated
      in the 2026-08-20 walk-through question the user approved.

assets:

  # -------------------------------------------------------------------------------------
  # WALKED ENTRIES -- family weights set with the user in the 2026-08-20 hazard-by-hazard
  # walk-through. confirmed_on records that determination.
  # -------------------------------------------------------------------------------------

  warehouse:
    aliases: [distribution center, distribution centre, logistics facility, depot]
    scope: "Storage/distribution buildings; exposure is physical damage and access interruption."
    family_weights:
      chronic-heat: 1
      cold-frost: 1
      heatwave: 1
      total-rainfall: 1
      extreme-rainfall: 1
      drought: 0
      flood-riverine: 1
      wildfire: 1
      tropical-cyclone: 1
      crop-failure: 0
      permafrost-thaw: 1
      sea-level: 1
      landslide: 1
      storm-convective: 1
    rationale: >-
      Weights set in the 2026-08-20 walk-through (user determinations). Drought excluded --
      water is not a process input for this class, consistent with the v1 reasoning.
      Crop failure delivered but never scored for this type.
    confirmed_on: "2026-08-20"

  power plant:
    aliases: [power station, generating station, powerplant, generation facility]
    scope: "Utility-scale electricity generation sites."
    family_weights:
      chronic-heat: 1
      cold-frost: 1
      heatwave: 1
      total-rainfall: 1
      extreme-rainfall: 1   # see the extreme-rainfall WEIGHT NOTE (2026-08-21)
      drought: 1
      flood-riverine: 1
      wildfire: 1
      tropical-cyclone: 1
      crop-failure: 0
      permafrost-thaw: 1
      sea-level: 1
      landslide: 1
      storm-convective: 1
    rationale: >-
      Weights set in the 2026-08-20 walk-through (user determinations). The only walked
      type that weights drought (1). It zeroed the former relative-only rainfall family;
      see the extreme-rainfall WEIGHT NOTE for the 2026-08-21 consolidation.
    confirmed_on: "2026-08-20"

  retail:
    aliases: [retail location, store, shopping center, shopping centre]
    scope: "Customer-facing commercial premises."
    family_weights:
      chronic-heat: 1
      cold-frost: 1
      heatwave: 1
      total-rainfall: 1
      extreme-rainfall: 1
      drought: 0
      flood-riverine: 1
      wildfire: 1
      tropical-cyclone: 1
      crop-failure: 0
      permafrost-thaw: 1
      sea-level: 1
      landslide: 1
      storm-convective: 1
    rationale: "Weights set in the 2026-08-20 walk-through (user determinations)."
    confirmed_on: "2026-08-20"

  apartment complex:
    aliases: [apartment, apartments, multifamily, multi-family, residential complex]
    scope: "Multi-family residential holdings."
    family_weights:
      chronic-heat: 1
      cold-frost: 1
      heatwave: 1
      total-rainfall: 1
      extreme-rainfall: 1
      drought: 0
      flood-riverine: 1
      wildfire: 1
      tropical-cyclone: 1
      crop-failure: 0
      permafrost-thaw: 1
      sea-level: 1
      landslide: 1
      storm-convective: 1
    rationale: "Weights set in the 2026-08-20 walk-through (user determinations)."
    confirmed_on: "2026-08-20"

  # -------------------------------------------------------------------------------------
  # LEGACY ENTRIES -- seeded 2026-08-12 under the v1 filter model and NEVER through a
  # weights walk-through. They cannot be used until their family_weights are set with the
  # user; the plan fails with that instruction. `legacy_layers` preserves the v1 bundle
  # and its recorded reasoning as history, nothing reads it.
  # -------------------------------------------------------------------------------------

  timber land:
    aliases: [timberland, forestry, forest, plantation, managed forest]
    family_weights: null
    weights_note: >-
      PENDING the weights walk-through -- the delivery model changed 2026-08-20. Note when
      walking this type: conifer-npp is out of the general standard set (user, 2026-08-20)
      and would need a Layers override plus a family decision to score timber productivity.
    legacy_layers: [conifer-npp, wildfire, drought-3b]
    rationale: >-
      (v1, 2026-08-12) Productivity is the asset's yield; wildfire is the dominant acute
      loss mechanism for standing timber; drought drives both growth loss and fire
      preconditioning.
    caveats: >-
      conifer-npp covers TEMPERATE NEEDLELEAF EVERGREEN stands only (Douglas-fir, loblolly
      and ponderosa pine, Norway spruce, radiata pine). A broadleaf or boreal holding will
      return OFF_LAYER_MASK and needs a different productivity layer that is not yet shipped.
    tornado_caveat: >-
      (v1, 2026-08-18) Tornado was deliberately NOT in this bundle: blowdown affects a path
      ~100 m wide, immaterial against a holding measured in thousands of hectares beside
      wildfire and drought. Under the v2 model tornado arrives via the standard set anyway;
      the walk-through should decide the storm-convective WEIGHT with that history in view.
    confirmed_on: null

  data center:
    aliases: [datacenter, data centre, colocation facility, server farm]
    family_weights: null
    weights_note: "PENDING the weights walk-through -- the delivery model changed 2026-08-20."
    legacy_layers: [drought-3b, cyclone, wildfire, tornado-f2plus]
    rationale: >-
      (v1, 2026-08-12) Drought is a genuine process input -- evaporative cooling and the
      local grid both depend on water availability. Cyclone, wildfire and tornado are
      direct physical-damage and outage risks; for tornado the transmission channel is
      usually the grid connection and rooftop plant rather than the hall itself.
    confirmed_on: null

  office:
    # `retail` REMOVED from these aliases 2026-08-20 -- it is its own walked entry above,
    # and a duplicate alias would make resolution order-dependent.
    aliases: [commercial building, office building, corporate campus]
    family_weights: null
    weights_note: "PENDING the weights walk-through -- the delivery model changed 2026-08-20."
    legacy_layers: [cyclone, wildfire, tornado-f2plus]
    rationale: >-
      (v1, 2026-08-12) Physical damage and business interruption, tornado included for the
      wind-damage channel.
    confirmed_on: null

  agricultural land:
    aliases: [farmland, cropland, agriculture, farm]
    family_weights: null
    weights_note: >-
      PENDING the weights walk-through -- the delivery model changed 2026-08-20. Note when
      walking this type: crop-failure exists as a family (weighted 0 by all four walked
      types) and this is the class it was built for.
    legacy_layers: [cropfailure-3b, drought-3b, wildfire, tornado-f2plus]
    rationale: >-
      (v1, 2026-08-13) Crop failure is the crop-specific exposure; drought is the primary
      underlying yield driver and covers the site whether or not it is inside the crop
      models' cropland footprint; wildfire is the acute loss mechanism.
    caveats: >-
      cropfailure-3b is an EXPOSURE index (how often conditions cross an unprecedentedness
      threshold), NOT a yield response, published on a CROPLAND footprint with
      relative-baseline scoring; which crops it aggregates is undocumented by the
      publisher. The sugarcane layers were withdrawn 2026-08-11 for an upstream data
      defect and must not be substituted.
    confirmed_on: null
